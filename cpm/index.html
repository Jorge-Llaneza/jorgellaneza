{t:"t1",q:"In a Swing window implemented with JFrame:",o:["Components are added directly to the JFrame without any intermediate container","Components are added to a JPanel called ContentPane, which is contained by the JFrame","The JFrame is a low-level component that must be placed inside a JPanel","The ContentPane is a JButton that contains the rest of the components","None of the answers is right"],a:1,e:"El JFrame es el contenedor de alto nivel y los componentes van en el ContentPane (un JPanel) que contiene."},
{t:"t1",q:"In relation to Swing and AWT…",o:["Swing and AWT contain exactly the same visual components; Swing only adds new attributes (border, icon, tooltip…)","Both specifications are part of the JFC (Java Foundation Classes)","AWT includes the package 'event' with the resources to work with events","Every answer is right","Only B and C are right"],a:4,ns:true,e:"Pregunta real de examen (2015). A es falsa porque Swing tiene MÁS componentes (tablas, árboles…). B y C son ciertas, así que la respuesta es 'Only B and C'."},
{t:"t1",q:"Swing components can be used…",o:["in every platform with Java 1.1 or newer","only in Windows","only from JDK 5 onwards","only if the OS provides an equivalent native component","None of the answers is right"],a:0,e:"Están escritos en Java y funcionan en cualquier plataforma con Java 1.1 o superior. Desde el JDK 1.2 vienen incluidos."},
{t:"t1",q:"In the Swing architecture, the interaction between the system and the user is done through…",o:["layouts","events","containers","the ContentPane","the look and feel"],a:1,e:"La arquitectura de Swing se basa en contenedores y componentes, y la interacción se hace mediante eventos."},
{t:"t1",q:"Swing is…",o:["based on AWT, and allows more advanced GUIs","completely independent of AWT","the library used for 2D graphics in JFC","a replacement of the JDK","None of the answers is right"],a:0,e:"El tema dice 'Swing: based in AWT, it allows more advanced GUI'. Los gráficos 2D son Java2D."},
/* ---------- T2 ---------- */
{t:"t2",q:"According to ACM-SIGCHI (1992), Human-Computer Interaction is a discipline concerned with…",o:["the design, evaluation and implementation of interactive computing systems for human use and with the study of major phenomena surrounding them","only the visual design (colors, fonts) of user interfaces","exclusively the ergonomics of computer hardware","the implementation of GUI libraries such as Swing","None of the answers is right"],a:0,e:"Definición literal de ACM-SIGCHI. HCI incluye aspectos psicológicos, ergonómicos y organizativos, pero el curso se centra en la UI."},
{t:"t2",q:"According to the course, the user interface of interactive applications involves approximately…",o:["50% of the source code and more than 70% of the development effort","70% of the source code and 50% of the development effort","10% of the source code and 20% of the effort","90% of the source code","None of the answers is right"],a:0,e:"≈50% del código y >70% del esfuerzo (Gartner Group). La trampa es intercambiar las dos cifras."},
{t:"t2",q:"Which of the following is a consequence of a poor user interface?",o:["Rejection of the system","Low productivity rates","Unfeasible training periods","High error rates that generate frustration","All of them"],a:4,e:"El tema enumera las cuatro como consecuencias de una UI pobre."},
{t:"t2",q:"HCI aims to build or improve the security, utility, effectiveness and efficiency of interactive systems, but mainly their…",o:["usability","aesthetics","portability","performance","None of the answers is right"],a:0,e:"'But mainly… USABILITY'."},
{t:"t2",q:"According to ISO 9241, usability is the extent to which a product can be used by specified users to achieve specified goals with…",o:["effectiveness, efficiency and satisfaction in a specified context of use","learnability, flexibility and robustness","speed, safety and aesthetics in any context","effectiveness, efficiency and security","None of the answers is right"],a:0,e:"Eficacia, eficiencia y satisfacción en un contexto de uso específico. Learnability, flexibility y robustness son las categorías de principios."},
{t:"t2",q:"In the ISO 9241 definition of usability, efficiency is…",o:["the complete and exact achievement of the users' goals","the complete and exact achievement of the users' goals in relation to the resources used","the comfort and user acceptance of the system","the response time of the system","None of the answers is right"],a:1,e:"Eficiencia = lograr los objetivos en relación con los recursos usados. La consecución completa y exacta, sin más, es la eficacia; la comodidad y aceptación, la satisfacción."},
{t:"t2",q:"In the ISO 9241 definition of usability, effectiveness is…",o:["the optimal use of resources","the complete and exact achievement of the users' goals","the comfort of the user","the absence of errors","None of the answers is right"],a:1,e:"Eficacia = consecución completa y exacta de los objetivos. El uso óptimo de recursos es la eficiencia."},
{t:"t2",q:"Satisfaction, as part of usability, concerns…",o:["the comfort and user acceptance of the system","the optimal use of resources","the number of errors made","the response time","None of the answers is right"],a:0,e:"Satisfacción = comodidad y aceptación del sistema."},
{t:"t2",q:"The dimensions of usability mentioned in the course (L, E, S) are:",o:["Learnability, Efficiency and Safety","Learnability, Effectiveness and Satisfaction","Legibility, Efficiency and Security","Learnability, Ergonomics and Simplicity","None of the answers is right"],a:0,e:"Learnability (¿es fácil de aprender?), Efficiency (¿una vez aprendido, es rápido?) y Safety (¿hay pocos errores y son recuperables?). Además, Ergonomics y Aesthetics."},
{t:"t2",q:"Regarding usability:",o:["It is basically a matter of choosing the right colors and typography","It also concerns dialog design, the cognitive link between user and system, documentation quality and online help","It increases support and maintenance costs","It can only be considered after deploying the system","None of the answers is right"],a:1,e:"La usabilidad va más allá de colores y tipografía, y reduce los costes de producción, soporte, mantenimiento y uso."},
{t:"t2",q:"The three categories of basic usability principles are:",o:["Learnability, Flexibility and Robustness","Prediction, Synthesis and Familiarity","Effectiveness, Efficiency and Satisfaction","Observability, Recoverability and Consistency","None of the answers is right"],a:0,e:"Learnability (PSFC), Flexibility (IDRC) y Robustness (ORRT)."},
{t:"t2",q:"Which of the following principles belongs to the Learnability category?",o:["Task delegation","Observability","Consistency","Recoverability","Customization capacity"],a:2,e:"Learnability = Prediction, Synthesis, Familiarity, Consistency."},
{t:"t2",q:"A system where the user is forced to remember what was shown in the previous screen mainly violates the principle of…",o:["Prediction","Task delegation","Replacement capacity","Response times","None of the answers is right"],a:0,e:"El tema lo dice literalmente: un sistema así NO es predecible. (También sobrecarga la STM, T5.)"},
{t:"t2",q:"Disabling (greying out) the menu options that are not available at a given moment mainly improves…",o:["predictability, by controlling the visibility of operations","recoverability","customization capacity","task delegation","None of the answers is right"],a:0,e:"Controlar la visibilidad de las operaciones (disponibles y no disponibles) refuerza la predicción."},
{t:"t2",q:"A system that shows the changes in its state without the user requesting them is applying…",o:["synthesis with immediate notification (the ideal one)","synthesis with sporadic notification","familiarity","initiative in the dialog guided by the system","None of the answers is right"],a:0,e:"Síntesis inmediata, sin petición del usuario, que es la ideal. La esporádica solo muestra los cambios cuando el usuario los pide."},
{t:"t2",q:"Using a trash-can icon to delete files is an example of…",o:["Familiarity","Consistency","Observability","Replacement capacity","Task advisability"],a:0,e:"Familiaridad: usar metáforas del mundo real que el usuario ya conoce."},
{t:"t2",q:"Which of the following factors helps to improve the usability of an application?",o:["The sensorial capacity of the user while using the application","The immediate notification to the user of any change occurred in the system","Changing the interaction techniques frequently to increase the user's attention","Avoiding, as far as possible, metaphors of the real world","More than one answer is right"],a:1,ns:true,e:"Pregunta real (2015). La notificación inmediata es síntesis. Cambiar las técnicas a menudo viola la consistencia y evitar metáforas viola la familiaridad."},
{t:"t2",q:"Keeping F1 as the key to open Help, as in most applications, is an example of…",o:["Consistency","Task delegation","Synthesis","Recoverability","Replacement capacity"],a:0,e:"Consistencia: no cambiar la funcionalidad de técnicas que el usuario ya conoce. El tema pone F1 = Help literalmente como ejemplo."},
{t:"t2",q:"To reach consistency in a user interface we need to…",o:["use style guides, a common look & feel and avoid changing techniques the user already knows","use metaphors from the real world","delegate tasks to the system","use modal dialogs whenever possible","None of the answers is right"],a:0,e:"Guías de estilo, un L&F común y no cambiar técnicas conocidas. Las metáforas son familiaridad."},
{t:"t2",q:"Which of the following principles belongs to the Flexibility category?",o:["Initiative in the dialog","Observability","Synthesis","Familiarity","Response times"],a:0,e:"Flexibility = Initiative in the dialog, Task delegation, Replacement capacity, Customization capacity."},
{t:"t2",q:"A modal dialog such as 'Save as'…",o:["is an example of a system-guided interaction (the initiative is taken by the system)","is an example of task delegation","violates the recoverability principle","is an example of customization capacity","None of the answers is right"],a:0,e:"Iniciativa en el diálogo: el modal impide usar otras ventanas de la aplicación hasta cerrarlo, así que guía el sistema. Lo ideal es que la iniciativa la tome el usuario, pero a veces conviene lo contrario."},
{t:"t2",q:"Automatic backups or a spell checker are examples of…",o:["Task delegation","Replacement capacity","Initiative in the dialog","Observability","Synthesis"],a:0,e:"Delegación de tareas: se transfiere el control de la tarea del usuario al sistema."},
{t:"t2",q:"Allowing a color to be selected by its name, by its hex value or from a palette is an example of…",o:["Replacement capacity","Customization capacity","Task delegation","Consistency","Familiarity"],a:0,e:"Capacidad de sustitución: un parámetro se puede reemplazar por otro equivalente."},
{t:"t2",q:"Regarding customization capacity:",o:["The interface can be customized by the users and/or by the system, regarding design preferences or the options available according to the user's experience level","Only the user can customize the interface","It only concerns colors and fonts","It is a robustness principle","None of the answers is right"],a:0,e:"Usuario y/o sistema; preferencias de diseño u opciones según el nivel de experiencia. Es un principio de flexibilidad."},
{t:"t2",q:"Which group contains only robustness principles?",o:["Observability, Recoverability, Response times, Task advisability","Prediction, Synthesis, Familiarity, Consistency","Initiative, Task delegation, Replacement, Customization","Observability, Synthesis, Consistency, Recoverability","None of the answers is right"],a:0,e:"Robustness = ORRT. El segundo grupo es Learnability y el tercero es Flexibility."},
{t:"t2",q:"An Internet speed test that shows a needle moving while the connection speed is measured mainly applies…",o:["Observability","Recoverability","Task delegation","Replacement capacity","Customization capacity"],a:0,e:"Observabilidad: el sistema muestra su estado interno en la UI. (En el examen de 2015 había un test de velocidad parecido.)"},
{t:"t2",q:"The 'proportional effort' principle states that…",o:["if undoing an action is hard, then the action itself must also be hard to do","all actions must require the same effort","the most frequent actions must be the hardest to perform","the easier an action is to undo, the more confirmations it requires","None of the answers is right"],a:0,e:"Pertenece a la recuperabilidad: borrar un fichero (difícil de deshacer) debe costar más (confirmación); renombrar (fácil de deshacer) puede ser inmediato."},
{t:"t2",q:"When the response times of a system cannot be short enough, the system must…",o:["notify the user that the request is being processed","block the interface without any message","delegate the task to the user","show a modal error message","None of the answers is right"],a:0,e:"Hay que avisar de que se está procesando la petición (el tema añade 'observability!!!')."},
{t:"t2",q:"Task advisability concerns…",o:["how far the system supports all the tasks the user wants to do, and the way the user understands them","the capacity of reaching the initial goal after an error","the delays the system needs to show its state changes","the system informing about its internal state","None of the answers is right"],a:0,e:"La segunda opción es recoverability, la tercera response times y la cuarta observability."},
{t:"t2",q:"Recoverability is…",o:["the capacity of reaching the initial goal after an error in the interaction","the capacity of restoring the default look and feel","the system informing about its internal state","the time the system needs to recover after a crash","None of the answers is right"],a:0,e:"Recuperabilidad: alcanzar el objetivo inicial tras un error."},
{t:"t2",q:"Which of these strategies improves the accessibility of a GUI?",o:["Allowing the user to choose high-contrast colors","Allowing the user to increase the fonts","Not using only colors as a source of information","All of them","None of them"],a:3,e:"Son las tres estrategias que da el tema para colores y fuentes."},
{t:"t2",q:"User-centred design implies…",o:["involving the user as far as possible, even in the design team","observing the everyday work of the user","building prototypes, scenarios or models so users evaluate the design as soon as possible","All of them","None of them"],a:3,e:"Las tres aparecen en la última diapositiva del T2."},
{t:"t2",q:"A system is usable when…",o:["it is easy to learn and easy to use","it has a modern look and feel","it has all the functionalities the client asked for","it never shows error messages","None of the answers is right"],a:0,e:"'A system is usable when it is easy to learn and it is easy to use.'"},
{t:"t2",q:"A system whose initial user experience is enough to guess the result of future interactions is…",o:["predictable","synthesizable","familiar","observable","customizable"],a:0,e:"Definición de Prediction."},
/* ---------- T3 ---------- */
{t:"t3",q:"The Usability Professionals Association (UPA) defines User Centered Design as…",o:["a design approach where the process is driven by information about the users who will use the product","a process driven by business goals and marketing","a technique to evaluate interfaces using experts only","a programming methodology based on prototypes","None of the answers is right"],a:0,e:"El proceso lo dirige la información sobre los usuarios."},
{t:"t3",q:"User Centered Design is defined in…",o:["ISO 13407, updated in ISO 9241-210:2010","ISO 9241, updated in ISO 13407:2010","ISO 9001, updated in ISO 27001","ISO 25010, updated in ISO 13407","None of the answers is right"],a:0,e:"ISO 13407, actualizada por la ISO 9241-210:2010. Ojo: la 9241 a secas es la de la definición de usabilidad (T2)."},
{t:"t3",q:"The origin of user centered design is in…",o:["civil engineering and architecture","software engineering","marketing","cognitive psychology","None of the answers is right"],a:0,e:"La ingeniería civil y la arquitectura. Dreyfuss popularizó la idea del diseño como proceso."},
{t:"t3",q:"When designing the Bell 500 telephone, Dreyfuss studied how the devices were…",o:["built, perceived by the users and used by the users","sold, advertised and bought","programmed, tested and deployed","only built","None of the answers is right"],a:0,e:"Built, perceived, used. Libro: Designing for People (1955)."},
{t:"t3",q:"The term 'User Centered System Design' in software development was used in…",o:["the first CHI conference (1983), organized by ACM-SIGCHI","ISO 9241-210 (2010)","'Designing for People' (1955)","Alan Cooper's book (1999)","None of the answers is right"],a:0,e:"CHI 1983. Dreyfuss es de 1955, Cooper (Personas) de 1999 y la ISO de 2010."},
{t:"t3",q:"In UCD, the model that the user builds from the user interface (what they understand) is called…",o:["the mental model","the conceptual model","the user model","the persona","the interaction model"],a:0,e:"Modelo mental = lo que entiende el usuario. El modelo conceptual es lo que ofrece el diseñador y la UI es lo que ve el usuario."},
{t:"t3",q:"In UCD, the conceptual model is…",o:["what the designer offers to the users","what the user sees","what the user understands","the set of personas","None of the answers is right"],a:0,e:"Lo que ofrece el diseñador. 'Lo que ve' es la UI y 'lo que entiende' es el modelo mental."},
{t:"t3",q:"Regarding the UCD process…",o:["it is not ONE process but a family of iterative processes that match a common framework","it is a single sequential (waterfall) process","it is applied only once, at the end of development","it is only an evaluation technique","None of the answers is right"],a:0,e:"Familia de procesos iterativos con 4 fases."},
{t:"t3",q:"The four iterative phases of UCD, in order, are:",o:["Specify the context of use → Specify requirements → Create design solutions → Evaluate designs","Specify requirements → Specify context of use → Evaluate → Create design solutions","Create design solutions → Evaluate → Specify requirements → Specify context","Specify context of use → Create design solutions → Specify requirements → Evaluate","None of the answers is right"],a:0,e:"Contexto → Requisitos → Diseño → Evaluación (y se itera)."},
{t:"t3",q:"A context-of-use description should include…",o:["the users and other stakeholders, their characteristics, their goals and tasks, and the environment(s) of the system","only the hardware where the system will run","only the business requirements","only the names and ages of the users","None of the answers is right"],a:0,e:"Usuarios y stakeholders, características, objetivos y tareas, y entornos (técnico, físico, social y cultural)."},
{t:"t3",q:"Light and noise conditions, temperature and spatial layout are part of the…",o:["physical environment","technical environment","social and cultural environment","user characteristics","None of the answers is right"],a:0,e:"El entorno físico. El técnico es hardware, ancho de banda y software. El social y cultural, prácticas de trabajo, estructura organizativa y actitudes."},
{t:"t3",q:"Work practices, organizational structure and attitudes are part of the…",o:["technical environment","physical environment","social and cultural environment","goals and tasks of the users","None of the answers is right"],a:2,e:"El entorno social y cultural."},
{t:"t3",q:"Hardware, bandwidth and software are part of the…",o:["technical environment","physical environment","social and cultural environment","user characteristics","None of the answers is right"],a:0,e:"El entorno técnico."},
{t:"t3",q:"Regarding the Personas technique in UCD…",o:["the identity of the characters is fictitious, but their needs, motivations, attitudes and behaviours must be based on real data","both the identity and the data can be freely invented by the designer","we should create as many personas as possible (at least 20) to cover every user","it is useful to have several personas that share most of their properties","None of the answers is right"],a:0,e:"Identidad ficticia y datos reales. No más de 7-8 personas y sin solaparse."},
{t:"t3",q:"How many personas should be created according to the course?",o:["They should not exceed 7 or 8, represent the largest possible percentage of the audience and not overlap","Exactly one, representing the average user","At least 15, to be representative","One per real user","None of the answers is right"],a:0,e:"Máximo 7-8, que cubran la mayor parte de la audiencia y sin solaparse."},
{t:"t3",q:"Personas are often contextualized with…",o:["scenarios, descriptions of specific use situations","UML class diagrams","usability metrics","GOMS models","None of the answers is right"],a:0,e:"Por eso la técnica se llama Personas-Scenario."},
{t:"t3",q:"When specifying requirements, we need to find the equilibrium between…",o:["business viability, technological feasibility and user needs and desires","cost, time and scope","effectiveness, efficiency and satisfaction","learnability, flexibility and robustness","None of the answers is right"],a:0,e:"Viabilidad de negocio, factibilidad tecnológica y necesidades y deseos del usuario."},
{t:"t3",q:"'A GPS application must be usable outdoors' is an example of a requirement derived from…",o:["the user needs and the context of use","the organizational requirements","the technological feasibility","the business viability","None of the answers is right"],a:0,e:"Es el ejemplo literal del tema para los requisitos derivados de las necesidades y el contexto de uso."},
{t:"t3",q:"The last step when specifying requirements is…",o:["resolving trade-offs (conflicts) between user requirements","implementing a functional prototype","performing beta testing","creating the personas","None of the answers is right"],a:0,e:"Primero se identifican necesidades y restricciones, luego se derivan los requisitos y al final se resuelven los conflictos."},
{t:"t3",q:"Making design solutions more concrete by means of scenarios, simulations, prototypes or mock-ups is an activity of the phase…",o:["Create design solutions","Specify the context of use","Specify requirements","Evaluate designs","None of the answers is right"],a:0,e:"Crear soluciones de diseño, que también incluye modificar el diseño según la evaluación y comunicarlo a los implementadores."},
{t:"t3",q:"Which activity belongs to the 'Create design solutions' phase?",o:["Communicating the design solutions to those responsible for their implementation","Identifying the stakeholders","Describing the physical environment","Resolving trade-offs between requirements","None of the answers is right"],a:0,e:"Las demás pertenecen a contexto de uso y requisitos."},
{t:"t3",q:"The two widely used user-centred evaluation approaches are…",o:["user-based testing and inspection-based evaluation","unit testing and integration testing","only expert inspection","only beta testing","None of the answers is right"],a:0,e:"Tests con usuarios e inspección basada en guías."},
{t:"t3",q:"Regarding inspection-based evaluation:",o:["it is done by experts using guidelines; it is simpler, quicker and cheaper, and complements user-based tests because users and experts usually find different problems","it makes user-based testing unnecessary, since experts find the same problems as users","it is done with real users in the real context (field validation)","it is more expensive than user-based testing","None of the answers is right"],a:0,e:"La inspección complementa, no sustituye. La validación de campo (beta testing) es un tipo de test con usuarios."},
{t:"t3",q:"Beta testing is…",o:["a field validation, a kind of user-based testing in the real context of use","an inspection-based evaluation done by experts","a technique to create personas","a phase to specify requirements","None of the answers is right"],a:0,e:"Validación de campo = test con usuarios en el contexto real."},
{t:"t3",q:"Ideally, design evaluation should be carried out through…",o:["usability testing with actual users, as early as possible","a final survey after deploying the product","the opinion of the client who pays for the system","automatic code analysis","None of the answers is right"],a:0,e:"Cuanto antes se enseñe el diseño a usuarios reales, más fácil es verlo desde su punto de vista."},
{t:"t3",q:"Who said that 'design decisions should be based on the needs and wants of users'?",o:["Donald Norman","Alan Cooper","Paul Fitts","Henry Dreyfuss","Jens Rasmussen"],a:0,e:"Dr. Donald Norman, investigador en ciencia cognitiva."},
{t:"t3",q:"The characteristics of users identified when specifying the context of use include…",o:["knowledge, skill, experience, education, training, physical attributes, habits, preferences and capabilities","only their age and gender","only their salary","only their job title","None of the answers is right"],a:0,e:"Lista literal del tema."},
{t:"t3",q:"During the 'Specify the context of use' phase we need to…",o:["identify the people who will use the product, understand what they will use it for and know under what conditions they will use it","write the source code of the prototype","decide the final colors of the interface","perform the usability tests","None of the answers is right"],a:0,e:"Quién, para qué y en qué condiciones: ENTENDER."},
/* ---------- T4 ---------- */
{t:"t4",q:"The Java event model is based on…",o:["delegation: handling an event produced in the source object is delegated to another object called listener","inheritance: each component overrides a handleEvent method","polling: the application keeps asking the components for changes","the Composite pattern","None of the answers is right"],a:0,e:"Modelo de delegación (patrón Observer)."},
{t:"t4",q:"Events can be generated…",o:["by the user's interaction and by the system","only by the user","only by the operating system","only by the mouse and the keyboard","None of the answers is right"],a:0,e:"'Events can be generated by users interaction and by the system.'"},
{t:"t4",q:"The elements of the Java event model presented in the course are…",o:["event sources, event listeners and adapter classes","frames, panels and buttons","layouts and containers","look and feel and themes","None of the answers is right"],a:0,e:"Fuentes, listeners y adaptadores (más las clases de evento y el registro)."},
{t:"t4",q:"Event sources are…",o:["objects that detect and notify events to the listeners","objects that implement a listener interface","subclasses of EventObject","the methods that handle the event","None of the answers is right"],a:0,e:"Detectan y notifican. Los que implementan la interfaz son los listeners."},
{t:"t4",q:"The method getSource()…",o:["belongs to EventObject and returns the component that generated the event (as an Object)","belongs to the listener and returns the event","returns the listener registered in the component","belongs to JFrame and returns the ContentPane","None of the answers is right"],a:0,e:"EventObject.getSource() devuelve un Object, así que hay que hacer cast al tipo concreto."},
{t:"t4",q:"Event listeners are…",o:["instances of a class implementing a listener interface","subclasses of EventObject","the components that generate the events","static methods of the source object","None of the answers is right"],a:0,e:"Por ejemplo ActionListener, FocusListener, KeyListener… en java.awt.event."},
{t:"t4",q:"Given a button btAzul and a listener object pA of a class implementing ActionListener, the right registration is:",o:["btAzul.addActionListener(pA);","pA.addActionListener(btAzul);","btAzul.addActionAdapter(pA);","btAzul.addActionEvent(pA);","pA.register(btAzul);"],a:0,e:"Sintaxis: sourceObject.addXxxListener(listenerObject)."},
{t:"t4",q:"Which design pattern is the Java event model based on?",o:["Observer","Composite","Singleton","Decorator","Factory Method"],a:0,e:"Observer. Trampa: Composite es el de contenedores y componentes (T1)."},
{t:"t4",q:"A listener usually needs access to the main class that contains the source object. The two ways presented in the course are:",o:["creating it as an inner class of the main class, or as an external class receiving a reference to the main class in its constructor","only as an inner class","only through static methods","declaring every attribute of the main class as public","None of the answers is right"],a:0,e:"Clase interna o clase externa con inyección de dependencias por constructor."},
{t:"t4",q:"Which of the following actions generates an ActionEvent?",o:["Clicking a button","Selecting an element from a menu","Pressing Intro (Enter) inside a text field","All of them","None of them"],a:3,e:"Las tres generan ActionEvent (y también seleccionar un elemento de una lista)."},
{t:"t4",q:"The only method of the ActionListener interface is…",o:["public void actionPerformed(ActionEvent e)","public void actionDone(ActionEvent e)","public void buttonClicked(ActionEvent e)","public void actionPerformed(Event e)","None of the answers is right"],a:0,e:"actionPerformed(ActionEvent e). Como tiene un solo método, no existe ActionAdapter."},
{t:"t4",q:"Regarding adapter classes:",o:["there is one adapter class for each listener interface with more than one method","there is an ActionAdapter because ActionListener is the most used interface","adapters are interfaces that must be implemented","adapters implement only the most common method of the interface","None of the answers is right"],a:0,e:"Hay uno por interfaz con más de un método (MouseAdapter, KeyAdapter, FocusAdapter…). Son clases que implementan todos los métodos vacíos."},
{t:"t4",q:"We want to implement a handler for the keyPressed event. Given that the KeyListener interface has three methods…",o:["We cannot use the adapter class, because it does not exist for key events","We can implement KeyListener or extend KeyAdapter; both strategies will work","We can extend KeyListener or implement KeyAdapter; both strategies will work","We can implement both KeyListener and KeyAdapter; both strategies will work","None of the answers is right"],a:1,e:"Pregunta real (2015). Las interfaces se implementan (implements) y los adaptadores se heredan (extends)."},
{t:"t4",q:"Given the code, and considering that the methods of the KeyListener interface are more than two:",c:"1. public class VentanaPrincipal extends JFrame {\n2.   private JTextArea area1 = null;\n3.   private ProcesaTecla pT = null;\n5.   class ProcesaTecla implements KeyAdapter {\n6.     public void keyTyped(KeyEvent e){ pintar(e); }\n9.   }\n11.  pT = new ProcesaTecla();\n16.  area1.addKeyListener(pT);",o:["pT is the event source and area1 is the event receiver","Line 16 is wrong; it should be area1.addKeyAdapter(pT)","Line 5 is wrong; extends should be used instead of implements","ProcesaTecla is wrong because all the methods of the MouseAdapter interface should be implemented","More than one answer is right"],a:2,ns:true,e:"Pregunta real (Modelo antiguo). KeyAdapter es una clase, así que se usa extends. area1 es la fuente y pT el receptor. addKeyAdapter no existe."},
{t:"t4",q:"Suppose this is the code of the method pintar of the previous question. Which statement is right?",c:"public void pintar(KeyEvent e){\n1.  JTextArea area = e.getSource();\n2.  area.setBackground(Color.red);\n}",o:["It is correct, and the background of the event source will be red","It is incorrect because parameters are missing in getSource (line 1)","It is incorrect because a parameter indicating the area to paint must be added","It is incorrect because in line 1 a cast to JTextArea is needed","It is correct, and the background of the event receiver will be red"],a:3,ns:true,e:"getSource() devuelve Object y no se puede asignar a JTextArea sin cast: (JTextArea) e.getSource()."},
{t:"t4",q:"The listener class that handles a FocusEvent, given that the FocusListener interface has two methods:",o:["can be built implementing the FocusListener interface","can be built extending the FocusAdapter class","cannot be built extending an adapter, because the interface has only two methods","can be built from the FocusAdapter interface","(a) and (b) are right"],a:4,ns:true,e:"Pregunta real. Las dos formas son válidas: implements FocusListener o extends FocusAdapter. Existe adaptador porque la interfaz tiene más de un método. FocusAdapter es una clase, no una interfaz."},
{t:"t4",q:"Given the code, where KeyEvent.VK_COMMA corresponds to the comma character, and assuming the listener is correctly registered in the source object:",c:"class ProcesaTecla extends KeyAdapter {\n  public void keyTyped(KeyEvent e){ comprueba(e); }\n}\nprivate void comprueba(KeyEvent e){\n  char tecla = e.getKeyChar();\n  if (tecla == KeyEvent.VK_COMMA)\n    e.consume();\n}",o:["The code is correct and will ignore every comma the user types in the source object","The code is correct and will ignore every key different from comma typed in the receiver object","The code is not correct because consume cannot be invoked on a KeyEvent","The code is not correct because consume must be applied to the char tecla","Both c and d are right"],a:0,ns:true,e:"Pregunta real (2015). consume() se llama sobre el evento y detiene la coma. Se escribe en la fuente (el componente), no en el receptor."},
{t:"t4",q:"What does this listener do when registered on a JTextField?",c:"public void keyTyped(KeyEvent e){\n  if (!Character.isDigit(e.getKeyChar()))\n    e.consume();\n}",o:["Only digits can be typed in the text field","Digits cannot be typed in the text field","It throws an exception when a letter is typed","It removes the listener from the text field","None of the answers is right"],a:0,e:"Consume todo lo que NO sea dígito, así que solo se pueden escribir números. Es el ejemplo del tema."},
{t:"t4",q:"Considering that pT is correctly registered as a key listener of the object area, to stop pT from listening to events generated by area we write:",o:["area.removeKeyListener(pT);","pT.removeKeyListener(area);","area.consume(pT);","pT.consume(area);","pT.addKeyListener(null);"],a:0,e:"Pregunta real (2015). Se desregistra en la fuente con removeXxxListener(listener)."},
{t:"t4",q:"Which of the following sentences is right?",o:["A source can handle only one listener at a time","A source can handle more than one listener at the same time, but only if they process different events","A source can handle more than one listener of the same type at the same time","If a source registers two listeners for the same event (p1 and then p2), only the last one (p2) is kept","None of the answers is right"],a:2,ns:true,e:"Pregunta real (2015). Se pueden registrar varios listeners del mismo tipo en la misma fuente, y todos se ejecutan."},
{t:"t4",q:"Given the code, and considering the listener is registered in text1, if we want the same behaviour in text2, the best strategy is:",c:"class ProcesaFoco1 extends FocusAdapter {\n  public void focusGained(FocusEvent e){\n    text1.setText(\"\");\n  }\n}",o:["Create ProcesaFoco2 with the same code replacing text1 with text2, and register a new object of it in text2","Replace text1 with ((JTextField) e.getSource()) and register the same listener object in text2","Create ProcesaFoco2 using ((JTextField) e.getSource()) and register a new object of it in text2","Replace text1 with (e.getSource()) and register the listener in text2","None of the answers is right"],a:1,ns:true,e:"Pregunta real (2015). Con getSource() y cast, un único listener vale para todos: se reutiliza el mismo objeto y se registra en text2. Sin cast (opción D) no compila setText."},
{t:"t4",q:"A 'Cancel' option must be available both in a menu and in a command button with the same behaviour. According to the course we need…",o:["one listener (an external class, so it is accessible from both places) and two registrations","two different listener classes and two registrations","one listener and one registration, because the menu and the button share the source","an adapter class for each component","None of the answers is right"],a:0,e:"Un solo listener (clase externa si debe ser accesible desde ambas clases) y dos registros."},
{t:"t4",q:"The methods mouseEntered and mouseExited belong to…",o:["MouseListener","MouseMotionListener","MouseWheelListener","ActionListener","FocusListener"],a:0,e:"MouseListener: mouseClicked, mouseEntered, mouseExited, mousePressed, mouseReleased. MouseMotionListener: mouseDragged y mouseMoved."},
{t:"t4",q:"The methods mouseDragged and mouseMoved belong to…",o:["MouseMotionListener","MouseListener","ActionListener","ItemListener","WindowListener"],a:0,e:"MouseMotionListener (adaptador: MouseMotionAdapter)."},
{t:"t4",q:"Which method does NOT belong to the KeyListener interface?",o:["keyClicked","keyPressed","keyReleased","keyTyped","All of them belong to KeyListener"],a:0,e:"KeyListener tiene keyPressed, keyReleased y keyTyped. 'keyClicked' no existe."},
{t:"t4",q:"How many methods does the WindowListener interface have?",o:["7","1","2","3","5"],a:0,e:"windowOpened, windowClosing, windowClosed, windowActivated, windowDeactivated, windowIconified y windowDeiconified. Por eso existe WindowAdapter."},
{t:"t4",q:"The event fired when a checkbox or an item of a list is selected, handled by itemStateChanged, is…",o:["ItemEvent","ActionEvent","FocusEvent","TextEvent","ContainerEvent"],a:0,e:"ItemEvent → ItemListener.itemStateChanged(ItemEvent)."},
{t:"t4",q:"The methods componentAdded and componentRemoved belong to…",o:["ContainerListener","ComponentListener","ItemListener","WindowListener","ActionListener"],a:0,e:"ContainerListener (añadir o quitar componentes). ComponentListener tiene componentHidden, Shown, Moved y Resized."},
{t:"t4",q:"The listener interface whose method textValueChanged is called when the content of a text field or text area changes is…",o:["TextListener","KeyListener","ActionListener","ItemListener","FocusListener"],a:0,e:"TextEvent → TextListener.textValueChanged."},
{t:"t4",q:"The code generated by WindowBuilder to handle a button click typically creates the listener as…",o:["an anonymous inner class passed directly to addActionListener","an external public class in a separate file","a static method of the main class","a subclass of JButton","None of the answers is right"],a:0,e:"btAzul.addActionListener(new ActionListener(){ public void actionPerformed(ActionEvent e){…} });"},
{t:"t4",q:"Which of the following classes will NOT compile?",c:"// A\nclass PF1 extends FocusAdapter {\n  public void focusLost(FocusEvent e){ check(); }\n}\n// B\nclass PF2 implements FocusListener {\n  public void focusLost(FocusEvent e){ check(); }\n}\n// C\nclass PF3 implements FocusListener {\n  public void focusGained(FocusEvent e){ }\n  public void focusLost(FocusEvent e){ check(); }\n}",o:["A","B","C","A and B","None: all of them compile"],a:1,ns:true,e:"B implementa la interfaz pero no implementa focusGained, así que no compila. C lo deja vacío y es correcto. A hereda del adaptador y solo sobrescribe focusLost."},
{t:"t4",q:"When an event occurs in a Java application…",o:["Java creates an object of the specific class for that event and sends it to a specific method called handler","Java creates a new thread for each listener","Java copies the source component and sends it to the operating system","the operating system executes the listener code directly","None of the answers is right"],a:0,e:"Se crea un objeto evento de la clase específica y se pasa al método handler del listener."},
{t:"t4",q:"Which of the following is NOT a listener interface?",o:["MouseAdapter","ActionListener","FocusListener","ItemListener","WindowListener"],a:0,e:"MouseAdapter es una clase adaptadora (se hereda con extends), no una interfaz."},
{t:"t4",q:"Every operating system that supports GUIs…",o:["continuously monitors the environment to capture and manage events and notifies them to the applications, which decide how to deal with them","only reacts to events when the application asks for them","handles every event itself without notifying the applications","None of the answers is right","More than one answer is right"],a:0,e:"El SO monitoriza, captura y notifica, y cada aplicación decide qué hacer."},
{t:"t4",q:"In the toolbar example, one ProcesaBorde listener (extends MouseAdapter) is registered in boton1 and boton2. Inside tratarBorde, how do we get the button that fired the event?",o:["JButton boton = (JButton) e.getSource();","JButton boton = e.getSource();","JButton boton = e.getButton();","JButton boton = this;","JButton boton = (JButton) e;"],a:0,e:"Se obtiene la referencia con e.getSource() y un cast a JButton."},
{t:"t4",q:"A checkbox enables or disables a filter (listener pT) on a text field. The correct implementation in its actionPerformed is:",o:["if (chk.isSelected()) txt.addKeyListener(pT); else txt.removeKeyListener(pT);","if (chk.isSelected()) pT.addKeyListener(txt); else pT.removeKeyListener(txt);","if (chk.isSelected()) txt.consume(pT); else txt.addKeyListener(pT);","txt.setKeyListener(chk.isSelected() ? pT : null);","None of the answers is right"],a:0,e:"Es el ejemplo de desregistro del tema: add o remove sobre la fuente según el estado del checkbox."},
/* ---------- T5 ---------- */
{t:"t5",q:"Regarding the restrictions imposed by the human visual system, it is advisable to…",o:["use a font size of at least 11 and avoid writing texts in capital letters","always write messages in capital letters so they are read more clearly","not exceed a font size of 12 points to avoid visual overload","use complicated fonts to attract attention","None of the answers is right"],a:0,e:"Tamaño ≥ 11, interlineado proporcional, sin fuentes complicadas y sin MAYÚSCULAS. 'No superar 12 puntos' es una trampa de examen antiguo."},
{t:"t5",q:"Considering the visual system restrictions, it is advisable to…",o:["not use redundant codes (shapes, for example) to avoid information overload","not exceed a font size of 12 points to avoid visual overload","always use capital letters in every message","More than one answer is right","None of the answers is right"],a:4,ns:true,e:"Pregunta real (Modelo antiguo, respuesta E). Los códigos redundantes SÍ se recomiendan, el mínimo es 11 (no hay máximo de 12) y las mayúsculas no se recomiendan."},
{t:"t5",q:"Which color combination is NOT discouraged by the course?",o:["Black text on a white background","Red and green","Blue and yellow","Green and blue","Red and blue"],a:0,e:"Hay que evitar rojo-verde, azul-amarillo, verde-azul y rojo-azul."},
{t:"t5",q:"Daltonism affects approximately…",o:["8% of men and 1% of women","1% of men and 8% of women","20% of the population","50% of men","None of the answers is right"],a:0,e:"8% de los hombres y 1% de las mujeres, según el tema. Por eso hay que usar códigos redundantes."},
{t:"t5",q:"A plane seat map shows available seats in blue and booked seats in red, with 12-point row numbers. According to the visual system recommendations, this interface:",o:["satisfies all the recommendations","should use an extra code besides color (e.g. a shape) to avoid confusion","should use a font smaller than 12 points to avoid saturating the visual sensorial memory","More than one answer is right","None of the answers is right"],a:1,ns:true,e:"Pregunta real (2015). El color no debe ser el único código, y además rojo-azul es una combinación a evitar. 12 pt cumple el mínimo de 11."},
{t:"t5",q:"Regarding the use of colors in the interface, the course recommends…",o:["avoiding bright colors in big areas of the screen","using bright colors as background of large panels","using red and green to distinguish states","using color as the only source of information","None of the answers is right"],a:0,e:"Hay que evitar los colores brillantes en zonas grandes, las combinaciones incompatibles y depender solo del color."},
{t:"t5",q:"The user model is…",o:["a generalization of an abstract representation of the information known about a certain user","the model the designer offers to the users","a real user who participates in the design team","the physical description of the device","None of the answers is right"],a:0,e:"Incluye su modelo mental, su lenguaje, su precisión motora, sus tiempos de reacción esperados, etc. Lo que ofrece el diseñador es el modelo conceptual (T3)."},
{t:"t5",q:"Knowing the user model allows us to…",o:["make the system adaptive and customize it according to the preferences and needs of each user","avoid usability testing","remove the need for accessibility","make every user interact in the same way","None of the answers is right"],a:0,e:"Adaptatividad y personalización (letra más grande para mayores, simplificar la información, catálogo por perfil…)."},
{t:"t5",q:"According to the behaviour classification (Harris, 1990), the reading direction is part of…",o:["culture based (local) models","biology based (universal) models","the Human Processor Model","GOMS","None of the answers is right"],a:0,e:"Culturales: idiomas, procesamiento de imágenes, significado del color y dirección de lectura."},
{t:"t5",q:"According to the behaviour classification, typing speed is part of…",o:["biology based (universal) models","culture based (local) models","personas","the conceptual model","None of the answers is right"],a:0,e:"Biológicos: velocidad de tecleo, precisión de movimientos y velocidad de aprendizaje."},
{t:"t5",q:"The meaning of colors is considered…",o:["a culture-based (local) aspect","a biology-based (universal) aspect","a GOMS operator","part of the perceptual processor","None of the answers is right"],a:0,e:"El significado del color cambia entre culturas, así que es un modelo cultural."},
{t:"t5",q:"The Personas technique was proposed by…",o:["Alan Cooper in 1999 ('The Inmates are Running the Asylum')","Card, Moran and Newell in 1983","Paul Fitts in the 50s","Jens Rasmussen","Henry Dreyfuss in 1955"],a:0,e:"Alan Cooper, 1999."},
{t:"t5",q:"Personas are…",o:["fictional characters with a narrative description of typical behaviour patterns, using concrete details without generalizations, based on interviews and ethnographic research","statistical averages of all the users","real users who test the application","mathematical models to predict task times","None of the answers is right"],a:0,e:"Personajes ficticios, narrativos, concretos y basados en investigación con usuarios reales."},
{t:"t5",q:"Which of the following is a drawback of Personas?",o:["There is no way to determine how many users a persona represents","They focus on marketing and sales goals","They provide a human face for designers","They are too mathematical","None of the answers is right"],a:0,e:"Contras: no se sabe cuántos usuarios representa, no se pueden validar ni falsar y no son científicas. La 'cara humana' es un pro."},
{t:"t5",q:"Which of the following is an advantage of Personas?",o:["They provide a human face for designers and focus the design on people rather than on marketing goals","They can be scientifically validated","They give the exact percentage of users represented","They estimate task times with 20% error","None of the answers is right"],a:0,e:"Pros: centran el diseño en personas, facilitan cumplir los requisitos de interacción y dan una cara humana."},
{t:"t5",q:"The Human Processor Model was developed by…",o:["Card, Moran and Newell (1983)","Jens Rasmussen","Alan Cooper (1999)","Paul Fitts","Seibel (1963)"],a:0,e:"Card, Moran y Newell. Rasmussen es el Human Information System Model."},
{t:"t5",q:"The Human Processor Model models the human interaction system with three subsystems:",o:["perceptual, cognitive and motor","sensorial, short-term and long-term","visual, auditory and haptic","goals, operators and methods","None of the answers is right"],a:0,e:"Perceptivo, cognitivo y motor. Sensorial, STM y LTM son los tipos de memoria."},
{t:"t5",q:"In the Human Processor Model, the average cycle time of the perceptual processor is…",o:["100 [50–200] ms","70 [25–170] ms","70 [30–100] ms","240 ms","1500 ms"],a:0,e:"Perceptivo 100 ms, cognitivo 70 ms y motor 70 ms. Reacción media 240 ms."},
{t:"t5",q:"The average reaction time according to the Human Processor Model is…",o:["240 ms (100 + 70 + 70), ranging from 105 to 470 ms","70 ms","100 ms","1.35 s","None of the answers is right"],a:0,e:"Perceptivo (100) + cognitivo (70) + motor (70) = 240 ms."},
{t:"t5",q:"Regarding the processors of the Human Processor Model:",o:["each processor operates independently; in some cases they work in parallel and in others sequentially","they always work sequentially","they always work in parallel","they share a single clock and cannot overlap","None of the answers is right"],a:0,e:"Funcionan de forma independiente, a veces en paralelo y a veces en secuencia."},
{t:"t5",q:"The visual memory of the perceptual processor has a decay time of about…",o:["200 ms and a size of about 17 characters","1500 ms and a size of about 5 characters","7±2 seconds","unlimited time","None of the answers is right"],a:0,e:"Visual: 200 ms y 17 caracteres. Auditiva: 1500 ms y 5 caracteres."},
{t:"t5",q:"Regarding sensorial memory:",o:["there is one per sense, it is continuously updated and information is received without paying attention","it has unlimited capacity and slow access","it is the work memory, limited to 7±2 elements","it is stimulated by recognition","None of the answers is right"],a:0,e:"La opción de capacidad ilimitada describe la LTM y la de 7±2 la STM."},
{t:"t5",q:"A screen with a blinking background is discouraged mainly because…",o:["continuous and repeated stimulation causes habituation, making us less sensitive to changes","it overloads the long-term memory","it violates Fitts' law","it increases the cognitive processor cycle time","None of the answers is right"],a:0,e:"La habituación, un fenómeno de la memoria sensorial. Es el ejemplo del tema."},
{t:"t5",q:"The short-term memory…",o:["is the work memory, limited in time and size (7±2 elements) and with high access speed","has unlimited capacity and slow access","receives information without paying attention","is stimulated mainly by recognition","None of the answers is right"],a:0,e:"STM = memoria de trabajo, 7±2 elementos y acceso rápido."},
{t:"t5",q:"To avoid saturating the short-term memory, a technique is to…",o:["split up (chunk) the information","rely on recognition","avoid habituation","increase the font size","None of the answers is right"],a:0,e:"Técnicas de STM: ensayo (repetir) y trocear o agrupar. El reconocimiento es de la LTM."},
{t:"t5",q:"The Undo and Redo options in a menu…",o:["lighten the load of the short-term memory","lighten the load of the long-term memory","lighten the load of the sensorial memory","lighten the restrictions of the human visual system","None of the answers is right"],a:0,e:"Pregunta real (modelo antiguo). Deshacer/rehacer, recordar los últimos datos y el portapapeles alivian la STM."},
{t:"t5",q:"Remembering the last data introduced by the user in a form mainly helps…",o:["the short-term memory","the long-term memory","the sensorial memory","the motor processor","None of the answers is right"],a:0,e:"Evita tener que recordar o reescribir datos (STM)."},
{t:"t5",q:"The long-term memory…",o:["has unlimited capacity and life, but slow access; it is stimulated by recognition","has limited capacity (7±2) and fast access","is updated continuously without attention","decays in 200 ms","None of the answers is right"],a:0,e:"LTM: capacidad y vida ilimitadas, acceso lento y reconocimiento."},
{t:"t5",q:"Tooltips and context help mainly…",o:["lighten the work of the long-term memory, by relying on recognition","lighten the work of the short-term memory","avoid habituation of the sensorial memory","reduce the motor processor time","None of the answers is right"],a:0,e:"El tema los pone como estrategias para la LTM: ayudan a reconocer la información."},
{t:"t5",q:"Using lists and menus to select information instead of forcing the user to type it is a design strategy for…",o:["the long-term memory (recognition)","the short-term memory (chunking)","the sensorial memory","Fitts' law","None of the answers is right"],a:0,e:"Reconocer es más fácil que recordar, así que se apoya en la LTM."},
{t:"t5",q:"Printing the keyboard shortcut next to the menu option it executes…",o:["leans on recognition, helping the long-term memory","overloads the short-term memory","causes habituation","violates consistency","None of the answers is right"],a:0,e:"Ejemplo literal de estrategia de LTM."},
{t:"t5",q:"Which modeling technique estimates the time to hit a target with a quick movement as a function of the target size and the distance to it?",o:["Fitts' law","Hick's law","The Power Law of Practice","GOMS","The Human Information System Model"],a:0,e:"Fitts: T = Im·log₂(D/A + 1)."},
{t:"t5",q:"In Fitts' law, T = Im · log2(D/A + 1), A is…",o:["the target's width/height in the same direction as the movement","the acceleration of the mouse","the number of choices","the time of the first attempt","None of the answers is right"],a:0,e:"A es el tamaño del objetivo en la dirección del movimiento, D la distancia e Im ≈ 100 ms."},
{t:"t5",q:"Using Fitts' law (Im = 0.1 s), which target is reached fastest? (D = distance, A = width)",o:["D = 8.5 cm, A = 2.5 cm","D = 8 cm, A = 1 cm","D = 5 cm, A = 1 cm","All take the same time","None of the answers is right"],a:0,e:"0,1·log₂(8,5/2,5 + 1) = 0,214 s; 0,1·log₂(9) = 0,317 s; 0,1·log₂(6) = 0,258 s. Es el ejemplo del tema: el tamaño importa."},
{t:"t5",q:"Using Fitts' law with Im = 100 ms, a button 1 cm wide placed 7 cm away from the cursor takes…",o:["0.3 s","0.7 s","0.1 s","0.8 s","None of the answers is right"],a:0,e:"0,1·log₂(7/1 + 1) = 0,1·log₂8 = 0,1·3 = 0,3 s."},
{t:"t5",q:"Making submenu options appear as close as possible to the initial position of the mouse is a consequence of…",o:["Fitts' law","Hick's law","The Power Law of Practice","Personas","None of the answers is right"],a:0,e:"Menos distancia D significa menos tiempo de apuntar (Fitts)."},
{t:"t5",q:"Hick's law (also known as the principle of uncertainty) estimates…",o:["the time we need to make a decision, e.g. to select a menu item","the time to point at a target","the learning effect of repeating a task","the time to type a word","None of the answers is right"],a:0,e:"T = Ic·H, con H = log₂(n + 1) e Ic = 150 ms/bit."},
{t:"t5",q:"In Hick's law, T = Ic · H, H is computed as…",o:["log2(n + 1), where n is the number of choices","log2(D/A + 1)","n^(-a)","7 ± 2","None of the answers is right"],a:0,e:"H = log₂(n + 1) bits. Trampa: n + 1, no n."},
{t:"t5",q:"Using Hick's law with Ic = 150 ms/bit, choosing among 7 options takes…",o:["0.45 s","0.15 s","1.05 s","0.30 s","None of the answers is right"],a:0,e:"0,15·log₂(7 + 1) = 0,15·3 = 0,45 s."},
{t:"t5",q:"The Power Law of Practice states that…",o:["if the same action is repeated over time, performance tends to improve: Tn = T1 · n^(-a), a ≈ 0.4","the time to decide grows with the number of choices","the time to point grows with distance","users never improve after the first attempt","None of the answers is right"],a:0,e:"Tn = T1·n^(−a), con a = 0,4 [0,2–0,6] (Seibel, 1963). Estima el efecto del aprendizaje."},
{t:"t5",q:"Using the Power Law of Practice (a = 0.4), if a task takes 10 s the first time, the 32nd attempt takes…",o:["2.5 s","5 s","0.31 s","10 s","None of the answers is right"],a:0,e:"32^(−0,4) = 2^(−2) = 0,25, y 10·0,25 = 2,5 s."},
{t:"t5",q:"GOMS stands for…",o:["Goals, Operators, Methods and Selection rules","Goals, Objects, Models and Systems","Graphical Operations Measurement System","Goals, Operations, Memory and Speed","None of the answers is right"],a:0,e:"Goals, Operators, Methods, Selection rules. También se llama Keystroke Model."},
{t:"t5",q:"Which of the following is an assumption of the GOMS model?",o:["Users do not make mistakes","Users do not know how to perform the tasks","The response time is unknown","Each user's specific times are used","None of the answers is right"],a:0,e:"Supuestos: saben hacer la tarea, no cometen errores y los parámetros y el tiempo de respuesta son conocidos."},
{t:"t5",q:"GOMS is a prediction model with a precision error of about…",o:["20%","5%","50%","1%","It has no error"],a:0,e:"≈20%. Es una herramienta de ingeniería para evaluar rápido alternativas de diseño."},
{t:"t5",q:"In GOMS, the H (Homing) operator means…",o:["moving the hands from one device to another (≈ 0.4 s)","pressing a key (≈ 0.2 s)","pointing at an area of the screen (≈ 1.1 s)","deciding what to do next (≈ 1.35 s)","the system response (≈ 0.25 s)"],a:0,e:"K = 0,2; H = 0,4; P = 1,1; M = 1,35; R = 0,25."},
{t:"t5",q:"In GOMS, when the distance or size of the target is unknown, the pointing operator P takes…",o:["1.1 s","0.2 s","0.4 s","1.35 s","0.25 s"],a:0,e:"P ≈ 1,1 s. Si se conocen, P = 0,1·log₂(2D/S + 1)."},

function optOrder(q){ if(q.ns) return q.o.map((_,i)=>i); const mv=[],fx=[]; q.o.forEach((o,i)=>(META.test(o)?fx:mv).push(i)); return shuffle(mv).concat(fx); }
function examMs(){ if(!S.settings.examDate) return null; const t=new Date(S.settings.examDate+"T09:00:00").getTime(); return isNaN(t)?null:t; }
function daysLeft(){ const t=examMs(); if(t==null) return null; return Math.ceil((t-Date.now())/DAY); }
const BOXDAYS=[0,0.007,1,2,4,8];
function schedule(st,correct){
  st.box = correct ? Math.min(5,(st.box||0)+1) : 1;
  let d=BOXDAYS[st.box]*DAY; const ex=examMs();
  if(ex){ const left=ex-Date.now(); if(left>0) d=Math.min(d, Math.max(left/3, 0.007*DAY)); }
  st.due=Date.now()+d;
}
function qst(id){ return S.q[id]||(S.q[id]={box:0,due:0,ok:0,ko:0,seen:0}); }
function recordQ(id,correct){ const st=qst(id); st.seen++; correct?st.ok++:st.ko++; st.last=Date.now(); schedule(st,correct); touchDay(); save(); }
function mastery(t){ const qs=Q.filter(q=>!t||q.t===t); return qs.reduce((s,q)=>s+Math.min((S.q[q.id]||{}).box||0,3)/3,0)/qs.length; }
const PBOX=[0.3,0.45,0.65,0.8,0.9,0.95];
function predicted(){
  const {plus,minus}=S.settings;
  const ev=Q.reduce((s,q)=>{ const p=PBOX[(S.q[q.id]||{}).box||0]; return s+Math.max(0,p*plus-(1-p)*minus); },0)/Q.length;
  let g=ev/plus*10;
  const sims=S.sims.slice(-2);
  if(sims.length){ const sg=sims.reduce((s,x)=>s+x.grade,0)/sims.length; g=0.5*g+0.5*sg; }
  return Math.max(0,Math.min(10,g));
}
function dueQ(){ const now=Date.now(); return Q.filter(q=>{ const s=S.q[q.id]; return s&&s.seen&&s.due<=now; }); }

function calAdvice(){
  const d=S.conf.doubt, n=d[0]+d[1], thr=S.settings.minus/(S.settings.plus+S.settings.minus);
  if(n<10) return "Marca tu seguridad en cada pregunta: con unas 10 dudosas ya podremos decirte si te conviene responderlas en el examen.";
  const p=d[0]/n;
  return p>thr+0.05?`✅ Cuando dudas aciertas el ${Math.round(p*100)}%: <b>responde las dudosas</b> en el examen.`:p<thr-0.05?`⚠️ Cuando dudas solo aciertas el ${Math.round(p*100)}%: <b>déjalas en blanco</b> salvo que hayas descartado opciones.`:`Estás justo en el umbral: responde solo si has descartado al menos una opción.`;
}

function practice(){

  $("#app").innerHTML=`<h1>Practicar</h1>

  </div>`;

function selectQuestions(mode,n=10){
  const now=Date.now(); const st=id=>S.q[id]||{};
  if(mode==="due") return shuffle(dueQ()).sort((a,b)=>(st(a.id).box||0)-(st(b.id).box||0)).slice(0,n);
  if(mode==="wrong") return shuffle(Q.filter(q=>{const s=S.q[q.id]; return s&&s.ko>0&&s.box<3;})).slice(0,n);
  if(TOPICS[mode]){ const pool=Q.filter(q=>q.t===mode);
    const unseen=shuffle(pool.filter(q=>!st(q.id).seen)), due=pool.filter(q=>st(q.id).seen&&st(q.id).due<=now), rest=shuffle(pool.filter(q=>st(q.id).seen&&st(q.id).due>now)).sort((a,b)=>(st(a.id).box||0)-(st(b.id).box||0));
    return shuffle(due).concat(unseen,rest).slice(0,n); }
  // smart: pendientes + nuevas de los temas más flojos + menor caja, intercaladas
  const due=shuffle(dueQ()).slice(0,Math.ceil(n*0.6));
  const order=TK.slice().sort((a,b)=>mastery(a)-mastery(b));
  const unseenBy=order.map(t=>shuffle(Q.filter(q=>q.t===t&&!st(q.id).seen&&(S.read[t]||!Object.values(S.read).some(Boolean)||true))));
  const out=due.slice(); let k=0;
  while(out.length<n && unseenBy.some(a=>a.length)){ const a=unseenBy[k%unseenBy.length]; if(a.length&&!out.includes(a[0])) out.push(a.shift()); else if(a.length) a.shift(); k++; }
  if(out.length<n){ const rest=Q.filter(q=>!out.includes(q)).sort((a,b)=>(st(a.id).box||0)-(st(b.id).box||0)||(st(a.id).due||0)-(st(b.id).due||0)); out.push(...rest.slice(0,n-out.length)); }
  return shuffle(out);
}
function startPractice(mode){
  VIEW="practice"; document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==="practice"));
  const qs=selectQuestions(mode);
  if(!qs.length){ practice(); return; }
  P={mode,qs,i:0,res:[],sel:null,stage:"choose",order:optOrder(qs[0])};
  renderP(); window.scrollTo(0,0);
}
function renderP(){
  const q=P.qs[P.i], T=TOPICS[q.t];

  <div id="opts">${P.order.map((oi,pos)=>{ let cls="opt"; if(lock){ cls+=" lock"; if(oi===q.a) cls+=" right"; else if(oi===P.sel) cls+=" wrong"; } else if(oi===P.sel) cls+=" sel";
    return `<button class="${cls}" data-oi="${oi}"><span class="let">${LET[pos]}</span><span>${esc(q.o[oi])}</span></button>`; }).join("")}</div>`;
  if(P.stage==="conf") html+=`<div class="conf"><div class="small" style="font-weight:600;margin-bottom:6px">¿Cuánta seguridad tienes? <span class="muted">(en el examen decidirías si responder o dejarla en blanco)</span></div>
    <div class="row"><button class="btn ok sm" data-c="sure">Seguro <span class="kbd">Q</span></button><button class="btn warn sm" data-c="doubt">Dudo <span class="kbd">W</span></button><button class="btn ko sm" data-c="guess">A ciegas <span class="kbd">E</span></button></div></div>`;
  if(P.stage==="choose") html+=`<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="blankBtn">No lo sé: la dejaría en blanco</button></div>`;
  if(lock){ const r=P.res[P.i];
    html+=`<div class="fb ${r.blank?"na":r.ok?"ok":"ko"}"><b>${r.blank?"En blanco (0 puntos en el examen).":r.ok?"✔ Correcto":"✘ Incorrecto"}</b> ${!r.blank&&!r.ok?`La correcta es <b>${LET[P.order.indexOf(q.a)]}</b>.`:""}<p style="margin:.4em 0 0">${esc(q.e)}</p></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">${P.i+1<P.qs.length?"Siguiente":"Ver resultado"} <span class="kbd" style="background:transparent;color:inherit">↵</span></button></div>`; }
  html+=`</div>`;
  $("#app").innerHTML=html;
  if(!lock) $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ P.sel=+b.dataset.oi; P.stage="conf"; renderP(); });
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>answerP(b.dataset.c));
  const bb=$("#blankBtn"); if(bb) bb.onclick=()=>answerP(null);
  const nb=$("#nextBtn"); if(nb){ nb.onclick=nextP; nb.focus(); }
}
function answerP(conf){
  const q=P.qs[P.i]; const blank=conf===null; const ok=!blank&&P.sel===q.a;
  P.res[P.i]={ok,blank,conf};
  recordQ(q.id, ok);
  if(!blank){ S.conf[conf][ok?0:1]++; save(); }
  P.stage="done"; renderP();
}
function nextP(){
  if(P.i+1<P.qs.length){ P.i++; P.sel=null; P.stage="choose"; P.order=optOrder(P.qs[P.i]); renderP(); window.scrollTo(0,0); return; }
  const ok=P.res.filter(r=>r.ok).length, bl=P.res.filter(r=>r.blank).length, ko=P.res.length-ok-bl;
  const {plus,minus}=S.settings; const pts=ok*plus-ko*minus, g=Math.max(0,pts)/(P.res.length*plus)*10;

  <div class="card"><div class="small muted">Fallos / blancos</div><div class="kpi">${ko} / ${bl}</div></div>
  <div class="card"><div class="small muted">Nota equivalente (+${plus}/−${minus})</div><div class="kpi" style="color:${g>=8?"var(--ok)":"var(--warn)"}">${g.toFixed(1)}</div></div></div>
  ${failed.length?`<div class="card"><h3 style="margin-top:0">Repasa ahora lo que fallaste (volverá a salirte pronto)</h3>${failed.map(q=>`<p><b>${esc(q.q)}</b><br><span style="color:var(--ok)">✔ ${esc(q.o[q.a])}</span><br><span class="small muted">${esc(q.e)}</span></p>`).join("")}</div>`:`<div class="card"><p>🎯 ¡Sesión perfecta! Estas preguntas volverán más espaciadas.</p></div>`}
  <div class="row"><button class="btn" id="againBtn">Otra sesión</button><button class="btn ghost" onclick="go('home')">Volver al inicio</button></div>`;
  $("#againBtn").onclick=()=>startPractice(P.mode==="due"&&!dueQ().length?"smart":P.mode);
}

function rateFC(r){
  const c=FC.cards[FC.i]; const st=S.f[c.id]||(S.f[c.id]={box:0,due:0});
