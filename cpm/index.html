<template id="tpl-learn">
<h1>Aprender</h1>
<p class="muted">Lee <b>un tema</b>, intenta responder las preguntas de “Autoexplícate” <b>antes</b> de abrirlas y, justo después, haz el test de ese tema. Recuperar de memoria es lo que fija el contenido; releer no.</p>
<div class="toc" id="learnToc"></div>

<section class="card" data-topic="t1">
<h2>T1 · Desarrollo de GUI en Java</h2>
<h3>JFC (Java Foundation Classes)</h3>
<p>Es la API estándar para GUI en Java. Está formada por <b>3 librerías: AWT, Swing y Java2D</b>.</p>
<div class="grid g2">
<div><h3>AWT</h3><ul class="tight">
<li>Pensada para que la GUI se ejecute en cualquier sistema y en <b>todas las versiones del JDK</b>.</li>
<li>Usa los <b>componentes nativos del sistema operativo</b>.</li>
<li><b>Inconvenientes:</b> solo puede ofrecer lo que existe en <i>todos</i> los SO, y como los componentes se comportan distinto en cada sistema, las aplicaciones portables eran muy complicadas.</li>
<li>Ofrece: <b>Componentes, Contenedores, Eventos y Layouts</b>.</li>
<li>Paquetes: <code>java.awt.*</code> y <code>java.awt.event.*</code>.</li></ul></div>
<div><h3>Swing</h3><ul class="tight">
<li>Publicado en <b>1997</b> para resolver las limitaciones de AWT. Forma parte del JDK <b>desde la 1.2</b>.</li>
<li>Paquete <code>javax.swing</code>. Está <b>basado en AWT</b>.</li>
<li>Componentes <b>escritos en Java</b> → <b>look &amp; feel homogéneo</b> entre plataformas. Funciona con Java 1.1 o superior.</li>
<li>Puede <b>cambiar el look &amp; feel en tiempo de ejecución</b>.</li>
<li>Más componentes: tablas, árboles, sliders, spinners, barras de progreso, internal frames y componentes de texto.</li>
<li>Permite <b>bordes</b>, <b>tooltips</b> y <b>asociar eventos de teclado</b> a los componentes.</li></ul></div>
</div>
<h3>Arquitectura: contenedores, componentes y eventos</h3>
<ul class="tight">
<li><b>Componente:</b> elemento con el que interactúa el usuario. Tiene <b>propiedades</b> (con valores por defecto), <b>métodos</b> (funcionalidad) y <b>eventos</b>.</li>
<li><b>Evento:</b> señal <i>externa o interna</i> que dispara la ejecución de un bloque de código implementado como método (un clic, la llamada a un método, la modificación de una propiedad…). El desarrollador debe programar la gestión de cada evento.</li>
<li><b>Contenedor:</b> agrupa y gestiona componentes, y <b>también es un componente</b>, así que puede ir dentro de otro contenedor. Coloca los componentes aplicando un <b>layout</b>.</li>
<li>Todo componente debe vivir dentro de un contenedor.</li>
<li>La interacción entre el sistema y el usuario se hace mediante <b>eventos</b>.</li>
</ul>
<h3>Patrón Composite</h3>
<p>Compone objetos en <b>estructuras de árbol</b> para representar jerarquías parte-todo, y permite tratar <b>igual los objetos individuales y las composiciones</b>.</p>
<svg class="svgfig" viewBox="0 0 520 200" role="img" aria-label="Árbol: JFrame contiene ContentPane (JPanel), que contiene JButton1, JButton2 y JTextArea1">
  <rect class="acc" x="200" y="10" width="120" height="34" rx="8"/><text x="260" y="32" text-anchor="middle">JFrame</text>
  <rect class="acc" x="170" y="80" width="180" height="34" rx="8"/><text x="260" y="102" text-anchor="middle">JPanel (ContentPane)</text>
  <rect class="box" x="20" y="150" width="130" height="34" rx="8"/><text x="85" y="172" text-anchor="middle">JButton1</text>
  <rect class="box" x="195" y="150" width="130" height="34" rx="8"/><text x="260" y="172" text-anchor="middle">JButton2</text>
  <rect class="box" x="370" y="150" width="130" height="34" rx="8"/><text x="435" y="172" text-anchor="middle">JTextArea1</text>
  <path class="ln" d="M260 44V80M260 114V132M85 132H435M85 132V150M260 132V150M435 132V150"/>
</svg>
<p>En Swing la ventana es un <b>contenedor de alto nivel (JFrame)</b>. Los componentes <b>no se añaden directamente al JFrame</b>: van en un <b>JPanel llamado ContentPane</b>, que está dentro del JFrame.</p>
<div class="trap"><b>⚠ Trampas típicas</b><ul class="tight">
<li><b>Composite</b> (contenedores/componentes) ≠ <b>Observer</b> (eventos, Tema 4).</li>
<li>AWT usa componentes <i>nativos</i>; Swing los tiene <i>escritos en Java</i>. Hay preguntas que intercambian las dos cosas.</li>
<li>“Swing y AWT tienen los mismos componentes” es <b>falso</b>, porque Swing tiene más. “Ambas son parte de JFC” y “AWT incluye el paquete event” son ciertas.</li>
</ul></div>
<details class="self"><summary>Autoexplícate: ¿por qué Swing tiene un look &amp; feel homogéneo y AWT no?</summary><p>Porque los componentes de Swing están escritos en Java y Swing los dibuja él mismo. AWT delega en los componentes nativos de cada SO, que se ven y se comportan distinto en cada sistema.</p></details>
<details class="self"><summary>Autoexplícate: ¿por qué Composite encaja con contenedores y componentes?</summary><p>Porque un contenedor <i>es</i> un componente que contiene otros componentes. Eso forma un árbol en el que una operación (pintar, por ejemplo) se aplica igual a una hoja (un JButton) que a una rama (un JPanel).</p></details>
<div class="row"><button class="btn" data-quiz="t1">Hacer test del T1 →</button><label class="row small"><input type="checkbox" data-read="t1"> Marcar como leído</label></div>
</section>

<section class="card" data-topic="t2">
<h2>T2 · Fundamentos de la Interacción Persona-Ordenador</h2>
<h3>¿Qué es HCI?</h3>
<p><b>ACM-SIGCHI (1992):</b> disciplina que se ocupa del <b>diseño, evaluación e implementación</b> de sistemas informáticos interactivos para uso humano y del estudio de los fenómenos que los rodean. Incluye el diseño de interfaces y aspectos psicológicos (motivación, satisfacción), ergonómicos y organizativos. El curso se centra en las <b>interfaces de usuario</b>.</p>
<p><b>Interfaz de usuario:</b> el conjunto de puntos de interacción entre el usuario y el sistema (todas las entradas y salidas). Supone <b>≈50% del código fuente</b> y <b>&gt;70% del esfuerzo de desarrollo</b> (Gartner Group).</p>
<p><b>Consecuencias de una UI pobre:</b> rechazo del sistema, baja productividad, periodos de formación inviables y altas tasas de error que generan frustración.</p>
<p><b>Objetivo de HCI:</b> construir o mejorar la seguridad, utilidad, eficacia y eficiencia, pero <b>sobre todo la USABILIDAD</b>.</p>
<h3>Usabilidad (ISO/IEC 9241)</h3>
<p>Es el grado en que un producto puede ser usado por <b>usuarios específicos</b> para conseguir <b>objetivos específicos</b> con <b>eficacia, eficiencia y satisfacción</b> en un <b>contexto de uso específico</b>.</p>
<div class="tablewrap"><table><tr><th>Effectiveness (eficacia)</th><td>Consecución <b>completa y exacta</b> de los objetivos del usuario.</td></tr>
<tr><th>Efficiency (eficiencia)</th><td>Lo mismo, pero <b>en relación con los recursos usados</b> (uso óptimo de los recursos).</td></tr>
<tr><th>Satisfaction</th><td><b>Comodidad y aceptación</b> del sistema por parte del usuario.</td></tr></table></div>
<p>Un sistema es usable cuando es <b>fácil de aprender</b> y <b>fácil de usar</b>. Las dimensiones son <b>Learnability</b>, <b>Efficiency</b> y <b>Safety</b> (errores pocos y recuperables), además de <i>Ergonomics</i> y <i>Aesthetics</i>.</p>
<p>La usabilidad va <b>más allá de los colores y la tipografía</b>: abarca el diseño del diálogo, el vínculo cognitivo usuario-sistema, la calidad de la documentación y la ayuda en línea. Sus beneficios son <b>menores costes</b> de producción, de soporte y mantenimiento y de uso, y <b>mejor calidad</b>.</p>
<h3>Principios básicos de usabilidad (3 categorías × 4)</h3>
<div class="grid g3">
<div class="card" style="margin:0"><b style="color:var(--t2)">a. Learnability</b><p class="small muted">Que un novato pase a experto con poco esfuerzo</p><ul class="tight small">
<li><b>Prediction:</b> la experiencia inicial basta para adivinar el resultado de interacciones futuras. Se consigue <b>controlando la visibilidad de las operaciones</b> (disponibles y no disponibles). Si el usuario tiene que recordar lo que vio en la pantalla anterior, el sistema <b>no</b> es predecible.</li>
<li><b>Synthesis:</b> informa al usuario de cualquier cambio. Puede ser <b>inmediata</b> (sin que el usuario la pida, la ideal) o <b>esporádica</b> (solo a petición).</li>
<li><b>Familiarity:</b> correlación entre lo que el usuario ya sabe y lo que exige el sistema. Se mejora con <b>metáforas del mundo real</b>.</li>
<li><b>Consistency:</b> todos los mecanismos se usan siempre igual. Se consigue con <b>guías de estilo</b>, un <b>look &amp; feel común</b> y <b>sin cambiar técnicas que el usuario ya conoce (F1 = Ayuda)</b>.</li></ul></div>
<div class="card" style="margin:0"><b style="color:var(--t2)">b. Flexibility</b><p class="small muted">Formas de intercambiar información</p><ul class="tight small">
<li><b>Initiative in the dialog:</b> ¿quién la toma? Lo ideal es que la tome el usuario. Un <b>diálogo modal</b> (“Guardar como”) es un ejemplo de interacción guiada por el sistema.</li>
<li><b>Task delegation:</b> pasar el control de una tarea al sistema (copias de seguridad, corrector ortográfico).</li>
<li><b>Replacement capacity:</b> un parámetro se puede sustituir por otro equivalente (un color por nombre, por valor hexadecimal o con una paleta).</li>
<li><b>Customization capacity:</b> el usuario <i>y/o</i> el sistema adaptan la interfaz según preferencias de diseño o según las opciones adecuadas al nivel de experiencia.</li></ul></div>
<div class="card" style="margin:0"><b style="color:var(--t2)">c. Robustness</b><p class="small muted">Alcanzar objetivos y percibir qué pasa</p><ul class="tight small">
<li><b>Observability:</b> el sistema muestra su <b>estado interno</b> en la UI (barras de progreso, tests de velocidad).</li>
<li><b>Recoverability:</b> poder alcanzar el objetivo inicial tras un error. Se aplica el principio de <b>esfuerzo proporcional</b>: si una acción es difícil de deshacer (borrar un fichero), también debe ser difícil de hacer; si es fácil de deshacer (renombrar), puede ser fácil.</li>
<li><b>Response times:</b> lo más cortos posible. Si no lo son, hay que avisar de que se está procesando (lo que también es observabilidad).</li>
<li><b>Task advisability:</b> en qué medida el sistema da soporte a <b>todas las tareas</b> que el usuario quiere hacer, y tal como el usuario las entiende.</li></ul></div>
</div>
<div class="mnemo"><b>🧠 Mnemotecnia</b>: <b>L</b>earnability = <b>P S F C</b> → “<b>P</b>ara <b>S</b>er <b>F</b>ácil, <b>C</b>onsistente”. <b>F</b>lexibility = <b>I D R C</b> → “<b>I</b>niciativa, <b>D</b>elegar, <b>R</b>eemplazar, <b>C</b>ustomizar”. <b>R</b>obustness = <b>O R R T</b> → “<b>O</b>bserva, <b>R</b>ecupera, <b>R</b>esponde, <b>T</b>areas”.</div>
<h3>Accesibilidad</h3>
<p>Las personas son diferentes y usan la tecnología en circunstancias distintas (problemas de visión con el tamaño de letra, personas mayores con el ratón o la navegación, distintos dispositivos…). La accesibilidad es otro <b>pilar</b> del buen diseño. Estrategias: permitir <b>colores de alto contraste</b>, permitir <b>aumentar la letra</b> y <b>no usar solo el color</b> como fuente de información.</p>
<h3>Diseño centrado en el usuario (adelanto)</h3>
<p>Implicar al usuario todo lo posible (incluso en el equipo de diseño), observar su trabajo diario y construir prototipos, escenarios o modelos para que evalúe el diseño <b>cuanto antes</b>.</p>
<div class="trap"><b>⚠ Trampas típicas</b><ul class="tight">
<li><b>Eficacia</b> (lograr el objetivo) ≠ <b>eficiencia</b> (lograrlo en relación con los recursos).</li>
<li><b>50%</b> del código y <b>70%</b> del esfuerzo, no al revés.</li>
<li>F1 = Ayuda es un ejemplo de <b>Consistency</b>. Las metáforas son <b>Familiarity</b>.</li>
<li>El diálogo modal es <b>Initiative</b> (la toma el sistema), no recoverability.</li>
<li>“Notificar los cambios de forma esporádica/eventual” <b>no</b> es lo ideal; lo ideal es la notificación <b>inmediata</b>.</li>
<li>“Cambiar a menudo las técnicas de interacción para mantener la atención” va <b>contra</b> la consistencia.</li>
</ul></div>
<details class="self"><summary>Autoexplícate: ¿por qué deshabilitar una opción de menú mejora la predicción?</summary><p>Porque controla la visibilidad de las operaciones: el usuario ve qué puede hacer en ese momento y no tiene que recordarlo ni descubrirlo probando.</p></details>
<details class="self"><summary>Autoexplícate: ¿qué dos principios se aplican cuando una barra de progreso aparece en una operación lenta?</summary><p>Observability (muestra el estado interno) y Response times (si la respuesta no es inmediata, hay que avisar de que se está procesando).</p></details>

<section class="card" data-topic="t3">
<h2>T3 · Diseño Centrado en el Usuario (DCU / UCD)</h2>
<p><b>Definición (UPA, Usability Professionals Association):</b> enfoque de diseño en el que el proceso está <b>dirigido por la información sobre los usuarios</b> que usarán el producto. Lo define la <b>ISO 13407</b>, actualizada en la <b>ISO 9241-210:2010</b>.</p>
<p><b>Origen:</b> la ingeniería civil y la arquitectura. <b>Dreyfuss</b> (<i>Designing for People</i>, <b>1955</b>) popularizó la idea de que el diseño es un proceso. Para diseñar el teléfono Bell (serie 500) estudió cómo se <b>construían</b>, cómo los <b>percibían</b> y cómo los <b>usaban</b> los usuarios.</p>
<p><b>En software:</b> el término <i>User Centered System Design</i> (Norman) se usó en la <b>primera conferencia CHI (1983)</b>, organizada por ACM-SIGCHI.</p>
<div class="tablewrap"><table>
<tr><th>Conceptual model</th><td>Lo que el <b>diseñador ofrece</b> a los usuarios.</td></tr>
<tr><th>User Interface</th><td>Lo que el usuario <b>ve</b>.</td></tr>
<tr><th>Mental model</th><td>El modelo que el usuario <b>construye</b> a partir de la UI (lo que <b>entiende</b>).</td></tr></table></div>
<p>Donald Norman: “Las decisiones de diseño deben basarse en las <b>necesidades y deseos de los usuarios</b>”. Hay que identificar <b>quién</b> usará el producto, <b>para qué</b> y <b>en qué condiciones</b>. Ojo: <b>clientes ≠ usuarios</b>.</p>
<h3>Proceso iterativo: 4 fases</h3>
<p>No es UN proceso, sino una <b>familia de procesos iterativos</b> que encajan en un marco común.</p>
<svg class="svgfig" viewBox="0 0 520 250" role="img" aria-label="Ciclo iterativo de 4 fases: contexto de uso, requisitos, soluciones de diseño, evaluación">

<h3>1. Especificar el contexto de uso (ENTENDER)</h3>
<p>El contexto lo definen las características de los usuarios, las tareas y el entorno organizativo, técnico y físico. Hay que saber <b>quién</b> lo usará, <b>para qué</b> y <b>en qué condiciones</b>. La descripción incluye:</p>
<ul class="tight"><li><b>Usuarios y otros stakeholders</b> (grupos relevantes).</li>
<li><b>Características</b> de cada grupo: conocimiento, habilidad, experiencia, educación, formación, atributos físicos, hábitos, preferencias y capacidades.</li>
<li><b>Objetivos y tareas</b>: cómo, con qué frecuencia y cuánto tiempo; interferencias; salud y seguridad; si pueden hacerlas usuarios especiales.</li>
<li><b>Entornos:</b> <b>técnico</b> (hardware, ancho de banda, software), <b>físico</b> (luz, ruido, temperatura, distribución espacial, ergonomía) y <b>social y cultural</b> (prácticas de trabajo, estructura organizativa, actitudes).</li></ul>
<p><b>Personas-Escenario:</b> sintetizan la información en fichas que representan <b>arquetipos</b> de usuario. La identidad es <b>ficticia</b> (nombre, foto), pero las necesidades, motivaciones, actitudes y comportamientos se basan en <b>datos reales</b>. Se contextualizan con <b>escenarios</b>. Conviene <b>no pasar de 7 u 8</b>, cubrir el mayor porcentaje posible de la audiencia y <b>no solaparlas</b>.</p>
<h3>2. Especificar requisitos</h3>
<p>Requisitos de negocio y objetivos de usuario necesarios para el éxito, considerando el contexto. Hay que equilibrar <b>viabilidad de negocio</b>, <b>factibilidad tecnológica</b> y <b>necesidades y deseos del usuario</b>.</p>
<ul class="tight"><li>Identificar las necesidades (y <b>restricciones</b>) de usuarios y stakeholders.</li>
<li>Derivar los requisitos de usuario: los del contexto (una app GPS se usa en exteriores), los de ergonomía y accesibilidad, los <b>objetivos de usabilidad</b> (con criterios de satisfacción) y los organizativos.</li>
<li><b>Resolver los conflictos (trade-offs)</b> entre requisitos.</li></ul>
<h3>3. Crear soluciones de diseño</h3>
<p>Por etapas, de un concepto aproximado a un diseño completo: generar muchas ideas, identificar oportunidades y probar y refinar. Actividades: diseñar tareas, interacción y UI; <b>concretar</b> con escenarios, simulaciones, <b>prototipos</b> o mock-ups; <b>modificar</b> según la evaluación; <b>comunicar</b> el diseño a quien lo implementa.</p>
<h3>4. Evaluar diseños</h3>
<p>La evaluación, idealmente con <b>tests de usabilidad con usuarios reales</b>, es tan esencial como el control de calidad. Cuanto antes se enseñe el diseño, mejor.</p>
<ul class="tight"><li><b>User-based testing:</b> el usuario usa el prototipo y lo observamos o le preguntamos al final. Puede hacerse en el contexto real o como validación de campo (<b>beta testing</b>).</li>
<li><b>Inspection-based evaluation:</b> la hacen <b>expertos</b> con guías de usabilidad y accesibilidad. Es más <b>simple, rápida y barata</b> y <b>complementa</b> los tests con usuarios, porque <b>usuarios y expertos suelen encontrar problemas distintos</b>.</li></ul>
<div class="trap"><b>⚠ Trampas típicas</b><ul class="tight">
<li>ISO <b>13407</b>, actualizada en ISO <b>9241-210:2010</b> (no al revés).</li>
<li>Fechas: Dreyfuss <b>1955</b>, CHI <b>1983</b>, ISO 9241-210 <b>2010</b>.</li>
<li>El modelo <b>mental</b> lo construye el usuario; el <b>conceptual</b> lo ofrece el diseñador.</li>
<li>Personas: la identidad es inventada, pero los datos deben ser reales; máximo 7-8 y sin solaparse.</li>
<li>La inspección por expertos <b>no sustituye</b> a los tests con usuarios: los complementa.</li>
</ul></div>
<details class="self"><summary>Autoexplícate: ¿por qué es útil que el proceso sea iterativo?</summary><p>Porque la evaluación genera feedback que obliga a modificar el diseño (y a veces a revisar el contexto y los requisitos). Cada vuelta acerca el modelo conceptual al modelo mental del usuario.</p></details>

<section class="card" data-topic="t4">
<h2>T4 · Gestión de eventos</h2>
<p>El SO monitoriza continuamente el entorno, captura los eventos y los notifica a las aplicaciones, y cada aplicación decide cómo tratarlos. Los eventos los generan <b>el usuario</b> o <b>el sistema</b>.</p>
<p>En Java, cuando ocurre un evento se crea <b>un objeto de la clase específica de ese evento</b>, que se envía a un método llamado <b>handler</b>. El modelo de eventos de Java se basa en la <b>delegación</b>: la responsabilidad de tratar un evento producido en la fuente se delega en otro objeto, el <b>listener</b>. Responde al patrón <b>Observer</b>.</p>
<svg class="svgfig" viewBox="0 0 560 170" role="img" aria-label="Fuente notifica un objeto evento al listener registrado con addXxxListener">
  <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="currentColor" style="color:var(--muted)"/></marker></defs>
  <rect class="acc" x="10" y="50" width="150" height="64" rx="10"/><text x="85" y="76" text-anchor="middle">Event SOURCE</text><text x="85" y="96" text-anchor="middle" style="fill:var(--muted)">btAzul (JButton)</text>
  <rect class="box" x="210" y="60" width="140" height="44" rx="10"/><text x="280" y="80" text-anchor="middle">ActionEvent</text><text x="280" y="96" text-anchor="middle" style="fill:var(--muted)">e.getSource()</text>
  <rect class="acc" x="400" y="50" width="150" height="64" rx="10"/><text x="475" y="76" text-anchor="middle">LISTENER</text><text x="475" y="96" text-anchor="middle" style="fill:var(--muted)">pA: ProcesaAccion</text>
  <path class="ln" marker-end="url(#ar2)" d="M160 82H206"/><path class="ln" marker-end="url(#ar2)" d="M350 82H396"/>
  <path class="ln" stroke-dasharray="5 4" d="M85 50V22H475V50"/><text x="280" y="16" text-anchor="middle">registro: btAzul.addActionListener(pA)</text>
  <text x="475" y="140" text-anchor="middle" style="fill:var(--muted)">actionPerformed(ActionEvent e)</text>
</svg>
<h3>Elementos</h3>
<ul class="tight">
<li><b>Fuentes (sources):</b> objetos que <b>detectan y notifican</b> eventos a los listeners. Ejemplos: un botón al pulsarlo, un TextField al perder el foco, un TextArea al pulsar una tecla, una ventana al cerrarse.</li>
<li><b>Clases de evento:</b> cada evento es una instancia de una subclase de <code>EventObject</code>, organizadas en jerarquía. <code>getSource()</code> devuelve el componente que lo generó como <b>Object</b>, así que hay que hacer <b>cast</b>.</li>
<li><b>Listeners:</b> instancias de una clase que <b>implementa una interfaz listener</b> (<code>ActionListener, FocusListener, ItemListener, KeyListener, MouseListener, WindowListener</code>… en <code>java.awt.event</code>).</li>
<li><b>Adaptadores (adapter classes).</b></li>
<li><b>Registro:</b> <code>fuente.addXxxListener(listener)</code>.</li></ul>
<p><b>¿Cómo accede el listener a la clase principal?</b> Hay dos formas: como <b>clase interna (inner class)</b>, que accede a todos los miembros, o como <b>clase externa</b> que recibe una referencia a la clase principal <b>en su constructor</b> (inyección de dependencias por constructor).</p>
<h3>Ejemplo 1: ActionEvent</h3>
<p>Lo generan hacer clic en un botón, seleccionar un elemento de una lista o de un menú, o pulsar <b>Intro en un textfield</b>. La interfaz <code>ActionListener</code> tiene <b>un único método</b>, <code>actionPerformed(ActionEvent e)</code>, así que <b>no hay ActionAdapter</b>.</p>
<pre>class VentanaPrincipal extends JFrame {
  private ProcesaAccion pA = null;
  private void cambiaColorPanel(){ panelPrincipal.setBackground(Color.blue); }
  class ProcesaAccion implements ActionListener {        // LISTENER (inner class)
    public void actionPerformed(ActionEvent e){ cambiaColorPanel(); }
  }
  public VentanaPrincipal(){ pA = new ProcesaAccion(); ... }
  private JButton getBtAzul(){ ... btAzul.addActionListener(pA); ... }  // REGISTRO
}</pre>
<p><b>WindowBuilder</b> genera el listener como <b>clase interna anónima</b>: <code>btAzul.addActionListener(new ActionListener(){ public void actionPerformed(ActionEvent e){...} });</code></p>
<h3>Ejemplo 2: FocusEvent y los adaptadores</h3>
<p><code>FocusListener</code> tiene <b>2 métodos</b>: <code>focusGained</code> y <code>focusLost</code>. Si implementas la interfaz tienes que escribir los dos, aunque dejes uno vacío.</p>
<p><b>Adaptadores:</b> hay <b>uno por cada interfaz listener con más de un método</b> (MouseAdapter, WindowAdapter, KeyAdapter, MouseMotionAdapter, FocusAdapter…). Implementan todos los métodos vacíos, así que <b>se heredan (extends)</b> y solo se sobrescribe lo necesario.</p>
<pre>class ProcesaFoco extends FocusAdapter {          // extends, NO implements
  public void focusLost(FocusEvent e){ compruebaLongitud(); }
}
txDNI.addFocusListener(pF);                       // se registra con addFocusListener</pre>
<h3>Ejemplo 3: varios componentes con el mismo comportamiento</h3>
<p>Basta con <b>un único listener</b> registrado en todos. Ejemplo: “Cancelar” en un menú y en un botón necesita <b>un listener (clase externa si debe ser accesible desde ambas clases) y dos registros</b>. Para actuar sobre el componente concreto se usa <code>e.getSource()</code> con cast:</p>
<pre>class ProcesaBorde extends MouseAdapter {
  public void mouseEntered(MouseEvent e){ tratarBorde(e, true); }
  public void mouseExited (MouseEvent e){ tratarBorde(e, false); }
}
private void tratarBorde(MouseEvent e, boolean b){
  JButton boton = (JButton) e.getSource();   // cast obligatorio
  boton.setBorderPainted(b);
}
boton1.addMouseListener(pB); boton2.addMouseListener(pB);   // mismo listener, 2 registros</pre>
<h3>Consumir y desregistrar</h3>
<pre>public void keyTyped(KeyEvent e){
  if (!Character.isDigit(e.getKeyChar())) e.consume();   // solo deja escribir dígitos
}
textDNI.removeKeyListener(pT);   // desregistrar (pT deja de escuchar)</pre>
<p><code>consume()</code> se aplica al <b>evento</b>, que se detiene y no tiene efecto más allá de ese listener. Se desregistra con <code>fuente.removeXxxListener(listener)</code>, por ejemplo desde un checkbox que activa o desactiva un filtro.</p>
<h3>Tabla resumen (memorízala)</h3>
<div class="tablewrap"><table>
<tr><th>Evento</th><th>Listener</th><th>Adapter</th><th>Métodos</th><th>Cuándo</th></tr>
<tr><td>ActionEvent</td><td>ActionListener</td><td>—</td><td>actionPerformed</td><td>clic en botón, elemento de lista o menú, Intro en textfield</td></tr>
<tr><td>ComponentEvent</td><td>ComponentListener</td><td>ComponentAdapter</td><td>componentHidden / Shown / Moved / Resized</td><td>cambiar tamaño, mover, mostrar u ocultar</td></tr>
<tr><td>ContainerEvent</td><td>ContainerListener</td><td>ContainerAdapter</td><td>componentAdded / componentRemoved</td><td>añadir o quitar componentes</td></tr>
<tr><td>FocusEvent</td><td>FocusListener</td><td>FocusAdapter</td><td>focusGained / focusLost</td><td>gana o pierde el foco</td></tr>
<tr><td>KeyEvent</td><td>KeyListener</td><td>KeyAdapter</td><td>keyPressed / keyReleased / keyTyped</td><td>se pulsa o suelta una tecla</td></tr>
<tr><td>MouseEvent</td><td>MouseListener</td><td>MouseAdapter</td><td>mouseClicked / Entered / Exited / Pressed / Released</td><td>operaciones con el ratón</td></tr>
<tr><td>MouseEvent</td><td>MouseMotionListener</td><td>MouseMotionAdapter</td><td>mouseDragged / mouseMoved</td><td>movimiento del ratón</td></tr>
<tr><td>WindowEvent</td><td>WindowListener</td><td>WindowAdapter</td><td>windowOpened / Closing / Closed / Activated / Deactivated / Iconified / Deiconified (7)</td><td>operaciones sobre una ventana</td></tr>
<tr><td>ItemEvent</td><td>ItemListener</td><td>—</td><td>itemStateChanged</td><td>se selecciona un checkbox o un elemento de lista</td></tr>
<tr><td>TextEvent</td><td>TextListener</td><td>—</td><td>textValueChanged</td><td>cambia el contenido de un textfield o textarea</td></tr>
</table></div>
<div class="trap"><b>⚠ Trampas típicas (las que más caen)</b><ul class="tight">
<li><code>class X <b>implements</b> KeyAdapter</code> es un <b>ERROR</b>: los adaptadores son clases, así que se usa <b>extends</b>. Las interfaces (<code>KeyListener</code>) se <b>implementan</b>.</li>
<li><code>addKeyAdapter(...)</code> o <code>addMouseAdapter(...)</code> <b>no existen</b>: siempre es <code>addXxx<b>Listener</b></code>, aunque el objeto herede de un adapter.</li>
<li><code>JTextArea a = e.getSource();</code> <b>no compila</b>: falta el cast <code>(JTextArea)</code>.</li>
<li>Una fuente <b>puede tener varios listeners, incluso del mismo tipo</b>, y no se sustituyen entre sí.</li>
<li>El registro es <code>fuente.addXxxListener(listener)</code>, no al revés. La fuente es el componente y el receptor es el listener.</li>
<li><code>consume()</code> se llama sobre el <b>evento</b> (<code>e.consume()</code>), no sobre el char ni sobre el componente.</li>
<li>mouseEntered/mouseExited son de <b>MouseListener</b>; mouseMoved/mouseDragged son de <b>MouseMotionListener</b>.</li>
</ul></div>
<details class="self"><summary>Autoexplícate: si quiero el mismo comportamiento en text1 y text2 al ganar el foco, ¿qué cambio en el listener?</summary><p>Sustituyo la referencia fija <code>text1</code> por <code>((JTextField) e.getSource())</code> y registro el <b>mismo</b> objeto listener también en text2. Así no hace falta crear otra clase.</p></details>
<details class="self"><summary>Autoexplícate: ¿cuándo me conviene un adapter y cuándo implementar la interfaz?</summary><p>El adapter conviene cuando la interfaz tiene varios métodos y solo necesito algunos. Implemento la interfaz si necesito todos, si la interfaz tiene un solo método (y entonces no hay adapter) o si mi clase ya hereda de otra (Java no tiene herencia múltiple). Las dos opciones funcionan.</p></details>

<section class="card" data-topic="t5">
<h2>T5 · El factor humano y el modelado de usuarios</h2>
<h3>Restricciones del sistema visual</h3>
<ul class="tight"><li>Tamaño de letra <b>≥ 11</b>, interlineado proporcional, <b>evitar fuentes complicadas</b> y <b>no escribir en MAYÚSCULAS</b>.</li>
<li><b>Colores:</b> usar combinaciones compatibles y <b>evitar rojo-verde, azul-amarillo, verde-azul y rojo-azul</b>. Evitar colores brillantes en zonas grandes de la pantalla.</li>
<li>Usar <b>códigos redundantes</b> (formas, iconos, texto) además del color. El <b>daltonismo</b> afecta al <b>8% de los hombres y al 1% de las mujeres</b>.</li></ul>
<h3>Modelo de usuario</h3>
<p>Es un modelo de los requisitos de interacción del usuario: una <b>generalización de una representación abstracta</b> de la información que se conoce sobre un usuario. Incluye su <b>modelo mental, su lenguaje, su precisión motora, sus tiempos de reacción esperados</b>, etc.</p>
<p><b>Sirve para</b> hacer el sistema <b>adaptativo</b> y <b>personalizarlo</b>. Aplicaciones: accesibilidad (letra o botones más grandes para mayores), simplificar la información y adaptar el catálogo de ventas al perfil.</p>
<div class="tablewrap"><table><tr><th>Culture based models (locales)</th><th>Biology based models (universales)</th></tr>
<tr><td>Idiomas, procesamiento de imágenes, <b>significado de los colores</b>, <b>dirección de lectura</b></td><td><b>Velocidad de tecleo</b>, precisión de movimientos, velocidad de aprendizaje</td></tr></table></div>
<p class="small muted">Clasificación de Harris (1990), <i>Our Kind</i>.</p>
<h3>Personas (modelo cultural)</h3>
<p>Las propuso <b>Alan Cooper en 1999</b> (<i>The Inmates are Running the Asylum</i>). Son <b>personajes ficticios</b> que representan los tipos de usuario: una <b>descripción narrativa</b> de patrones de comportamiento típicos con <b>detalles concretos, sin generalizaciones</b>. Se basan en entrevistas e <b>investigación etnográfica</b> con usuarios reales. Su objetivo es evitar errores y malentendidos y facilitar la comprensión de los objetivos, capacidades, necesidades y contexto de los usuarios.</p>
<div class="grid g2"><div><b style="color:var(--ok)">Pros</b><ul class="tight small"><li>Simplifican el diseño centrándose en <b>personas</b>, no en objetivos de marketing o ventas.</li><li>Diseñar para el arquetipo facilita cumplir los requisitos de interacción.</li><li>Dan una <b>cara humana</b> a los diseñadores.</li></ul></div>
<div><b style="color:var(--ko)">Contras</b><ul class="tight small"><li>No se puede saber <b>cuántos usuarios representa</b> una persona.</li><li><b>No se pueden validar ni falsar</b>.</li><li><b>No son herramientas científicas</b>.</li></ul></div></div>
<h3>Modelos biológicos</h3>
<p>Modelan al usuario por sus rasgos biológicos para <b>predecir</b> aspectos de la interacción. Los más populares son el <b>Human Information System Model (Rasmussen)</b> y el <b>Human Processor Model (Card, Moran y Newell, 1983)</b>.</p>
<p><b>Human Processor Model:</b> método cognitivo para <b>estimar el tiempo</b> que tarda alguien en hacer una tarea. Tiene <b>3 subsistemas</b>: <b>perceptivo</b> (estímulos sensoriales), <b>motor</b> (controla las acciones) y <b>cognitivo</b> (conecta los dos). Funcionan de forma <b>independiente</b>, a veces en paralelo y a veces en secuencia, y se basan en ciclos de reloj.</p>
<svg class="svgfig" viewBox="0 0 560 150" role="img" aria-label="Perceptivo 100 ms, cognitivo 70 ms, motor 70 ms; reacción media 240 ms">
  <defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="currentColor" style="color:var(--muted)"/></marker></defs>
  <rect class="acc" x="10" y="30" width="160" height="60" rx="10"/><text x="90" y="55" text-anchor="middle">Perceptual</text><text x="90" y="75" text-anchor="middle">100 [50–200] ms</text>
  <rect class="acc" x="200" y="30" width="160" height="60" rx="10"/><text x="280" y="55" text-anchor="middle">Cognitive</text><text x="280" y="75" text-anchor="middle">70 [25–170] ms</text>
  <rect class="acc" x="390" y="30" width="160" height="60" rx="10"/><text x="470" y="55" text-anchor="middle">Motor</text><text x="470" y="75" text-anchor="middle">70 [30–100] ms</text>
  <path class="ln" marker-end="url(#ar3)" d="M170 60H196"/><path class="ln" marker-end="url(#ar3)" d="M360 60H386"/>
  <text x="280" y="125" text-anchor="middle">Reacción media = 100 + 70 + 70 = 240 ms (rango 105–470 ms)</text>
</svg>
<p><b>Sistema perceptivo:</b> la entrada llega por los sentidos (vista, oído, tacto, olfato, gusto) y la salida es el movimiento de dedos, extremidades, ojos, cabeza y el sistema vocal. Tiene 2 memorias:</p>
<div class="tablewrap"><table><tr><th>Memoria</th><th>Decay time</th><th>Tamaño</th></tr>
<tr><td>Visual</td><td>200 [70–1000] ms</td><td>17 [7–17] caracteres</td></tr>
<tr><td>Auditiva</td><td>1500 [900–3500] ms</td><td>5 [4,4–6,2] caracteres</td></tr></table></div>
<h3>Sistema cognitivo: la memoria humana</h3>
<p>Hay tres tipos: <b>sensorial → corto plazo (STM) → largo plazo (LTM)</b>.</p>
<div class="tablewrap"><table>
<tr><th>Sensorial</th><td>Una <b>por sentido</b>, se actualiza continuamente y recibe la información <b>sin prestar atención</b>. Lo que capta la atención pasa a la STM. Si un estímulo se repite de forma continua aparece la <b>habituación</b> (nos volvemos menos sensibles), y hay que evitarla, por ejemplo con fondos que parpadean.</td></tr>
<tr><th>Corto plazo (STM)</th><td>Es la memoria de <b>trabajo</b> (multiplicar 35×6, retener un teléfono). Limitada en tiempo y tamaño (<b>7±2 elementos</b>) y con <b>acceso rápido</b>. Técnicas para estimularla: <b>repetir (ensayo)</b> y <b>trocear o agrupar (chunking)</b>. <br><b>Diseño:</b> no obligar a recordar ni a reescribir datos de una pantalla anterior; ofrecer <b>deshacer y rehacer</b>, <b>recordar los últimos datos introducidos</b> y <b>cortar, copiar y pegar</b>.</td></tr>
<tr><th>Largo plazo (LTM)</th><td>Capacidad y duración <b>ilimitadas</b>, pero <b>acceso lento</b>. Su función es recuperar información, y se estimula con el <b>reconocimiento</b> (no recuerdas una cara, pero la reconoces al verla). <br><b>Diseño:</b> mostrar los <b>atajos junto a las opciones</b>, usar <b>listas y menús</b> en vez de obligar a escribir, poner <b>tooltips y ayuda contextual</b> y permitir <b>volver al estado por defecto</b>.</td></tr></table></div>
<h3>Técnicas de modelado (estimaciones objetivas)</h3>
<div class="tablewrap"><table>
<tr><th>Ley de Fitts</th><td><b>T = Im · log₂(D/A + 1)</b>, con Im = 100 [70–120] ms, D = distancia al objetivo y A = ancho del objetivo <b>en la dirección del movimiento</b>. Predice el tiempo de <b>apuntar</b> (clicar, arrastrar). La propuso Paul Fitts en los años 50. Consecuencias: los botones importantes deben ser grandes y estar cerca, y los submenús deben aparecer cerca del ratón.</td></tr>
<tr><th>Ley de Hick</th><td>También llamada “principio de incertidumbre”. Da el tiempo de <b>decisión</b>: <b>T = Ic · H</b>, con <b>H = log₂(n + 1)</b> bits, n = número de opciones e Ic = 150 [0–157] ms/bit. Sirve para estimar el tiempo de elegir un elemento de menú.</td></tr>
<tr><th>Power Law of Practice</th><td><b>Tn = T1 · n<sup>−a</sup></b>, con a = 0,4 [0,2–0,6]. Al repetir una tarea, el rendimiento mejora; estima el efecto del aprendizaje (Seibel, 1963).</td></tr>
<tr><th>GOMS</th><td><b>G</b>oals, <b>O</b>perators, <b>M</b>ethods, <b>S</b>election rules. También se llama <b>Keystroke Model</b>. Es un modelo de predicción con un <b>error del 20%</b> y una herramienta de ingeniería para evaluar rápido alternativas de diseño. <b>Supone que</b> los usuarios saben hacer la tarea, <b>no cometen errores</b> y que los parámetros de interacción y el tiempo de respuesta son conocidos.</td></tr></table></div>
<div class="tablewrap"><table><tr><th>Operador GOMS</th><th>Significado</th><th>Tiempo</th></tr>
<tr><td><b>K</b> Keystroking</td><td>pulsar una tecla o el botón del ratón</td><td>0,2 s</td></tr>
<tr><td><b>H</b> Homing</td><td>mover las manos de un dispositivo a otro</td><td>0,4 s</td></tr>
<tr><td><b>P</b> Pointing</td><td>apuntar a una zona de la pantalla</td><td>0,1·log₂(2D/S + 1); si no se conocen D o S, <b>1,1 s</b></td></tr>
<tr><td><b>M</b> Mental</td><td>decidir qué hacer</td><td>1,35 s o 0,15·log₂(n + 1)</td></tr>
<tr><td><b>D</b> Drawing</td><td>dibujar gestos con el ratón</td><td>0,9·n<sub>D</sub> + 0,16·l<sub>D</sub></td></tr>
<tr><td><b>R</b> Response</td><td>tiempo de respuesta del sistema</td><td>recomendado 0,25 s</td></tr></table></div>
<p><b>Ejemplo (Amazon):</b> M(11 opciones) = 0,15·log₂12 ≈ 0,53, más P = 1,1 y K = 0,2, da 1,83 s. Después R = 0,25, M(4 opciones) = 0,15·log₂5 ≈ 0,35 (las diapositivas ponen 0,33), P = 1,1 y K = 0,2, con lo que el <b>total ≈ 3,71 s</b>.</p>
<p><b>Modelos biológicos.</b> Pros: dan un marco para evaluar alternativas, tienen <b>alta precisión (error ≤ 20%)</b> y son un método científico. Contras: usan <b>tiempos medios</b> en lugar de los de cada usuario y <b>no consideran a los usuarios especiales</b>.</p>
<div class="mnemo"><b>🧠 Mnemotecnia GOMS</b>: <b>K-H-P-M-R</b> con sus tiempos → “<b>K</b>ilo (0,2), <b>H</b>ogar (0,4), <b>P</b>unto (1,1), <b>M</b>ente (1,35), <b>R</b>espuesta (0,25)”. En el orden K, H, P, M, R, cada operador tarda más que el anterior salvo R, que vuelve a ser corto.</div>
<div class="trap"><b>⚠ Trampas típicas</b><ul class="tight">
<li><b>Deshacer/rehacer, recordar los últimos datos y el portapapeles</b> → alivian la <b>STM</b>. <b>Tooltips, menús, listas y atajos visibles</b> → se apoyan en el <b>reconocimiento</b> de la <b>LTM</b>.</li>
<li>Trocear la información (chunking) es una técnica de <b>STM</b>. La habituación es un fenómeno de la memoria <b>sensorial</b>.</li>
<li>Fitts = tiempo de <b>moverse</b>; Hick = tiempo de <b>decidir</b>; Power law = <b>aprendizaje</b>; GOMS = tiempo de una <b>tarea completa</b>.</li>
<li>Hick usa <b>n+1</b>, no n. En Fitts es <b>D/A + 1</b> (y en el P de GOMS, 2D/S + 1).</li>
<li>El significado de los colores y la dirección de lectura son <b>culturales</b>; la velocidad de tecleo es <b>biológica</b>.</li>
<li>Personas: <b>Cooper 1999</b>. Human Processor: <b>Card, Moran y Newell 1983</b>. Rasmussen: Human <b>Information System</b> Model.</li>
<li>“No pasar de 12 puntos de letra” es <b>falso</b>: la regla es un <b>mínimo de 11</b>.</li>
</ul></div>
<details class="self"><summary>Autoexplícate: ¿por qué un botón más grande pero algo más lejos puede ser más rápido?</summary><p>Porque Fitts depende del cociente D/A, no solo de D. Con D = 8,5 y A = 2,5, D/A = 3,4 y T ≈ 0,214 s. Con D = 8 y A = 1, D/A = 8 y T ≈ 0,317 s.</p></details>
<details class="self"><summary>Autoexplícate: ¿por qué el experto tarda menos en iniciar sesión según GOMS?</summary><p>Porque usa Tab e Intro en vez del ratón y se ahorra operadores H (0,4 s) y P (1,1 s) entre campos. Solo añade algún K (0,2 s). Con 10 caracteres sale ≈ 6,1 s frente a ≈ 9,5 s del novato (lo tienes en la pestaña Cálculos).</p></details>

<template id="tpl-strategy">
<h1>Estrategia de examen</h1>
<div class="card">
<h2 style="margin-top:0">Cómo puntúa (formato histórico de la EII)</h2>
<p>Los parciales teóricos de años anteriores son un <b>test de 5 opciones con una sola correcta</b>: <b>+4</b> por acierto, <b>−1</b> por fallo y <b>0</b> en blanco. Si este año cambia, ajusta los valores en Simulacro → Configuración.</p>
<p><b>Matemática del blanco:</b> responder compensa si tu probabilidad de acertar <i>p</i> cumple 4p − (1 − p) &gt; 0, es decir, <b>p &gt; 20%</b>.</p>
<ul class="tight">
<li>Al azar puro entre 5 opciones (p = 20%), el valor esperado es <b>0</b>: no ganas nada y añades riesgo. Déjala en blanco.</li>
<li>Si <b>descartas 1 opción con seguridad</b> (p = 25%), el valor esperado ya es positivo (+0,25 puntos). Si descartas 2 (p = 33%), es +0,67.</li>
<li>Regla práctica: <b>responde si has eliminado al menos una opción con seguridad</b>. Si no, en blanco.</li>
</ul>
<p>Tu <b>calibración real</b> (aciertos cuando dices “Dudo”) aparece en Inicio. Si en “Dudo” aciertas más del 20%, <b>te conviene responder las dudosas</b>.</p>
</div>
<div class="card">
<h2 style="margin-top:0">Calculadora: ¿cuánto necesito para el 8?</h2>
<div class="row">
<label>Preguntas <input type="number" id="cN" value="20" min="5" max="60" style="width:70px"></label>
<label>Aciertos <input type="number" id="cR" value="16" min="0" style="width:70px"></label>
<label>Fallos <input type="number" id="cW" value="0" min="0" style="width:70px"></label>
<label>+ <input type="number" id="cP" value="4" step="0.25" style="width:60px"></label>
<label>− <input type="number" id="cM" value="1" step="0.25" style="width:60px"></label>
</div>
<p id="cOut" class="kpi" style="margin-top:10px"></p>
<p id="cHint" class="muted"></p>
</div>
<div class="card">
<h2 style="margin-top:0">Cómo leer cada pregunta</h2>
<ol>
<li><b>Lee el enunciado entero</b> y busca palabras clave: <i>NOT, only, always, never, mandatory, must</i>. Los absolutos (“always”, “never”, “only”) suelen ser falsos.</li>
<li><b>Evalúa cada opción como verdadero/falso</b> por separado antes de mirar las meta-opciones. Escribe V/F al lado.</li>
<li>Después resuelve las meta-opciones: <b>“More than one answer is right”</b> (¿tienes ≥ 2 V?), <b>“All of them”</b> (¿todas V?), <b>“None”</b> (¿ninguna V?), <b>“A and C are right”</b> (¿exactamente esas?).</li>
<li><b>Código:</b> revisa por este orden: <code>extends</code>/<code>implements</code> correcto, nombre del método de registro (<code>addXxxListener</code>), cast de <code>getSource()</code>, métodos de la interfaz completos y sobre qué se llama <code>consume()</code>.</li>
<li><b>Cálculos:</b> escribe la fórmula, sustituye y comprueba las unidades (ms o s). Fitts usa D/A + 1 y Hick usa n + 1.</li>
<li>Primera vuelta: responde las seguras. Segunda vuelta: las dudosas, aplicando la regla del 20%.</li>
</ol>
</div>
<div class="card">
<h2 style="margin-top:0">Plan de estudio con base científica</h2>
<ul class="tight">
<li><b>Práctica de recuperación</b> (testing effect): hacerte preguntas fija más que releer. Por eso la web es casi todo preguntas.</li>
<li><b>Repetición espaciada</b>: las flashcards y las preguntas vuelven justo cuando estás a punto de olvidarlas (sistema Leitner, comprimido hasta la fecha del examen).</li>
<li><b>Práctica intercalada</b> (interleaving): mezclar temas te obliga a identificar qué tipo de pregunta es, igual que en el examen.</li>
<li><b>Feedback inmediato con explicación</b>: cada fallo explica por qué y dónde está la trampa.</li>
<li><b>Calibración de confianza</b>: aprendes cuándo dejar en blanco, que con +4/−1 vale puntos.</li>
<li><b>Ejemplos resueltos → práctica autónoma</b> para las fórmulas (Fitts, Hick, GOMS…).</li>
<li><b>Codificación dual</b>: diagramas junto al texto. <b>Autoexplicación</b>: preguntas de “por qué”.</li>
</ul>
<h3>Rutina diaria sugerida (45-60 min)</h3>
<ol class="tight">
<li>10 min: <b>flashcards pendientes</b>.</li>
<li>20 min: <b>Practicar → Repaso inteligente</b> (mezcla de temas).</li>
<li>10 min: <b>Cálculos</b> (2 o 3 problemas).</li>
<li>5 min: <b>Mis fallos</b>.</li>
<li>Los últimos 3 días: <b>un simulacro al día</b> y repasar solo los fallos.</li>
</ol>
<p class="muted small">Duerme bien la noche antes: el sueño consolida lo estudiado. Un repaso corto de flashcards la mañana del examen es mejor que estudiar algo nuevo.</p>
</div>
