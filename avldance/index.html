<!DOCTYPE html>
<html lang="es">
<head>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary">

<style>
  html, body { margin: 0; height: 100%; background: #05030a; overflow: hidden; color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  #title { position: fixed; top: max(58px, calc(env(safe-area-inset-top) + 48px)); left: 16px; font-weight: 800; letter-spacing: .08em;
    font-size: 15px; text-transform: uppercase; text-shadow: 0 0 12px #ff2a3c; pointer-events: none; }
  #title small { display: block; font-weight: 500; letter-spacing: .02em; text-transform: none;
    opacity: .7; font-size: 12px; margin-top: 2px; text-shadow: none; }
  #caption { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    width: min(92vw, 560px); text-align: center; pointer-events: none; }
  #case { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  #state { font-size: clamp(17px, 3.4vw, 24px); font-weight: 800; margin-top: 4px;
    transition: color .25s, text-shadow .25s; text-wrap: balance; }
  #state.bad { color: #ff5a7a; text-shadow: 0 0 18px rgba(255, 40, 90, .8); }
  #state.ok { color: #6dffb0; text-shadow: 0 0 18px rgba(40, 255, 150, .7); }
  #play { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); white-space: nowrap;
    font: inherit; font-size: 18px; font-weight: 800; color: #fff; cursor: pointer;
    padding: 16px 28px; border-radius: 999px; border: 2px solid #ff2a3c;
    background: rgba(20, 5, 30, .8); box-shadow: 0 0 30px rgba(255, 42, 60, .6); }
  #play:hover { background: rgba(60, 10, 70, .9); }
  #toggle { position: fixed; top: 12px; right: 14px; font: inherit; font-size: 13px; font-weight: 700;
    color: #fff; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .4); background: rgba(10, 5, 20, .6); display: none; }
  /* vuelta a jorgellaneza.es, siempre visible */
  .home-link { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
    z-index: 30; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px;
    font-size: 12.5px; letter-spacing: .03em; line-height: 1; color: rgba(255, 255, 255, .7); text-decoration: none;
    background: rgba(10, 4, 8, .6); border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px;
    transition: color .15s, border-color .15s; }
  .home-link:hover { color: #fff; border-color: #fff; }
  .home-link:focus-visible, #play:focus-visible, #toggle:focus-visible { outline: 2px solid #6dffb0; outline-offset: 2px; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; }
</style>

<body>
<a class="home-link" href="/" title="Volver a jorgellaneza.es"><span aria-hidden="true">&larr;</span> jorgellaneza.es</a>
<div id="title">AVL Dembow en el Joker<small>10 ← 20 ← 30 pasa a 10 ← 20 → 30. El brazo que apunta es la flecha.</small></div>
<div id="caption"><div id="case"></div><div id="state"></div></div>
<button id="play">▶ Dale play (con música)</button>
<button id="toggle">⏸ Pausa</button>
<div id="err">No se pudo cargar Three.js o WebGL no está disponible en este navegador.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
if (!window.THREE) { document.getElementById('err').style.display = 'flex'; return; }

/* ---------- tempo ---------- */
var BPM = 95, BEAT = 60 / BPM, STEP = BEAT / 4, BAR = BEAT * 4;

/* ---------- casos AVL: alturas (niveles) de [10, 20, 30] ---------- */
var BAL = [0, 2, 0];
var CASES = [
  { name: 'Caso RR · inserción 10, 20, 30', h: [2, 1, 0], bf: [2, 1, 0], pt: [[0,1],[1,2]], edges: [1, 1, 0],
    bad: 'Desbalanceado: FB(10) = +2', fix: 'Rotación simple a la izquierda → 20 sube' },
  { name: 'Rotación a la derecha · 10 ← 20 ← 30', h: [0, 1, 2], bf: [0, -1, -2], pt: [[2,1],[1,0]], edges: [1, 1, 0],
    bad: 'Desbalanceado: 10 ← 20 ← 30', fix: 'Balanceado: 10 ← 20 → 30' },
  { name: 'Caso LR · inserción 30, 10, 20', h: [1, 0, 2], bf: [1, 0, -2], pt: [[2,0],[0,1]], edges: [1, 0, 1],
    bad: 'Desbalanceado en zigzag: FB(30) = −2', fix: 'Rotación doble izquierda-derecha → 20 sube' },
  { name: 'Caso RL · inserción 10, 30, 20', h: [2, 0, 1], bf: [2, 0, -1], pt: [[0,2],[2,1]], edges: [0, 1, 1],
    bad: 'Desbalanceado en zigzag: FB(10) = +2', fix: 'Rotación doble derecha-izquierda → 20 sube' }
];
var BAL_PT = [[1, 0], [1, 2]]; var BAL_EDGES = [1, 1, 0];           // pares: [10-20, 20-30, 10-30]
var PAIRS = [[0, 1], [1, 2], [0, 2]];
var SC = 1.22, XS = [-1.75, 0, 1.75], LV = 0.9, KEYS = [10, 20, 30];
var COLORS = [0x19e6ff, 0xff3fd0, 0xffe23f];

/* ---------- escena ---------- */
var renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x070204);
scene.fog = new THREE.FogExp2(0x070204, 0.03);
var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
var camR = 8.2;
function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  camR = Math.max(8.2, 6.6 / camera.aspect);
}
window.addEventListener('resize', resize); resize();

scene.add(new THREE.AmbientLight(0x553344, 0.8));
var hemi = new THREE.HemisphereLight(0xff8866, 0x110008, 0.35); scene.add(hemi);
var front = new THREE.DirectionalLight(0xffffff, 0.45); front.position.set(2, 6, 8); scene.add(front);

/* ---------- el Joker: sótano de piedra en la calle Mon ---------- */
var RW = 7, RD = -6, RH = 4.8;                                   // medio ancho, pared del fondo, techo
var seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function stoneTex(rx, ry) {
  var c = document.createElement('canvas'); c.width = 512; c.height = 256;
  var g = c.getContext('2d');
  g.fillStyle = '#120c0a'; g.fillRect(0, 0, 512, 256);
  for (var y = 0; y < 256;) {
    var h = 22 + rnd() * 18;
    for (var x = -rnd() * 40; x < 512;) {
      var w = 40 + rnd() * 60;
      g.fillStyle = 'hsl(' + (18 + rnd() * 16) + ',' + (14 + rnd() * 14) + '%,' + (16 + rnd() * 16) + '%)';
      g.fillRect(x + 2, y + 2, w - 4, h - 4);
      x += w;
    }
    y += h;
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}
function stoneWall(w, rx) {
  return new THREE.Mesh(new THREE.PlaneGeometry(w, RH),
    new THREE.MeshStandardMaterial({ map: stoneTex(rx, 2), roughness: 0.95 }));
}
var back = stoneWall(2 * RW, 3); back.position.set(0, RH / 2, RD); scene.add(back);
var lw = stoneWall(10, 2); lw.rotation.y = Math.PI / 2; lw.position.set(-RW, RH / 2, -1); scene.add(lw);
var rw = stoneWall(10, 2); rw.rotation.y = -Math.PI / 2; rw.position.set(RW, RH / 2, -1); scene.add(rw);
var ceil = new THREE.Mesh(new THREE.PlaneGeometry(2 * RW, 10),
  new THREE.MeshStandardMaterial({ color: 0x0b0709, roughness: 0.9 }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, RH, -1); scene.add(ceil);

/* tubos de ventilación plateados por el techo */
var metal = new THREE.MeshStandardMaterial({ color: 0xb8b8c4, metalness: 0.8, roughness: 0.35 });
function duct(len, r, pos, alongX) {
  var d = new THREE.Group(); d.position.copy(pos); scene.add(d);
  var tube = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 20), metal);
  tube.rotation[alongX ? 'z' : 'x'] = Math.PI / 2; d.add(tube);
  for (var x = -len / 2 + 0.5; x < len / 2; x += 1) {
    var rib = new THREE.Mesh(new THREE.TorusGeometry(r + 0.01, 0.025, 6, 20), metal);
    if (alongX) { rib.rotation.y = Math.PI / 2; rib.position.x = x; } else rib.position.z = x;
    d.add(rib);
  }
}
duct(2 * RW, 0.32, new THREE.Vector3(0, RH - 0.45, -3.4), true);
duct(9, 0.24, new THREE.Vector3(-4.6, RH - 0.35, -1.2), false);

/* suelo de baldosas */

/* suelo de baldosas */
var NT = 10, TS = 1.25;
var floorBase = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshBasicMaterial({ color: 0x030208 }));
floorBase.rotation.x = -Math.PI / 2; floorBase.position.y = -0.02; scene.add(floorBase);
var tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(TS * 0.94, 0.04, TS * 0.94),
  new THREE.MeshBasicMaterial({ color: 0xffffff }), NT * NT);
var dummy = new THREE.Object3D(), tileSeed = [], tmpC = new THREE.Color();
for (var i = 0; i < NT * NT; i++) {
  var ix = i % NT, iz = Math.floor(i / NT);
  dummy.position.set((ix - NT / 2 + 0.5) * TS, 0, (iz - NT / 2 + 0.5) * TS);
  dummy.updateMatrix(); tiles.setMatrixAt(i, dummy.matrix);
  tiles.setColorAt(i, tmpC.setRGB(0.05, 0.02, 0.08));
  tileSeed.push(Math.random());
}
scene.add(tiles);

/* neones en la pared de piedra */
function neonCanvas(w, h, draw) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var g = c.getContext('2d'); g.lineCap = g.lineJoin = 'round'; draw(g);
  return new THREE.CanvasTexture(c);
}
function tube(g, path, col, w) {          // halo de color + núcleo casi blanco, como un tubo de neón
  g.save(); g.shadowColor = col; g.shadowBlur = 40; g.strokeStyle = col; g.lineWidth = w; path(); g.stroke();
  g.shadowBlur = 10; g.strokeStyle = '#fff1f3'; g.lineWidth = w * 0.35; path(); g.stroke(); g.restore();
}
function neonText(g, txt, x, y, font, col, w) {
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  tube(g, function () { g.beginPath(); g.strokeText(txt, x, y); }, col, w);
}
var jokerTex = neonCanvas(1024, 512, function (g) {
  function q(t, cy) { var s = 1 - t; return [150 * s * s + 1024 * t * s + 874 * t * t, 150 * s * s + 2 * t * s * cy + 150 * t * t]; }
  tube(g, function () {                                          // la sonrisa
    g.beginPath(); g.moveTo(150, 150); g.quadraticCurveTo(512, 480, 874, 150); g.quadraticCurveTo(512, 320, 150, 150);
  }, '#ff2a3c', 16);
  tube(g, function () {                                          // los dientes
    g.beginPath();
    for (var t = 0.2; t < 0.81; t += 0.075) { var a = q(t, 320), b = q(t, 480); g.moveTo(a[0], a[1] + 6); g.lineTo(b[0], b[1] - 8); }
  }, '#ffffff', 7);
  neonText(g, 'JOKER', 512, 190, '900 170px Impact, "Arial Black", sans-serif', '#ff2a3c', 9);
  neonText(g, 'DELUXE', 512, 430, '700 72px system-ui, sans-serif', '#ffffff', 5);
});
var hashTex = neonCanvas(1024, 256, function (g) {
  neonText(g, '#sinreglas', 512, 128, 'italic 800 130px system-ui, sans-serif', '#19f0ff', 7);
});
function neonPlane(tex, w, h, x, y) {
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.set(x, y, RD + 0.04); scene.add(m); return m;
}
var jokerSign = neonPlane(jokerTex, 3.0, 1.5, -5.1, 3.85);
var hashSign = neonPlane(hashTex, 2.6, 0.65, 5.0, 4.0);
var neonRed = new THREE.PointLight(0xff2030, 1.2, 7); neonRed.position.set(-5.1, 3.8, RD + 0.8); scene.add(neonRed);
var neonCyan = new THREE.PointLight(0x19f0ff, 0.6, 5); neonCyan.position.set(5.0, 4.0, RD + 0.8); scene.add(neonCyan);

/* un folio pegado en la piedra y una frase rayada en la pared del fondo */
var flyer = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.88), new THREE.MeshStandardMaterial({ roughness: 0.9,
  map: neonCanvas(310, 440, function (g) {
    g.fillStyle = '#0b0f0c'; g.fillRect(0, 0, 310, 440);
    g.fillStyle = '#5dff8a'; g.font = '700 22px ui-monospace, Consolas, monospace';
    g.fillText('$ ./infofiesta', 22, 60);
    g.font = '400 17px ui-monospace, Consolas, monospace'; g.fillStyle = '#a8ffc0';
    ['> sala: joker, c/ mon', '> entrada: O(1)', '> barra libre: false', '> fin: undefined', '', '  hoy no se compila'].forEach(function (l, k) {
      g.fillText(l, 22, 110 + k * 32);
    });
    g.fillStyle = '#5dff8a'; g.fillRect(22, 330, 12, 22);
  }) }));
flyer.rotation.y = Math.PI / 2; flyer.rotation.z = 0.04; flyer.position.set(-RW + 0.02, 2.05, 1.9); scene.add(flyer);
var scrawl = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.45), new THREE.MeshBasicMaterial({ transparent: true,
  opacity: 0.4, depthWrite: false, map: neonCanvas(880, 220, function (g) {
    g.fillStyle = '#f4ece4'; g.font = 'italic 600 54px "Comic Sans MS", "Segoe Print", cursive';
    g.save(); g.translate(30, 120); g.rotate(-0.04); g.fillText('while (fiesta) baila();', 0, 0); g.restore();
    g.font = '500 30px "Segoe Print", cursive'; g.fillText('— info', 620, 185);
  }) }));
scrawl.rotation.y = -Math.PI / 2; scrawl.position.set(RW - 0.03, 3.0, -2.4); scene.add(scrawl);

/* barra a la derecha: mostrador con tira LED y botellas retroiluminadas */
var bar = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.15, 5.5),
  new THREE.MeshStandardMaterial({ color: 0x140a0c, roughness: 0.6 }));
bar.position.set(6.0, 0.575, -2); scene.add(bar);
var strip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 5.5), new THREE.MeshBasicMaterial({ color: 0xff2440 }));
strip.position.set(5.54, 1.1, -2); scene.add(strip);
var shelfGlow = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 1.3), new THREE.MeshBasicMaterial({ color: 0x3a1608 }));
shelfGlow.rotation.y = -Math.PI / 2; shelfGlow.position.set(RW - 0.03, 2.05, -2); scene.add(shelfGlow);
var bottleGeo = new THREE.CylinderGeometry(0.05, 0.055, 0.3, 8); bottleGeo.translate(0, 0.15, 0);
var bottleCols = [0xffa040, 0x6aff7a, 0xe8f0ff, 0xff5a3a, 0xc08030];
[1.5, 1.95, 2.4].forEach(function (y) {
  var shelf = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.03, 5.4), metal); shelf.position.set(RW - 0.15, y, -2); scene.add(shelf);
  for (var z = -4.55; z < 0.6; z += 0.17 + rnd() * 0.08) {
    var b = new THREE.Mesh(bottleGeo, new THREE.MeshBasicMaterial({ color: bottleCols[Math.floor(rnd() * bottleCols.length)],
      transparent: true, opacity: 0.55 + rnd() * 0.3 }));
    b.position.set(RW - 0.15, y + 0.015, z); scene.add(b);
  }
});
var barLight = new THREE.PointLight(0xff8a3a, 0.9, 6); barLight.position.set(5.6, 2.3, -2); scene.add(barLight);

/* altavoces colgados en las paredes laterales, mirando a la pista */
var speakers = [];
[-1, 1].forEach(function (sd) {
  var box = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x15101a, roughness: 0.8 }));
  box.position.set(sd * (RW - 0.45), RH - 1.15, -3.9); box.rotation.y = -sd * Math.PI / 2; scene.add(box);
  [-0.35, 0.3].forEach(function (y, k) {
    var cone = new THREE.Mesh(new THREE.CircleGeometry(k ? 0.22 : 0.32, 20), new THREE.MeshBasicMaterial({ color: 0x2c2230 }));
    cone.position.set(0, y, 0.41); box.add(cone); speakers.push(cone);
  });
});

/* luz que late con el bombo y guirnaldas de LEDs en el techo */
var pulse = new THREE.PointLight(0xffe8f0, 1, 14); pulse.position.set(0, RH - 0.3, 0); scene.add(pulse);
var fairyPos = [], fairyCol = [], fc = new THREE.Color();
var BITS = 'INFOFIESTA'.split('').map(function (ch) {          // la guirnalda del medio, en ASCII
  return ('0000000' + ch.charCodeAt(0).toString(2)).slice(-8);
}).join('');
[-4.8, -2.2, 0.6].forEach(function (z, row) {
  var n = row === 1 ? BITS.length - 1 : 60;
  for (var k = 0; k <= n; k++) {
    var f = k / n, x = -RW + 0.3 + f * (2 * RW - 0.6);
    fairyPos.push(x, RH - 0.15 - 0.5 * Math.sin(Math.PI * f) - 0.05 * Math.sin(f * 40), z + 0.15 * Math.sin(f * 9));
    if (row === 1) fc.setRGB.apply(fc, BITS[k] === '1' ? [0.35, 1, 0.55] : [0.04, 0.09, 0.06]);
    else fc.setHSL(rnd(), 0.9, 0.6);
    fairyCol.push(fc.r, fc.g, fc.b);
  }
});
var fairyGeo = new THREE.BufferGeometry();
fairyGeo.setAttribute('position', new THREE.Float32BufferAttribute(fairyPos, 3));
fairyGeo.setAttribute('color', new THREE.Float32BufferAttribute(fairyCol, 3));
var fairy = new THREE.Points(fairyGeo, new THREE.PointsMaterial({ size: 0.1, vertexColors: true,
  transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(fairy);

/* cabezas móviles en el techo, con sus haces */
var spots = [], heads = [], beams = [];
[0x18ffd0, 0xff2440, 0x39ff6a, 0xe8f4ff].forEach(function (col, k) {
  var x = (k - 1.5) * 3.4;
  var sl = new THREE.SpotLight(col, 2.2, 14, 0.4, 0.6, 1);
  sl.position.set(x, RH - 0.5, -0.8); scene.add(sl); scene.add(sl.target); spots.push(sl);
  var head = new THREE.Group(); head.position.set(x, RH - 0.35, -0.8); scene.add(head); heads.push(head);
  head.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0x18141c })));
  var cg = new THREE.ConeGeometry(0.9, 5.2, 20, 1, true); cg.translate(0, -2.75, 0);
  var beam = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.07,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  head.add(beam); beams.push(beam);
});

/* láseres desde las esquinas del fondo: rojos con el árbol torcido, verdes al balancear */
var NL = 16, laserPos = new Float32Array(NL * 6);
var laserGeo = new THREE.BufferGeometry(); laserGeo.setAttribute('position', new THREE.BufferAttribute(laserPos, 3));
var lasers = new THREE.LineSegments(laserGeo, new THREE.LineBasicMaterial({ color: 0xff2440, transparent: true,
  opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(lasers);

/* el público, apretado alrededor de los tres */
var crowd = [], crowdGeo = {
  body: new THREE.CylinderGeometry(0.22, 0.16, 1.5, 10).translate(0, 0.75, 0),
  head: new THREE.SphereGeometry(0.16, 12, 10),
  arm: new THREE.CylinderGeometry(0.06, 0.05, 0.72, 6).translate(0, -0.36, 0),
  phone: new THREE.PlaneGeometry(0.09, 0.16)
};
var crowdMats = [0x0c0609, 0x070a0e, 0x0b080c, 0x100b09].map(function (c) {
  return new THREE.MeshStandardMaterial({ color: c, roughness: 0.75 });
});
var crowdSkin = new THREE.MeshStandardMaterial({ color: 0x1c1210, roughness: 0.7 });
var phoneMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, map: neonCanvas(32, 56, function (g) {
  g.fillStyle = '#05140a'; g.fillRect(0, 0, 32, 56); g.fillStyle = '#5dff8a';     // pantallas con código
  for (var y = 5; y < 52; y += 6) g.fillRect(3 + (y % 4) * 2, y, 8 + (y * 7) % 18, 2);
}) });
for (var tries = 0; crowd.length < 28 && tries < 3000; tries++) {
  var cx = -6.2 + rnd() * 12.4, cz = -5.4 + rnd() * 6.4;
  if (Math.abs(cx) < 3.4 && cz > -3.3) continue;                // la pista de los tres bailarines
  if (cx > 5.0 && cz < 1.0) continue;                          // la barra
  if (crowd.some(function (p) { return (p.x - cx) * (p.x - cx) + (p.z - cz) * (p.z - cz) < 0.64; })) continue;
  var pg = new THREE.Group(), sc = 1.15 + rnd() * 0.15;
  pg.position.set(cx, 0, cz); pg.scale.setScalar(sc); scene.add(pg);
  pg.add(new THREE.Mesh(crowdGeo.body, crowdMats[Math.floor(rnd() * 4)]));

  var beatI = Math.floor(bp);
  for (var n = 0; n < NT * NT; n++) {
    var chk = ((n % NT) + Math.floor(n / NT) + beatI) % 2;
    var hue = lerp(0.98, 0.47, w) + (hash(n, beatI) - 0.5) * 0.12;
    hue = hue - Math.floor(hue);
    var lum = chk ? 0.06 + 0.3 * kickEnv : 0.03 + 0.08 * snEnv * tileSeed[n];
    tiles.setColorAt(n, tmpC.setHSL(hue, 1, lum));
  }
  tiles.instanceColor.needsUpdate = true;

  /* neones (con algún parpadeo), altavoces, LEDs, cabezas móviles */
  var flick = hash(beatI, 7) < 0.1 && beatFrac < 0.12 ? 0.25 : 1;
  jokerSign.material.opacity = flick * (0.85 + 0.15 * kickEnv);
  neonRed.intensity = flick * (0.9 + 0.8 * kickEnv);
  hashSign.material.opacity = 0.8 + 0.2 * snEnv;
  speakers.forEach(function (s) { var k = 1 + 0.18 * kickEnv; s.scale.set(k, k, 1); });
  fairy.material.opacity = 0.55 + 0.45 * snEnv;
  pulse.intensity = 0.4 + 1.3 * kickEnv;
  spots.forEach(function (s, k) {
    var rz = Math.sin(t * 0.7 + k * 1.7) * 0.55, rx = Math.cos(t * 0.5 + k * 2.3) * 0.35;
    heads[k].rotation.set(rx, 0, rz);
    s.target.position.set(heads[k].position.x + Math.tan(rz) * RH, 0, heads[k].position.z - Math.tan(rx) * RH);
    s.intensity = 1.2 + 1.6 * kickEnv;
    beams[k].material.opacity = 0.05 + 0.08 * kickEnv;
  });

  /* láseres en abanico, golpeando con el bombo */
  lasers.material.color.setRGB(lerp(1, 0.2, w), lerp(0.15, 1, w), lerp(0.25, 0.45, w));
  lasers.material.opacity = 0.15 + 0.6 * kickEnv;
  for (var l = 0; l < NL; l++) {
    var side = l < NL / 2 ? -1 : 1, f = (l % (NL / 2)) / (NL / 2 - 1);
    laserPos.set([side * 6.2, RH - 0.5, RD + 0.4,
      lerp(-6, 6, f) + 2 * Math.sin(t * 1.3 + side), 0.3 + 1.6 * (0.5 + 0.5 * Math.sin(t * 2 + l * 0.7)),
      3 + 1.5 * Math.sin(t * 0.9 + l)], l * 6);
  }
  laserGeo.attributes.position.needsUpdate = true;

  /* el público bota con el dembow */
  crowd.forEach(function (c) {
    var b = Math.max(0, Math.sin(2 * Math.PI * (bp + c.ph)));
    c.g.position.y = 0.06 * b;
    c.g.rotation.y = c.ry + 0.2 * Math.sin(Math.PI * bp / 2 + c.ph * 6);
    c.arms.forEach(function (a, k) {
      var sd = k ? 1 : -1;
      a.rotation.z = c.up ? sd * (2.55 + 0.25 * kickEnv + 0.1 * Math.sin(Math.PI * bp + c.ph * 5))
                          : sd * (0.15 + 0.12 * b);
    });
  });

  /* cámara */
  var ang = 0.38 * Math.sin(t * 0.17), R = camR * (1 - 0.012 * kickEnv);
  camera.position.set(R * Math.sin(ang), 2.7 + 0.3 * Math.sin(t * 0.11), R * Math.cos(ang));
  camera.lookAt(0, 1.55, 0);
  renderer.render(scene, camera);
}
frame();
})();
</script>
