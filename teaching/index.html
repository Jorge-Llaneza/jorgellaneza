ue\">\u003cbutton id=\"bi\">Insert\u003c/button>\u003cbutton id=\"bd\">Delete\u003c/button>\u003cbutton id=\"bs2\">Search\u003c/button>\n\u003cselect id=\"tp\">\u003coption>Examples\u2026\u003c/option>${Object.keys(TP).map(k=>`\u003coption>${k}\u003c/option>`).join('')}\u003c/select>\u003cbutton id=\"br\">\ud83c\udfb2 Random tree\u003c/button>\u003cbutton id=\"bc\">Clear\u003c/button>\u003c/div>\n\u003cdiv class=\"bar\">Walk the tree: \u003cbutton id=\"pre\">Pre-order\u003c/button>\u003cbutton id=\"ino\">In-order\u003c/button>\u003cbutton id=\"pos\">Post-order\u003c/button>\u003c/div>\n\u003cp id=\"tmsg\" class=\"tip\">Insert, delete or search and I\u2019ll explain what happened.\u003c/p>\u003cdiv class=\"scroll\">\u003csvg id=\"ts\">\u003c/svg>\u003c/div>\u003cp id=\"tinfo\">\u003c/p>`;\nfunction treeRun(){if(!T)return{q:[]};if(PG[cur].avl)return{q:[['Is it an AVL tree? (yes/no)',isAVL(T)?'yes':'no'],['Is it a perfectly balanced tree (PBT)? (yes/no)',isPBT(T)?'yes':'no'],['Balance factor of the root (BF = hright \u2212 hleft)',ht(T.r)-ht(T.l)]]};\nreturn{q:[['In-order (e.g. 3 4 5)',ino(T).join(' '),1],['Pre-order',pre(T).join(' '),1],['Post-order',post(T).join(' '),1],['Height (a single node = 1)',ht(T)]]}}\n/* ---------- pages ---------- */\nconst tip=(a,b)=>`\u003cdiv class=\"tip\">\u003cb>${a}\u003c/b> ${b}\u003c/div>`;\nconst PG={\nintro:{t:'Intro: types, structures & complexity',doc:1,ui:'\u003clabel>Algorithm \u003cselect id=\"ia\">\u003coption value=\"C\">C: 3 + loop(4) + 3\u003c/option>\u003coption value=\"D\">D: loop(5) + 1\u003c/option>\u003coption value=\"E\">E: nested loops (2)\u003c/option>\u003coption value=\"F\">F: halving loop\u003c/option>\u003c/select>\u003c/label>\u003clabel>n \u003cinput id=\"in\" type=\"number\" min=\"1\" max=\"40\" value=\"5\">\u003c/label>\u003cbutton id=\"rd\">\ud83c\udfb2 Random\u003c/button>',run:introRun,init:()=>{$('#rd').onclick=()=>{$('#in').value=1+Math.floor(Math.random()*12);$('#ia').selectedIndex=Math.floor(Math.random()*4)}},learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a program is a recipe (algorithm) plus the pantry shelves where ingredients are kept (data structures).')+`\u003cul>\u003cli>\u003cb>Programs = Data Structures + Algorithms\u003c/b> (Niklaus Wirth, 1976; Turing Award 1984).\u003c/li>\u003cli>\u003cb>Problem solving:\u003c/b> define the problem (analysis) \u2192 build a model (abstraction) \u2192 design an algorithm on the model.\u003c/li>\u003cli>\u003cb>Data type:\u003c/b> the set of values a property can take. \u003cb>Predefined\u003c/b> (PDT): integer, real, character, boolean, reference. \u003cb>Structured\u003c/b> (SDT): arrays, strings, classes/objects. Others (ArrayList, List, HashMap, Stack\u2026) are usually classes.\u003c/li>\u003cli>\u003cb>Families:\u003c/b> linear (lists, stacks, queues), network (graphs), hierarchical (trees), dictionaries (hash tables).\u003c/li>\u003cli>\u003cb>Choosing a structure:\u003c/b> (1) does it fit the model? (2) efficiency: time O\u003csub>T\u003c/sub>(n) and memory O\u003csub>M\u003c/sub>(n).\u003c/li>\u003cli>\u003cb>Counting executions of test():\u003c/b> T\u003csub>A\u003c/sub>=3, T\u003csub>B\u003c/sub>=2 (constants, O(1)); T\u003csub>C\u003c/sub>(n)=4n+6 and T\u003csub>D\u003c/sub>(n)=5n+1 (O(n)); T\u003csub>E\u003c/sub>(n)=2n\u00b2+1 (O(n\u00b2)); T\u003csub>F\u003c/sub>(n)=2(\u230alog\u2082n\u230b+1)+1 (the loop halves n, O(log\u2082n)).\u003c/li>\u003cli>\u003cb>Big-O ranking, fast \u2192 slow:\u003c/b> O(1) &lt; O(log\u2082n) &lt; O(n) &lt; O(n\u00b7log\u2082n) &lt; O(n\u00b2) &lt; O(n\u00b2\u00b7log\u2082n) &lt; O(n\u00b3) (class P); then O(2\u207f), O(K\u207f) &lt; O(n!), O(n\u207f) (class NP). Complexity assumes n \u2192 \u221e, so constants stop mattering.\u003c/li>\u003cli>\u003cb>Why it matters:\u003c/b> on the slide\u2019s table, at n=45 the 2\u207f algorithm needs about 1.08 centuries while the n\u00b3 one needs about 15 minutes: exponential algorithms become unusable even for modest n.\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Mistake:','keeping constants in Big-O: 4n+6 is simply O(n).'),qs:[['How many times does `for(i=0;i\u003cn;i++){test();test();}` plus 3 extra calls run test()?','2n + 3, so O(n).'],['Order O(n\u00b2), O(1), O(log\u2082n), O(n\u00b3) from fastest to slowest.','O(1), O(log\u2082n), O(n\u00b2), O(n\u00b3).'],['Is O(2\u207f) in class P?','No: it is in NP (exponential), far slower than any polynomial.']]},\nbasics:{t:'Graph basics',run:basicsRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a graph is a map. \u003cb>Nodes\u003c/b> = cities, \u003cb>arcs\u003c/b> = roads. A \u003cb>directed\u003c/b> graph has one-way roads; a \u003cb>weight\u003c/b> is the cost (km, euros\u2026) of a road.')+`\u003cul>\u003cli>With n nodes you can have at most \u003cb>n\u00b2 \u2212 n\u003c/b> arcs (no loops), n\u00b2 with loops. All of them = \u003cb>complete graph\u003c/b>. Zero arcs is the minimum.\u003c/li>\u003cli>\u003cb>Matrix\u003c/b> = a table \u201cis there a road from row to column?\u201d. Instant lookup O(1) but always uses n\u00b2 memory \u2192 best for \u003cb>heavy\u003c/b> graphs (many arcs).\u003c/li>\u003cli>\u003cb>Lists\u003c/b> = each city keeps a list of its roads. Memory only for real roads, but finding one means walking a list O(n) \u2192 best for \u003cb>light\u003c/b> graphs (about 1 arc per node).\u003c/li>\u003c/ul>`+'\u003cul>\u003cli>\u003cb>Degree\u003c/b> of a node = arcs touching it = \u003cb>ID\u003c/b> (arcs arriving) + \u003cb>OD\u003c/b> (arcs departing). A \u003cb>loop\u003c/b> is an arc that starts and ends at the same node (it counts in both ID and OD).\u003c/li>\u003cli>\u003cb>Heavy\u003c/b> graph: arcs \u2192 n\u00b2. \u003cb>Light\u003c/b> graph: arcs \u2192 n. A tree has exactly n \u2212 1 arcs and no cycles.\u003c/li>\u003c/ul>'+tip('\u26a0\ufe0f Common mistake:','mixing up \u201cnodes\u201d (n) with \u201carcs\u201d. Count them separately!')},\npaths:{t:'Paths, cycles & connectivity',start:1,run:pathsRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a path is the list of towns you drive through; a cycle is a trip that brings you back home.')+`\u003cul>\u003cli>\u003cb>Path\u003c/b> Vi\u2192Vj (Vi\u2260Vj): sequence of nodes (and edges) that reaches Vj from Vi. Nodes may repeat, so paths can be infinitely many.\u003c/li>\u003cli>\u003cb>Length\u003c/b> = number of edges = nodes in the path \u2212 1. Example V1,V2,V3,V4,V5 has length 4.\u003c/li>\u003cli>\u003cb>Simple path:\u003c/b> no node repeated. \u003cb>Theorem:\u003c/b> if any path exists, a simple one exists (cut out loops and cycles).\u003c/li>\u003cli>\u003cb>Minimum-length path:\u003c/b> fewest arcs (always simple). \u003cb>Minimum-cost path:\u003c/b> smallest sum of weights. They can differ: on the slide graph V1\u2192V4 directly has length 1, but the cheapest route V1,V2,V3,V4 costs 9 (2+3+4) versus 11.\u003c/li>\u003cli>\u003cb>Cycle over a node:\u003c/b> a path from the node back to itself (V1,V2,V3,V4 has length 4).\u003c/li>\u003cli>\u003cb>Strongly connected graph:\u003c/b> every node can reach every other and vice versa. If one node is strongly connected to all, the whole graph is. Otherwise it is \u003cb>weakly connected\u003c/b> (e.g. a node with no way back).\u003c/li>\u003cli>\u003cb>Tree:\u003c/b> connected graph without cycles; n nodes, n\u22121 edges; exactly one simple path between any two nodes.\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Mistake:','mixing length (counts edges) with cost (adds weights). Dijkstra with every weight = 1 gives minimum length.'),qs:[['A path visits 6 nodes. What is its length?','5 edges (nodes \u2212 1).'],['Can the minimum-cost path be shorter in edges than the minimum-length path?','No: minimum length is the fewest edges possible, so the cheapest path has at least that many.'],['Directed graph where V6 has arcs in but none out: strongly connected?','No, it is weakly connected: V6 cannot reach the others.']]},\ngmeth:{t:'Graph class methods (matrix & lists)',start:1,run:gmethRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','the graph is a table of yes/no boxes plus a table of prices; adding or removing a town means editing one row and one column.')+`\u003cul>\u003cli>\u003cb>Fields:\u003c/b> \u003ccode>nodes[]\u003c/code>, \u003ccode>size\u003c/code>, \u003ccode>edges[][]\u003c/code> (boolean: is there an arc?) and \u003ccode>weight[][]\u003c/code> (cost).\u003c/li>\u003cli>\u003cb>addNode\u003c/b> \u2014 O(n): precondition: node does not exist and there is free space. Put it at \u003ccode>nodes[size]\u003c/code>, set its whole row and column to false / 0.0, then \u003ccode>size++\u003c/code>.\u003c/li>\u003cli>\u003cb>removeNode\u003c/b> \u2014 O(n): find index i; \u003ccode>size\u2212\u2212\u003c/code>; if it was not the last node, \u003cb>move the last node into position i\u003c/b> (copy its row, column and diagonal loop). No shifting of everything, which is why it stays O(n).\u003c/li>\u003cli>\u003cb>existsEdge / addEdge / removeEdge / weight:\u003c/b> direct access \u003ccode>edges[i][j]\u003c/code> after finding the node indexes, so O(1) on the matrix.\u003c/li>\u003cli>\u003cb>Adjacency lists (dynamic memory):\u003c/b> \u003ccode>class Edge {double weight; Node target;}\u003c/code>, \u003ccode>class Node&lt;T&gt; {T node; LinkedList&lt;Edge&gt; edges;}\u003c/code> and \u003ccode>LinkedList&lt;Node&gt; nodes\u003c/code>: a list of nodes, each holding a list of its outgoing edges. Memory O\u003csub>M\u003c/sub>(K\u2081n + K\u2082a) with K\u2081 = bytes per node and K\u2082 = bytes per arc; finding an arc means walking a list, O(n). Best for light graphs; wasteful for heavy ones, worst of all on complete graphs (many pointers).\u003c/li>\u003cli>\u003cb>Advanced algorithms on the matrix:\u003c/b> Dijkstra O(n\u00b2), Floyd O(n\u00b3), depth-first search O(n\u00b2), Prim / Warshall O(n\u00b2).\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Mistake:','forgetting to reset the new row and column in addNode: stale values from a removed node would look like real arcs.'),qs:[['Why does removeNode copy the last node into the hole?','To avoid shifting the matrix; only one row and column are rewritten, so it stays O(n).'],['Complexity of DFS on the matrix?','O(n\u00b2): for each of the n nodes the whole row is scanned.']]},\ndij:{t:'Dijkstra (cheapest route from ONE node)',start:1,run:dij,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','you\u2019re a GPS standing in one city and you want the cheapest trip to every other city.')+`\u003col>\u003cli>Put the start in the set \u003cb>S\u003c/b> (done nodes). \u003cb>D\u003c/b> = direct cost from start (\u221e if no road). \u003cb>P\u003c/b> = who we came from.\u003c/li>\u003cli>Pick the node \u003cb>w\u003c/b> outside S with the \u003cb>smallest D\u003c/b>. Lock it into S: its D can\u2019t get better.\u003c/li>\u003cli>For every node m outside S: if \u003cb>D[w] + weight(w,m) &lt; D[m]\u003c/b> you found a shortcut \u2192 update D[m] and P[m] = w.\u003c/li>\u003cli>Repeat n\u22121 times.\u003c/li>\u003c/ol>\u003cp>Time: n\u22121 rounds \u00d7 O(n) work = \u003cb>O(n\u00b2)\u003c/b>.\u003c/p>`+'\u003cp>Why O(n\u00b2): the n \u2212 1 rounds each do an O(n) search for the smallest D plus an O(n) update loop. Result: \u003cb>vector D\u003c/b> (minimum costs) and \u003cb>vector P\u003c/b> (paths).\u003c/p>'+tip('\u26a0\ufe0f Mistakes:','it gives costs from ONE start only; it breaks with \u003cb>negative weights\u003c/b> (a loop could shrink the cost forever); put 1 on every arc to get minimum \u003ci>length\u003c/i> instead of cost.')},\nfloyd:{t:'Floyd\u2013Warshall (cheapest route between ALL pairs)',run:floydRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','same GPS, but for every pair of cities at once. Trick: try each city k as a possible stop-over.')+`\u003col>\u003cli>Matrix \u003cb>A\u003c/b> starts as the weights, 0 on the diagonal, \u221e if no arc. Matrix \u003cb>P\u003c/b> starts empty.\u003c/li>\u003cli>For each \u003cb>k\u003c/b>, for each \u003cb>i\u003c/b>, for each \u003cb>j\u003c/b>: if \u003cb>A[i][k] + A[k][j] &lt; A[i][j]\u003c/b> \u2192 A[i][j] gets that smaller value and P[i][j] = k.\u003c/li>\u003cli>To print a path i\u2192j: look at k = P[i][j]. If empty, go direct. Otherwise print path(i,k), k, path(k,j).\u003c/li>\u003c/ol>\u003cp>Three loops \u2192 \u003cb>O(n\u00b3)\u003c/b>.\u003c/p>`+'\u003cp>\u003cb>Special routes:\u003c/b> to force paths through a given set L of stop-overs, run the k loop only for k in L.\u003c/p>'+tip('\ud83d\udca1 Trick (extra, not on the slides):','in step k, row k and column k never change, so you can skip them while solving.')},\ncenter:{t:'Center of a graph (uses Floyd)',run:centerRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','where do you build the hospital so even the unluckiest person is as close as possible?')+`\u003col>\u003cli>Run Floyd to get matrix A.\u003c/li>\u003cli>\u003cb>Eccentricity\u003c/b> of node v = the \u003cb>biggest number in v\u2019s column\u003c/b> (the worst trip that ends at v).\u003c/li>\u003cli>The \u003cb>center\u003c/b> is the node with the \u003cb>smallest eccentricity\u003c/b>.\u003c/li>\u003c/ol>`+tip('\u26a0\ufe0f Mistake:','use the \u003ci>column\u003c/i> (trips arriving at v), not the row. If a column has \u221e that node can\u2019t be reached from everywhere.')},\ndfs:{t:'Depth-First Search',start:1,run:dfsRun2,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','you\u2019re in a maze with chalk. Always walk forward to a new room, chalk it (visited). Dead end? Walk back until some room has an unchalked door.')+`\u003col>\u003cli>Mark the node visited and print it.\u003c/li>\u003cli>For each neighbour not visited yet, repeat from that neighbour.\u003c/li>\u003cli>When nothing is left, return (backtrack).\u003c/li>\u003c/ol>\u003cp>To cover \u003ci>every\u003c/i> node (graph not connected) call it again from any node still unvisited, after one \u003ccode>resetVisited()\u003c/code>. Here neighbours are tried \u003cb>lowest number first\u003c/b>.\u003c/p>`+'\u003cp>\u003cb>Visit every node:\u003c/b> resetVisited(), then for i = 0..n\u22121 call DFPrint(i) if node i is not visited. \u003cb>DFSearch\u003c/b> is the same but returns true and stops as soon as a condition holds at a node.\u003c/p>'+tip('\u26a0\ufe0f Mistake:','forgetting the visited mark \u2192 infinite loops on cycles.')},\nprim:{t:'Prim (Minimum Spanning Tree)',start:1,run:primRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','connect all houses with the least cable. Start with one house, always add the cheapest cable that reaches a new house.')+`\u003col>\u003cli>U = {start}, T = no edges.\u003c/li>\u003cli>Look at all edges with one end in U and the other outside. Take the \u003cb>cheapest\u003c/b>.\u003c/li>\u003cli>Add the edge to T and the new node to U. Stop when U has every node (n\u22121 edges).\u003c/li>\u003c/ol>\u003cp>Naive: O(n\u00b3); with auxiliary sorted vectors O(n\u00b2). Ties can give different trees, but \u003cb>the total cost is always the same\u003c/b>.\u003c/p>`+'\u003cp>A \u003cb>spanning tree\u003c/b> connects all nodes; the \u003cb>minimum\u003c/b> one has the smallest total weight. The result depends on the start node and on how ties are broken.\u003c/p>'+tip('\u26a0\ufe0f Mistake:','a tree never has a cycle: if the edge joins two nodes already in U, skip it. Works on undirected graphs.')},\nbst:{t:'Binary Search Tree',tree:1,run:treeRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a guessing game. At every node: smaller \u2192 go left, bigger \u2192 go right.')+`\u003cul>\u003cli>\u003cb>Insert:\u003c/b> walk down comparing, hang the new value as a leaf.\u003c/li>\u003cli>\u003cb>Delete\u003c/b> has 3 sceneries: \u003cb>I\u003c/b> leaf \u2192 remove it; \u003cb>II\u003c/b> one child \u2192 child takes its place; \u003cb>III\u003c/b> two children \u2192 copy the \u003cb>max of the left subtree\u003c/b> into the node, then delete that max (it\u2019s a case I or II).\u003c/li>\u003cli>\u003cb>Traversals:\u003c/b> pre-order = N-L-R, in-order = L-N-R (gives sorted order!), post-order = L-R-N.\u003c/li>\u003cli>\u003cb>Speed depends on height:\u003c/b> between log\u2082n and n. Inserting 1,2,3,4\u2026 builds a stick (degenerate) \u2192 O(n). Try the \u201cDegenerate\u201d example!\u003c/li>\u003c/ul>`+'\u003cul>\u003cli>\u003cb>Duplicates:\u003c/b> inserting an existing key is an error (repeated keys not allowed).\u003c/li>\u003cli>\u003cb>Complete tree\u003c/b> (all levels full): n = 2\u003csup>h\u003c/sup> \u2212 1, so h = log\u2082(n + 1). Height here counts the root as level 1.\u003c/li>\u003cli>\u003cb>Performance\u003c/b> (H between log\u2082n and n): best case insert/search/delete O(1), worst case O(n); traversal always O(n).\u003c/li>\u003cli>Traversals also exist mirrored (N-R-L, R-N-L, R-L-N).\u003c/li>\u003cli>\u003cb>PBT\u003c/b>: |#left \u2212 #right| \u2264 1 at every node. Search O(log\u2082n) in any case, but insert/delete O(n) (rebuild).\u003c/li>\u003c/ul>'+tip('\u26a0\ufe0f Mistake:','the traversal name says where the \u003cb>node N\u003c/b> goes: before (pre), between (in) or after (post) its children.')},\ntrav:{t:'Traversals (pre / in / post)',tree:1,run:treeRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','you walk around a tree statue, hugging it with your hand, and shout a node\u2019s number when you pass a certain spot on it. Different spot = different traversal.')+`\u003csvg viewBox='0 0 360 165' style='max-width:440px;width:100%;display:block;margin:auto;background:none;border:0'>${[[180,28,90,88],[180,28,270,88]].map(([a,b,c,d])=>`\u003cline class='e' x1='${a}' y1='${b}' x2='${c}' y2='${d}'/>`).join('')}${[[180,28,5],[90,88,3],[270,88,8]].map(([x,y,v])=>`\u003ccircle class='n' cx='${x}' cy='${y}' r='16'/>\u003ctext x='${x}' y='${y}'>${v}\u003c/text>\u003ccircle cx='${x-26}' cy='${y}' r='6' fill='#ef4444'/>\u003ccircle cx='${x}' cy='${y+27}' r='6' fill='#16a34a'/>\u003ccircle cx='${x+26}' cy='${y}' r='6' fill='#3b82f6'/>`).join('')}\u003c/svg>\u003cp>\ud83d\udd34 \u003cb>Pre-order\u003c/b>: shout the number when you pass its \u003cb>left\u003c/b> dot \u2192 \u003cb>5 3 8\u003c/b>\u003cbr>\ud83d\udfe2 \u003cb>In-order\u003c/b>: when you pass the dot \u003cb>below\u003c/b> \u2192 \u003cb>3 5 8\u003c/b>\u003cbr>\ud83d\udd35 \u003cb>Post-order\u003c/b>: when you pass its \u003cb>right\u003c/b> dot \u2192 \u003cb>3 8 5\u003c/b>\u003c/p>\u003col>\u003cli>\u003cb>Pre-order N-L-R\u003c/b>\u003cbr>Node, then the whole Left subtree, then the whole Right subtree.\u003c/li>\u003cli>\u003cb>In-order L-N-R\u003c/b>\u003cbr>Left subtree, Node, Right subtree. On a BST this prints the numbers \u003cb>sorted\u003c/b>.\u003c/li>\u003cli>\u003cb>Post-order L-R-N\u003c/b>\u003cbr>Both subtrees first, the Node last.\u003c/li>\u003c/ol>`+tip('\ud83d\udca1 Memory trick:','the letter N shows where the Node goes: Pre = before, In = in between, Post = after its children.')+tip('\u26a0\ufe0f Mistake:','the rule applies inside \u003cb>every\u003c/b> subtree, not only at the root. Press \u201c\u270d Solve it here\u201d and the app tells you why a step is wrong.')},\navl:{t:'AVL trees (is it balanced?)',tree:1,avl:1,run:treeRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a see-saw at every node: the two sides may differ by at most one level.')+`\u003cul>\u003cli>\u003cb>AVL rule:\u003c/b> for every node |h\u003csub>left\u003c/sub> \u2212 h\u003csub>right\u003c/sub>| \u2264 1 (heights). The little number by each circle is its \u003cb>balance number\u003c/b> = height of the right side \u2212 height of the left side. 0, +1 or \u22121 is fine; +2 or \u22122 means the tree is too lopsided (not AVL).\u003c/li>\u003cli>\u003cb>PBT rule:\u003c/b> for every node |#nodes left \u2212 #nodes right| \u2264 1 (\u003cb>counting nodes\u003c/b>, stricter).\u003c/li>\u003cli>Goal of AVL: keep search, insert and delete at \u003cb>O(log\u2082n)\u003c/b> even in the worst case. PBTs also search in log\u2082n but rebuilding them after insert/delete is O(n).\u003c/li>\u003cli>An AVL tree can fail the PBT test (see the example). Here you \u003cb>check\u003c/b> the balance with \u201cSolve it here\u201d, or press \u201cShow me step by step\u201d / \u201cPractice AVL insert\u201d to insert keys with automatic rebalancing; the rotations that repair it are on the next page, \u201cAVL: insert, delete &amp; rotations\u201d.\u003c/li>\u003c/ul>`+'\u003cul>\u003cli>Every \u003cb>PBT is an AVL\u003c/b>; not every AVL is a PBT; not every AVL is a minimum-height tree; and not every minimum-height tree is an AVL.\u003c/li>\u003c/ul>'+tip('\u26a0\ufe0f Mistake:','checking only the root. The rule must hold at \u003cb>every\u003c/b> node (the balance numbers will show the culprits).')},\navlrot:{t:'AVL: insert, delete & rotations',doc:1,ui:'\u003clabel>Numbers to add \u003cinput id=\"ak\" style=\"width:210px\" value=\"10, 20, 30, 40, 50, 25, d10\" title=\"write d25 to delete 25\">\u003c/label>\u003cbutton id=\"rd\">\ud83c\udfb2 Random\u003c/button>\u003cbutton id=\"bp\">\u270d Practice AVL insert/delete\u003c/button>\u003cinput id=\"av\" type=\"number\" placeholder=\"value\" style=\"width:80px\">\u003cbutton id=\"ai\">Add\u003c/button>\u003cbutton id=\"ad\">Remove\u003c/button>\u003cbutton id=\"ac\">Clear\u003c/button>',run:()=>({st:[],q:[]}),init:()=>{avlInit();avlLive();$('#rd').onclick=()=>{const s=new Set;while(s.size\u003c7)s.add(1+Math.floor(Math.random()*60));$('#ak').value=[...s].join(', ')};$('#bq').onclick=avlInit.prac},learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a see-saw that tips too far gets a quick twist at the middle so both sides are level again.')+`\u003cul>\u003cli>\u003cb>Goal:\u003c/b> keep the tree from becoming a long, thin line. Then searching stays fast.\u003c/li>\u003cli>\u003cb>Balance number\u003c/b> of a circle = height of its right side \u2212 height of its left side. \u003cb>0, 1 or \u22121 = fine.\u003c/b> \u003cb>2 or \u22122 = too heavy\u003c/b>, so fix it.\u003c/li>\u003cli>\u003cb>Adding a number:\u003c/b> put it at the bottom like in any search tree, then check the circles on the way back up. Fix the lowest circle that is too heavy.\u003c/li>\u003cli>\u003cb>How to fix:\u003c/b> look at the heavy circle and its heavy child. \u003cb>Straight line\u003c/b> (both lean the same way) \u2192 \u003cb>rotate once\u003c/b>: the child moves up to the top. \u003cb>Zig-zag\u003c/b> (they lean opposite ways) \u2192 \u003cb>rotate twice\u003c/b>: the middle circle moves up to the top.\u003c/li>\u003cli>\u003cb>Removing a number:\u003c/b> remove it like in a search tree (if it has two children, the biggest number on its left takes its place). Then check \u003cb>every circle on the way up\u003c/b>, not only the first one. Sometimes more than one fix is needed.\u003c/li>\u003cli>\u003cb>Why it is great:\u003c/b> an AVL tree is at most about 44% taller than a perfect tree, so adding, removing and searching are all fast (O(log\u2082n)).\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Mistake:','stopping after the first fix when removing. Keep checking all the circles above.'),\nqs:[['Node with BF = \u22122 whose left child has BF = \u22121: which rotation?','Single rotation (case I): the left child\u2019s BF is \u2264 0.'],['Node with BF = +2 whose right child has BF = \u22121: which rotation?','Double rotation (case II): the right child leans the opposite way.'],['Insert 1, 2, 3 into an empty AVL tree. What is the final root?','2: inserting 3 makes the root 1 have BF = +2 with right child BF = +1, so a single rotation lifts 2.'],['Why is AVL insert O(log\u2082n) but PBT insert O(n)?','AVL rebalances only the search path (length \u2264 1.44\u00b7log\u2082n); a PBT must be rebuilt.']]},\nwordle:{t:'Daily Golf \u26f3',game:1}};\nconst avlMk=t=>t?{v:t.v,l:avlMk(t.l),r:avlMk(t.r)}:null,avlH=t=>t?1+Math.max(avlH(t.l),avlH(t.r)):0,avlB=t=>avlH(t.r)-avlH(t.l);\nfunction avlLay(t){const P=new Map;let i=0,d0=0;const go=(n,d)=>{if(!n)return;go(n.l,d+1);const o=AOFF[n.v]||[0,0];P.set(n.v,{x:24+i++*40+o[0],y:26+d*50+o[1],b:avlB(n),l:n.l?n.l.v:null,r:n.r?n.r.v:null});d0=Math.max(d0,d);go(n.r,d+1)};go(t,0);return{P,w:Math.max(i*40+30,200),h:d0*50+56}}\nfunction avlSvg(P,w,h,hi,bf,bad){let s='';P.forEach(p=>{[p.l,p.r].forEach(c=>{const q=c==null?null:P.get(c);if(q)s+=`\u003cline class=\"e\" x1=\"${p.x}\" y1=\"${p.y}\" x2=\"${q.x}\" y2=\"${q.y}\" opacity=\"${Math.min(p.o??1,q.o??1)}\"/>`})});\nP.forEach((p,v)=>{const c=Math.abs(p.b)>1?'#e5484d':p.b?'#f2a93b':'#3fb86b';s+=`\u003cg class=\"dn\" data-v=\"${v}\" style=\"cursor:grab\" opacity=\"${p.o??1}\">\u003ccircle class=\"${hi.includes(v)?'nh':'n'}\" cx=\"${p.x}\" cy=\"${p.y}\" r=\"16\"${bad.includes(v)?' style=\"stroke:#e5484d;stroke-width:5\"':''}/>\u003ctext x=\"${p.x}\" y=\"${p.y}\">${v}\u003c/text>`+(bf?`\u003ccircle cx=\"${p.x+16}\" cy=\"${p.y-16}\" r=\"9\" fill=\"${c}\" stroke=\"#0007\"/>\u003ctext x=\"${p.x+16}\" y=\"${p.y-16}\" style=\"font-size:10px;fill:#fff;font-weight:700\">${p.b>0?'+':''}${p.b}\u003c/text>`:'')+'\u003c/g>'});\nreturn`\u003cdiv class=\"scroll\">\u003csvg viewBox=\"0 0 ${w} ${h}\" style=\"min-width:${w}px;overflow:visible\">${s}\u003c/svg>\u003c/div>`+(bf?'\u003cp style=\"font-size:12px;margin:4px 0\">Number on each circle = right height \u2212 left height: \u003cb style=\"color:#3fb86b\">\u25cf 0 perfect\u003c/b> \u003cb style=\"color:#f2a93b\">\u25cf \u00b11 fine\u003c/b> \u003cb style=\"color:#e5484d\">\u25cf \u00b12 too heavy \u2192 rotate!\u003c/b>\u003c/p>':'')}\nfunction avlDraw(t,hi,bf,bad){if(!t)return'\u003cp>\u003ci>(empty tree)\u003c/i>\u003c/p>';const A=avlLay(t);return avlSvg(A.P,A.w,A.h,hi,bf,bad||[])}\nfunction avlTween(box,f,t,hi){if(!f||!t||typeof requestAnimationFrame=='undefined'){box.innerHTML=avlDraw(t,hi,1);return}const A=avlLay(f),B=avlLay(t),w=Math.max(A.w,B.w),h=Math.max(A.h,B.h),t0=performance.now();cancelAnimationFrame(box._raf);\nconst tk=now=>{const u=Math.min(1,(now-t0)/750),e=u\u003c.5?2*u*u:1-Math.pow(-2*u+2,2)/2,M=new Map;B.P.forEach((p,v)=>{const a=A.P.get(v);M.s ))','\u2200x(p(a,x)\u2192q(x))'];\nfunction rmodel(){let d=['A','B'],t=d.flatMap(x=>d.map(y=>'('+x+','+y+')')).filter(()=>Math.random()\u003c.5);return'dom=A,B; p={'+t+'}; q={'+d.filter(()=>Math.random()\u003c.5)+'}; a='+pick(d)}\nfunction gen(c){let r=Math.random()\u003c.5;switch(c){case'evalp':return{c,d:{f:rf(),I:'p:'+pick('TF')+', q:'+pick('TF')+', r:'+pick('TF')}};case'cnf':case'class':return{c,d:r?rf():pick(B[c])};case'entail':return r?{c,d:['Random',[rf(2),rf(2)],rf(2)]}:{c,d:pick(B.entail)};case'pev':return{c,d:[pick(TP),rmodel()]}}return{c,d:pick(B[c])}}\nlet S={d:'prop',m:'tut',c:'cnf',i:0,mist:[],ok:0,no:0,ex:null,mi:-1};\nconst CATS={prop:{wff:'Syntax',formal:'Formalization',evalp:'Evaluation',cnf:'CNF',class:'Classification',entail:'Soundness'},pred:{pev:'Evaluation',pform:'Formalization'}};\nconst MODES={tut:'Tutorial',prac:'Practice',rand:'Random',ct:'Contradiction',ls:'Rule lessons',nd:'Deduction',wd:'Symbolix \ud83c\udfae',sim:'Simulator',mist:'Mistakes'};\nfunction nav(){$('#n1').innerHTML=[['prop','Propositional logic'],['pred','Predicate logic']].map(([k,v])=>`\u003cbutton class=\"${S.d==k?'on':''}\" onclick=\"S.d='${k}';S.c=Object.keys(CATS[S.d])[1-1];S.i=0;go()\">${v}\u003c/button>`).join('');\n$('#n2').innerHTML=Object.entries(MODES).map(([k,v])=>`\u003cbutton class=\"${S.m==k?'on':''}\" onclick=\"S.m='${k}';S.i=0;go()\">${v}${k=='mist'?' ('+S.mist.length+')':''}\u003c/button>`).join('')+`\u003cspan class=mu style=\"align-self:center\">\u2713 ${S.ok} \u00b7 \u2717 ${S.no}\u003c/span>`;\n$('#n3').innerHTML=S.m=='prac'||S.m=='rand'?Object.entries(CATS[S.d]).map(([k,v])=>`\u003cbutton class=\"${S.c==k?'on':''}\" onclick=\"S.c='${k}';S.i=0;go()\">${v}\u003c/button>`).join(''):''}\nfunction go(){nav();({tut,prac:ex,rand:ex,ct,ls,nd,wd,sim,mist:mi})[S.m]()}\nconst sec=(h,b)=>`\u003cdiv class=card>\u003ch3>${h}\u003c/h3>${b}\u003c/div>`;\nfunction tut(){$('#M').innerHTML=S.d=='prop'?\nsec('1 \u00b7 Syntax and formalization','Atoms p, q, r; connectives \u00ac \u2227 \u2228 \u2192 \u2194. Precedence: \u00ac > \u2227 > \u2228 > \u2192 > \u2194. A formula is well formed if every connective sits between two formulas (no \u003ccode>r(p\u2227q)\u003c/code>, no \u003ccode>p\u00ac\u003c/code>).\u003cpre>if p then q \u00b7 p only if q \u00b7 p is sufficient for q  \u2192  p\u2192q\\np is necessary for q  \u2192  q\u2192p\\np unless q  \u2192  \u00acq\u2192p  \u2261  p\u2228q\\nnot p unless q  \u2192  p\u2192q\\nsufficient but not necessary  \u2192  (p\u2192q)\u2227\u00ac(q\u2192p)\\nnot sufficient  \u2192  \u00ac(p\u2192q)\\nif p then q else r  \u2192  (p\u2192q)\u2227(\u00acp\u2192r)\u003c/pre>')+\nsec('2 \u00b7 Truth tables and classification','Valid = true under every interpretation. Unsatisfiable = false under every one. Otherwise satisfiable (not valid). \u003cb>Proof by contradiction\u003c/b>: assume the formula is false, propagate truth values; if you always hit a contradiction it is valid. Split in cases when you must; \u003ci>every\u003c/i> case must contradict. A case without contradiction gives a counterexample.')+\nsec('3 \u00b7 Logical consequence','Thm I: {P1\u2026Pn} \u22a8 Q is sound iff P1\u2227\u2026\u2227Pn\u2192Q is valid. Thm II: it is sound iff {P1\u2026Pn, \u00acQ} is inconsistent (unsatisfiable). Premises true and conclusion false = counterexample.')+\nsec('4 \u00b7 CNF','1) Eliminate \u2194 and \u2192 (\u003ccode>A\u2192B \u2261 \u00acA\u2228B\u003c/code>). 2) Push \u00ac inwards (De Morgan) and cancel \u00ac\u00ac. 3) Distribute: \u003ccode>A\u2228(B\u2227C) \u2261 (A\u2228B)\u2227(A\u2228C)\u003c/code>. 4) Simplify: drop clauses with p\u2228\u00acp, duplicates, absorbed clauses. In CNF: valid iff every clause is a tautology (result True); unsatisfiable iff no interpretation satisfies all clauses at once (e.g. p \u2227 \u00acp: check with a table or resolution); to falsify, make one clause false.')+\nsec('5 \u00b7 Resolution','Premises + negated conclusion \u2192 clauses. From (A\u2228l) and (B\u2228\u00acl) derive (A\u2228B). Reaching the empty clause \u25a1 means inconsistent, so the reasoning is \u003cb>sound\u003c/b>. If no new clauses appear and \u25a1 was never derived, the set is consistent and the reasoning is \u003cb>not sound\u003c/b>. Add each resolvent to the set; write proofs as numbered lines Res(i,j).')+\nsec('6 \u00b7 Natural deduction','Rules: \u2227I, \u2227E, \u2228I, \u2228E (cases), \u2192I (assume A, derive B, discharge), \u2192E (modus ponens), \u00acI/\u00acE (assume, reach contradiction), \u2194I, \u2194E. Strategy: work backwards from the goal. Goal A\u2192B: assume A. Goal \u00acA: assume A, get \u22a5. Premise A\u2228B: prove the goal in both cases. Since \u22a2 and \u22a8 agree, use \u003ci>Soundness\u003c/i> practice to learn whether a derivation exists before attempting it.'):\nsec('1 \u00b7 Symbols','Constants (a, b, l), variables (x, y), predicates with arity p(x,y), q(x), functions f(x). Write \u2200x and \u2203x (buttons, or \u003ccode>all x\u003c/code> / \u003ccode>ex x\u003c/code>). Quantifiers bind the next unit: \u003ccode>\u2200x(p(x)\u2192q(x))\u003c/code>.')+\nsec('2 \u00b7 Formalization patterns','\u003cpre>All S are P        \u2200x(S(x)\u2192P(x))\\nSome S are P       \u2203x(S(x)\u2227P(x))\\nNo S is P          \u00ac\u2203x(S(x)\u2227P(x))  \u2261  \u2200x(S(x)\u2192\u00acP(x))\\nNot all S are P    \u00ac\u2200x(S(x)\u2192P(x))\\nEverybody loves somebody  \u2200x\u2203y L(x,y)\\nSomebody loves everybody  \u2203x\u2200y L(x,y)\u003c/pre>Never pair \u2200 with \u2227, or \u2203 with \u2192, for restricted statements. \"p unless q\" and \"only when\" follow the propositional patterns. Answers are tested against the reference on many random models, so any equivalent formula is accepted.')+\nsec('3 \u00b7 Interpretations and evaluation','An interpretation gives a domain, the extension of each predicate (set of tuples) and a value for each constant. \u2200x F is true iff F holds for \u003ci>every\u003c/i> d in the domain; \u2203x F iff for \u003ci>some\u003c/i> d. Evaluate inside-out, trying each element. Write it as \u003ccode>dom=A,B; p={(A,B),(B,B)}; q={A}; a=B\u003c/code>.')}\nfunction exH(e){let d=e.d,c=e.c,q='',a='';const btn=(v,l)=>`\u003cbutton onclick=\"jd('${v}')\">${l}\u003c/button>`,inp=`\u003cinput id=ans placeholder=\"Your formula\" autocomplete=off>\u003cdiv class=row>\u003cbutton class=on onclick=\"jd($('#ans').value)\">Check\u003c/button>\u003c/div>`;\nif(c=='wff')q='Is this a well-formed formula?\u003cdiv class=f>'+d+'\u003c/div>',a=btn('y','Yes')+btn('n','No');\nif(c=='formal'||c=='pform')q='Formalize:\u003cbr>\u003cb>'+d[0]+'\u003c/b>',a=inp;\nif(c=='evalp')q='Evaluate under I = {'+d.I+'}\u003cdiv class=f>'+d.f+'\u003c/div>',a=btn('T','True')+btn('F','False');\nif(c=='cnf')q='Write in CNF:\u003cdiv class=f>'+d+'\u003c/div>',a=inp;\nif(c=='class')q='Classify:\u003cdiv class=f>'+d+'\u003c/div>',a=btn('valid','Valid')+btn('sat','Satisfiable, not valid')+btn('unsat','Unsatisfiable');\nif(c=='entail')q='\u003cspan class=mu>'+d[0]+'\u003c/span>\u003cdiv class=f>{ '+d[1].join(',  ')+' } \u22a8 '+d[2]+'\u003c/div>Is the reasoning sound?',a=btn('s','Sound')+btn('n','Not sound');\nif(c=='pev')q='Evaluate:\u003cdiv class=f>'+d[0]+'\u003c/div>under \u003ccode>'+d[1]+'\u003c/code>'+mview(pint(d[1])),a=btn('T','True')+btn('F','False');\nif(c=='puz')q=puzQ(d),a=puzA(d);return`\u003cdiv class=card>${q}\u003cdiv class=row>${c=='formal'||c=='pform'||c=='cnf'?'':''}${a}\u003c/div>\u003cdiv id=fb>\u003c/div>\u003c/div>`}\nfunction ex(){S.ex=S.m=='rand'||S.c=='evalp'||S.c=='pev'&&0?gen(S.c):{c:S.c,d:B[S.c][S.i%B[S.c].length]};if(S.m=='prac'&&S.c=='evalp')S.ex=gen('evalp');show()}\nfunction show(){const e=S.ex;$('#M').innerHTML=exH(e)+`\u003cdiv class=row>${S.m=='prac'&&B[e.c]?`\u003cbutton onclick=\"S.i=(S.i+${B[e.c].length}-1)%${B[e.c].length};ex()\">\u2190 Prev\u003c/button>\u003cspan class=mu style=\"align-self:center\">${S.i%B[e.c].length+1}/${B[e.c].length}\u003c/span>`:'' k.type=='unsat'?'The formula is \u003cb>unsatisfiable\u003c/b> (no interpretation makes all the clauses true).':'Not valid: falsify one clause, e.g. \u003ccode>'+ist(k.c)+'\u003c/code>. Satisfiable: model \u003ccode>'+ist(k.m)+'\u003c/code>.'})()}\nif(c=='class'){let f=parse(d),r=cls(f);ok=a==r.type;h='Answer: \u003cb>'+{valid:'valid',sat:'satisfiable but not valid',unsat:'unsatisfiable'}[r.type]+'\u003c/b>.'+(r.c?' Falsified by \u003ccode>'+ist(r.c)+'\u003c/code>.':'')+(r.m?' Model: \u003ccode>'+ist(r.m)+'\u003c/code>.':'')+tbl(r.vs,[f],I=>!ev(f,I))}\nif(c=='entail'){let P=d[1].map(x=>parse(x)),Q=parse(d[2]),w=ent(P,Q),C=[...P.flatMap(p=>cnf(p)),...cnf({t:'n',a:Q})],R=res(C);ok=(a=='s')==!w;h=w?'\u003cb>Not sound.\u003c/b> Counterexample \u003ccode>'+ist(w)+'\u003c/code> makes every premise true and the conclusion false. Resolution saturates without \u25a1 over the clauses {'+C.map(x=>x.join('\u2228')).join(', ')+'}.':'\u003cb>Sound.\u003c/b> No counterexample. Resolution on premises + \u00acconclusion:\u003cpre>'+proof(R)+'\u003c/pre>';if(!w)h+=R.ok?'':'';h+=tbl(vsOf([...P,Q]),[...P,Q],I=>P.every(p=>ev(p,I))&&!ev(Q,I))}\nif(c=='pev'){let f=parse(d[0],1),M=pint(d[1]),v=pev(f,M);ok=(a=='T')==v;h='Value: \u003cb>'+(v?'True':'False')+'\u003c/b>'+wit(f,M)}\nif(c=='pform'){let u=parse(a,1),s=parse(d[1],1),w=peq(u,s);ok=!w;h=(ok?'Equivalent to the reference (tested on 800 random models).':'Differs in the model \u003ccode>'+mstr(w)+'\u003c/code>: yours = '+pev(u,w)+', reference = '+pev(s,w)+'.')+'\u003cbr>Reference: \u003cb>'+sh(s)+'\u003c/b>'}\nif(c=='puz'){let r=puzJ(d,a);ok=r.ok;h=r.h}return{ok,h}}\nfunction jd(a){let r;try{r=judge(S.ex,a)}catch(x){$('#fb').innerHTML='\u003cp class=no>Syntax error: '+x.message+'\u003c/p>';return}\n$('#fb').innerHTML='\u003cp class='+(r.ok?'ok>\u2713 Correct':'no>\u2717 Not quite')+'\u003c/p>'+r.h;let m=S.mist.indexOf(S.ex);if(r.ok){S.ok++;addXP(2);if(m>=0)S.mist.splice(m,1)}else{S.no++;if(m\u003c0)S.mist.push(S.ex)}nav()}\nfunction mi( .tile,html[data-card=soft] details.card{border:0!important;box-shadow:0 6px 24px #0003!important;border-radius:16px!important;}html[data-card=sketch] .card,html[data-card=sketch] .tile,html[data-card=sketch] details.card{border:2px dashed var(--bd,#888)!important;}html[data-card=glass] .card,html[data-card=glass] .tile,html[data-card=glass] details.card{background:color-mix(in srgb,var(--card) 55%,transparent)!important;backdrop-filter:blur(8px)!important;border-color:#fff4!important;}html[data-card=comic] .card,html[data-card=comic] .tile,html[data-card=comic] details.card{box-shadow:5px 5px 0 var(--fg,#000)!important;border:2px solid var(--fg,#000)!important;border-radius:6px!important;}html[data-card=ghost] .card,html[data-card=ghost] .tile,html[data-card=ghost] details.card{background:color-mix(in srgb,var(--card) 70%,transparent)!important;border:1px solid #fff6!important;box-shadow:0 0 18px #ffffff55,0 0 40px #ffffff22!important;}html[data-card=neon] .card,html[data-card=neon] .tile,html[data-card=neon] details.card{border:1px solid var(--acc,var(--blue,var(--ac)))!important;box-shadow:0 0 10px color-mix(in srgb,var(--acc,var(--blue,var(--ac))) 55%,transparent)!important;}\nnav#nav{position:static!important;display:flex!important;flex-wrap:wrap!important;overflow:visible!important;gap:6px!important;background:var(--card)!important;border:1px solid var(--line,var(--bd))!important;border-radius:12px!important;padding:8px!important;margin:10px auto!important;max-width:956px;box-sizing:border-box}\nnav#nav button{border-radius:8px!important;padding:6px 12px!important;font-size:13px!important;font-weight:600!important;border:1px solid var(--line,var(--bd))!important;background:var(--card)!important;color:var(--ink,var(--fg))!important;white-space:nowrap}\nnav#nav button[aria-selected=true],nav#nav button.on,nav#nav button.sel{background:var(--blue,var(--acc,var(--ac)))!important;color:var(--on,#fff)!important;border-color:var(--blue,var(--acc,var(--ac)))!important}\nheader{position:static!important}\n.mpsec{display:none;font:inherit;font-weight:600;text-align:left;background:var(--card);color:var(--ink,var(--fg));border:1px solid var(--line,var(--bd));border-radius:10px;padding:10px 12px;margin:10px 12px;cursor:pointer;width:calc(100% - 24px);box-sizing:border-box}\n@media (max-width:700px){.mpsec{display:block}nav#nav{display:none!important;margin:0 12px 10px!important}nav#nav.mpopen{display:flex!important}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>TEC \u003cspan>Lab\u003c/span>\u003c/h1>\u003cp>Electronics and Computer Technology, explained step by step. Start at \u201cStart here\u201d, then move the sliders: everything updates live.\u003c/p>\u003c/header>\n\u003cnav role=\"tablist\" id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection id=\"learn\">\u003ch2>Start here\u003c/h2>\u003cp class=\"lead\">No prior knowledge needed. Open each card in order.\u003c/p>\n\u003cdetails open>\u003csummary>1. Voltage, current, resistance\u003c/summary>\u003cp>\u003cb>Voltage (V)\u003c/b> is the \u201cpush\u201d on the charges, like water pressure from a tank. \u003cb>Current (I)\u003c/b> is how much charge flows per second, like the water flow. \u003cb>Resistance (R)\u003c/b> is the friction, like a narrow pipe.\u003c/p>\u003cp>They are linked by Ohm\u2019s law: \u003cspan class=\"f\">V = I\u00b7R\u003c/span>. Voltage is applied \u003ci>across\u003c/i> things; current flows \u003ci>through\u003c/i> them. Try it in \u201cCircuits\u201d.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>2. Sources and the sign convention\u003c/summary>\u003cp>A \u003cb>voltage source\u003c/b> keeps its voltage whatever the current. A \u003cb>current source\u003c/b> keeps its current whatever the voltage. If the current leaves the + terminal, the element \u003cb>delivers\u003c/b> energy (source); if it enters the +, it \u003cb>absorbs\u003c/b> it (load). Resistors always absorb.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>3. Series and parallel\u003c/summary>\u003cp>\u003cb>Series\u003c/b>: same current, resistances add. \u003cb>Parallel\u003c/b>: same voltage, conductances add, so the total is always smaller than the smallest resistor. Trick: in series the biggest resistor dominates; in parallel the smallest does.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>4. Kirchhoff\u2019s laws\u003c/summary>\u003cp>\u003cb>KCL\u003c/b>: currents entering a node = currents leaving it. \u003cb>KVL\u003c/b>: voltages around any closed loop add up to zero. Write the sign you meet first on each element as you walk the loop. A negative result just means the real current goes the other way.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>5. Thevenin: the big trick\u003c/summary>\u003cp>Any linear circuit seen from two terminals A\u2013B equals one source \u003cb>V\u003csub>TH\u003c/sub>\u003c/b> in series with one resistor \u003cb>R\u003csub>TH\u003c/sub>\u003c/b>. Steps: open the load \u2192 V\u003csub>TH\u003c/sub> = open-circuit voltage \u2192 \u201ckill\u201d sources (voltage source \u2192 wire, current source \u2192 open) \u2192 R\u003csub>TH\u003c/sub> = resistance seen from A\u2013B. Then changing the load is trivial.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>6. Diodes and the Q point\u003c/summary>\u003cp>A diode is a one-way valve. \u003cb>Ideal\u003c/b>: ON (0 V) when current flows anode\u2192cathode, OFF (no current) otherwise. \u003cb>Real silicon\u003c/b>: needs \u22480.7 V to turn on. \u003cb>Zener\u003c/b>: also conducts backwards once the reverse voltage reaches V\u003csub>Z\u003c/sub>. The \u003cb>Q point\u003c/b> (operation point) is where the diode\u2019s curve meets the circuit\u2019s \u003cb>load line\u003c/b>. Practice in the \u201cDiode\u201d tab.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>7. Transistors: electric switches and amplifiers\u003c/summary>\u003cp>\u003cb>MOSFET\u003c/b>: voltage V\u003csub>GS\u003c/sub> on the gate (no gate current) opens a channel between drain and source. Below the threshold: cutoff (open switch). Above: ohmic (resistor, a closed switch) or saturation (current source). \u003cb>BJT\u003c/b>: a small base current I\u003csub>B\u003c/sub> controls a big collector current: \u003cspan class=\"f\">I\u003csub>C\u003c/sub> = \u03b2\u00b7I\u003csub>B\u003c/sub>\u003c/span>. Try both in the next tabs.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>8. Capacitors\u003c/summary>\u003cp>A capacitor stores energy in an electric field. It blocks DC when full and its voltage can\u2019t jump. With a resistor it charges exponentially with time constant \u03c4 = R\u00b7C: 63% after 1\u03c4, 99% after 5\u03c4.\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"circ\">\u003ch2>Circuits: divider + Thevenin\u003c/h2>\u003cp class=\"lead\">A voltage divider gives a fraction of V\u003csub>in\u003c/sub>. Add a load R\u003csub>L\u003c/sub> and see why Thevenin matters.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"c1\">\u003c/div>\u003cdiv class=\"box\">\u003cdiv id=\"c2\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"dio\">\u003ch2>Diode simulator\u003c/h2>\u003cp class=\"lead\">The circuit is already reduced with Thevenin: V\u003csub>TH\u003c/sub> \u2013 R\u003csub>TH\u003c/sub> \u2013 diode (anode at the resistor). Move V\u003csub>TH\u003c/sub> and watch the Q point slide along the load line.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"d1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"dc\">\u003c/canvas>\u003cdiv class=\"res\" id=\"dres\">\u003c/div>\u003cdiv class=\"say\" id=\"dsay\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"mos\">\u003ch2>MOSFET simulator (NMOS)\u003c/h2>\u003cp class=\"lead\">Switch driving a load R\u003csub>D\u003c/sub> from V\u003csub>DD\u003c/sub>. Ideal linear curves like the course exercises: cutoff below 2.5 V, saturation current 40 mA per volt above it, knee at 2 V.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"m1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"mc\">\u003c/canvas>\u003cdiv class=\"res\" id=\"mosres\">\u003c/div>\u003cdiv class=\"say\" id=\"mossay\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"bjt\">\u003ch2>BJT simulator (NPN, common emitter)\u003c/h2>\u003cp class=\"lead\">V\u003csub>BB\u003c/sub> feeds the base through R\u003csub>B\u003c/sub>. Increase V\u003csub>BB\u003c/sub> and see the transistor go from cutoff to active to saturation (switch ON).\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"b1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"bcv\">\u003c/canvas>\u003cdiv class=\"res\" id=\"bres\">\u003c/div>\u003cdiv class=\"say\" id=\"bsay\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"rc\">\u003ch2>RC charging\u003c/h2>\u003cp class=\"lead\">Capacitor charging from 0 V through a resistor.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"r1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"rcv\">\u003c/canvas>\u003cdiv class=\"res\" id=\"rres\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"sv\">\u003ch2>Solve it step by step\u003c/h2>\u003cp class=\"lead\">Pick the kind of problem, change the numbers, and every step is shown with the formula, your numbers, and why you do it. Use it as a template for your own exercises.\u003c/p>\u003cdetails>\u003csummary>What are they asking? What do I do?\u003c/summary>\u003cdiv id=\"svq\">\u003c/div>\u003c/details>\u003cdiv class=\"box\">\u003cselect id=\"svt\" aria-label=\"Problem type\">\u003c/select>\u003cdiv class=\"say\" id=\"svask\">\u003c/div>\u003cdiv id=\"svf\">\u003c/div>\u003c/div>\u003cdiv id=\"svs\">\u003c/div>\u003c/section>\n\u003csection id=\"ex\">\u003ch2>Exercises from your notes\u003c/h2>\u003cp class=\"lead\">Try each one on paper first, then open the solution. Units: V, k\u03a9, mA unless stated.\u003c/p>\u003cselect id=\"exf\" aria-label=\"Topic\">\u003c/select>\u003cdiv id=\"exl\" style=\"margin-top:10px\">\u003c/div>\u003c/section>\n\u003csection id=\"mk\">\u003ch2>Circuit maker + solver\u003c/h2>\u003cp class=\"lead\">Build a real circuit: a source on the left, a top wire (the rail) and a bottom wire (ground). Add parts \u003cb>on the rail\u003c/b> (in series) or \u003cb>to ground\u003c/b> (hanging down). The schematic redraws live with node voltages, the current through every part and the ON/OFF state of diodes.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"box\">\u003cb>Start from an example\u003c/b>\u003cselect id=\"kpre\" aria-label=\"Preset\">\u003c/select>\u003cp style=\"margin:10px 0 2px\">\u003clabel for=\"kvin\">\u003cb>Source voltage Vin (V)\u003c/b>\u003c/label>\u003c/p>\u003cinput type=\"number\" step=\"any\" id=\"kvin\" value=\"10\">\u003cp style=\"margin:10px 0 2px\">\u003cb>Parts, from left to right\u003c/b>\u003c/p>\u003cdiv id=\"krows\">\u003c/div>\u003cbutton class=\"b\" id=\"kadd\">+ Add on the rail\u003c/button>\u003cbutton class=\"b\" id=\"kadd2\">+ Add to ground\u003c/button>\u003cdiv class=\"say\">\u21c4 flips a part\u2019s direction (diode, battery, sink). Parts on the same node can be added one after another to the ground side (a load, a zener\u2026). Symbols:\u003c/div>\u003cdiv class=\"leg\" id=\"kleg\">\u003c/div>\u003c/div>\u003cdiv class=\"box\">\u003cdiv id=\"kdraw\" style=\"overflow-x:auto\">\u003c/div>\u003cdiv id=\"kres\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"pr\">\u003ch2>Practice\u003c/h2>\u003cp class=\"lead\">Pick a topic and get a new random problem each time. Type your answer and check it.\u003c/p>\u003cdiv class=\"box\">\u003cselect id=\"ptop\" aria-label=\"Topic\">\u003c/select>\u003cbutton class=\"b\" id=\"pnew\">New problem\u003c/button>\u003cdiv id=\"pq\" class=\"say\" style=\"font-size:16px\">Press \u201cNew problem\u201d.\u003c/div>\u003cdiv id=\"pg\">\u003c/div>\u003cinput type=\"number\" step=\"any\" id=\"pin\" placeholder=\"Your answer\" aria-label=\"Your answer\">\u003cbutton class=\"b\" id=\"pchk\">Check\u003c/button>\u003cbutton class=\"b\" id=\"psh\">Show solution\u003c/button>\u003cdiv id=\"pfb\">\u003c/div>\u003cdiv id=\"pscore\" class=\"lead\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"gm\">\u003ch2>Crack the Q \ud83c\udfaf\u003c/h2>\u003cp class=\"lead\">A hidden operating point. You have 6 tries to find where the circuit settles: its \u003cb>region\u003c/b>, the \u003cb>current\u003c/b> and the \u003cb>voltage\u003c/b>. After each try the tiles tell you how close you are. Do the math, draw the load line, crack it.\u003c/p>\u003cdiv class=\"box\">\u003cdiv class=\"grid\">\u003cselect id=\"gmode\" aria-label=\"Mode\">\u003coption value=\"daily\">Daily puzzle (same for everyone)\u003c/option>\u003coption value=\"rnd\">Random puzzle\u003c/option>\u003c/select>\u003cselect id=\"gtop\" aria-label=\"Circuit\">\u003coption value=\"any\">Any circuit\u003c/option>\u003coption value=\"dio\">Diode\u003c/option>\u003coption value=\"mos\">MOSFET\u003c/option>\u003coption value=\"bjt\">BJT\u003c/option>\u003c/select>\u003c/div>\u003cbutton class=\"b\" id=\"gnew\">New game\u003c/button>\u003cdiv id=\"gdg\">\u003c/div>\u003cdiv class=\"say\" id=\"gtxt\">\u003c/div>\u003cdiv class=\"grid\" style=\"margin-top:8px\">\u003cselect id=\"greg\" aria-label=\"Region\">\u003c/select>\u003cinput type=\"number\" step=\"any\" id=\"gi\" placeholder=\"Current I (mA)\" aria-label=\"Current in mA\">\u003cinput type=\"number\" step=\"any\" id=\"gv\" placeholder=\"Voltage V (V)\" aria-label=\"Voltage in V\">\u003c/div>\u003cbutton class=\"b\" id=\"gsub\">Guess\u003c/button>\u003cbutton class=\"b\" id=\"ghint\">Hint\u003c/button>\u003cdiv id=\"gbd\">\u003c/div>\u003cdiv id=\"gmsg\">\u003c/div>\u003cdiv class=\"lead\" id=\"gst\">\u003c/div>\u003cdiv class=\"say\">\ud83d\udfe9 right \u00b7 \ud83d\udfe8 within 25% \u00b7 \u2b1b far. \u25b2 the real value is higher, \u25bc lower. Current and voltage keep their sign (V is V_AK, V_DS or V_CE).\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"form\">\u003ch2>Formulas and tricks\u003c/h2>\u003cdiv class=\"grid\">\u003cinput type=\"search\" id=\"q\" placeholder=\"Search: ohm, thevenin, mosfet, tau\u2026\" aria-label=\"Search formulas\">\u003cselect id=\"fc\" aria-label=\"Topic\">\u003c/select>\u003c/div>\u003cdiv id=\"fl\" style=\"margin-top:12px\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id),V=id=>+$(id).value;\nconst tabs=[['learn','Start here'],['circ','Circuits'],['dio','Diode'],['mos','MOSFET'],['bjt','BJT'],['rc','RC'],['sv','Step by step'],['ex','Exercises'],['mk','Maker'],['pr','Practice'],['gm','Crack the Q \ud83c\udfaf'],['form','Formulas']];\nconst nav=$('nav');\ntabs.forEach(([id,t],i)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('role','tab');b.onclick=()=>show(id);b.dataset.t=id;nav.appendChild(b)});\nfunction show(id){tabs.forEach(([k])=>$(k).classList.toggle('on',k==id));[...nav.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.t==id));draw();scrollTo(0,0)}\nfunction sl(id,l,mn,mx,st,v,u){return `\u003cdiv class=\"sl\">\u003clabel for=\"${id}\">${l}\u003c/label>\u003cb id=\"${id}o\">${v} ${u}\u003c/b>\u003cinput type=\"range\" id=\"${id}\" min=\"${mn}\" max=\"${mx}\" step=\"${st}\" value=\"${v}\" data-u=\"${u}\">\u003c/div>`}\nfunction sel(id,opts){return `\u003cselect id=\"${id}\" aria-label=\"${id}\">${opts.map(o=>`\u003coption>${o}\u003c/option>`).join('')}\u003c/select>`}\ndocument.addEventListener('input',e=>{const t=e.target,o=$(t.id+'o');if(o)o.textContent=t.value+' '+t.dataset.u;draw()});\nconst f=(x,d=2)=>(+x).toFixed(d).replace(/\\.?0+$/,'');\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();\nfunction plot(cv,o){const r=devicePixelRatio||1,W=cv.width=cv.clientWidth*r,H=cv.height=cv.clientHeight*r,c=cv.getContext('2d');c.scale(r,r);const w=W/r,h=H/r,p=34;\nconst X=x=>p+(x-o.x0)/(o.x1-o.x0)*(w-p-8),Y=y=>h-p-(y-o.y0)/(o.y1-o.y0)*(h-p-10);c.clearRect(0,0,w,h);c.font='11px system-ui';c.fillStyle=col('mut');c.strokeStyle=col('line');\nc.beginPath();c.moveTo(p,Y(0));c.lineTo(w-8,Y(0));c.moveTo(X(0),10);c.lineTo(X(0),h-p);c.stroke();c.fillText(o.xl,w-70,Y(0)+(Y(0)>h-p-14?-6:14));c.fillText(o.yl,X(0)+4,18);c.fillText(f(o.x0,1),p,h-p+14);c.fillText(f(o.x1,1),w-30,h-p+14);c.fillText(f(o.y1,1),2,16);c.fillText(f(o.y0,1),2,h-p);\no.ln.forEach(l=>{c.beginPath();c.strokeStyle=col(l.c);c.lineWidth=l.w||2;c.setLineDash(l.d||[]);l.p.forEach((q,i)=>i?c.lineTo(X(q[0]),Y(q[1])):c.moveTo(X(q[0]),Y(q[1])));c.stroke()});c.setLineDash([]);\n(o.dots||[]).forEach(d=>{c.fillStyle=col('ok');c.beginPath();c.arc(X(d[0]),Y(d[1]),7,0,7);c.fill();c.fillStyle=col('ink');c.font='bold 12px system-ui';c.fillText('Q',X(d[0])+10,Y(d[1])-8)})}\nconst tag=(t,c)=>`\u003cspan class=\"tag\" style=\"background:${col(c)}\">${t}\u003c/span>`;\n/* circuits */\n$('c1').innerHTML='\u003cb>Voltage divider\u003c/b>'+sl('vi','V in',1,24,.5,10,'V')+sl('r1','R1',.1,20,.1,1,'k\u03a9')+sl('r2','R2',.1,20,.1,1,'k\u03a9')+sl('rl','R load (20 = none)',.1,20,.1,20,'k\u03a9')+'\u003cdiv id=\"cv\">\u003c/div>';\n$('c2').innerHTML='\u003cb>Thevenin equivalent seen by the load\u003c/b>\u003cdiv id=\"ct\">\u003c/div>\u003cdiv class=\"say\">Trick: if R load is much bigger than R\u003csub>TH\u003c/sub>, the load barely disturbs the divider. Lower R load and V out sags.\u003c/div>';\nfunction circ(){const v=V('vi'),a=V('r1'),b=V('r2'),l=V('rl'),nl=l>=20,vth=v*b/(a+b),rth=a*b/(a+b),vo=nl?vth:vth*l/(l+rth),I=v/(a+b);\nconst bar=(t,x,c)=>`\u003cdiv class=\"bar\" style=\"width:${Math.max(x/v*100,1)}%;background:${col(c)}\">${t}\u003c/div>`;\n$('cv').innerHTML=bar('V in = '+f(v)+' V',v,'ink')+bar('V on R1 = '+f(v-vth)+' V',v-vth,'red')+bar('V out (no load) = '+f(vth)+' V',vth,'blue')+(nl?'':bar('V out with load = '+f(vo)+' V',vo,'ok'))+`\u003cdiv class=\"res\">I = Vin/(R1+R2) = ${f(I)} mA\u003cbr>P total = ${f(v*I)} mW\u003c/div>`;\n$('ct').innerHTML=`\u003cdiv class=\"res\">V\u003csub>TH\u003c/sub> = Vin\u00b7R2/(R1+R2) = ${f(vth)} V\u003cbr>R\u003csub>TH\u003c/sub> = R1\u2016R2 = ${f(rth,3)} k\u03a9\u003cbr>V out = ${f(vo)} V\u003cbr>I load = ${nl?'0':f(vo/l,3)} mA\u003c/div>`}\n/* diode */\n$('d1').innerHTML='\u003cb>Circuit\u003c/b>'+sl('dv','V TH',-20,20,.1,5,'V')+sl('dr','R TH',.1,5,.1,2,'k\u03a9')+'\u003cp>Diode type\u003c/p>'+sel('dt',['Ideal','Silicon 0.7 V','Zener (ideal)','Zener (0.7 V forward)'])+sl('dz','V Z',1,10,.5,5,'V');\nfunction dio(){const vt=V('dv'),R=V('dr'),t=$('dt').selectedIndex,vf=t%2?.7:0,z=t>1,Vz=V('dz');let q,I,m;\nif((vt-vf)/R>0){I=(vt-vf)/R;q=vf;m=['ON (forward)','ok']}else if(z&&vt\u003c-Vz){I=(vt+Vz)/R;q=-Vz;m=['ZENER region','red']}else{I=0;q=vt;m=['OFF (blocking)','blue']}\nconst ext=Math.max(Math.abs(vt),Vz,1)*1.3,ym=Math.max(Math.abs(vt)/R,2)*1.2,ch=[[-ext,z?0:0],[vf,0],[vf,ym]];if(z)ch.splice(0,1,[-Vz,-ym],[-Vz,0]);else ch.unshift([-ext,0]);\nplot($('dc'),{x0:-ext,x1:ext,y0:-ym,y1:ym,xl:'V_AK (V)',yl:'I_D (mA)',ln:[{p:ch,c:'blue',w:3},{p:[[vt,0],[0,vt/R]],c:'red',d:[6,4]}],dots:[[q,I]]});\n$('dres').innerHTML=`Q point = (V\u003csub>AK\u003c/sub> = ${f(q)} V, I\u003csub>D\u003c/sub> = ${f(I,3)} mA)\u003cbr>${tag(m[0],m[1])}`;\n$('dsay').innerHTML='Blue = diode curve, dashed red = load line (all circuit solutions). Q is where they cross. Load line points: diode as short \u2192 I = V\u003csub>TH\u003c/sub>/R\u003csub>TH\u003c/sub>; as open \u2192 V = V\u003csub>TH\u003c/sub>.'}\n/* mosfet */\n$('m1').innerHTML='\u003cb>Circuit\u003c/b>'+sl('mg','V GS',0,12,.5,7.5,'V')+sl('mv','V DD',2,24,1,12,'V')+sl('mr','R D',5,200,5,40,'\u03a9');\nfunction mos(){const g=V('mg'),vdd=V('mv'),R=V('mr'),vth=2.5,kn=2;let I,vds,m;const isat=g\u003cvth?0:(g-vth)*40,ron=isat?kn/isat*1000:1e9;\nif(!isat){I=0;vds=vdd;m=['CUTOFF = open switch','blue']}else if(vdd-isat/1000*R>=kn){I=isat;vds=vdd-I/1000*R;m=['SATURATION = current source','red']}else{I=vdd/(R+ron)*1000;vds=vdd-I/1000*R;m=['OHMIC = closed switch (R_DS(on)='+f(ron)+' \u03a9)','ok']}\nconst ym=Math.max(vdd/R*1000,330)*1.1,xm=Math.max(vdd,4)*1.05,ln=[];[5,7.5,10,12].forEach(v=>{const s=(v-vth)*40;ln.push({p:[[0,0],[kn,s],[xm,s]],c:v==g?'blue':'line',w:v==g?3:1.5})});\nif(g>=vth&&![5,7.5,10,12].includes(g)){const s=(g-vth)*40;ln.push({p:[[0,0],[kn,s],[xm,s]],c:'blue',w:3})}\nln.push({p:[[0,0],[xm,0]],c:'blue',w:g\u003cvth?3:1.5},{p:[[vdd,0],[0,vdd/R*1000]],c:'red',d:[6,4]});\nplot($('mc'),{x0:0,x1:xm,y0:0,y1:ym,xl:'V_DS (V)',yl:'I_D (mA)',ln,dots:[[vds,I]]});\n$('mosres').innerHTML=`Q = (V\u003csub>DS\u003c/sub> = ${f(vds)} V, I\u003csub>D\u003c/sub> = ${f(I,1)} mA)\u003cbr>P in MOSFET = ${f(vds*I)} mW\u003cbr>${tag(m[0],m[1])}`;\n$('mossay').innerHTML='Gray = curves for other V\u003csub>GS\u003c/sub>; blue = yours; dashed red = load line. As a switch you want V\u003csub>GS\u003c/sub> high: low V\u003csub>DS\u003c/sub> means little heat in the transistor.'}\n/* bjt */\n$('b1').innerHTML='\u003cb>Circuit (\u03b2 = 100)\u003c/b>'+sl('bb','V BB',0,10,.1,2,'V')+sl('br','R B',1,100,1,10,'k\u03a9')+sl('bc','V CC',2,24,1,15,'V')+sl('bcr','R C',.1,5,.1,1,'k\u03a9')+sl('bbe','\u03b2',20,300,10,100,'');\nfunction bjt(){const vbb=V('bb'),rb=V('br'),vcc=V('bc'),rc=V('bcr'),be=V('bbe');let ib=Math.max((vbb-.7)/rb,0),ic=be*ib,vce=vcc-ic*rc,m;\nif(ib==0){m=['CUTOFF = open switch','blue']}else if(vce\u003c=0){ic=vcc/rc;vce=0;m=['SATURATION = closed switch (needs I_B > I_C(sat)/\u03b2)','red']}else m=['ACTIVE = amplifier zone','ok'];\nconst ics=vcc/rc,ym=ics*1.2,ln=[],ibl=[...new Set([0.1,.25,.5,.75,1].map(k=>k*ics/be))];ibl.forEach(i=>{const y=Math.min(i*be,ics*1.15);ln.push({p:[[0,0],[.1,y],[vcc*1.05,y]],c:'line',w:1.5})});\nif(ib){const y=Math.min(ic,ym);ln.push({p:[[0,0],[.1,y],[vcc*1.05,y]],c:'blue',w:3})}ln.push({p:[[vcc,0],[0,ics]],c:'red',d:[6,4]});\nplot($('bcv'),{x0:0,x1:vcc*1.05,y0:0,y1:ym,xl:'V_CE (V)',yl:'I_C (mA)',ln,dots:[[vce,ic]]});\n$('bres').innerHTML=`I\u003csub>B\u003c/sub> = (V\u003csub>BB\u003c/sub>\u22120.7)/R\u003csub>B\u003c/sub> = ${f(ib*1000,1)} \u00b5A\u003cbr>I\u003csub>C\u003c/sub> = ${f(ic,2)} mA, V\u003csub>CE\u003c/sub> = ${f(vce)} V\u003cbr>${tag(m[0],m[1])}`;\n$('bsay').innerHTML='Red dashed = load line from V\u003csub>CC\u003c/sub> (cutoff) to V\u003csub>CC\u003c/sub>/R\u003csub>C\u003c/sub> (saturation). Q slides along it when I\u003csub>B\u003c/sub> changes. Switch design: pick I\u003csub>B\u003c/sub> well above I\u003csub>C\u003c/sub>/\u03b2.'}\n/* rc */\n$('r1').innerHTML='\u003cb>Circuit\u003c/b>'+sl('rv','V source',1,24,1,10,'V')+sl('rr','R',1,100,1,10,'k\u03a9')+sl('rcc','C',1,100,1,10,'\u00b5F');\nfunction rc(){const v=V('rv'),R=V('rr'),C=V('rcc'),tau=R*C,N=5*tau,p=[];for(let i=0;i\u003c=60;i++){const t=N*i/60;p.push([t,v*(1-Math.exp(-t/tau))])}\nplot($('rcv'),{x0:0,x1:N,y0:0,y1:v*1.05,xl:'t (ms)',yl:'V_C (V)',ln:[{p,c:'blue',w:3},{p:[[tau,0],[tau,v*.632]],c:'red',d:[4,4]}],dots:[[tau,v*.632]]});\n$('rres').innerHTML=`\u03c4 = R\u00b7C = ${f(tau)} ms\u003cbr>At 1\u03c4: ${f(v*.632)} V (63%)\u003cbr>At 5\u03c4 (${f(5*tau)} ms): ${f(v*.993)} V (99%)\u003cbr>k\u03a9\u00b7\u00b5F = ms`}\n/* formulas */\nconst F=[['Basics','Ohm\u2019s law','V = I\u00b7R','Voltage across, current through. R in \u03a9, I in A.'],['Basics','Power','P = V\u00b7I = V\u00b2/R = I\u00b2\u00b7R','Resistors always absorb power. Source P = V\u00b7I; negative absorbed power = it delivers.'],['Basics','Units','1 k\u03a9\u00b71 mA = 1 V','k\u03a9 with mA gives V. M\u03a9 with \u00b5F gives seconds; k\u03a9 with \u00b5F gives ms.'],['Basics','Series R','R = R1 + R2','Same current. Largest resistor dominates.'],['Basics','Parallel R','1/R = 1/R1 + 1/R2 \u00b7 R = R1\u00b7R2/(R1+R2)','Always smaller than the smallest. Two equal R \u2192 half.'],['Basics','Source power sign','Current out of + \u2192 source; into + \u2192 load','Check with P = V\u00b7I: P \u003c 0 means it delivers energy.'],['Laws','KCL','\u03a3 I in = \u03a3 I out','Choose directions, stay consistent. A negative answer = opposite direction.'],['Laws','KVL','\u03a3 V around a loop = 0','Write the first sign you meet on each element. Direction of the walk doesn\u2019t matter.'],['Laws','Voltage divider','Vout = Vin\u00b7R2/(R1+R2)','Valid only if nothing loads the output.'],['Laws','Series sources','Sources in series just add (mind the polarity)','Example in your notes: 5 V + 5 V against a 10 V source gives 0 A.'],['Laws','Current source \u2225 R','I with R in parallel \u2261 V = I\u00b7R in series with R','Quick source transformation (10 mA \u2225 1 k\u03a9 \u2261 10 V + 1 k\u03a9).'],['Theorems','Thevenin','V_TH = V_AB open \u00b7 R_TH = R seen with sources killed','Voltage source \u2192 short, current source \u2192 open. Include every element when finding R_TH.'],['Theorems','Thevenin trick','Use it whenever the load changes or a diode/transistor is the only nonlinear part','Reduce the circuit around the diode, then only a series loop remains.'],['Theorems','Superposition','Total = \u03a3 effect of each source alone','Linear circuits only. Turn off the others. Try Thevenin first for each partial circuit.'],['Diodes','Ideal diode','ON: V_D = 0, I_D \u2265 0 \u00b7 OFF: I_D = 0, V_AK \u2264 0','Sign convention: V_AK = V_A \u2212 V_K, I from A to K.'],['Diodes','Real diode','ON: V_D = 0.7 V (silicon)','I = (V_TH \u2212 0.7)/R_TH.'],['Diodes','Zener','Forward \u2248 diode \u00b7 reverse: V_AK = \u2212V_Z when breakdown','In the zener region I_D \u003c 0 and I = (V_TH + V_Z)/R_TH.'],['Diodes','Solve by assumption','1) guess ON/OFF/zener 2) solve 3) check compatibility','OFF needs V_AK \u003c 0; ON needs I_D > 0. If incompatible, change the guess.'],['Diodes','Solve by load line','Two points: diode short (V=0, I=V_TH/R_TH) and open (V=V_TH, I=0)','Q = intersection with the characteristic curve. No assumption needed.'],['Diodes','Quick checks','A diode in series with a current source (pointing forward) is always ON','A diode that is in reverse across a source is OFF. Look before calculating.'],['Diodes','LED resistor','R = (V \u2212 V_F)/I_LED','Example: (10 \u2212 2.5)/10 mA = 750 \u03a9.'],['Diodes','Battery life','t = Capacity (Wh) / P load (W)','Remember zener and resistors consume too, not just the LED.'],['MOSFET','Regions (NMOS)','Cutoff: V_GS \u003c V_th \u00b7 Ohmic: V_DS \u003c V_ov \u00b7 Saturation: V_DS > V_ov','V_ov = V_GS \u2212 V_th. PMOS: use V_SG and V_SD.'],['MOSFET','Gate','I_G = 0','The oxide is an insulator. A resistive divider on the gate sets V_GS with no loading.'],['MOSFET','R_DS(on)','R_DS(on) = V_DS(on)/I_D(on)','Inverse of the slope in the ohmic region. Used as a switch.'],['MOSFET','Load line','I_D(sat) = V_DD/R_D \u00b7 V_DS = V_DD \u2212 I_D\u00b7R_D','Q = intersection with the curve of your V_GS.'],['MOSFET','Switch trick','Drive V_GS well above V_th so it works in the ohmic region','Then P = I\u00b2\u00b7R_DS(on): little heat. In saturation it dissipates much more.'],['MOSFET','Zener on gate','V_GS = V_Z if the zener conducts','Check the zener region as you would with a diode.'],['BJT','Currents','I_E = I_C + I_B \u00b7 I_C = \u03b2\u00b7I_B \u00b7 I_C \u2248 I_E','I_B is tiny compared with I_C.'],['BJT','Base loop (ideal V_BE = 0)','I_B = (V_BB \u2212 V_BE)/R_B','Real silicon: V_BE = 0.7 V.'],['BJT','Collector loop','V_CE = V_CC \u2212 I_C\u00b7R_C','Valid in the active region.'],['BJT','Regions','Cutoff I_B = 0 \u00b7 Active I_C = \u03b2 I_B \u00b7 Saturation V_CE \u2248 0','If \u03b2\u00b7I_B > I_C(sat), it is saturated: I_C = V_CC/R_C.'],['BJT','Load line','Cutoff (V_CE = V_CC, I_C = 0) \u00b7 Saturation (V_CE = 0, I_C = V_CC/R_C)','Q moves along it when I_B changes.'],['BJT','Switch design','Force I_B \u2265 a few times I_C(sat)/\u03b2','Then R_B = (V_in \u2212 0.7)/I_B.'],['Capacitor','Equations','i = C\u00b7dv/dt \u00b7 w = \u00bd\u00b7C\u00b7V\u00b2','V can\u2019t change instantly. Open circuit at DC.'],['Capacitor','Association','Parallel: C = C1 + C2 \u00b7 Series: 1/C = 1/C1 + 1/C2','Opposite to resistors.'],['Capacitor','RC charge','v(t) = V\u221e \u2212 (V\u221e \u2212 V\u2080)\u00b7e^(\u2212t/\u03c4) \u00b7 \u03c4 = R\u00b7C','63% at 1\u03c4, 99% at 5\u03c4.'],['Inductor','Equations','v = L\u00b7di/dt \u00b7 w = \u00bd\u00b7L\u00b7i\u00b2','I can\u2019t change instantly. Short circuit at DC. Series add, parallel like resistors.'],['Lab','Resistor colors','Digits, then multiplier, tolerance last (gold 5%, silver 10%)','Black 0 \u00b7 brown 1 \u00b7 red 2 \u00b7 orange 3 \u00b7 yellow 4 \u00b7 green 5 \u00b7 blue 6 \u00b7 violet 7 \u00b7 gray 8 \u00b7 white 9.'],['Lab','Decoupling','100 nF\u20131 \u00b5F close to the IC supply pin','Filters noise on the power supply.'],['Lab','Open vs short','Open: I = 0, V unknown \u00b7 Short: V = 0, I unknown','Overpower destroys transistors; solder splashes create shorts.']];\nfunction list(){const s=$('q').value.toLowerCase(),k=$('fc').value;let h='',c='';F.forEach(r=>{if((s&&!r.join(' ').toLowerCase().includes(s))||(k&&r[0]!=k))return;if(r[0]!=c){c=r[0];h+=`\u003ch2 style=\"margin-top:14px;font-size:20px\">${c}\u003c/h2>`}h+=`\u003cdiv class=\"fi\">\u003cb>${r[1]}\u003c/b>\u003cbr>\u003cspan class=\"f\">${r[2]}\u003c/span>\u003csmall>${r[3]}\u003c/small>${(EXM[r[0]+r[1]]||EXM[r[1]])?`\u003csmall>Example: ${EXM[r[0]+r[1]]||EXM[r[1]]}\u003c/small>`:''}\u003c/div>`});$('fl').innerHTML=h||'\u003cp>No match. Try \u201cohm\u201d, \u201czener\u201d or \u201ctau\u201d.\u003c/p>'}\n$('q').oninput=list;\n/* v2: diagrams, exercises, maker, practice */\nconst S=b=>`\u003csvg viewBox=\"0 0 300 150\" style=\"width:100%;max-width:340px;display:block;margin:6px auto;color:var(--ink)\" role=\"img\" aria-label=\"circuit diagram\">${b}\u003c/svg>`,w=d=>`\u003cpath d=\"${d}\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>`,tx=(x,y,s)=>`\u003ctext x=\"${x}\" y=\"${y}\" font-size=\"13\" text-anchor=\"middl ;return{s:[['Open the load',`V_TH = Vin\u00b7R2/(R1+R2) = ${f(vt,3)} V`,'Voltage between A and B with nothing attached.'],['Kill the sources',`R_TH = R1\u2016R2 = ${f(rt,3)} k\u03a9`,'Voltage source \u2192 wire, then look into A\u2013B.'],['Draw the equivalent','V_TH in series with R_TH, then R_L.','Now it is a one-loop circuit.'],['Load current',`I_L = V_TH/(R_TH+R_L) = ${f(vt,3)}/${f(rt+v.rl,3)} = ${f(I,3)} mA`,'Change R_L and only this step changes.'],['Load voltage and power',`V_L = I_L\u00b7R_L = ${f(I*v.rl,3)} V, P_L = ${f(I*I*v.rl,3)} mW`,'']],a:`V_TH = ${f(vt,3)} V, R_TH = ${f(rt,3)} k\u03a9, I_L = ${f(I,3)} mA`}}},\neq:{n:'Equivalent resistance',a:'\u201cFind R_eq\u201d, \u201ctotal current drawn from the source\u201d',F:[['r1','R1 (k\u03a9)',1],['r2','R2 (k\u03a9)',2],['r3','R3 (k\u03a9)',2],['vs','Source (V)',10]],S:v=>{const rp=v.r2*v.r3/(v.r2+v.r3),rt=v.r1+rp,I=v.vs/rt,vp=I*rp;return{s:[['Find what is in parallel','R2 and R3 share the same two nodes (R1 is in series with them).','Always start with the parallel part.'],['Parallel part',`R2\u2016R3 = R2\u00b7R3/(R2+R3) = ${f(rp,3)} k\u03a9`,'Always smaller than the smallest one.'],['Add the series',`R_eq = R1 + R2\u2016R3 = ${f(rt,3)} k\u03a9`,'Series resistors add.'],['Total current',`I = Vs/R_eq = ${f(v.vs)}/${f(rt,3)} = ${f(I,3)} mA`,'Ohm\u2019s law.'],['Voltage on the parallel part',`V = I\u00b7(R2\u2016R3) = ${f(vp,3)} V`,'Then split into branches.'],['Branch currents',`I2 = ${f(vp/v.r2,3)} mA, I3 = ${f(vp/v.r3,3)} mA`,'Check: I2 + I3 = I.']],a:`R_eq = ${f(rt,3)} k\u03a9, I = ${f(I,3)} mA`}}},\nkcl:{n:'Two sources: KCL + KVL',a:'\u201cFind I1, I2, I3\u201d in a circuit with two batteries sharing a branch',F:[['v1','V1 (V)',10],['r1','R1 (\u03a9)',10],['v2','V2 (V)',20],['r3','R3 (\u03a9)',20],['r2','R2 shared (\u03a9)',40]],S:v=>{const Va=(v.v1/v.r1+v.v2/v.r3)/(1/v.r1+1/v.r2+1/v.r3),i1=(v.v1-Va)/v.r1,i3=(v.v2-Va)/v.r3,i2=Va/v.r2;return{s:[['Choose directions','I1 and I3 flow into node A, I2 flows out through R2 to ground.','Any choice works if you stay consistent. A negative result means the real direction is opposite.'],['KCL at A','I1 + I3 = I2','Currents in = currents out.'],['KVL on each loop','\u2212V1 + I1\u00b7R1 + I2\u00b7R2 = 0 and \u2212V2 + I3\u00b7R3 + I2\u00b7R2 = 0','Each drop is I\u00b7R.'],['Shortcut: voltage at node A',`V_A = (V1/R1 + V2/R3)/(1/R1 + 1/R2 + 1/R3) = ${f(Va,3)} V`,'It packs the equations into one.'],['Currents',`I1 = (V1\u2212V_A)/R1 = ${f(i1,4)} A \u00b7 I3 = (V2\u2212V_A)/R3 = ${f(i3,4)} A \u00b7 I2 = V_A/R2 = ${f(i2,4)} A`,'With \u03a9 and V you get A.'],['Check KCL',`I1 + I3 = ${f(i1+i3,4)} and I2 = ${f(i2,4)} \u2713`,'Always verify.']],a:`I1 = ${f(i1,4)} A, I2 = ${f(i2,4)} A, I3 = ${f(i3,4)} A`}}},\ndio:{n:'Diode operation point',a:'\u201cFind the Q point\u201d, \u201cis the diode ON?\u201d, \u201cdetermine the operation point of the diodes\u201d',F:[['vth','V_TH (V)',5],['rth','R_TH (k\u03a9)',2],['kind','Diode: 0 ideal, 1 silicon 0.7 V, 2 zener',1],['vz','Zener V_Z (V)',5]],S:v=>{const vf=v.kind==1?.7:0,z=v.kind==2,a=(v.vth-vf)/v.rth;let reg='OFF',I=0,Vd=v.vth;if(a>0){reg='ON';I=a;Vd=vf}else if(z&&v.vth\u003c-v.vz){reg='ZENER';I=(v.vth+v.vz)/v.rth;Vd=-v.vz}return{s:[['Reduce the circuit',`Everything around the diode becomes V_TH in series with R_TH (Thevenin). Here V_TH = ${f(v.vth)} V, R_TH = ${f(v.rth)} k\u03a9.`,'The diode is then alone in a single loop.'],['First guess',reg=='ON'?`V_TH \u2212 V_F = ${f(v.vth-vf,2)} V > 0: the source pushes current forward \u2192 guess ON`:reg=='ZENER'?`V_TH = ${f(v.vth)} V is below \u2212V_Z = ${f(-v.vz)} V \u2192 guess ZENER breakdown`:`V_TH \u2212 V_F = ${f(v.vth-vf,2)} V \u2264 0 \u2192 guess OFF`,'Look at what sign the source pushes on the anode.'],['Solve with that guess',reg=='ON'?`I = (V_TH \u2212 V_F)/R_TH = (${f(v.vth)} \u2212 ${f(vf)})/${f(v.rth)} = ${f(I,3)} mA, V_AK = ${f(vf)} V`:reg=='ZENER'?`I = (V_TH + V_Z)/R_TH = ${f(I,3)} mA (negative = reverse), V_AK = \u2212${f(v.vz)} V`:`I = 0, V_AK = V_TH = ${f(Vd)} V`,'ON = a source of V_F. ZENER = a source of \u2212V_Z. OFF = open circuit.'],['Check the guess',reg=='ON'?`I = ${f(I,3)} mA > 0 \u2713`:reg=='ZENER'?'I \u003c 0 and V_AK = \u2212V_Z \u2713':`V_AK = ${f(Vd)} V \u2264 V_F${z?' and \u2265 \u2212V_Z':''} \u2713`,'If it fails, change the guess and redo the previous step.'],['Load line (to draw it)',`Diode as a short: (V_AK = 0, I = ${f(v.vth/v.rth,2)} mA). As an open circuit: (V_AK = ${f(v.vth)} V, I = 0). Q is where it meets the diode curve.`,'Two points define a line.']],a:`Q = (V_AK = ${f(Vd,3)} V, I_D = ${f(I,3)} mA), diode ${reg}`}}},\nled:{n:'LED series resistor',a:'\u201cCalculate R to limit the current to \u2026\u201d, \u201cdesign the LED circuit\u201d',F:[['vs','Supply (V)',5],['vf','LED V_F (V)',2],['i','Desired current (mA)',20]],S:v=>{const R=(v.vs-v.vf)/v.i*1000,Rs=e12(R),Ia=(v.vs-v.vf)/Rs*1000;return{s:[['KVL around the loop',`Vs = V_R + V_F \u2192 V_R = ${f(v.vs)} \u2212 ${f(v.vf)} = ${f(v.vs-v.vf,2)} V`,'The resistor takes whatever the LED does not.'],['Ohm for R',`R = V_R/I = ${f(v.vs-v.vf,2)} V / ${f(v.i)} mA = ${f(R,1)} \u03a9`,'V/mA = k\u03a9.'],['Pick a standard value',`Next E12 value \u2265 ${f(R,1)} \u03a9 \u2192 ${f(Rs,1)} \u03a9, giving I = ${f(Ia,2)} mA`,'Round up so you never exceed the current.'],['Power in R',`P = V_R\u00b7I = ${f((v.vs-v.vf)*v.i,1)} mW`,'The resistor rating must be above this.']],a:`R \u2248 ${f(R,1)} \u03a9 (use ${f(Rs,1)} \u03a9)`}}},\nmos:{n:'MOSFET operation point',a:'\u201cCalculate the operation point of the MOSFET\u201d, \u201cdraw the load line\u201d, \u201cpower dissipated in the transistor\u201d',F:[['g','V_GS (V)',7.5],['vdd','V_DD (V)',12],['rd','R_D (\u03a9)',40]],S:v=>{const s=v.g\u003c2.5?0:(v.g-2.5)*40,[I,vds]=mosQ(v.g,v.vdd,v.rd),reg=!s?'cutoff':v.vdd-s*v.rd/1000>=2?'saturation':'ohmic',st=[['Is it ON at all?',`V_GS = ${f(v.g)} V vs threshold 2.5 V \u2192 ${s?'above: a channel exists':'below: CUTOFF'}`,'Below the threshold the MOSFET is an open switch: I_D = 0, V_DS = V_DD.']];if(s)st.push(['Current if it were a current source',`I_sat = (V_GS \u2212 2.5)\u00b740 = ${f(s)} mA`,'Course curves: each volt above the threshold adds 40 mA.'],['Try saturation',`V_DS = V_DD \u2212 I_sat\u00b7R_D = ${f(v.vdd)} \u2212 ${f(s*v.rd/1000,2)} = ${f(v.vdd-s*v.rd/1000,2)} V`,'Saturation needs V_DS \u2265 2 V (the knee).'],['Verdict: '+reg,reg=='saturation'?'V_DS \u2265 2 V \u2192 saturation, so I_D = I_sat.':`V_DS \u003c 2 V \u2192 ohmic. R_on = 2 V/I_sat = ${f(2/s*1000,2)} \u03a9, I_D = V_DD/(R_D+R_on) = ${f(I,2)} mA`,'Ohmic = closed switch that acts like a small resistor.']);st.push(['Voltage and power',`V_DS = V_DD \u2212 I_D\u00b7R_D = ${f(vds,3)} V, P = V_DS\u00b7I_D = ${f(vds*I,2)} mW`,'A good switch has a small V_DS, so little heat.'],['Load line (to draw it)',`Short: I = V_DD/R_D = ${f(v.vdd/v.rd*1000,1)} mA. Open: V_DS = ${f(v.vdd)} V.`,'Q is where it meets the curve of your V_GS.']);return{s:st,a:`${reg} \u00b7 I_D = ${f(I,2)} mA \u00b7 V_DS = ${f(vds,3)} V`}}},\nbjt:{n:'BJT operation point',a:'\u201cDetermine the operation point of the transistor\u201d, \u201cis it saturated?\u201d, \u201ccalculate V_CE\u201d',F:[['vbb','V_BB (V)',5],['rb','R_B (k\u03a9)',10],['vcc','V_CC (V)',15],['rc','R_C (k\u03a9)',1],['be','\u03b2',100]],S:v=>{const ib=Math.max((v.vbb-.7)/v.rb,0),ics=v.vcc/v.rc,ic=Math.min(v.be*ib,ics),reg=!ib?'cutoff':v.be*ib>=ics?'saturation':'active',vce=v.vcc-ic*v.rc;return{s:[['Base loop',`I_B = (V_BB \u2212 0.7)/R_B = (${f(v.vbb)} \u2212 0.7)/${f(v.rb)} = ${f(ib*1000,1)} \u00b5A`,ib?'If V_BB \u003c 0.7 V nothing flows: cutoff.':'V_BB \u003c 0.7 V: the base junction does not conduct \u2192 CUTOFF.'],['Current if active',`\u03b2\u00b7I_B = ${f(v.be)}\u00b7${f(ib,4)} mA = ${f(v.be*ib,2)} mA`,'In the active region I_C = \u03b2\u00b7I_B.'],['Maximum possible current',`I_C(sat) = V_CC/R_C = ${f(v.vcc)}/${f(v.rc)} = ${f(ics,2)} mA`,'The collector resistor limits it.'],['Compare',`${f(v.be*ib,2)} mA ${v.be*ib>=ics?'\u2265':'\u003c'} ${f(ics,2)} mA \u2192 ${reg.toUpperCase()}`,'Larger: saturated (switch ON). Smaller: active (amplifier).'],['Collector loop',`I_C = ${f(ic,2)} mA, V_CE = V_CC \u2212 I_C\u00b7R_C = ${f(vce,2)} V`,'In saturation V_CE \u2248 0.'],['Power',`P = V_CE\u00b7I_C = ${f(vce*ic,2)} mW`,'']],a:`${reg} \u00b7 I_C = ${f(ic,2)} mA \u00b7 V_CE = ${f(vce,2)} V`}}},\nrc:{n:'RC charging time',a:'\u201cTime constant\u201d, \u201ctime to reach X volts\u201d, \u201cvoltage after t ms\u201d',F:[['r','R (k\u03a9)',10],['c','C (\u00b5F)',10],['v','Source V (V)',10],['vt','Target voltage (V)',6.3]],S:v=>{const tau=v.r*v.c,k=v.vt>0&&v.vt\u003cv.v,t=k?-tau*Math.log(1-v.vt/v.v):0;return{s:[['Time constant',`\u03c4 = R\u00b7C = ${f(v.r)} k\u03a9 \u00b7 ${f(v.c)} \u00b5F = ${f(tau)} ms`,'k\u03a9\u00b7\u00b5F = ms.'],['Charging law','v(t) = V\u00b7(1 \u2212 e^(\u2212t/\u03c4))','Starts at 0 and heads to V exponentially.'],['Time to the target',k?`t = \u2212\u03c4\u00b7ln(1 \u2212 ${f(v.vt)}/${f(v.v)}) = ${f(t,2)} ms`:'The target must be between 0 and V','Rearrange the law for t.'],['Rules of thumb',`1\u03c4 \u2192 63% (${f(.632*v.v,2)} V). 5\u03c4 = ${f(5*tau)} ms \u2192 99%`,'Handy for quick estimates.']],a:k?`t = ${f(t,2)} ms to reach ${f(v.vt)} V`:'Choose a target between 0 and V'}}}};\nconst ASK=[['\u201cFind the operation point / Q point\u201d','Thevenin around the nonlinear part \u2192 guess a region \u2192 solve \u2192 check it is consistent (or draw the load line).'],['\u201cCalculate the current through \u2026\u201d','Reduce to one loop and use Ohm\u2019s law. With several sources or nodes use KCL + KVL or Thevenin.'],['\u201cFind the voltage across \u2026\u201d','Resistors in series with nothing else on the node \u2192 voltage divider. A load or several sources \u2192 Thevenin.'],['\u201cIs it a source or a load?\u201d','Current leaving the + terminal means source. Compute P = V\u00b7I with the passive sign: negative means it delivers.'],['\u201cPower dissipated in the transistor\u201d','Find Q first, then P = V_DS\u00b7I_D (MOSFET) or V_CE\u00b7I_C (BJT).'],['\u201cCalculate R so that \u2026\u201d','Write KVL with the target current, solve for R, then round to a standard value.'],['\u201cDraw the load line\u201d','Two points: device short (I = V/R) and device open (V = source). Mark Q where the line meets the curve.'],['\u201cTime to charge\u201d, \u201cvoltage after t\u201d','\u03c4 = R\u00b7C and v(t) = V(1 \u2212 e^(\u2212t/\u03c4)).'],['\u201cDoes it work as a switch?\u201d','ON = saturation (BJT: \u03b2\u00b7I_B \u2265 I_C(sat)) or ohmic with V_GS well above the threshold (MOSFET).']];\n$('svq').innerHTML=ASK.map(a=>`\u003cdiv class=\"fi\">\u003cb>${a[0]}\u003c/b>\u003csmall>${a[1]}\u003c/small>\u003c/div>`).join('');\nfunction svForm(){const t=SOL[$('svt').value];$('svask').innerHTML='\u003cb>You will see it as:\u003c/b> '+t.a;$('svf').innerHTML=t.F.map(([id,l,d])=>`\u003cdiv class=\"sl\">\u003clabel for=\"sv_${id}\">${l}\u003c/label>\u003cinput type=\"number\" step=\"any\" id=\"sv_${id}\" value=\"${d}\" style=\"padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit\">\u003c/div>`).join('')}\nfunction svSolve(){const t=SOL[$('svt').value],v={};for(const[id]of t.F){const e=$('sv_'+id);if(!e||e.value==='')return;v[id]=+e.value}if(v.r1\u003c=0||v.r2\u003c=0||v.r3\u003c=0||v.rth\u003c=0||v.rb\u003c=0||v.rc\u003c=0||v.rd\u003c=0)return;const o=t.S(v);$('svs').innerHTML=o.s.map((s,i)=>`\u003cdiv class=\"fi\">\u003cb>${i+1}. ${s[0]}\u003c/b>\u003cbr>\u003cspan class=\"f\">${s[1]}\u003c/span>\u003csmall>${s[2]||''}\u003c/small>\u003c/div>`).join('')+`\u003cdiv class=\"res\">\u003cb>Answer:\u003c/b> ${o.a}\u003c/div>`}\n$('svt').innerHTML=Object.entries(SOL).map(([k,t])=>`\u003coption value=\"${k}\">${t.n}\u003c/option>`).join('');$('svt').onchange=()=>{svForm();draw()};svForm();\nfunction draw(){circ();dio();mos();bjt();rc();mkSolve();svSolve();list()}\naddEventListener('resize',draw);show('learn');\n\u003c/script>\u003cscript>(function(){var nv=document.querySelector('nav#nav');if(!nv)return;var btn=document.createElement('button');btn.className='mpsec';nv.parentNode.insertBefore(btn,nv);\nfunction cur(){var a=nv.querySelector('[aria-selected=true],.on,.sel');return a?a.textContent.trim():'Menu'}\nfunction paint(){btn.innerHTML='\u2630 Sections \u00b7 \u003cb>'+cur()+'\u003c/b> \u25be'}\nbtn.onclick=function(){nv.classList.toggle('mpopen')};\nnv.addEventListener('click',function(e){if(e.target.closest('button'))setTimeout(function(){nv.classList.remove('mpopen');paint()},0)});\nnew MutationObserver(paint).observe(nv,{subtree:true,childList:true,attributes:true});paint()})();\u003c/script>\u003c/body>\u003c/html>\n"}</script>

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pk=(r,a)=>a[Math.floor(r()*a.length)];
function shuf(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mcq(r,correct,wrongs){const w=[...new Set(wrongs.filter(x=>x!==correct))].slice(0,3),all=shuf(r,[correct,...w]);return{ch:all,ans:all.indexOf(correct)}}
function sci(v,u){const A=Math.abs(v);let s,p;if(A>=1e6){s=v/1e6;p='M'}else if(A>=1e3){s=v/1e3;p='k'}else if(A>=1||A===0){s=v;p=''}else if(A>=1e-3){s=v*1e3;p='m'}else if(A>=1e-6){s=v*1e6;p='µ'}else if(A>=1e-9){s=v*1e9;p='n'}else{s=v*1e12;p='p'}return (+s.toPrecision(3)).toString()+' '+p+u}
function numMC(r,c,ws,u){const seen=new Set([sci(c,u)]),out=[];[...ws,c*10,c/10,c*2,c/2,c*5].forEach(v=>{if(!isFinite(v)||v<=0)return;const s=sci(v,u);if(!seen.has(s)&&out.length<3){seen.add(s);out.push(s)}});return mcq(r,sci(c,u),out)}

function lrand0(r,d,vs){if(d===0||r()<.12)return{t:'v',n:pk(r,vs)};const x=r();if(x<.2)return{t:'n',a:lrand0(r,d-1,vs)};return{t:pk(r,['a','o','i','i','e']),l:lrand0(r,d-1,vs),r:lrand0(r,d-1,vs)}}
function ldeg(f){if(f.t==='v')return false;if(f.t==='n')return f.a.t==='n'||ldeg(f.a);return lstr(f.l,0)===lstr(f.r,0)||ldeg(f.l)||ldeg(f.r)}
function lrand(r,d,vs){for(let i=0;i<40;i++){const f=lrand0(r,d,vs);if(!ldeg(f))return f}return lrand0(r,d,vs)}
function lev(f,I){switch(f.t){case'v':return I[f.n];case'n':return!lev(f.a,I);case'a':return lev(f.l,I)&&lev(f.r,I);case'o':return lev(f.l,I)||lev(f.r,I);case'i':return!lev(f.l,I)||lev(f.r,I);default:return lev(f.l,I)===lev(f.r,I)}}
function lstr(f,top){if(f.t==='v')return f.n;if(f.t==='n')return '¬'+lstr(f.a,0);const s=lstr(f.l,0)+' '+LOPS[f.t]+' '+lstr(f.r,0);return top?s:'('+s+')'}

function rollRarity(type){const odds=BOX[type].odds,L=M.loot;let r=Math.random(),acc=0,rar='common';
 for(const k of ['common','rare','epic','legendary']){acc+=odds[k];if(r<acc){rar=k;break}}
 if(L.se>=9&&(rar==='common'||rar==='rare'))rar='epic';if(L.sl>=39)rar='legendary';
 L.se=(rar==='epic'||rar==='legendary')?0:L.se+1;L.sl=rar==='legendary'?0:L.sl+1;return rar}
const boxVisible=k=>{const b=BOX[k];return !!b&&(!b.sw||M.sw)&&(!b.season||hwSeason()||unlocked||(M.inv.box[k]||0)>0)};
function boxPool(type){const b=BOX[type];return CATALOG.filter(it=>!it.noDrop&&(b.pack?it.pack===b.pack:(!it.pack&&(!b.cats||b.cats.includes(it.c)))))}
function pickItem(type,rar){let pool=boxPool(type).filter(it=>it.r===rar);
 if(!pool.length)pool=boxPool(type);
 const w=pool.map(it=>M.inv.own[it.id]?1:3),tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot,i=0;while(i<w.length-1&&x>=w[i]){x-=w[i];i++}return pool[i]}
function openBox(type,free){const b=BOX[type];if(!b||!boxVisible(type))return;
 if(free){if((M.inv.box[type]||0)<=0)return;M.inv.box[type]--}else{if(M.coins<b.p){toast('Not enough coins yet. Keep studying! 🪙');return}M.coins-=b.p}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#reelpanel [data-r]');if(!b)return;const a=b.dataset.r,el=$('reelpanel');
 if(a==='size'){M.set.reelBig=M.set.reelBig?0:1;mDirty=true;reelsSync()}else if(a==='min'){M.set.reelMin=M.set.reelMin?0:1;mDirty=true;reelsSync()}
