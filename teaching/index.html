<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--mut:#6b6a64;--card:#fff;--bd:#d6d4cb;--ok:#1a8a3a;--acc:#c62828;color-scheme:light;box-sizing:border-box}
html[data-theme=dark]{--bg:#121211;--fg:#e8e6df;--mut:#928f85;--card:#1b1b19;--bd:#35342f;--ok:#5fd07f;--acc:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;color:var(--acc);background:none;border:0;padding:4px 6px;letter-spacing:.02em}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;order:3;min-width:0;padding:2px;scrollbar-width:thin}.tr{margin-left:auto}
.tabs button{white-space:nowrap}.tabs button.sel{background:var(--acc);color:var(--on,#fff);border-color:var(--acc)}
#home{flex:1;overflow:auto;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px;color:var(--acc)}p.sub{margin:0 0 16px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tile{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile .ic{font-size:26px}.tile b{font-size:15px;color:var(--acc)}.tile small{color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.tile span.d{color:var(--fg)}.tile:hover{border-color:var(--acc)}
.foot{margin-top:24px;color:var(--mut);font-size:12px}
#views{flex:1;min-height:0;display:none;position:relative}
#views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#views iframe.on{display:block}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;cursor:pointer}
html[data-hw]{--bg:#0d0612;--fg:#f2e6d0;--mut:#a089b8;--card:#1a0f24;--bd:#3a2250;--ok:#8bd450;--acc:#ff7a18;color-scheme:dark}
html[data-hw] .top{box-shadow:0 2px 14px #ff7a1840}html[data-hw] .brand::after{content:' 🎃'}
#fog,#web,#hwp{display:none}
html[data-hw] #fog{display:block;position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(ellipse at center,transparent 62%,#0008 100%);animation:flick 5s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.82}50%{opacity:1}55%{opacity:.7}}
html[data-hw] #web{display:block;position:fixed;right:0;transform:scaleX(-1);top:var(--bar,52px);width:80px;height:80px;pointer-events:none;z-index:41;opacity:.35}
html[data-hw] #hwp{display:flex;gap:6px;position:fixed;right:20px;bottom:calc(var(--bot,0px) + 20px);z-index:60;background:#0d0612cc;border:1px solid var(--bd);border-radius:8px;padding:4px}
#hwp button{padding:4px 9px}#hwp select{padding:4px 6px}
html[data-hw].danger #fog{background:radial-gradient(ellipse at center,transparent 38%,#7a0000d0 100%);animation:dng var(--hb,1s) ease-in-out infinite}
@keyframes dng{0%,100%{opacity:.55}18%{opacity:1}34%{opacity:.7}}
@media (prefers-reduced-motion:reduce){html[data-hw].danger #fog{animation:none}}
#toast{position:fixed;left:50%;top:calc(var(--bar,56px) + 12px);transform:translateX(-50%);background:var(--card);border:1px solid var(--acc);color:var(--fg);border-radius:8px;padding:8px 14px;z-index:90;display:none;max-width:90vw}
#scare{position:fixed;inset:0;z-index:9999;display:none;background:#000;overflow:hidden;cursor:pointer}
#scare.on{display:block}#scare .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#wrapf{display:flex;align-items:center;justify-content:center}
#face{width:min(96vw,82vh);height:auto;transform:scale(.02);opacity:0;transform-origin:50% 42%}
#scare.creep #face{transform:scale(.4);opacity:.85;transition:transform 2.7s cubic-bezier(.25,0,.6,1),opacity 1.8s}
#scare.lunge #face{transform:scale(1.4);opacity:1;transition:transform .13s cubic-bezier(.9,0,1,.6),opacity .04s}
#scare.lunge .stage{animation:glitch .55s steps(1) 1}#scare.lunge #wrapf{animation:jit .07s linear .2s infinite alternate}
#jaw{transform-box:fill-box}#scare.lunge #jaw{transform:translateY(52px);transition:transform .11s ease-out}
#scare.lunge #seyes{opacity:0!important;transition:none!important}
#scare.cut #face,#scare.cut #snowc,#scare.cut #seyes{opacity:0!important;transition:none!important}
#scare.fade{opacity:0;transition:opacity .9s}
#snowc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;mix-blend-mode:screen;pointer-events:none}
#scare.lunge #snowc{opacity:.2}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#scare.lunge #flash{animation:fl .14s ease-out 1}
#scare.lunge::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,transparent 30%,#8a000099 100%);pointer-events:none}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
@keyframes glitch{0%{filter:drop-shadow(14px 0 0 #f00) drop-shadow(-14px 0 0 #0ff)}25%{filter:drop-shadow(-10px 4px 0 #f00) drop-shadow(10px -4px 0 #0ff);transform:skewX(8deg)}50%{filter:drop-shadow(6px 0 0 #f00) drop-shadow(-6px 0 0 #0ff);transform:skewX(-6deg)}75%{filter:none;transform:translateX(22px)}100%{filter:drop-shadow(5px 0 0 #f00) drop-shadow(-5px 0 0 #0ff)}}
@keyframes jit{from{transform:translate(-10px,6px) scale(1.01)}to{transform:translate(10px,-6px) scale(1.04)}}
.eyes{position:fixed;display:flex;gap:calc(var(--s,1)*16px);opacity:0;transition:opacity 1.8s;pointer-events:none;z-index:46}.eyes.on{opacity:1}
.eyes i{display:block;width:calc(var(--s,1)*22px);height:calc(var(--s,1)*11px);border-radius:50%;background:radial-gradient(circle at calc(50% + var(--px,0)*1px) calc(50% + var(--py,0)*1px),#000 0 24%,#fff2cc 28%,#ffa050 100%);box-shadow:0 0 calc(var(--s,1)*14px) calc(var(--s,1)*3px) #ff3b1a88;animation:blink 5.5s infinite}
.eyes i:nth-child(2){animation-delay:.05s}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.05)}}
#seyes{z-index:9999}
#peek{position:fixed;display:none;width:150px;height:200px;z-index:44;pointer-events:none;transition:transform 3s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 0 14px #000)}
.gtxt{position:fixed;z-index:45;color:#a01212;font:italic 15px ui-monospace,Menlo,Consolas,monospace;opacity:0;pointer-events:none;text-shadow:0 0 6px #000;animation:gt 4.2s ease-in-out forwards}
@keyframes gt{0%{opacity:0}30%,60%{opacity:.55}100%{opacity:0}}
html.dim #fog{background:#000!important;animation:none!important}
@media (prefers-reduced-motion:reduce){#scare .stage,#scare #wrapf,#face,#jaw{animation:none!important;transition:opacity .3s!important}html[data-hw] #fog{animation:none}.eyes i{animation:none}}

#cam,#scan,#trk{display:none}

#cam{position:fixed;inset:0;z-index:10000;pointer-events:none;color:#f4f4f4;font:700 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-shadow:1px 0 #f008,-1px 0 #0ff8,0 0 4px #000}

#scan::after{content:'';position:absolute;inset:-100px;opacity:.1;mix-blend-mode:overlay;animation:grain .5s steps(5) infinite;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-40px,25px)}40%{transform:translate(30px,-50px)}60%{transform:translate(-20px,-30px)}80%{transform:translate(50px,40px)}100%{transform:translate(0,0)}}

ext y='26' font-size='26'>\ud83d\udc1f\u003c/text>\u003c/svg>\") 4 4,auto!important}html[data-cur=pizza],html[data-cur=pizza] *{cursor:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32'>\u003ctext y='26' font-size='26'>\ud83c\udf55\u003c/text>\u003c/svg>\") 4 4,auto!important}html[data-cur=ghost],html[data-cur=ghost] *{cursor:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32'>\u003ctext y='26' font-size='26'>\ud83d\udc7b\u003c/text>\u003c/svg>\") 4 4,auto!important}html[data-cur=spider],html[data-cur=spider] *{cursor:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32'>\u003ctext y='26' font-size='26'>\ud83d\udd77\ufe0f\u003c/text>\u003c/svg>\") 4 4,auto!important}html[data-cur=bat],html[data-cur=bat] *{cursor:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32'>\u003ctext y='26' font-size='26'>\ud83e\udd87\u003c/text>\u003c/svg>\") 4 4,auto!important}html[data-cur=ankh],html[data-cur=ankh] *{cursor:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32'>\u003ctext y='26' font-size='26'>\u2625\u003c/text>\u003c/svg>\") 4 4,auto!important}html[data-card=sharp] .card,html[data-card=sharp] .tile,html[data-card=sharp] details.card{border-radius:0!important;border-width:2px!important;}html[data-card=soft] .card,html[data-card=soft] .tile,html[data-card=soft] details.card{border:0!important;box-shadow:0 6px 24px #0003!important;border-radius:16px!important;}html[data-card=sketch] .card,html[data-card=sketch] .tile,html[data-card=sketch] details.card{border:2px dashed var(--bd,#888)!important;}html[data-card=glass] .card,html[data-card=glass] .tile,html[data-card=glass] details.card{background:color-mix(in srgb,var(--card) 55%,transparent)!important;backdrop-filter:blur(8px)!important;border-color:#fff4!important;}html[data-card=comic] .card,html[data-card=comic] .tile,html[data-card=comic] details.card{box-shadow:5px 5px 0 var(--fg,#000)!important;border:2px solid var(--fg,#000)!important;border-radius:6px!important;}html[data-card=ghost] .card,html[data-card=ghost] .tile,html[data-card=ghost] details.card{background:color-mix(in srgb,var(--card) 70%,transparent)!important;border:1px solid #fff6!important;box-shadow:0 0 18px #ffffff55,0 0 40px #ffffff22!important;}html[data-card=neon] .card,html[data-card=neon] .tile,html[data-card=neon] details.card{border:1px solid var(--acc,var(--blue,var(--ac)))!important;box-shadow:0 0 10px color-mix(in srgb,var(--acc,var(--blue,var(--ac))) 55%,transparent)!important;}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003ch1>\u258cMIPS64 pipeline simulator\u003c/h1>\n\u003cp class=\"sub\">Predict the diagram yourself, then compare it with the computed one. Turn features on and off in the menu.\u003c/p>\n\n\n\u003cdiv class=\"card lsn\" id=\"learnCard\">\n  \u003cdetails open>\n  \u003csummary>\ud83c\udf93 Learn mode \u2014 one idea at a time, with before/after diagrams\u003c/summary>\n  \u003cdiv class=\"pal tabs\" id=\"lsnTabs\" style=\"margin-top:12px\">\u003c/div>\n  \u003cdiv id=\"lsnBody\">\u003c/div>\n  \u003c/details>\n\u003c/div>\n\u003cdiv class=\"card bz\" id=\"blitzCard\">\n  \u003cdetails open>\n  \u003csummary>\ud83c\udfae Pipeline Blitz \u2014 10 rounds or endless, 3 lives\u003c/summary>\n  \u003cdiv id=\"blitz\" style=\"margin-top:12px\">\u003c/div>\n  \u003c/details>\n\u003c/div>\n\u003cdiv class=\"card\">\n  \u003clabel for=\"pre\">Examples (slides and Unit 2 exercises)\u003c/label>\n  \u003cselect id=\"pre\" style=\"margin-bottom:10px;width:100%\">\u003c/select>\n  \u003clabel for=\"code\">Instructions (one per line, labels like \u003cb>loop:\u003c/b>)\u003c/label>\n  \u003ctextarea id=\"code\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"mut\" style=\"margin-top:6px;font-size:12px\">Branches follow real register values (set them in the menu; all registers start at 0, \u003cb>ld\u003c/b> loads 0). Force an outcome by ending a branch line with \u003cb>; taken\u003c/b> or \u003cb>; nt\u003c/b>. Loops are executed up to the instruction limit.\u003c/div>\n\u003c/div>\n\n\u003cdetails class=\"card\" open>\n  \u003csummary>\u2699 Settings menu \u2014 choose which features are active\u003c/summary>\n  \u003cdiv class=\"menu\">\n    \u003cdiv class=\"grp\">\u003ch3>Data hazards\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"fwd\"> Forwarding paths\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"ren\"> Register renaming (no WAW stalls)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Structural\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"mem\"> Single memory port (IF vs load/store MEM)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Control hazards\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"early\"> Early branches (resolved in ID)\u003c/label>\n      \u003cselect id=\"pred\">\u003coption value=\"stall\">No prediction (stall fetch)\u003c/option>\u003coption value=\"nt\">Always not taken\u003c/option>\u003coption value=\"bht\">2-bit predictor (BHT/BTB, starts at 01)\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Execution units\u003c/h3>\n      \u003clabel>Int mul/div latency \u003cinput type=\"number\" id=\"mulLat\" min=\"1\" max=\"30\" value=\"1\"> cycles\u003c/label>\n      \u003clabel>Floating point (.d/.s) latency \u003cinput type=\"number\" id=\"fpLat\" min=\"1\" max=\"30\" value=\"1\"> cycles\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"pipe\"> Pipelined multi-cycle units (EX1\u2026EXn)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Ordering\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"ooo\"> Out-of-order execution\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"oooRet\"> Out-of-order retirement (off = precise exceptions)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Display and program\u003c/h3>\n      \u003clabel>Clock cycles shown \u003cinput type=\"number\" id=\"cyc\" min=\"1\" max=\"500\" value=\"12\">\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"auto\" checked> Extend automatically to fit the solution\u003c/label>\n      \u003clabel>Max instructions executed \u003cinput type=\"number\" id=\"maxI\" min=\"1\" max=\"500\" value=\"60\">\u003c/label>\n      \u003clabel>Initial registers \u003cinput type=\"text\" id=\"init\" placeholder=\"r1=8, r2=2\" style=\"flex:1;min-width:120px\">\u003c/label>\n    \u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\n\u003cdetails class=\"card\" id=\"gymCard\">\u003csummary>\ud83c\udfaf Branch predictor gym: train the 2-bit counter\u003c/summary>\u003cdiv class=\"gym\" id=\"gym\" style=\"margin-top:10px\">\u003c/div>\u003c/details>\n\u003cdiv class=\"card\" id=\"pracCard\">\n  \u003ch2>\ud83c\udfb2 Practice test \u2014 a new random exercise\u003c/h2>\n  \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n    \u003cselect id=\"lvl\">\u003coptgroup label=\"Starter\">\u003coption value=\"1\">1 \u00b7 Warm-up: no hazards, just draw the pipeline\u003c/option>\u003coption value=\"2\">2 \u00b7 Easy: RAW stalls, no forwarding\u003c/option>\u003coption value=\"3\">3 \u00b7 Easy: forwarding on or off\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Medium\">\u003coption value=\"4\">4 \u00b7 Load-use hazard\u003c/option>\u003coption value=\"5\">5 \u00b7 Single memory port\u003c/option>\u003coption value=\"6\">6 \u00b7 Branches: work out taken or not\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Advanced\">\u003coption value=\"7\">7 \u00b7 Early branch and a small loop (trace it)\u003c/option>\u003coption value=\"8\">8 \u00b7 Slow multiply units\u003c/option>\u003coption value=\"9\">9 \u00b7 Loop with multiply and a predictor (2-bit counters)\u003c/option>\u003c/optgroup>\u003coptgroup label=\"Expert\">\u003coption value=\"10\">10 \u00b7 Out-of-order, renaming, everything\u003c/option>\u003c/optgroup>\u003c/select>\n    \u003clabel style=\"margin:0\">Seed \u003cinput type=\"number\" id=\"seed\" placeholder=\"random\" style=\"width:110px\">\u003c/label>\n    \u003cbutton class=\"pri\" id=\"newEx\">New exercise\u003c/button>\n    \u003cbutton id=\"retryEx\">Retry this one\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"exInfo\" class=\"mut\" style=\"margin-top:10px\">\u003c/div>\n  \u003cdiv id=\"score\" style=\"margin-top:6px;font-weight:700\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card bws\" id=\"bwsCard\" hidden>\u003ch2>Step 1 \u00b7 Run the branches\u003c/h2>\u003cdiv id=\"bws\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\n  \u003ch2>Your prediction\u003c/h2>\n  \u003cdiv class=\"pal\" id=\"pal\">\u003c/div>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"grid\" id=\"mine\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"pri\" id=\"chk\">Check my answer\u003c/button>\n    \u003cbutton id=\"hint\">Hint\u003c/button>\n    \u003cbutton id=\"rev\">Show solution\u003c/button>\n    \u003cbutton id=\"clr\">Clear grid\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"res\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\" id=\"solCard\" hidden>\n  \u003ch2>Expected solution\u003c/h2>\n  \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"grid ro\" id=\"sol\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"why\" class=\"mut\" style=\"margin-top:10px\">\u003c/div>\n\u003c/div>\n\n\u003cdetails class=\"card\">\n  \u003csummary>\ud83e\uddee Performance calculator (exercises 10\u201313, 15.1\u201315.3)\u003c/summary>\n  \u003cdiv style=\"margin-top:10px\">\n    \u003clabel for=\"stg\">Stage times in ns, comma separated (sequential CPU executes them one after another)\u003c/label>\n    \u003cinput type=\"text\" id=\"stg\" value=\"50, 50, 60, 50, 40\" style=\"width:100%\">\n    \u003cdiv class=\"btns\">\u003cbutton id=\"calc\">Calculate\u003c/button>\u003c/div>\n    \u003cdiv class=\"out\" id=\"calcOut\">\u003c/div>\n    \u003clabel for=\"fq\" style=\"margin-top:14px\">Frequency \u2194 cycle time and MIPS\u003c/label>\n    \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n      \u003cinput type=\"number\" id=\"fq\" value=\"2\" step=\"any\" style=\"width:100px\"> GHz,\n      \u003cinput type=\"number\" id=\"cpi\" value=\"1\" step=\"any\" style=\"width:80px\"> CPI\n      \u003cbutton id=\"calc2\">Calculate\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"out\" id=\"calc2Out\">\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003c/div>\n\n\u003cscript>\nconst ST=['IF','ID','EX','MEM','WB'];\nconst $=id=>document.getElementById(id);\nconst LOAD=/^(ld|lw|lwu|lh|lhu|lb|lbu|l\\.d|l\\.s)$/,STORE=/^(sd|sw|sh|sb|s\\.d|s\\.s)$/,BR=/^(beq|bne|beqz|bnez|bgez|bltz|blez|bgtz)$/;\nconst MUL=/^(dmul|dmulu|mul|mult|dmult|ddiv|ddivu|div|divu)$/;\nconst isReg=t=>/^(r\\d+|\\$\\w+|f\\d+)$/i.test(t||'')&&!/^(r0|\\$0|\\$zero)$/i.test(t);\n\nconst D={fwd:0,mem:0,early:0,pred:'stall',mulLat:1,fpLat:1,pipe:0,ooo:0,oooRet:0,ren:0,cyc:12,auto:1,maxI:60,init:''};\nconst P1=\"ori r1, r0, 2 ; r1 = 2\\nstartf:\\nbeqz r1, endf ; jump to endf if r1 zero\\ndaddi r1, r1, -1 ; r1 = r1-1\\nj startf ; jump to startf\\nendf:\\nld r5, 100(r3)\";\nconst P20=\"ori r1, r0, 8 ; r1 = 8\\ndaddi r2, r0, 2 ; r2 = 2\\nloop:\\nbeqz r1, dest\\ndmul r3, r2, r7\\nxor r6, r4, r5\\ndadd r6, r7, r6\\ndsub r1, r1, r2\\nj loop\\ndest:\\ndmul r5, r4, r2\";\nconst PRE=[\n ['Slide 46 \u00b7 Basic pipeline',\"dadd r4, r3, r2\\ndsub r12, r13, r14\\nxor r5, r5, r5\\nand r13, r14, r15\",{}],\n ['Slide 56 \u00b7 Structural hazard',\"ld r11, 120(r0)\\ndadd r2, r3, r6\\nxor r15, r15, r15\\ndsub r4, r1, r9\\nand r12, r13, r10\",{mem:1}],\n ['Slide 57 \u00b7 RAW, no forwarding',\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\\nxor r18, r18, r18\",{}],\n ['Slide 74 \u00b7 RAW, forwarding',\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\",{fwd:1}],\n ['Slide 77 \u00b7 Load-use, forwarding',\"ld r2, 120(r3)\\ndsub r1, r10, r2\\nor r12, r11, r14\",{fwd:1}],\n ['Slide 80 \u00b7 Two forwarding paths',\"dadd r1, r3, r5\\nld r2, 120(r0)\\ndsub r4, r1, r2\",{fwd:1}],\n ['Slide 60 \u00b7 Branch not taken',\"beq r0, r3, loop ; nt\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",{}],\n ['Slide 60 \u00b7 Branch taken',\"beq r0, r3, loop ; taken\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",{}],\n ['Slide 61 \u00b7 Jump',\"j loop\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",{}],\n ['Slide 90 \u00b7 Early branch + RAW',\"daddi r1, r1, 4\\nbeq r1, r6, target ; nt\\nor r3, r4, r9\\ntarget: and r12, r2, r5\",{fwd:1,early:1}],\n ['Slide 93 \u00b7 Always-not-taken miss',\"beq r4, r5, target ; taken\\ndadd r9, r0, r7\\ndsub r11, r10, r5\\nor r12, r5, r14\\ntarget: dadd r7, r1, r3\",{pred:'nt'}],\n ['Slide 65 \u00b7 Pipelined mul unit',\"xor r1, r4, r5\\ndmul r1, r2, r3\\ndmul r8, r9, r10\\ndadd r9, r11, r12\",{mulLat:5,pipe:1,ooo:1,oooRet:1,ren:1}],\n ['Ex 15.4 \u00b7 Loop with dmul (mul = 3 cycles)',\"daddi r1, r0, 200\\nloop:\\nld r2, 0(r2)\\ndmul r2, r3, r1\\ndaddi r1, r1, -1\\ndmul r2, r3, r2\\nbnez r1, loop\\ndadd r9, r2, r3\",{mulLat:3,ooo:1,oooRet:1,cyc:15,auto:0,init:'r1=0, r2=0'}],\n ['Ex 16.1/16.2 \u00b7 Mul unit, OoO execution and retirement',\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndmul r4, r6, r8\\nld r3, 100(r2)\",{mulLat:4,ooo:1,oooRet:1}],\n ['Ex 16.3 \u00b7 Same, precise exceptions',\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndmul r4, r6, r8\\nld r3, 100(r2)\",{mulLat:4,ooo:1}],\n ['Ex 16.4 \u00b7 Pipelined mul unit + precise exceptions',\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndmul r4, r6, r8\\nld r3, 100(r2)\",{mulLat:4,ooo:1,pipe:1}],\n ['Ex 17.2 \u00b7 Original order (stall)',\"dadd r9, r5, r7\\nxor r4, r6, r7\\nori r9, r6, 1\\nld r3, 100(r4)\",{}],\n ['Ex 17.4 \u00b7 Reordered by the compiler',\"xor r4, r6, r7\\ndadd r9, r5, r7\\nori r9, r6, 1\\nld r3, 100(r4)\",{}],\n ['Ex 18 \u00b7 Forwarding EX\u2192EX and MEM\u2192EX',\"dadd r9, r5, r7\\nxor r2, r6, r7\\nld r4, 100(r9)\\ndsub r2, r4, r9\",{fwd:1}],\n ['Ex 18 \u00b7 Same without forwarding',\"dadd r9, r5, r7\\nxor r2, r6, r7\\nld r4, 100(r9)\\ndsub r2, r4, r9\",{}],\n ['Ex 19.1 \u00b7 Early branches + forwarding',P1,{fwd:1,early:1,cyc:20}],\n ['Ex 19.3 \u00b7 Always not taken',P1,{fwd:1,early:1,pred:'nt',cyc:20}],\n ['Ex 19.4 \u00b7 2-bit predictor',P1,{fwd:1,early:1,pred:'bht',cyc:20}],\n ['Ex 20.3 \u00b7 No forwarding, mul 3 cycles pipelined, OoO',P20,{early:1,pred:'nt',mulLat:3,pipe:1,ooo:1,oooRet:1,cyc:25}],\n ['Ex 20.5 \u00b7 Same with all forwarding paths',P20,{fwd:1,early:1,pred:'nt',mulLat:3,pipe:1,ooo:1,oooRet:1,cyc:13,auto:0}],\n ['Ex 21.1 \u00b7 ddiv (4 cycles), forwarding, imprecise',\"daddi r3, r0, 5\\nddiv r2, r4, r5\\nxor r3, r6, r8\\ndsub r2, r9, r10\",{fwd:1,mulLat:4,ooo:1,oooRet:1}],\n ['Ex 21.2 \u00b7 Same with register renaming',\"daddi r3, r0, 5\\nddiv r2, r4, r5\\nxor r3, r6, r8\\ndsub r2, r9, r10\",{fwd:1,mulLat:4,ooo:1,oooRet:1,ren:1}]\n];\n\n//SIM-START\nfunction parse(txt){\n  const out=[],lab={};\n  txt.split('\\n').forEach(raw=>{\n    const s=raw.trim();if(!s)return;\n    const cm=s.match(/;\\s*(taken|t|nt)\\s*$/i);\n    const force=cm?(/^nt$/i.test(cm[1])?0:1):null;\n    let b=s.replace(/;.*$/,'').trim();\n    const m=b.match(/^(\\w+):\\s*(.*)$/);\n    if(m){lab[m[1].toLowerCase()]=out.length;b=m[2];if(!b)return}\n    const a0=b.toLowerCase().split(/[,\\s()]+/).filter(Boolean),op=a0[0],a=a0.slice(1);\n    let dest=null,src=[],load=false,kind='alu',target=null,unit='gen';\n    if(op==='j'){kind='j';target=a[0]}\n    else if(BR.test(op)){kind='br';src=a.slice(0,/z$/.test(op)?1:2);target=a[a.length-1]}\n    else if(LOAD.test(op)){dest=a[0];src=[a[2]];load=true;kind='ld'}\n    else if(STORE.test(op)){src=[a[0],a[2]];kind='st'}\n    else if(/i$|iu$/.test(op)){dest=a[0];src=[a[1]]}\n    else{dest=a[0];src=[a[1],a[2]]}\n    if(kind==='alu'){if(MUL.test(op))unit='mul';else if(/\\.(d|s)$/.test(op))unit='fp'}\n    out.push({line:b.replace(/\\s+/g,' '),op,a,kind,target,force,unit,load,dest:isReg(dest)?dest:null,src:src.filter(isReg)});\n  });\n  return{out,lab};\n}\nfunction runVal(x,R){\n  const v=t=>/^(r0|\\$0|\\$zero)$/.test(t)?0:(R[t]||0),n=t=>Number(t)||0,a=x.a,o=x.op;let r=null;\n  if(/^(dadd|add|daddu|addu)$/.test(o))r=v(a[1])+v(a[2]);\n  else if(/^(dsub|sub|dsubu|subu)$/.test(o))r=v(a[1])-v(a[2]);\n  else if(o==='and')r=v(a[1])&v(a[2]);else if(o==='or')r=v(a[1])|v(a[2]);else if(o==='xor')r=v(a[1])^v(a[2]);\n  else if(/^(dmul|dmulu|mul|mult|dmult)$/.test(o))r=v(a[1])*v(a[2]);\n  else if(MUL.test(o))r=v(a[2])?Math.trunc(v(a[1])/v(a[2])):0;\n  else if(/^(daddi|addi|daddiu|addiu)$/.test(o))r=v(a[1])+n(a[2]);\n  else if(o==='ori')r=v(a[1])|n(a[2]);else if(o==='andi')r=v(a[1])&n(a[2]);else if(o==='xori')r=v(a[1])^n(a[2]);\n  else if(x.load)r=0;else if(x.dest)r=0;\n  if(r!==null&&x.dest)R[x.dest]=r;\n  if(x.kind!=='br')return null;\n  if(o==='beq')return v(a[0])===v(a[1]);if(o==='bne')return v(a[0])!==v(a[1]);\n  if(o==='beqz')return v(a[0])===0;if(o==='bnez')return v(a[0])!==0;\n  if(o==='bgez')return v(a[0])>=0;if(o==='bltz')return v(a[0])\u003c0;\n  if(o==='blez')return v(a[0])\u003c=0;return v(a[0])>0;\n}\nfunction simulate(P,o){\n  const L=P.out,R=Object.assign({},o.init),rows=[],notes=[],ex=[],cnt={};const brs=[];let seq=0;const jb={};\n  const busy={gen:new Set(),mul:new Set(),fp:new Set()},wait={gen:new Set(),mul:new Set(),fp:new Set()},memC=new Set(),wbC=new Set(),port=new Set(),bht={},ren={};\n  let pc=0,prev=null,redir=0,tk=false,maxC=0,steps=0,rq=32,lastWb=0;\n  const put=(row,c,l,s)=>{row.cells[c]={l,s:!!s};if(c>maxC)maxC=c};\n  const wrong=(start,idS,Rr,exB)=>{\n    let ifS=idS,idPrev=exB-1;\n    for(let j=0;start+j\u003cL.length;j++){\n      if(ifS>Rr)break;\n      const ids=Math.max(ifS+1,idPrev+1);\n      const w={x:L[start+j],cells:{},fl:true,n:0};rows.push(w);\n      for(let c=ifS;c\u003cids&&c\u003c=Rr;c++)put(w,c,'IF',c>ifS);\n      ['ID','EX','MEM','WB'].forEach((l,k)=>{if(ids+k\u003c=Rr)put(w,ids+k,l)});\n      idPrev=ids;ifS=ids;\n    }\n  };\n  while(pc\u003cL.length&&steps\u003co.maxI){\n    steps++;\n    const x=L[pc];cnt[pc]=(cnt[pc]||0)+1;\n    const row={x,cells:{},fl:false,n:cnt[pc]};rows.push(row);\n    const ifS=prev?prev.idS:1;\n    let f=Math.max(ifS,redir);const showFrom=tk?f:ifS;tk=false;redir=0;\n    const f0=f;if(o.mem)while(port.has(f))f++;\n    const why={id:[],ex:[]};\n    if(f>f0)why.id.push('single memory port busy during fetch');\n    const idS=Math.max(f+1,prev?prev.exFirst:0);\n    const early=x.kind==='br'&&o.early;\n    const Lat=x.unit==='mul'?o.mulLat:x.unit==='fp'?o.fpLat:1,pipe=Lat>1&&o.pipe;seq+=4+Lat;\n    let idNeed=0,exNeed=0,dep=null;\n    x.src.forEach(reg=>{for(let k=ex.length-1;k>=0;k--){const p=ex[k];if(p.x.dest===reg){\n      const av=p.x.load?p.mem+1:p.execEnd+1;\n      if(early)idNeed=Math.max(idNeed,o.fwd?av:p.wb);\n      else if(o.fwd)exNeed=Math.max(exNeed,av);\n      else idNeed=Math.max(idNeed,p.wb);\n      dep=dep||{reg,p:p.x.line};break}}});\n    const b1=Math.max(idS+1,idNeed+1);\n    if(idNeed+1>idS+1)why.id.push(`RAW on ${dep.reg} (from \u201c${dep.p}\u201d)`);\n    const b2=Math.max(b1,prev?(o.ooo?prev.exFirst+1:prev.execEndAll+1):0);\n    if(b2>b1)why.id.push('previous instruction still in EX');\n    let e=b2,s;\n    for(;;){s=Math.max(e,exNeed);let bz=false;\n      if(pipe){bz=busy[x.unit].has(s);for(let c=e;c\u003cs;c++)if(wait[x.unit].has(c))bz=true}else for(let c=e;c\u003cs+Lat;c++)if(busy[x.unit].has(c))bz=true;\n      if(!bz)break;e++}\n    if(e>b2)why.id.push(`${x.unit==='gen'?'EX':x.unit==='mul'?'mul/div':'FP'} unit busy`);\n    const exFirst=e,execEnd=s+Lat-1;\n    if(s>exFirst)why.ex.push(`waiting for ${dep? Instructions executed \u003cb>${n}\u003c/b>\u003c/div>\u003cdiv>CPI \u003cb>${n?(T/n).toFixed(2):'\u2013'}\u003c/b>\u003c/div>\u003cdiv>CPI without start-up, (T\u22124)/n \u003cb>${n?((T-4)/n).toFixed(2):'\u2013'}\u003c/b>\u003c/div>\u003cdiv>Ideal (no hazards) \u003cb>${n?n+4:0}\u003c/b>\u003c/div>\u003cdiv>Non-pipelined (sequential) \u003cb>${sim.seq}\u003c/b>\u003c/div>`;\n  $('why').innerHTML=sim.notes.length?`\u003cul>${sim.notes.map(t=>`\u003cli>${esc(t)}\u003c/li>`).join('')}\u003c/ul>`:'No hazards: each instruction enters the pipeline one cycle after the previous one.';\n}\n\nfunction setOpts(p){\n  const v=Object.assign({},D,p);\n  ['fwd','mem','early','pipe','ooo','oooRet','ren','auto'].forEach(k=>$(k).checked=!!v[k]);\n  $('pred').value=v.pred;$('mulLat').value=v.mulLat;$('fpLat').value=v.fpLat;$('cyc').value=v.cyc;$('maxI').value=v.maxI;$('init').value=v.init;\n}\n$('pre').innerHTML='\u003coption value=\"\">\u2014 custom \u2014\u003c/option>'+PRE.map((p,k)=>`\u003coption value=\"${k}\">${p[0]}\u003c/option>`).join('');\n$('pre').onchange=()=>{\n  const p=PRE[$('pre').value];if(!p)return;\n  $('code').value=p[1];setOpts(p[2]);grid=[];$('solCard').hidden=true;build();\n};\nlet t;\n$('code').addEventListener('input',()=>{$('pre').value='';clearTimeout(t);t=setTimeout(build,250)});\n['fwd','mem','early','pred','ren','pipe','ooo','oooRet','mulLat','fpLat','cyc','auto','maxI','init'].forEach(k=>$(k).addEventListener('change',()=>{if(!['cyc','auto'].includes(k))$('pre').value='';build()}));\n\n$('calc').onclick=()=>{\n  const s=$('stg').value.split(/[,\\s]+/).map(Number).filter(x=>x>0);if(!s.length)return;\n  const sum=s.reduce((a,b)=>a+b,0),mx=Math.max(...s),n=s.length,f=x=>+x.toFixed(2);\n  $('calcOut').textContent=`Sequential CPU\\n  Time per instruction: ${f(sum)} ns\\n  Throughput: ${f(1000/sum)} MIPS (${f(1e9/sum)} instr/s)\\n\\nPipelined CPU (${n} stages, cycle = slowest stage)\\n  Clock cycle: ${f(mx)} ns \u2192 frequency ${f(1000/mx)} MHz (${f(1/mx)} GHz)\\n  Time per instruction (latency): ${f(n*mx)} ns\\n  Ideal throughput: ${f(1000/mx)} MIPS\\n  Ideal throughput speedup: ${f(sum/mx)}`;\n};\n$('calc2').onclick=()=>{\n  const g=+$('fq').value,c=+$('cpi').value||1;if(!g)return;\n  $('calc2Out').textContent=`Cycle time: ${+(1/g).toFixed(4)} ns\\nMIPS: ${+(g*1000/c).toFixed(2)}  (at CPI ${c})\\nInstructions per cycle (IPC): ${+(1/c).toFixed(3)}`;\n};\n\n/* ===== helpers shared by Learn and Practice ===== */\nfunction parseInit(s){const o={};(s||'').split(/[,\\s]+/).forEach(t=>{const m=t.match(/^(\\$?\\w+)=(-?\\w+)$/);if(m)o[m[1].toLowerCase()]=Number(m[2])||0});return o}\nfunction mkO(p){const v=Object.assign({},D,p);return{fwd:!!v.fwd,mem:!!v.mem,early:!!v.early,pred:v.pred,ren:!!v.ren,pipe:!!v.pipe,ooo:!!v.ooo,oooRet:!!v.oooRet,mulLat:v.mulLat,fpLat:v.fpLat,maxI:v.maxI,init:parseInit(v.init)}}\nconst MEAN={IF:'is being fetched from memory',ID:'is decoded and its source registers are read',EX:'is being calculated in the ALU / execution unit',MEM:'goes through the memory stage (only ld/sd really use it)',WB:'writes its result into the register'};\nfunction diagHTML(sm,upto,N){\n  let h=`\u003cdiv class=\"grid ro\" style=\"grid-template-columns:max-content repeat(${N},46px)\">\u003cdiv>\u003c/div>`+Array.from({length:N},(_,c)=>`\u003cdiv class=\"hd\">${c+1}\u003c/div>`).join('');\n  sm.rows.forEach(r=>{h+=lbl(r);for(let c=1;c\u003c=N;c++){const e=c\u003c=upto?r.cells[c]:null;h+=`\u003cdiv class=\"c ${e?base(e.l)+' st':'empty'} ${e&&e.s?'stall':''}\">${e?e.l:'\u00b7'}\u003c/div>`}});\n  return h+'\u003c/div>';\n}\nfunction narrate(sm,k){\n  const out=[];\n  sm.rows.forEach(r=>{const e=r.cells[k];if(!e)return;\n    out.push(`\u003cli>\u003ccode>${esc(r.x.line)}\u003c/code> ${e.s?`is \u003cb>stuck\u003c/b> (stall) \u2014 repeats \u003cb>${e.l}\u003c/b> because it has to wait`:`\u003cb>${e.l}\u003c/b>: ${MEAN[base(e.l)]}`}${r.fl?' \u2014 \u003ci>wrong path, will be thrown away\u003c/i>':''}\u003c/li>`)});\n  return out.length?`\u003cul>${out.join('')}\u003c/ul>`:'\u003ci>Nothing is happening in this cycle.\u003c/i>';\n}\n\n/* ===== Learn mode ===== */\nconst MULC=\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndadd r4, r7, r8\";\nconst LS=[\n{t:'1 \u00b7 Pipeline',c:\"dadd r4, r3, r2\\ndsub r12, r13, r14\\nxor r5, r5, r5\\nand r13, r14, r15\",A:{o:{},l:'Ideal pipeline, no problems'},\n b:`\u003cp>A CPU doesn\u2019t finish one instruction before starting the next. Think of a \u003cb>laundry room\u003c/b>: while load 1 is in the dryer, load 2 is already in the washer.\u003c/p>\n \u003cp>Every instruction goes through 5 steps: \u003cb>IF\u003c/b> fetch it from memory \u2192 \u003cb>ID\u003c/b> decode it and read registers \u2192 \u003cb>EX\u003c/b> calculate \u2192 \u003cb>MEM\u003c/b> read/write memory \u2192 \u003cb>WB\u003c/b> write the result back.\u003c/p>\n \u003cdiv class=\"tip\">A new instruction starts every cycle. 4 instructions take only \u003cb>4 + 4 = 8 cycles\u003c/b>, not 4 \u00d7 5 = 20.\u003c/div>`},\n{t:'2 \u00b7 Data hazard (RAW)',c:\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\\nxor r18, r18, r18\",A:{o:{},l:'No forwarding: dsub must wait'},\n b:`\u003cp>\u003ccode>dsub\u003c/code> needs \u003cb>r2\u003c/b>, but \u003ccode>dadd\u003c/code> only \u003ci>writes\u003c/i> r2 in its last step (WB). If dsub read it earlier it would get the \u003cb>old\u003c/b> value.\u003c/p>\n \u003cp>So dsub waits in ID (the hatched cells are \u003cb>stalls\u003c/b>) until the cycle where dadd is in WB. A register can be written in the first half of a cycle and read in the second half of the same cycle, so dsub\u2019s last ID cycle lines up with dadd\u2019s WB.\u003c/p>\n \u003cdiv class=\"tip\">This is a \u003cb>RAW\u003c/b> (Read After Write) hazard. Everything behind dsub is held back too (their IF repeats).\u003c/div>`},\n{t:'3 \u00b7 Forwarding',c:\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\",A:{o:{},l:'Without forwarding'},B:{o:{fwd:1},l:'With forwarding'},\n b:`\u003cp>Shortcut: \u003ccode>dadd\u003c/code> already \u003ci>knows\u003c/i> r2 at the end of its EX step. \u003cb>Forwarding paths\u003c/b> are extra wires that send that result straight into the next instruction\u2019s EX input, without waiting for WB.\u003c/p>\n \u003cdiv class=\"tip\">Result: the stall disappears completely. Turn forwarding on/off in the menu to see it any time.\u003c/div>`},\n{t:'4 \u00b7 Load-use',c:\"ld r2, 120(r3)\\ndsub r1, r10, r2\\nor r12, r11, r14\",A:{o:{fwd:1},l:'dsub right after the ld'},B:{c:\"ld r2, 120(r3)\\nor r12, r11, r14\\ndsub r1, r10, r2\",o:{fwd:1},l:'Unrelated instruction in between'},\n b:`\u003cp>A \u003ccode>ld\u003c/code> only gets its value at the end of \u003cb>MEM\u003c/b>, one step later than an ALU result. So even with forwarding, the next instruction must wait \u003cb>1 cycle\u003c/b>.\u003c/p>\n \u003cdiv class=\"tip\">Fix: put an unrelated instruction in between (compilers do this). The stall slot gets used for useful work.\u003c/div>`},\n{t:'5 \u00b7 Structural',c:\"ld r11, 120(r0)\\ndadd r2, r3, r6\\nxor r15, r15, r15\\ndsub r4, r1, r9\\nand r12, r13, r10\",A:{o:{},l:'Two memory ports'},B:{o:{mem:1},l:'Single memory port'},\n b:`\u003cp>IF (fetching instructions) and MEM (loading/storing data) both use memory. With only \u003cb>one memory port\u003c/b>, a \u003ccode>ld\u003c/code> in MEM blocks the fetch that wants to happen in the same cycle.\u003c/p>\n \u003cdiv class=\"tip\">That fetch is delayed 1 cycle. This is a \u003cb>structural hazard\u003c/b>: two instructions need the same hardware at the same time.\u003c/div>`},\n{t:'6 \u00b7 Branches',c:\"beq r0, r3, loop ; nt\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",A:{o:{},l:'Branch NOT taken'},B:{c:\"beq r0, r3, loop ; taken\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",o:{},l:'Branch taken'},\n b:`\u003cp>A branch decides where the program goes next, but the CPU only learns the answer late (in \u003cb>MEM\u003c/b>). Meanwhile it doesn\u2019t know what to fetch.\u003c/p>\n \u003cp>Simplest policy: \u003cb>stop fetching\u003c/b> until the branch is resolved. Both diagrams lose the same cycles.\u003c/p>\n \u003cdiv class=\"tip\">When taken, the instruction that was waiting (struck through) is thrown away and the \u003cb>target\u003c/b> is fetched instead.\u003c/div>`},\n{t:'7 \u00b7 Early branch',c:\"beq r0, r3, loop ; taken\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",A:{o:{},l:'Resolved in MEM'},B:{o:{early:1},l:'Resolved in ID (early)'},\n b:`\u003cp>Add comparator hardware in the \u003cb>ID\u003c/b> stage so the branch is decided 2 cycles earlier. Less waiting, same result.\u003c/p>\n \u003cdiv class=\"tip\">The cost: if the branch depends on a register written just before, that value must be ready in ID (needs forwarding into ID, or a stall).\u003c/div>`},\n{t:'8 \u00b7 Predict NT',c:\"beq r4, r5, target ; nt\\ndadd r9, r0, r7\\ndsub r11, r10, r5\\nor r12, r5, r14\\ntarget: dadd r7, r1, r3\",A:{o:{pred:'nt'},l:'Guess right (not taken)'},B:{c:\"beq r4, r5, target ; taken\\ndadd r9, r0, r7\\ndsub r11, r10, r5\\nor r12, r5, r14\\ntarget: dadd r7, r1, r3\",o:{pred:'nt'},l:'Guess wrong (taken)'},\n b:`\u003cp>Instead of waiting, \u003cb>guess\u003c/b>: assume the branch is \u003cb>not taken\u003c/b> and keep fetching the next instructions.\u003c/p>\n \u003cp>Right guess \u2192 \u003cb>zero\u003c/b> lost cycles. Wrong guess \u2192 those instructions (struck-through rows) are \u003cb>flushed\u003c/b> and you restart from the target.\u003c/p>\n \u003cdiv class=\"tip\">Careful: both diagrams happen to end in the same cycle, but B only executed 2 useful instructions (the branch and the target) while A executed 5. The wrong guess made B waste fetch slots.\u003c/div>`},\n{t:'9 \u00b7 2-bit predictor',c:\"daddi r1, r0, 5\\nloop:\\ndaddi r1, r1, -1\\nbnez r1, loop\\ndadd r9, r2, r3\",A:{o:{pred:'nt',early:1,fwd:1},l:'Always not taken'},B:{o:{pred:'bht',early:1,fwd:1},l:'2-bit predictor'},\n b:`\u003cp>Guess smarter by \u003cb>remembering\u003c/b>. Each branch gets a 2-bit counter: \u003ccode>00\u003c/code> strongly NT, \u003ccode>01\u003c/code> weakly NT, \u003ccode>10\u003c/code> weakly T, \u003ccode>11\u003c/code> strongly T.\u003c/p>\n \u003cp>Taken \u2192 counter +1, not taken \u2192 \u22121 (stops at 00 and 11). Counter \u2265 \u003ccode>10\u003c/code> \u2192 predict taken. The first time a branch is seen it is predicted not taken (counter starts at \u003ccode>01\u003c/code>).\u003c/p>\n \u003cdiv class=\"tip\">Loops are taken many times, so the predictor learns quickly. The final BHT state is listed under the solution notes.\u003c/div>`},\n{t:'10 \u00b7 Slow units',c:MULC,A:{o:{mulLat:4},l:'In-order: everything waits'},B:{o:{mulLat:4,ooo:1,oooRet:1},l:'Out-of-order execution'},\n b:`\u003cp>Multiplication/division is slow, so its EX takes several cycles (here 4). With \u003cb>in-order execution\u003c/b> every later instruction waits behind it.\u003c/p>\n \u003cp>With \u003cb>out-of-order execution\u003c/b>, instructions that don\u2019t depend on the slow one (like \u003ccode>xor\u003c/code>) go ahead and finish first.\u003c/p>`},\n{t:'11 \u00b7 Precise exceptions',c:MULC,A:{o:{mulLat:4,ooo:1,oooRet:1},l:'Out-of-order retirement'},B:{o:{mulLat:4,ooo:1},l:'In-order retirement (precise)'},\n b:`\u003cp>Finishing early is fast, but if \u003ccode>dmul\u003c/code> later causes an error (exception), younger instructions have \u003cb>already changed registers\u003c/b> \u2014 the program state is a mess.\u003c/p>\n \u003cp>\u003cb>Precise exceptions\u003c/b> force instructions to retire (WB) in program order, so the fast \u003ccode>xor\u003c/code> must wait for the slow \u003ccode>dmul\u003c/code>.\u003c/p>`},\n{t:'12 \u00b7 Pipelined mul',c:\"dmul r2, r5, r6\\ndmul r4, r6, r8\\ndmul r7, r9, r10\",A:{o:{mulLat:4,ooo:1,oooRet:1},l:'Mul unit not pipelined'},B:{o:{mulLat:4,ooo:1,oooRet:1,pipe:1},l:'Pipelined mul unit (EX1\u2026EX4)'},\n b:`\u003cp>A normal mul unit is \u003cb>busy\u003c/b> for all 4 cycles, so the 2nd \u003ccode>dmul\u003c/code> waits in ID (structural hazard).\u003c/p>\n \u003cp>A \u003cb>pipelined\u003c/b> unit is itself an assembly line (EX1, EX2, EX3, EX4): it accepts a new multiplication \u003cb>every cycle\u003c/b>.\u003c/p>`},\n{t:'13 \u00b7 WAW & renaming',c:\"daddi r3, r0, 5\\nddiv r2, r4, r5\\nxor r3, r6, r8\\ndsub r2, r9, r10\",A:{o:{fwd:1,mulLat:4,ooo:1,oooRet:1},l:'No renaming'},B:{o:{fwd:1,mulLat:4,ooo:1,oooRet:1,ren:1},l:'With register renaming'},\n b:`\u003cp>\u003cb>WAW\u003c/b> (Write After Write): two instructions write the same register (\u003ccode>ddiv r2\u003c/code> and \u003ccode>dsub r2\u003c/code>). If the slow one finished last it would overwrite the newer value, so the later write must wait.\u003c/p>\n \u003cp>\u003cb>Register renaming\u003c/b> gives every write its own hidden physical register (rr32, rr33\u2026), so they never collide and nothing waits.\u003c/p>`}\n];\n\nLS.unshift({t:'0 \u00b7 Read a diagram',c:LS[0].c,A:{o:{},l:'An ideal pipeline: nothing goes wrong'},\n b:`\u003cp>Every picture in this lab is a \u003cb>timetable\u003c/b>. Each \u003cb>row\u003c/b> is one instruction. Each \u003cb>column\u003c/b> is one tick of the CPU clock (a \u003cb>cycle\u003c/b>). The box where a row and a column meet says what that instruction is doing during that tick.\u003c/p>\n \u003cp>Read one row from left to right and you see the five steps in order: IF, ID, EX, MEM, WB. Look down a column and you see everything the CPU does at the same moment.\u003c/p>\n \u003cdiv class=\"tip\">The total number of cycles is the number of the last column that still has a box.\u003c/div>`});\nconst LX=[\n{say:'A pipeline diagram is a timetable: rows are instructions, columns are clock ticks.',ana:'Like a train timetable: each row is a train, each column is an hour.',w:[['Clock cycle','One tick of the CPU clock. The column numbers 1, 2, 3\u2026'],['IF \u00b7 ID \u00b7 EX \u00b7 MEM \u00b7 WB','The five steps every instruction goes through, always in this order.'],['Stall','A hatched box. The instruction has to wait, so it repeats its step.'],['Flushed','A struck-through instruction was fetched by mistake and is thrown away.']],look:'Follow one row from left to right: IF, ID, EX, MEM, WB. Then notice each row starts one column later than the one above.',mistake:'Reading time as going downwards. Time goes to the right, across the columns.',q:['What do the columns of a pipeline diagram represent?','Clock cycles (time)','Instructions','Registers']},\n{say:'While one instruction executes, the next is being decoded and the one after is being fetched.',ana:'A laundry room: while load 1 is in the dryer, load 2 is already in the washer.',w:[['Pipeline','Doing different steps of different instructions at the same time.'],['Throughput','How many instructions finish per cycle. Ideal: one per cycle.']],look:'After the first few cycles, one instruction finishes in every cycle.',mistake:'Thinking each instruction becomes faster. One instruction still needs 5 cycles. The gain is that they overlap.',q:['In an ideal 5-stage pipeline, how many cycles do 4 instructions need in total?','8','20','5']},\n{say:'An instruction needs a value that an earlier instruction has not written yet, so it has to wait.',ana:'You cannot ice a cake before someone has finished baking it.',w:[['RAW (Read After Write)','The later instruction reads a register that the earlier one will write.'],['Stall','Waiting a cycle (hatched). The instruction repeats its step.']],look:'Find the hatched boxes: they sit in the instruction that needs the value.',mistake:'Thinking the instructions behind can skip ahead. In an in-order pipeline they wait too.',q:['Why does dsub have to wait in this program?','It reads r2 before dadd has written it','It needs the memory port','Its opcode is slow']},\n{say:'Send the result straight to where it is needed, instead of waiting for it to be written to the register.',ana:'Hand the pizza directly to the next person, instead of putting it in the fridge first.',w:[['Forwarding (bypass)','Extra wires that carry an ALU result straight into the next instruction\u2019s EX step.']],look:'Compare A and B: the hatched boxes in A disappear in B.',mistake:'Believing forwarding fixes everything. It cannot help right after a load (next lesson).',q:['What does forwarding do?','Sends a result to a later instruction before it is written back','Skips the WB stage','Makes the clock faster']},\n{say:'A loaded value only exists after MEM, so even with forwarding the very next instruction waits one cycle.',ana:'Food from the oven (memory) is ready one step later than food from the counter.',w:[['Load-use hazard','An instruction uses a register that the load right before it is still fetching.']],look:'Exactly one hatched box in A. Then see B: an unrelated instruction fills the gap.',mistake:'Expecting forwarding to remove this stall. It cannot: the data does not exist yet.',q:['With forwarding on, how many stall cycles does an instruction need if it uses the result of the load right before it?','1','0','3']},\n{say:'Two instructions want the same piece of hardware in the same cycle, so one of them waits.',ana:'Two people trying to walk through one door at the same time.',w:[['Structural hazard','Not enough hardware. Here: one memory port shared by fetching and by loads/stores.'],['Memory port','A door into memory. One port means one access per cycle.']],look:'Find the cycle where a load/store is in MEM while another instruction wants to be in IF.',mistake:'Blaming data dependencies. These instructions can be completely independent.',q:['With one memory port, which stage collides with the MEM stage of a load or store?','IF','WB','ID']},\n{say:'The CPU does not know which instruction comes next until the branch is decided, so it stops fetching and waits.',ana:'A fork in the road: you wait at the sign until you know which way to go.',w:[['Branch','An instruction that may change which instruction runs next.'],['Taken / not taken','Taken: jump to the target. Not taken: carry on in order.'],['Control hazard','Not knowing what to fetch next.']],look:'Fetching pauses right after the branch in both diagrams.',mistake:'Thinking not-taken is free. Without prediction, fetching waits either way.',q:['With no prediction, when does the CPU start fetching again after a branch?','Once the branch is resolved','Immediately','Only after the branch\u2019s WB']},\n{say:'Decide the branch earlier (in ID) so the wait gets shorter.',ana:'Reading the road sign from further away.',w:[['Early branch','The branch outcome is computed in ID instead of MEM.']],look:'B loses fewer cycles than A.',mistake:'Forgetting the cost: the register the branch needs must already be ready in ID.',q:['In which stage is an early branch resolved?','ID','WB','IF']},\n{say:'Guess \u201cnot taken\u201d and keep fetching. A right guess costs nothing, a wrong guess throws instructions away.',ana:'Keep driving straight. If the road turns, you go back and lose a few seconds.',w:[['Branch prediction','Guessing the outcome of a branch so fetching can continue.'],['Flush','Throwing away instructions that were fetched on a wrong guess.']],look:'In B the struck-through rows are the wrong guesses.',mistake:'Believing a wrong guess is free. Those fetch slots were wasted.',q:['You predict \u201cnot taken\u201d but the branch is taken. What happens to the instructions fetched after it?','They are flushed','They run normally','They run twice']},\n{say:'Remember what the branch did before, using a small counter, so loops get predicted well.',ana:'A habit: if someone always turns left at this corner, bet on left.',w:[['2-bit counter','00, 01, 10, 11. The higher, the more likely \u201ctaken\u201d.'],['BHT','Branch history table: where the counters live.']],look:'A keeps flushing. B learns the loop after a couple of iterations.',mistake:'Thinking it is right the first time. It starts at 01 (weakly not taken).',q:['A 2-bit predictor starts at 01. What does it predict the first time?','Not taken','Taken','It stalls']},\n{say:'A multiply takes several cycles. In-order machines wait behind it, out-of-order machines let independent instructions overtake.',ana:'A slow cashier: customers with a small purchase move to another till.',w:[['Latency','How many cycles one operation takes.'],['Out-of-order','Independent instructions may execute before an earlier slow one.']],look:'In B, xor finishes before dmul.',mistake:'Thinking out-of-order breaks dependencies. Dependent instructions still wait.',q:['What may out-of-order execution let an independent instruction do?','Run before an earlier slow instruction finishes','Ignore its operands','Skip its WB']},\n{say:'To keep the machine state clean if an instruction fails, instructions must finish (WB) in program order.',ana:'Check out of the hotel in room order, so the bill never gets mixed up.',w:[['Exception','An error, for example dividing by zero.'],['Precise exception','The state looks as if all earlier instructions finished and no later one started.'],['Retire','Finish: write the result (WB).']],look:'xor is ready early, but it waits for dmul.',mistake:'Thinking the waiting is useless. It protects correctness.',q:['Why must instructions retire in order for precise exceptions?','So later instructions never change state before an earlier one fails','To save clock cycles','Because WB is slow']},\n{say:'A pipelined multiplier is an assembly line: a new multiply can start every cycle.',ana:'A car wash with several stations instead of a single bay.',w:[['Pipelined unit','Split into stages EX1\u2026EXn, so it accepts a new operation each cycle.'],['Busy unit','A non-pipelined unit cannot accept a new operation until the current one is done.']],look:'In A the second dmul waits in ID. In B it does not.',mistake:'Thinking each multiply gets faster. Each still tak , say what the predictor \u003cb>guesses\u003c/b>, then update the \u003cb>counter\u003c/b>. Learning pays Study Points (up to 30 a day).\u003c/p>\u003cdiv class=\"btns\">\u003cbutton class=\"pri\" data-g=\"s1\">Start \u00b7 counters begin at 01\u003c/button>\u003cbutton data-g=\"s2\">Start \u00b7 random counter, more patterns\u003c/button>\u003c/div>`;return}\n  const g=gy,done=g.i>=g.seq.length;\n  let h=`\u003cdiv class=\"mut\">Pattern: ${GYMN[g.k]} \u00b7 counter starts at \u003cb>${CTRN[g.start]}\u003c/b>\u003c/div>\u003cdiv class=\"chips2\">${g.seq.map((x,k)=>`\u003cspan class=\"${k===g.i&&!done?'cur':''} ${g.hist[k]===undefined?'':g.hist[k]?'hit':'miss'}\">${k\u003cg.i||(k===g.i&&g.step==='upd')?x:'?'}\u003c/span>`).join('')}\u003c/div>`;\n  if(done){h+=`\u003cdiv class=\"tip\">\u003cb>Finished!\u003c/b> Your 2-bit predictor missed \u003cb>${g.miss}\u003c/b> of ${g.seq.length}. For comparison: always-not-taken would miss \u003cb>${g.nt}\u003c/b>, and a 1-bit predictor (remember only the last outcome, starts not taken) \u003cb>${g.one}\u003c/b>.\u003c/div>\u003cdiv class=\"btns\">\u003cbutton class=\"pri\" data-g=\"again\">Another sequence\u003c/button>\u003c/div>`}\n  else if(g.step==='pred')h+=`\u003cdiv>Counter now: \u003cspan class=\"ctr\">${CTRN[g.ctr]}\u003c/span> \u003cspan class=\"mut\">(${CTRD[g.ctr]})\u003c/span>\u003c/div>\u003cdiv>\u003cb>What does the predictor guess?\u003c/b>\u003c/div>\u003cdiv class=\"btns\">\u003cbutton data-g=\"pT\">Taken\u003c/button>\u003cbutton data-g=\"pN\">Not taken\u003c/button>\u003c/div>`;\n  else h+=`\u003cdiv>The branch was \u003cb>${g.seq[g.i]==='T'?'taken':'not taken'}\u003c/b>. Counter was \u003cb>${CTRN[g.ctr]}\u003c/b>. \u003cb>What is the new counter?\u003c/b>\u003c/div>\u003cdiv class=\"btns\">${CTRN.map((c,k)=>`\u003cbutton data-g=\"c${k}\">${c}\u003c/button>`).join('')}\u003c/div>`;\n  if(g.msg)h+=`\u003cdiv class=\"fb\">${g.msg}\u003c/div>`;el.innerHTML=h}\n$('gym').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;const a=b.dataset.g;\n  if(a==='s1')gymStart(1);else if(a==='s2')gymStart(2);else if(a==='again')gymStart(gy.level);\n  else if(gy&&a[0]==='p'){const pred=a[1]==='T';if(pred===(gy.ctr>=2)){gy.step='upd';gy.pred=pred;gy.msg=(gy.seq[gy.i]==='T')===pred?'\u2713 Right guess.':'\u2717 That guess will be wrong.'}else{gy.errs++;gy.msg=`Counter ${CTRN[gy.ctr]}: 10 or 11 means predict taken, 00 or 01 means predict not taken.`}gymPaint()}\n  else if(gy&&a[0]==='c'){const t=gy.seq[gy.i]==='T',nc=t?Math.min(3,gy.ctr+1):Math.max(0,gy.ctr-1);\n    if(+a[1]===nc){const hit=gy.pred===t;if(!hit)gy.miss++;gy.hist[gy.i]=hit;gy.ctr=nc;gy.i++;gy.step='pred';gy.msg='';\n      if(gy.i>=gy.seq.length){try{parent!==window&&parent.MPT&&parent.MPT.learn({id:'mips-gym-'+gy.seed,sp:Math.max(2,6-gy.errs),cap:'gym',why:'Branch predictor gym'})}catch(x){}}}\n    else{gy.errs++;gy.msg=t?'Taken: the counter goes up by 1 (it stops at 11).':'Not taken: the counter goes down by 1 (it stops at 00).'}gymPaint()}});\ngymPaint();\n$('chk').addEventListener('click',()=>{});\nconst _preCh=$('pre').onchange;$('pre').onchange=()=>{practice.active=false;unlockGrid();_preCh&&_preCh()};\n\n$('chk').addEventListener('click',()=>{\n  if(!$('res').textContent.startsWith('\u2713'))return;\n  try{if(parent===window||!parent.MPT)return;\n    if(practice.scored&&practice.active&&!practice.rewarded){practice.rewarded=1;parent.MPT.learn({id:'mips-prac-'+practice.level+'-'+practice.seed,sp:Math.round((5+2*practice.level+(practice.bws?6:0))*(practice.hints?.5:1)),cap:'practice',why:'Practice test, level '+practice.level+(practice.hints?' (hint used)':'')})}\n    else if(!practice.active){let h=0,s=$('code').value+JSON.stringify(getO());for(let i=0;i\u003cs.length;i++)h=(h*31+s.charCodeAt(i))|0;parent.MPT.learn({id:'mips-ex-'+h,sp:6,why:'Exercise solved'})}\n  }catch(e){}\n});\n$('hint').addEventListener('click',()=>{practice.hints=(practice.hints||0)+1});\nrenderLesson();showInfo();\n\n$('pre').value='0';$('pre').onchange();$('calc').onclick();$('calc2').onclick();\n\u003c/script>\n\u003cscript>\n(function(){\nconst KEY='mp64blitz',TOT=10,TIME=30,B=$('blitz');\nconst emit=o=>{try{parent!==window&&parent.postMessage(Object.assign({mp:'blitz'},o),'*')}catch(e){}};\nconst ldS=()=>{try{return JSON.parse(parent.KV.getItem(KEY)||'{}')}catch(e){return{}}};\nconst svS=o=>{try{parent.KV.setItem(KEY,JSON.stringify(o))}catch(e){}};\nconst dayNum=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};\nlet G=null,timer=null;\nfunction shuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction numChoices(c,extra,rnd){\n  const cand=[c-2,c-1,c+1,c+2,c+3,...extra].filter((v,i,a)=>v>=0&&v!==c&&a.indexOf(v)===i);\n  const pick=shuffle(cand,rnd).slice(0,3);\n  for(let k=1;pick.length\u003c3;k++){const v=c+3+k;if(!pick.includes(v))pick.push(v)}\n  const all=shuffle([c,...pick],rnd);return{ch:all.map(String),ans:all.indexOf(c)};\n}\nfunction mkRound(i,seedBase,rnd){\n  const level=G.endless?(i\u003c2?2:i\u003c4?3:i\u003c6?4:i\u003c8?5:i\u003c10?6:i\u003c13?7:i\u003c16?8:i\u003c20?9:10):([2,2,3,3,4,4,5,5,6,7][i]||7);\n  for(let tries=0;tries\u003c30;tries++){\n    const seed=seedBase*37+i*101+tries*7;\n    const g=gen(level,seed),o=mkO(g.opts),Pp=parse(g.code),sm=simulate(Pp,o);\n    if(!sm.rows.length||sm.n\u003c2||sm.maxC>26)continue;\n    const types=shuffle(['cyc','stall','stage','fwd','worst'],rnd);\n    for(const ty of types){\n      const q=build(ty,g,o,Pp,sm,rnd);if(q){q.level=level;q.code=g.code;q.opts=g.opts;return q}\n    }\n  }\n  for(let tries=0;tries\u003c40;tries++){\n    const seed=seedBase*37+i*101+tries*11+5,g=gen(4,seed),o=mkO(g.opts),Pp=parse(g.code),sm=simulate(Pp,o);\n    if(!sm.rows.length||sm.n\u003c2||sm.maxC>26)continue;\n    const q=build('cyc',g,o,Pp,sm,rnd);if(q){q.level=4;q.code=g.code;q.opts=g.opts;return q}\n  }\n  return null;\n}\nfunction build(ty,g,o,Pp,sm,rnd){\n  const T=sm.total,n=sm.n,ideal=n+4;\n  if(ty==='cyc'){const c=numChoices(T,[ideal,5*n],rnd);\n    return{q:'How many clock cycles until the last instruction finishes (WB)?',...c,sm,why:`Total = ${T} cycles for ${n} executed instructions (ideal without hazards would be ${ideal}).`}}\n  if(ty==='stall'){const s=T-ideal;if(s\u003c1)return null;const c=numChoices(s,[],rnd);\n    return{q:`This run executes ${n} instructions, so the ideal pipeline needs ${n}+4 = ${ideal} cycles. How many extra cycles does it actually lose?`,...c,sm,why:`${T} \u2212 ${ideal} = ${s} extra cycle(s).`}}\n  if(ty==='stage'){\n    const rows=sm.rows.filter(r=>!r.fl&&Object.keys(r.cells).length>3);if(!rows.length)return null;\n    const r=rows[Math.floor(rnd()*rows.length)],cs=Object.keys(r.cells).map(Number),cy=cs[Math.floor(rnd()*cs.length)];\n    const st=base(r.cells[cy].l),opts=['IF','ID','EX','MEM','WB'];\n    const three=shuffle(opts.filter(x=>x!==st),rnd).slice(0,3),all=shuffle([st,...three],rnd);\n    return{q:`In clock cycle ${cy}, which stage is \u201c${r.x.line}\u201d${r.n>1?` (execution #${r.n})`:''} in? (Stalls repeat the stage they wait in.)`,ch:all,ans:all.indexOf(st),sm,why:`Look at the row of \u201c${r.x.line}\u201d, column ${cy}: ${st}.`}}\n  if(ty==='fwd'){\n    const o2=Object.assign({},g.opts,{fwd:g.opts.fwd?0:1}),s2=simulate(Pp,mkO(o2));\n    if(s2.total===T||s2.maxC>26)return null;const c=numChoices(s2.total,[T],rnd);\n    return{q:`With these settings the program takes ${T} cycles. How many cycles would it take with forwarding turned ${g.opts.fwd?'OFF':'ON'} (everything else equal)?`,...c,sm:s2,why:`With forwarding ${g.opts.fwd?'off':'on'} the total is ${s2.total} cycles (diagram below shows that case).`}}\n  if(ty==='worst'){\n    const rows=sm.rows.filter(r=>!r.fl);if(rows.length\u003c3||rows.length>8)return null;\n    const cnt=rows.map(r=>Object.values(r.cells).filter(c=>c.s).length),mx=Math.max(...cnt);\n    if(mx\u003c1||cnt.filter(v=>v===mx).length>1)return null;\n    const lab=r=>r.x.line+(r.n>1?` #${r.n}`:''),names=rows.map(lab);\n    if(new Set(names).size!==names.length)return null;\n    const ci=cnt.indexOf(mx),others=shuffle(names.filter((_,k)=>k!==ci),rnd).slice(0,3);\n    if(others.length\u003c2)return null;\n    const all=shuffle([names[ci],...others],rnd);\n    return{q:'Which instruction spends the most stall cycles (hatched cells)?',ch:all,ans:all.indexOf(names[ci]),sm,why:`\u201c${names[ci]}\u201d stalls ${mx} cycle(s), more than any other.`}}\n  return null;\n}\nfunction menu(){\n  emit({type:'menu'});clearInterval(timer);const s=ldS(),d=dayNum(),done=s.daily&&s.daily.day===d;\n  B.innerHTML=`\u003cp class=\"mut\" style=\"margin:0 0 10px\">Each round gives you a random program and settings; the answer comes straight from the simulator. Correct answers build a streak multiplier, and quick answers earn bonus points. Wrong answer or timeout = lose a life. \u003cb>Endless\u003c/b> never stops: the clock shrinks every round and the programs get harder, so chase the high score (every 5 correct in a row wins back a life).\u003c/p>\n  \u003cdiv class=\"hud\" style=\"margin-bottom:10px\">\u003cdiv>Best score \u003cb>${s.best||0}\u003c/b>\u003c/div>\u003cdiv>Endless best \u003cb>${s.bestE||0}\u003c/b> (${s.bestER||0} rounds)\u003c/div>\u003cdiv>Daily streak \u003cb>${(s.ds&&s.ds.l>=d-1)?s.ds.n:0}\u003c/b>\u003c/div>\u003cdiv>Today \u003cb>${done?s.daily.score:'not played'}\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"btns\" style=\"margin-top:0\">\u003cbutton class=\"pri\" id=\"bzDaily\">\ud83d\udcc5 Daily blitz${done?' (replay)':''}\u003c/button>\u003cbutton id=\"bzRnd\">\ud83c\udfb2 Random blitz\u003c/button>\u003cbutton id=\"bzEnd\">\u267e\ufe0f Endless\u003c/button>\u003clabel style=\"margin:0;display:flex;gap:6px;align-items:center\">\u003cinput type=\"checkbox\" id=\"bzTimer\" ${s.noTimer?'':'checked'}> ${TIME}s timer\u003c/label>\u003c/div>\u003cdiv id=\"bzBoard\">\u003c/div>`;\n  boardUI($('bzBoard'),lbView);\n  $('bzDaily').onclick=()=>start('daily');$('bzRnd').onclick=()=>start('random');$('bzEnd').onclick=()=>start('endless');\n  $('bzTimer').onchange=e=>{const x=ldS();x.noTimer=!e.target.checked;svS(x)};\n}\nfunction start(mode){\n  const seedBase=mode==='daily'?dayNum():Math.floor(Math.random()*90000)+10000,rnd=rng(seedBase),endless=mode==='endless';\n  G={mode,endless,seedBase,rnd,i:0,lives:3,score:0,streak:0,best:0,ok:0,timer:endless||!ldS().noTimer,q:null,done:false};nextQ();\n}\nfunction nextQ(){\n  if((!G.endless&&G.i>=TOT)||G.lives\u003c=0)return finish();\n  const q=mkRound(G.i,G.seedBase,G.rnd);if(!q){G.i=G.endless?G.i:TOT;return finish()}\n  G.secs=G.endless?Math.max(6,Math.round(TIME*Math.pow(0.93,G.i))):TIME;G.ticks=G.secs*4;G.q=q;G.done=false;G.left=G.ticks;G.t50=G.t25=G.t10=0;paint();emit({type:'q',lives:G.lives,endless:G.endless,round:G.i+1,streak:G.streak});\n  clearInterval(timer);if(G.timer)timer=setInterval(()=>{\n    if(!B.offsetParent||G.done)return;G.left--;const b=$('bzBar');if(b)b.style.width=(G.left/G.ticks*100)+'%';const fr=G.left/G.ticks;if(fr\u003c.5&&!G.t50){G.t50=1;emit({type:'t',frac:fr})}if(fr\u003c.25&&!G.t25){G.t25=1;emit({type:'t',frac:fr})}if(fr\u003c.1&&!G.t10){G.t10=1;emit({type:'t',frac:fr})}\n    if(G.left\u003c=0)answer(-1)},250);\n}\nfunction paint(){\n  const q=G.q;\n  B.innerHTML=`\u003cdiv class=\"top2\">\u003cdiv class=\"hud\">\u003cdiv>Round \u003cb>${G.i+1}${G.endless?'':'/'+TOT}\u003c/b>\u003c/div>${G.endless?`\u003cdiv>Time \u003cb>${G.secs}s\u003c/b>\u003c/div>`:''}\u003cdiv>Lives \u003cb>${'\u2665'.repeat(G.lives)+'\u2661'.repeat(3-G.lives)}\u003c/b>\u003c/div>\u003cdiv>Score \u003cb>${G.score}\u003c/b>\u003c/div>\u003cdiv>Streak \u003cb>${G.streak}\u003c/b>\u003c/div>\u003c/div>\u003cbutton id=\"bzQuit\">Quit\u003c/button>\u003c/div>\n  ${G.timer?'\u003cdiv class=\"bar\">\u003ci id=\"bzBar\">\u003c/i>\u003c/div>':''}\n  \u003cdiv class=\"mut\" style=\"font-size:12px\">${esc(descOpts(q.opts))}\u003c/div>\n  \u003cpre>${esc(q.code)}\u003c/pre>\u003cdiv class=\"q\">${esc(q.q)}\u003c/div>\n  \u003cdiv class=\"opts\">${q.ch.map((c,k)=>`\u003cbutton data-k=\"${k}\">${esc(c)}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"bzFb\">\u003c/div>`;\n  B.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.k));$('bzQuit').onclick=menu;\n}\nfunction answer(k){\n  if(G.done)return;G.done=true;G.bonusLife=false;clearInterval(timer);const q=G.q,ok=k===q.ans;\n  let gain=0;\n  if(ok){G.streak++;G.ok++;gain=10+Math.min(G.streak-1,5)*2+(G.timer?Math.ceil(G.left/G.ticks*10):5)+(G.endless?Math.floor(G.i/5)*2:0);G.score+=gain;if(G.endless&&G.streak%5===0&&G.lives\u003c3){G.lives++;gain+=0;G.bonusLife=true}}\n  else{G.streak=0;G.lives--}\n  emit({type:ok?'correct':(k\u003c0?'timeout':'wrong'),lives:G.lives,streak:G.streak});\n  try{if(parent!==window&&parent.MPT)parent.MPT.answer({ok,lab:'MIPS64',game:'Pipeline Blitz',q:q.q,code:q.code,ctx:descOpts(q.opts),choices:q.ch,ans:q.ans,picked:k,why:q.why})}catch(e){}\n  B.querySelectorAll('.opts button').forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add('ok');else if(i===k)b.classList.add('no')});\n  const N=q.sm.maxC;\n  $('bzFb').innerHTML=`\u003cp class=\"${ok?'good':'badc'}\" style=\"font-weight:700\">${ok?`\u2713 Correct! +${gain}${G.bonusLife?' \u00b7 +1 life \u2665':''}`:(k\u003c0?'\u23f0 Time is up.':'\u2717 Not quite.')}\u003c/p>\u003cdiv class=\"tip\">${esc(q.why)}\u003c/div>\n  \u003cdetails>\u003csummary>Show the pipeline diagram\u003c/summary>\u003cdiv class=\"scroll\" style=\"margin-top:8px\">${diagHTML(q.sm,N,N)}\u003c/div>\u003c/details>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"pri\" id=\"bzNext\">${((!G.endless&&G.i+1>=TOT)||G.lives\u003c=0)?'See results':'Next \u25b6'}\u003c/button>\u003c/div>`;\n  $('bzNext').onclick=()=>{G.i++;nextQ()};\n  const hud=B.querySelector('.hud');if(hud)hud.innerHTML=`\u003cdiv>Round \u003cb>${G.i+1}${G.endless?'':'/'+TOT}\u003c/b>\u003c/div>${G.endless?`\u003cdiv>Time \u003cb>${G.secs}s\u003c/b>\u003c/div>`:''}\u003cdiv>Lives \u003cb>${'\u2665'.repeat(G.lives)+'\u2661'.repeat(3-G.lives)}\u003c/b>\u003c/div>\u003cdiv>Score \u003cb>${G.score}\u003c/b>\u003c/div>\u003cdiv>Streak \u003cb>${G.streak}\u003c/b>\u003c/div>`;\n}\nconst BN={endless:'ENDLESS',blitz:'BLITZ 10'};let lbView='endless';\nconst rankOf=(list,sc)=>list.filter(x=>x.s>=sc).length;\nfunction boardHTML(b,hi){\n  const list=(ldS().lb||{})[b]||[],lab=b==='endless'?'RND':'HIT';\n  let rows='';for(let k=0;k\u003c10;k++){const x=list[k];\n    rows+=`\u003ctr class=\"${k\u003c3?'r'+(k+1):''} ${hi===k?'me':''}\">\u003ctd>${String(k+1).padStart(2,'0')}.\u003c/td>\u003ctd>${x?esc(x.n):'---'}\u003c/td>\u003ctd>${x?String(x.s).padStart(5,'0'):'-----'}\u003c/td>\u003ctd>${x?x.r:'--'}\u003c/td>\u003ctd>${x?x.d:'--------'}\u003c/td>\u003c/tr>`}\n  return `\u003ch3>\u2605 HIGH SCORES \u00b7 ${BN[b]} \u2605\u003c/h3>\u003ctable>\u003ctr>\u003cth>RK\u003c/th>\u003cth>NAME\u003c/th>\u003cth>SCORE\u003c/th>\u003cth>${lab}\u003c/th>\u003cth>DATE\u003c/th>\u003c/tr>${rows}\u003c/table>`;\n}\nfunction boardUI(el,b,hi){\n  lbView=b;\n  el.innerHTML=`\u003cdiv class=\"arc\">\u003cdiv class=\"tabs2\">\u003cbutton data-b=\"endless\" class=\"${b==='endless'?'sel':''}\">\u267e\ufe0f Endless\u003c/button>\u003cbutton data-b=\"blitz\" class=\"${b==='blitz'?'sel':''}\">\ud83c\udfae Blitz 10\u003c/button>\u003c/div>${boardHTML(b,hi)}\u003cdiv class=\"hint\">Scores are saved in this browser only.\u003c/div>\u003cdiv class=\"btns\" style=\"justify-content:center\">\u003cbutton id=\"bzClr\">Clear scores\u003c/button>\u003c/div>\u003c/div>`;\n  el.querySelectorAll('.tabs2 button').forEach(x=>x.onclick=()=>boardUI(el,x.dataset.b));\n  let armed=false;$('bzClr').onclick=function(){if(!armed){armed=true;this.textContent='Sure? Click again';return}\n    const t=ldS();t.lb={};svS(t);boardUI(el,b)};\n}\nfunction initials(el,b,rank,done){\n  const s0=ldS();let L=(s0.ini||'AAA').split(''),cur=0;\n  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';\n  const draw=()=>{el.innerHTML=`\u003cdiv class=\"arc\">\u003ch3>\u2605 NEW HIGH SCORE \u00b7 RANK #${rank+1} \u2605\u003c/h3>\u003cdiv>ENTER YOUR INITIALS\u003c/div>\u003cdiv>${L.map((c,i)=>`\u003cdiv class=\"ini ${i===cur?'cur':''}\">\u003cbutton data-i=\"${i}\" data-d=\"1\">\u25b2\u003c/button>\u003cspan data-i=\"${i}\">${c}\u003c/span>\u003cbutton data-i=\"${i}\" data-d=\"-1\">\u25bc\u003c/button>\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"btns\" style=\"justify-content:center\">\u003cbutton class=\"pri\" id=\"bzOk\">OK\u003c/button>\u003c/div>\u003cdiv class=\"hint\">Tap \u25b2\u25bc or type letters \u00b7 Enter to confirm\u003c/div>\u003c/div>`;\n    el.querySelectorAll('.ini button').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;cur=i;L[i]=A[(A.indexOf(L[i])+ +x.dataset.d+A.length)%A.length];draw()});\n    el.querySelectorAll('.ini span').forEach(x=>x.onclick=()=>{cur=+x.dataset.i;draw()});\n    $('bzOk').onclick=ok};\n  const key=e=>{const k=e.key;\n    if(/^[a-z0-9]$/i.test(k)){L[cur]=k.toUpperCase();cur=Math.min(2,cur+1);draw()}\n    else if(k==='Backspace'){cur=Math.max(0,cur-1);draw()}\n    else if(k==='ArrowLeft'){cur=Math.max(0,cur-1);draw()}else if(k==='ArrowRight'){cur=Math.min(2,cur+1);draw()}\n    else if(k==='ArrowUp'||k==='ArrowDown'){L[cur]=A[(A.indexOf(L[cur])+(k==='ArrowUp'?1:-1)+A.length)%A.length];draw()}\n    else if(k==='Enter'){ok()}else return;e.preventDefault()};\n  function ok(){document.removeEventListener('keydown',key);done(L.join(''))}\n  document.addEventListener('keydown',key);draw();\n}\nfunction finish(){\n  emit({type:G.lives\u003c=0?'over':'done'});clearInterval(timer);const s=ldS(),d=dayNum(),won=!G.endless&&G.lives>0&&G.i>=TOT;\n  if(G.endless){if(G.score>(s.bestE||0))s.bestE=G.score,s.bestER=G.i,G.newBest=true}\n  else if(G.score>(s.best||0))s.best=G.score,G.newBest=true;\n  if(G.mode==='daily'){\n    if(!s.daily|
