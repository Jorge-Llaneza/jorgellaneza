<template id="tpl-learn">
<h1>Learn</h1>
<p class="muted">Read a unit, try to answer the “Explain it” questions before opening them, and take its quiz right after.</p>
<div class="toc" id="learnToc"></div>

<section class="card" data-topic="p1">
<h2 style="margin-top:0">1 · Formalization in propositional logic</h2>
<p>A <b>proposition</b> is a declarative sentence that can be true or false: “it rains”, “Gasol is tall”, “Juan works with Pedro”. Questions, exclamations and bare expressions (“What time is it?”, “2 + 2”, “Pedro”) are not. To formalize: identify the simple propositions (p, q, r…) and then the words that connect them.</p>
<div class="tablewrap"><table>
<tr><th>Connective</th><th>Formula</th><th>How it appears in the sentence</th></tr>
<tr><td>Negation</td><td>¬p</td><td>not p · p is false · p is not true · it is false that p</td></tr>
<tr><td>Conjunction</td><td>p ∧ q</td><td>p and q · p <b>but</b> q · p <b>however</b> q · p <b>nevertheless</b> q · p <b>despite</b> q</td></tr>
<tr><td>Disjunction</td><td>p ∨ q</td><td>p or q · p or q or both · at least p or q</td></tr>
<tr><td>Conditional</td><td>p → q</td><td>if p then q · <b>p only if q</b> · q if p · q when p · <b>q is necessary for p</b> · <b>p is sufficient for q</b> · <b>not p unless q</b></td></tr>
<tr><td>Biconditional</td><td>p ↔ q</td><td>p if and only if q · p is necessary and sufficient for q</td></tr>
</table></div>
<div class="mnemo"><b>Golden rule of the conditional.</b> Whatever follows <b>only if</b>, and whatever is <b>necessary</b>, is the consequent (right of →). Whatever follows <b>if</b>, and whatever is <b>sufficient</b>, is the antecedent. “Not p unless q” is p → q, so “p unless q” is ¬q → p ≡ p ∨ q.</div>
<h3>Precedence of the connectives</h3>
<p>From highest to lowest: <span class="fx">¬ · ∧ · ∨ · → · ↔</span>. Between connectives of the same level the leftmost one goes first: <span class="fx">p → q → r</span> is <span class="fx">(p → q) → r</span>. Examples: <span class="fx">p ∧ ¬q → r</span> = <span class="fx">(p ∧ ¬q) → r</span>; <span class="fx">¬p ↔ q ∨ r</span> = <span class="fx">(¬p) ↔ (q ∨ r)</span>; <span class="fx">p ∨ q ∧ p → r</span> = <span class="fx">(p ∨ (q ∧ p)) → r</span>.</p>
<h3>Well-formed formulas</h3>
<p>Propositional letters and the constants T and F are atomic formulas; if F and G are formulas, so are ¬F, F ∧ G, F ∨ G, F → G and F ↔ G. Two binary connectives cannot appear next to each other (<span class="fx">p ∧ ∧ q</span> is not a formula). The main connective is the root of the syntax tree: the one with the lowest precedence.</p>
<h3>Worked example (exam 20/21)</h3>
<p>“<i>Only if you have finished studying (p) I will let you go to the party (q), and for me to let you go to the party it is necessary that you do not misbehave (r).</i>” → “only if p, q” is <span class="fx">q → p</span>; “¬r is necessary for q” is <span class="fx">q → ¬r</span>. Answer: <span class="fx">(q → p) ∧ (q → ¬r)</span>, or <span class="fx">q → p ∧ ¬r</span>.</p>
<div class="trap"><b>Common traps.</b> Writing “p only if q” as q → p. Reading “unless” as “if… then not”. Forgetting that “but” is ∧. In “It is not true that p or q” the negation covers everything: ¬(p ∨ q), not ¬p ∨ q. And in “which sentence matches the formula” questions, check whether one option is the converse.</div>
<details class="self"><summary>Explain it: why is “studying is necessary for passing” equivalent to “not studying is sufficient for not passing”?</summary><p>With p = study and q = pass, the first is q → p and the second ¬p → ¬q, its contrapositive. Both say nobody passes without studying.</p></details>
<details class="self"><summary>Explain it: “The robot stops when there is no electricity and the sensor is triggered”. Why are there two possible formulas?</summary><p>It is not clear whether “and the sensor is triggered” is part of the consequent (¬p → q ∧ r) or a separate statement ((¬p → q) ∧ r). Natural language is ambiguous and logic forces you to choose.</p></details>
<div class="row"><button class="btn" data-quiz="p1">Take this unit's quiz →</button><label class="row small"><input type="checkbox" data-read="p1"> Mark as read</label></div>
</section>

<section class="card" data-topic="p2">
<h2 style="margin-top:0">2 · Semantics, logical consequence and contradiction</h2>
<p>An <b>interpretation</b> gives each letter the value T or F: with n distinct letters there are <b>2ⁿ</b> interpretations (the rows of the truth table). If Fᴵ = T, I is a <b>model</b> of F; if Fᴵ = F, a <b>countermodel</b>.</p>
<svg class="svgfig" viewBox="0 0 520 170" role="img" aria-label="Diagram: among all formulas, the satisfiable ones contain the valid ones and the rest are unsatisfiable">
<rect class="fill2" x="10" y="10" width="500" height="150" rx="10"/>
<rect class="fill1" x="24" y="24" width="300" height="122" rx="8"/>
<rect x="40" y="62" width="130" height="70" rx="8" style="fill:var(--surface);stroke:var(--accent)"/>
<rect class="fill3" x="340" y="24" width="156" height="122" rx="8"/>
<text x="36" y="46" font-weight="600">Satisfiable (T in some I)</text>
<text x="56" y="92" font-weight="600">Valid</text><text x="56" y="112" class="small">(T in all)</text>
<text x="186" y="92">Satisfiable,</text><text x="186" y="112">not valid: F and ¬F</text>
<text x="352" y="80" font-weight="600">Unsatisfiable</text><text x="352" y="100">(F in all)</text>
</svg>
<p><b>Mirror principle:</b> F is valid ⇔ ¬F is unsatisfiable. If F is satisfiable but not valid, so is ¬F.</p>
<p>A <b>set</b> is <b>consistent</b> if some interpretation makes all its formulas T at once. {p, ¬p} is inconsistent even though each formula is satisfiable.</p>
<h3>Equivalence and laws</h3>
<p>F ≡ G if they have the same value in every interpretation; F ≡ G ⇔ F ↔ G is valid. ≡ is a metasymbol, not a connective.</p>
<div class="tablewrap"><table>
<tr><th>Law</th><th>Equivalence</th></tr>
<tr><td>Contraposition</td><td class="fx">G → H ≡ ¬H → ¬G</td></tr>
<tr><td>Removing → and ↔</td><td class="fx">G → H ≡ ¬G ∨ H · G ↔ H ≡ (G → H) ∧ (H → G)</td></tr>
<tr><td>De Morgan</td><td class="fx">¬(G ∨ H) ≡ ¬G ∧ ¬H · ¬(G ∧ H) ≡ ¬G ∨ ¬H</td></tr>
<tr><td>Distributivity</td><td class="fx">G ∨ (H ∧ J) ≡ (G ∨ H) ∧ (G ∨ J) · G ∧ (H ∨ J) ≡ (G ∧ H) ∨ (G ∧ J)</td></tr>
<tr><td>Absorption</td><td class="fx">G ∧ (H ∨ G) ≡ G · G ∨ (H ∧ G) ≡ G</td></tr>
<tr><td>Complement</td><td class="fx">G ∧ ¬G ≡ F · G ∨ ¬G ≡ T</td></tr>
<tr><td>Domination / identity</td><td class="fx">G ∧ F ≡ F · G ∨ T ≡ T · G ∧ T ≡ G · G ∨ F ≡ G</td></tr>
<tr><td>Double negation, idempotence, commutativity, associativity</td><td class="fx">¬¬G ≡ G · G ∧ G ≡ G · …</td></tr>
</table></div>
<h3>Logical consequence</h3>
<p>Γ ⊨ Q if every model of all the formulas in Γ is a model of Q. An argument {P₁…Pₙ} ⊨ Q is <b>sound</b> (correct) if the conclusion is a logical consequence of the premises.</p>
<ul class="tight">
<li><b>Theorem I:</b> sound ⇔ <span class="fx">P₁ ∧ … ∧ Pₙ → Q</span> is valid. Used by truth tables and the contradiction method.</li>
<li><b>Theorem II:</b> sound ⇔ <span class="fx">{P₁, …, Pₙ, ¬Q}</span> is inconsistent. Used by resolution.</li>
</ul>
<h3>Proof by contradiction</h3>
<ol class="tight">
<li>Assume the formula is <b>F</b> in some I: the antecedent (conjunction of premises) T and the conclusion F.</li>
<li>Propagate values from the outside in until you reach the letters.</li>
<li>If one fact is not enough, split into cases (for example, q ↔ r = F gives q = T, r = F or q = F, r = T).</li>
<li>If <b>every</b> case ends in a contradiction, the formula is valid. If one does not, that case is a countermodel and the formula is not valid.</li>
</ol>
<div class="mnemo"><b>Meta-reasoning questions.</b> “X is not valid” ⇒ there is an I with Xᴵ = F. If X = ¬F ∨ G (≡ F → G), that I gives F = T and G = F: F is satisfiable and G is not valid. Always write down the values that I forces and check each option in it.</div>
<div class="trap"><b>Common traps.</b> If the premises are inconsistent, the argument is sound whatever the conclusion. A countermodel has to make <b>all</b> the premises T. And in the contradiction method, finding a contradiction in one case is not enough: you need all of them.</div>
<details class="self"><summary>Explain it: why is {p → q, q} ⊨ p not sound?</summary><p>With p = F and q = T both premises are T and the conclusion is F: it is a countermodel (the fallacy of affirming the consequent).</p></details>

</section>

<section class="card" data-topic="p3">
<h2 style="margin-top:0">3 · Clausal form, resolution and natural deduction</h2>
<p><b>Literal:</b> p or ¬p. <b>Clause:</b> disjunction of literals. <b>CNF:</b> conjunction of clauses. <b>DNF:</b> disjunction of conjunctions of literals. <b>Clausal form:</b> the set of clauses of the CNF, {¬p ∨ q, ¬p ∨ r ∨ ¬s, p}.</p>
<ol class="tight">
<li>Remove ↔ and →.</li>
<li>Push ¬ inwards (De Morgan, ¬¬).</li>
<li>Distribute ∨ over ∧.</li>
<li>Simplify: remove clauses with a literal and its negation, repeated literals and clauses that contain another one (absorption).</li>
</ol>
<p>Example from the unit: <span class="fx">¬p ∨ q → ¬(q ∧ r)</span> ≡ <span class="fx">(p ∧ ¬q) ∨ ¬q ∨ ¬r</span> ≡ <span class="fx">(p ∨ ¬q ∨ ¬r) ∧ (¬q ∨ ¬r)</span> ≡ <span class="fx">¬q ∨ ¬r</span> (absorption). Clausal form: {¬q ∨ ¬r}.</p>
<p><b>□</b> (empty clause) ≡ F, unsatisfiable. <b>∅</b> (set with no clauses) is valid. <b>Horn:</b> at most one positive literal: fact H, goal ¬G₁ ∨ … ∨ ¬Gₙ, rule H ∨ ¬G₁ ∨ … ∨ ¬Gₙ.</p>
<h3>Resolution</h3>
<p>From <span class="fx">L ∨ F</span> and <span class="fx">Lᶜ ∨ G</span> you get <span class="fx">F ∨ G</span>. To prove Γ ⊨ Q: take the clausal form of the premises and of ¬Q, and apply the rule, adding each resolvent to the set. If □ appears, the set is inconsistent and the argument is sound. If the pairs run out without □, it is consistent.</p>
<p>Umbrella example: {¬p ∨ q ∨ r, ¬r, p, ¬q} → ¬p ∨ q (with ¬r) → q (with p) → □ (with ¬q).</p>
<div class="trap"><b>One pair at a time.</b> p ∨ q and ¬p ∨ ¬q do not give □: they give q ∨ ¬q or p ∨ ¬p. And do not forget to negate the conclusion before turning it into clauses.</div>
<h3>Natural deduction</h3>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>What it does</th><th>How it is cited</th></tr>
<tr><td>∧I / ∧E</td><td>From A and B, A ∧ B · from A ∧ B, A (or B)</td><td>∧I 2,3 · ∧E 1</td></tr>
<tr><td>∨I / ∨E</td><td>From A, A ∨ B · from A ∨ B, A → C and B → C, C</td><td>∨I 4 · ∨E 4,1,10</td></tr>
<tr><td>→I / →E</td><td>A box that assumes A and reaches B ⇒ A → B · from A and A → B, B (modus ponens)</td><td>→I 3-5 · →E 1,3</td></tr>
<tr><td>↔I / ↔E</td><td>From A → B and B → A, A ↔ B · from A ↔ B, A → B (or B → A)</td><td>↔I 6,11 · ↔E 2</td></tr>
<tr><td>¬I</td><td>A box that assumes A and reaches B ∧ ¬B ⇒ ¬A</td><td>¬I 5-7</td></tr>
<tr><td>¬E</td><td>A box that assumes ¬A and reaches B ∧ ¬B ⇒ A</td><td>¬E 6-8</td></tr>
<tr><td>T-I, T-E, F-I, F-E</td><td>A ∨ ¬A ⇔ T · from A ∧ ¬A, F · from F, any A</td><td></td></tr>
</table></div>
<p class="small muted">In Campus Virtual the rules are written the other way round: “I →” = →I, “E ∼” = ¬E, “E ∨” = ∨E.</p>
<div class="mnemo"><b>How to read a box.</b> Look at the line right after the box: if it is A → B, the box was closed with →I; if it is ¬A (with A the assumption), with ¬I; if it is A and the assumption was ¬A, with ¬E. Just before that line, inside the box, there is usually the contradiction B ∧ ¬B (∧I). To prove A → B, assume A; to prove ¬A, assume A; to use A ∨ B, prepare A → C and B → C.</div>
<p><b>Properties:</b> resolution and natural deduction are <b>sound</b> (Γ ⊢ Q ⇒ Γ ⊨ Q) and <b>complete</b> (Γ ⊨ Q ⇒ Γ ⊢ Q). Propositional logic is decidable; SAT was the first NP-complete problem.</p>
<details class="self"><summary>Explain it: in the exam 20/21 proof, why is line 9 (r) justified with ¬E 6-8 and not with ¬I?</summary><p>Box 6-8 assumes ¬r and reaches s ∧ ¬s. Concluding r from the assumption ¬r removes the negation (¬E). ¬I would have been assuming r and concluding ¬r.</p></details>

<section class="card" data-topic="q1">
<h2 style="margin-top:0">4 · Predicate logic: syntax and formalization</h2>
<p>L1 adds to the connectives <b>constants</b> (a, b, john), <b>functions</b> (f(X), motherOf(X)), <b>variables</b> (X, Y), <b>predicates</b> (p(X,Y), Dog(X)) and the <b>quantifiers</b> ∀ and ∃. The arity is the number of arguments.</p>
<ul class="tight">
<li><b>Term</b>: a constant, a variable or a function applied to terms. It evaluates to an object, not to T/F.</li>
<li><b>Atomic formula</b>: a predicate applied to terms. It evaluates to T/F. P(Q(X)) is not well formed, and neither is ¬f(x).</li>
<li><b>Precedence</b>: ¬, ∀ and ∃ bind the tightest. In <span class="fx">∀X p(X) → q(X)</span> the scope of ∀X is only p(X), and the X in q(X) is free.</li>
<li>A variable is <b>bound</b> if it is in the scope of a quantifier on it, and <b>free</b> if not. If there are several, the nearest one binds it. A <b>bound formula</b> has no free variables, and the result of a formalization must always be one.</li>
</ul>
<div class="tablewrap"><table>
<tr><th>Sentence</th><th>Formula</th></tr>
<tr><td>All p are q</td><td class="fx">∀X (p(X) → q(X))</td></tr>
<tr><td>Only p are q</td><td class="fx">∀X (q(X) → p(X))</td></tr>
<tr><td>No p is q</td><td class="fx">∀X (p(X) → ¬q(X)) ≡ ¬∃X (p(X) ∧ q(X))</td></tr>
<tr><td>Some p are q</td><td class="fx">∃X (p(X) ∧ q(X))</td></tr>
<tr><td>Not all p are q</td><td class="fx">¬∀X (p(X) → q(X)) ≡ ∃X (p(X) ∧ ¬q(X))</td></tr>
<tr><td>Every flea hounds some dragon</td><td class="fx">∀Y [F(Y) → ∃X (D(X) ∧ H(Y,X))]</td></tr>
<tr><td>Some fleas hound all dragons</td><td class="fx">∃Y [F(Y) ∧ ∀X (D(X) → H(Y,X))]</td></tr>
<tr><td>Everybody lives somewhere / there is a place where everybody lives</td><td class="fx">∀X ∃Y Lives(X,Y) / ∃Y ∀X Lives(X,Y)</td></tr>
</table></div>
<div class="mnemo"><b>∀ with →, ∃ with ∧.</b> ∀X (A ∧ B) says the whole domain is A and B. ∃X (A → B) holds for anything that is not A. They are almost always mistakes, which is why they are the favourite wrong options.</div>
<div class="trap"><b>Common traps.</b> The order of the arguments: with R(X,Y) = “X reads Y”, “X is read by somebody” is ∃Y R(Y,X). The order of ∀ and ∃ changes the meaning. “Necessary” still works as in L0: “for all students to pass it is necessary that some professor explains well” is ∀x (S(x) → P(x)) → ∃x (Pr(x) ∧ E(x)).</div>
<details class="self"><summary>Explain it: why is ∀x∃y A(x,y) ∧ B(x,y) not a closed formula?</summary><p>The quantifiers only reach A(x,y); in B(x,y), x and y are free. With parentheses, ∀x∃y (A(x,y) ∧ B(x,y)) would be one.</p></details>
<div class="row"><button class="btn" data-quiz="q1">Take this unit's quiz →</button><label class="row small"><input type="checkbox" data-read="q1"> Mark as read</label></div>
</section>

<section class="card" data-topic="q2">
<h2 style="margin-top:0">5 · Semantics in L1: interpretations and AND/OR trees</h2>
<p>An <b>interpretation</b> consists of a <b>non-empty</b> domain D, an element of D for each constant, a function Dⁿ → D for each function and a function Dⁿ → {T, F} for each predicate. There can be infinitely many interpretations, so <b>there are no truth tables</b>.</p>
<p>∀X G(X) is T if G is T for <b>every</b> element of D; ∃X G(X) if it is T for <b>some</b> element. In finite domains it is evaluated with an <b>AND/OR tree</b>: each ∀ is an AND node and each ∃ an OR node. A ¬ inverts the result of the subtree.</p>
<p>Example from exam 20/21: <span class="fx">∀Y¬∀X (p(X,Y) → q(X) ∨ r(Y))</span> with D = {1, 2}, p = “X ≥ Y”, q = “X is odd”, r = “X &gt; 5”.</p>
<ul class="ao"><li><span class="aoq">∀Y</span> AND node ⇒ <b class="tv">T</b>
<ul class="ao"><li><span class="aob">Y = 1</span> <span class="aoq">¬</span>∀X(…): ∀X is <b class="fv">F</b> because with X = 2: p(2,1) = T, q(2) ∨ r(1) = F ⇒ the branch is <b class="tv">T</b></li>
<li><span class="aob">Y = 2</span> <span class="aoq">¬</span>∀X(…): with X = 2: p(2,2) = T, q(2) ∨ r(2) = F ⇒ ∀X is F ⇒ the branch is <b class="tv">T</b></li></ul></li></ul>
<div class="mnemo"><b>Trick for “select the true formulas” questions.</b> They all share the kernel: work out the kernel table K(X,Y) once for each pair, then read each prefix off the table. ∃X∀Y: is there a whole row of T? ∀X∃Y: does every row have some T? A ¬ between quantifiers swaps T and F at the level it negates.</div>
<h3>Equivalences with quantifiers</h3>
<div class="tablewrap"><table>
<tr><th>Holds</th><th>Does not hold (only ⊨ in one direction)</th></tr>
<tr><td class="fx">¬∀X G ≡ ∃X ¬G · ¬∃X G ≡ ∀X ¬G</td><td class="fx">∀X (G ∨ H) ⊭ ∀X G ∨ ∀X H <span class="muted">(everybody passes or fails)</span></td></tr>
<tr><td class="fx">∀X (G ∧ H) ≡ ∀X G ∧ ∀X H · ∃X (G ∨ H) ≡ ∃X G ∨ ∃X H</td><td class="fx">∃X G ∧ ∃X H ⊭ ∃X (G ∧ H) <span class="muted">(students and workers)</span></td></tr>
<tr><td class="fx">∀X∀Y ≡ ∀Y∀X · ∃X∃Y ≡ ∃Y∃X</td><td class="fx">∀Y∃X G ⊭ ∃X∀Y G <span class="muted">(everybody dates someone)</span></td></tr>
<tr><td>If X does not appear in H: <span class="fx">H ∨ ∀X G(X) ≡ ∀X (H ∨ G(X))</span>, and the same with ∧ and with ∃</td><td>The directions that do hold: <span class="fx">∀X G ∨ ∀X H ⊨ ∀X (G ∨ H)</span>, <span class="fx">∃X (G ∧ H) ⊨ ∃X G ∧ ∃X H</span>, <span class="fx">∃X∀Y G ⊨ ∀Y∃X G</span></td></tr>
</table></div>
<div class="trap"><b>Common traps.</b> ∃X (cow(X) → good(X)) is T as soon as something is not a cow. ∀X p(X) → ∃X p(X) is valid because the domain cannot be empty. When evaluating, one F branch is enough to bring down a ∀ and one T branch is enough for an ∃: you do not need to draw the whole tree to know the result, but in the written exam you do have to justify it.</div>
<details class="self"><summary>Explain it: with D = {1,2}, p = “X = Y” and q = “X is odd”, why is ∀X∃Y (p(X,Y) → q(X)) T and ∀X (∃Y p(X,Y) → q(X)) F?</summary><p>In the first, for X = 2 you can pick Y = 1, which makes the antecedent false. In the second, ∃Y p(2,Y) is T (Y = 2) and q(2) is F, so the implication is F for X = 2.</p></details>

</section>

<section class="card" data-topic="q3">
<h2 style="margin-top:0">6 · Clausal form, unification and general resolution</h2>
<p>Resolution in L1 needs clauses. Steps (the constructive proof of Skolem's theorem):</p>
<ol class="tight">
<li>Remove ↔ and →.</li>
<li>Push ¬ inwards (De Morgan, also with quantifiers).</li>
<li>Rename variables if two quantifiers use the same name.</li>
<li>Move the quantifiers to the left <b>without changing their order</b> (restricted distributivity).</li>
<li>Remove the ∃s (skolemize): ∃X with no ∀ before it ⇒ new constant (X/a); ∃Y with ∀X₁…∀Xₘ before it ⇒ new function Y/f(X₁,…,Xₘ). From here on the formula is <b>≡sat</b> (equisatisfiable), not equivalent.</li>
<li>Turn the kernel into CNF: this is the <b>Skolem normal form</b> (SNF).</li>
<li>Drop the ∀s and write each clause separately.</li>
</ol>
<p>Example from exam 20/21: <span class="fx">∀Y [¬∃X r(f(X),Y) → ¬∃Z (q(Z) ∨ p(Y,Z))]</span> ≡ <span class="fx">∀Y [∃X r(f(X),Y) ∨ ∀Z (¬q(Z) ∧ ¬p(Y,Z))]</span> ≡ <span class="fx">∀Y∃X∀Z [r(f(X),Y) ∨ (¬q(Z) ∧ ¬p(Y,Z))]</span> ≡sat (X/g(Y)) … ⇒ <span class="fx">{r(f(g(Y)),Y) ∨ ¬q(Z), r(f(g(Y)),Y) ∨ ¬p(Y,Z)}</span>.</p>
<h3>Substitutions</h3>
<p>σ = {V₁/t₁, …}: each variable is replaced by its term in all its occurrences, all at once. No variable can go to a term that contains it ({X/f(X)} is not valid). <b>Composition σ₁σ₂</b>: (1) apply σ₂ to the <b>terms</b> of σ₁ and drop any X/X; (2) add the pairs of σ₂ whose variable is not in σ₁. It is not commutative: with σ₁ = {Z/g(X,Y)} and σ₂ = {X/a, Y/b, W/c, Z/d}, σ₁σ₂ = {Z/g(a,b), X/a, Y/b, W/c} and σ₂σ₁ = σ₂.</p>
<h3>Unification algorithm</h3>
<ol class="tight">
<li>μ₀ = { }.</li>
<li>Compute the disagreement set D(Tμᵢ): the first position, from left to right, where the expressions differ.</li>
<li>If D has two terms that start with different symbols (a and b, a and f(…), f and g), or a variable X against a term that contains X, it is <b>not unifiable</b>.</li>
<li>Otherwise, δ = {X/t} and <b>μᵢ₊₁ = μᵢδ</b> (composition: δ is applied to what you already have).</li>
<li>Repeat until the expressions are identical: μ is the mgu.</li>
</ol>
<p>Example: {p(X, a, f(g(Y))), p(f(Z), Z, f(U))} → X/f(Z) → Z/a (and X/f(Z) becomes X/f(a)) → U/g(Y): mgu = {X/f(a), Z/a, U/g(Y)}.</p>
<div class="trap"><b>Unification traps.</b> Not composing (leaving X/f(Z) when Z is already a). Forgetting a binding. Writing b/f(a) (a constant is never substituted). Not renaming: p(X,Y) and p(Y,f(X)) from different clauses do unify after renaming one of them.</div>
<h3>General resolution</h3>
<p>From <span class="fx">G ∨ ¬E₁</span> and <span class="fx">H ∨ E₂</span> with σ = mgu(E₁, E₂) you get <span class="fx">Gσ ∨ Hσ</span>; if several literals unify, they are all removed at once. To prove Φ ⊨ G: take the clausal form of the premises and of ¬G (¬∃X q(X) gives ¬q(X), with a variable), rename variables between clauses and resolve until □.</p>
<p>Example from exam 20/21: {p(X) ∨ ¬r(X,f(Y)), q(X) ∨ r(X,Y), ¬p(a), ¬q(X)} → ¬r(a,f(Y)) with {X/a} → q(a) with {X₂/a, Y₂/f(Y)} → □ with {X/a}.</p>
<p><b>Strategies:</b> breadth-first (every resolvent at each level) or set of support (clauses from the negated conclusion and their descendants); Prolog's SLD resolution is a special case of the latter.</p>
<details class="self"><summary>Explain it: in mock exam 2, why is P(b) fine for ∀x (R(x) → ∃x P(x))?</summary><p>The inner ∃x is another variable that does not depend on the outer x: ∀x (¬R(x) ∨ ∃z P(z)) ≡ ∀x ¬R(x) ∨ ∃z P(z), and that ∃ can move to the front and give a constant. With f(x) it would also be equisatisfiable.</p></details>
<div class="row"><button class="btn" data-quiz="q3">Take this unit's quiz →</button><button class="btn ghost" data-labgo="mgu">Practise unification</button><label class="row small"><input type="checkbox" data-read="q3"> Mark as read</label></div>
</section>

<section class="card" data-topic="q4">
<h2 style="margin-top:0">7 · Natural deduction in L1 and properties</h2>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>What it does</th><th>Condition</th></tr>
<tr><td>∀E</td><td>From ∀X A(X), A(a) for any term</td><td>—</td></tr>
<tr><td>∀I</td><td>A box that starts with “(t) free” and derives A(t) ⇒ ∀X A(X)</td><td>t does not appear in any earlier open box</td></tr>
<tr><td>∃I</td><td>From A(a), ∃X A(X)</td><td>—</td></tr>
<tr><td>∃E</td><td>From ∃X A(X) and a box that assumes “A(t), t free” and reaches B ⇒ B</td><td>t free and t ∉ B</td></tr>
</table></div>
<p>Example from exam 19/20, {∃X p(X), ∀X (q(X) → ¬p(X))} ⊢ ∃X ¬q(X):</p>
<pre>1.  ∃X p(X)                 Premise
2.  ∀X (q(X) → ¬p(X))       Premise
┌ 3.  p(a), a free          Assumption
│ 4.  q(a) → ¬p(a)          ∀E 2
│ ┌ 5.  q(a)                Assumption
│ │ 6.  ¬p(a)               →E 4,5
│ └ 7.  p(a) ∧ ¬p(a)        ∧I 3,6
│ 8.  ¬q(a)                 ¬I 5-7
└ 9.  ∃X ¬q(X)              ∃I 8
10. ∃X ¬q(X)                ∃E 1,3-9</pre>
<div class="mnemo"><b>Pattern.</b> If there is an ∃ premise, open its ∃E box first with a new witness and work inside it; the last line inside the box is repeated outside with ∃E. If the goal is ∀X A(X), open a “(t) free” box. ∀ premises are particularized with ∀E to whatever term you need.</div>
<div class="trap"><b>Typical misuse (slides).</b> With ∃X P(X) and ∃X Q(X) you cannot assume P(a) and Q(a) with the same a: in the second box a is no longer free. That is why {∃X P(X), ∃X Q(X)} ⊬ ∃X (P(X) ∧ Q(X)), and in fact it is not a logical consequence.</div>
<p><b>Properties:</b> predicate logic is <b>semidecidable</b>: if Γ ⊨ Q it can be proved in finite time, but if not, no algorithm is guaranteed to stop. General resolution and natural deduction are sound and complete. L0 is zero-order and L1 first-order; there are higher-order logics and extensions (temporal, fuzzy…).</p>
<details class="self"><summary>Explain it: why can {∃X∀Y P(X,Y)} ⊢ ∀Y∃X P(X,Y) be proved, but not the other way round?</summary><p>With the witness a from the premise, for any free b you get P(a,b) and ∃X P(X,b). The other way round, each Y could have a different X: there is no common witness, and the argument is not sound.</p></details>

<template id="tpl-strategy">
<h1>Exam strategy</h1>
<div class="card">
<h2 style="margin-top:0">What the midterm looks like</h2>
<p>The official Campus Virtual mock exams have <b>11 questions worth 1 point</b> of two kinds: <b>“Select one”</b> (4 options, one correct) and <b>“Select one or more”</b> (several can be correct). Written exams from previous years asked you to formalize, complete a natural deduction proof, convert to clausal form, refute by resolution and evaluate with an AND/OR tree: Workshops covers all of that.</p>
<p>This year's exact penalty is not known. By default the mock exams here take off <b>0.25 per wrong answer</b> in single-answer questions (like the multiple-choice question in exam 19/20), and multi-answer questions are scored like Moodle: each correct option you tick adds its share, each wrong one subtracts, and the question never goes below 0. You can change this in Mock exam.</p>
</div>
<div class="card">
<h2 style="margin-top:0">Answer or leave blank?</h2>
<p>With +1 / −0.25, answering pays off if your probability of being right <i>p</i> satisfies p − 0.25(1 − p) &gt; 0, that is, <b>p &gt; 20%</b>. With 4 options, a pure guess already gives p = 25%: the expected value is +0.06 per question. If the penalty were −1/3, a pure guess would give 0 and you would want to rule out at least one option before answering.</p>
<p><b>In multi-answer questions</b> tick only the options you are sure of: each right one adds, and a wrong one subtracts as much as a right one adds. Leaving out a correct option only costs you its share.</p>
<p>Your <b>actual calibration</b> (how often you are right when you say “Unsure”) is shown on Home.</p>
</div>
<div class="card">
<h2 style="margin-top:0">Calculator: how much do I need?</h2>
<div class="row">
<label>Questions <input type="number" id="cN" value="11" min="5" max="60" style="width:70px"></label>
<label>Right <input type="number" id="cR" value="9" min="0" style="width:70px"></label>
<label>Wrong <input type="number" id="cW" value="0" min="0" style="width:70px"></label>
<label>Penalty <input type="number" id="cP" value="0.25" step="0.05" style="width:80px"></label>
</div>

<p id="cHint" class="muted"></p>
</div>
<div class="card">
<h2 style="margin-top:0">How to tackle each kind of question</h2>
<ul>
<li><b>Formalization:</b> underline only if, unless, necessary, sufficient, but. Write the arrow before looking at the options and then look for yours; be wary of converses.</li>
<li><b>Meta-reasoning</b> (“¬F ∨ G is not valid…”): translate it into “there is an I with…”, note which values it fixes and evaluate each option in that I.</li>
<li><b>Interpretations (AND/OR):</b> kernel table once, then each prefix. In multi-answer questions, evaluate each formula separately.</li>
<li><b>Clausal form / set to refute:</b> do not forget to negate the conclusion. Check whether the Skolem constant should be a function of an earlier ∀.</li>
<li><b>Unification:</b> run the algorithm in order and always compose. Check an option by applying it to both expressions: if they do not become identical, it is false.</li>
<li><b>Composition:</b> σ₁σ₂ applies σ₂ to σ₁; look at the variable they share.</li>
<li><b>Natural deduction with gaps:</b> rebuild the whole proof on scrap paper. The line after each box tells you which rule closed it.</li>
<li>First pass: the sure ones. Second pass: the doubtful ones, with the 20% rule.</li>
</ul>
</div>

<h2 style="margin-top:0">Why the site works this way</h2>
<ul class="tight">
<li><b>Retrieval practice:</b> answering questions sticks better than rereading.</li>
<li><b>Spaced repetition:</b> each question comes back when you are about to forget it. If you get it right and are sure, it stays away for days; if you get it wrong, it comes back in 10 minutes and again in the same session.</li>
<li><b>Generated exercises:</b> the workshops create new AND/OR trees, mgus, compositions, Skolem forms and clausal forms every time, so you can practise without repeats.</li>
<li><b>Interleaved practice:</b> the review mixes units, like the exam.</li>
<li><b>Immediate feedback:</b> every question explains why, and where the trap is.</li>
</ul>
<h3>Daily routine (45-60 min)</h3>
<ol class="tight">
<li>10 min: due flashcards.</li>
<li>20 min: Practice → Smart review.</li>
<li>15 min: one workshop (for your weakest unit) and one proof with gaps.</li>
<li>The last 3 days: one mock exam a day and only “My mistakes”.</li>
</ol>
