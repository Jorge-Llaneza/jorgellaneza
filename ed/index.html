<script>
const $=s=>document.querySelector(s),INF=Infinity,L=i=>'V'+(i+1),f=x=>x===INF?'∞':x;
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map((x,i)=>i?`<td>${x}</td>`:`<th>${x}</th>`).join('')}</tr>`).join('')}</table>`;

function dfsRun2(s){const W=Wm(),n=W.length,vis=[],o=[],te=[],stk=[],st=[];

go(s,-1);return{st,q:[['Visit order from '+L(s)+' (lowest number first), e.g. 1 2 4',o.map(x=>x+1).join(' '),1]]}}
const DEMO={basics:[4,[[1,2,2],[1,3,5],[2,4,1],[3,2,1],[4,3,3]],1],dij:[4,[[1,2,4],[1,4,1],[4,2,2],[2,3,1],[4,3,4]],1],floyd:[4,[[1,2,3],[2,3,2],[1,3,8],[3,4,1]],1],center:[4,[[1,2,2],[2,3,2],[2,4,1],[3,4,3]],0],dfs:[5,[[1,2,1],[1,3,1],[2,4,1],[2,5,1],[3,5,1]],0],prim:[5,[[1,2,2],[1,3,3],[2,3,1],[2,4,4],[3,4,2],[3,5,5],[4,5,1]],0]};

if(id=='avl'){setT(TP['AVL but NOT PBT']);say('Every balance number is between −1 and +1, so this IS an AVL tree. But the root has 6 nodes on its left and only 2 on its right → NOT a PBT.');return}
const a=[6,4,3,5,12,9,15];T=null;hv=[];let i=0;tm=setInterval(()=>{const x=a[i++],p=path(T,x);T=ins(T,x);hv=[...p,x];say(`Insert <b>${x}</b>: path ${p.join(' → ')||'none (it becomes the root)'}. Smaller goes left, bigger goes right.`);drawT();if(i>=a.length)clearInterval(tm)},1400)}
let G={nodes:[],edges:[],dir:true},mode='move',sel=null,drag=null,hl={n:[],e:[]},cur='basics',T=null,hv=[],tm=0;
const PRE={'Small directed graph (p. 22)':[4,[[1,2,2],[1,3,5],[2,4,1],[3,2,1],[4,3,3]],1],
'Dijkstra practice (6 nodes)':[6,[[1,2,6],[1,4,1],[4,3,3],[3,5,3],[2,6,4],[5,6,1],[4,2,2]],1],
'Floyd practice (like p. 66)':[6,[[1,2,3],[1,3,4],[2,5,5],[3,5,3],[3,4,8],[5,6,3],[5,4,5],[6,4,2],[2,4,10]],1],
'Prim practice (undirected)':[6,[[1,2,2],[1,3,3],[2,4,1],[2,3,3],[3,5,3],[4,5,2],[4,6,2],[5,6,1]],0]};
const TP={'Slides tree (p. 126)':[6,4,3,5,12,9,15,8,11],'Perfect tree':[10,5,15,3,7,12,18],'AVL but NOT PBT':[10,5,15,3,8,12,2,7,9],'Not AVL':[10,5,15,3,2],'Degenerate (sorted input)':[1,2,3,4,5,6]};
/* ---------- graph model ---------- */
function Wm(){const n=G.nodes.length,W=[...Array(n)].map(()=>Array(n).fill(INF));G.edges.forEach(e=>{W[e.a][e.b]=Math.min(W[e.a][e.b],e.w);if(!G.dir)W[e.b][e.a]=Math.min(W[e.b][e.a],e.w)});return W}
function load(n,E,dir){G={nodes:[...Array(n)].map((_,i)=>{const t=2*Math.PI*i/n-Math.PI/2;return{x:280+210*Math.cos(t),y:170+130*Math.sin(t)}}),edges:E.map(([a,b,w])=>({a:a-1,b:b-1,w})),dir:!!dir};const c=$('#dr');if(c)c.checked=G.dir;hl={n:[],e:[]};draw()}
function rndG(){const n=5+Math.floor(Math.random()*3),p=[0,...[...Array(n-1).keys()].map(x=>x+1).sort(()=>Math.random()-.5)],E=[],d=G.dir,r9=()=>1+Math.floor(Math.random()*9);
const has=(a,b)=>E.some(e=>e[0]==a&&e[1]==b||!d&&e[0]==b&&e[1]==a);
for(let i=1;i<n;i++)E.push([p[i-1]+1,p[i]+1,r9()]);
for(let k=0;k<n+1;k++){const a=1+Math.floor(Math.random()*n),b=1+Math.floor(Math.random()*n);if(a!=b&&!has(a,b))E.push([a,b,r9()])}load(n,E,d)}
function addE(a,b){const w=Math.max(1,+$('#wt').value||1);G.edges=G.edges.filter(e=>!(e.a==a&&e.b==b||!G.dir&&e.a==b&&e.b==a));G.edges.push({a,b,w})}
function draw(){const s=$('#gs');if(!s)return;let h='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#888"/></marker></defs>';
G.edges.forEach((e,i)=>{const A=G.nodes[e.a],B=G.nodes[e.b],dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,o=G.dir?7:0,nx=-uy*o,ny=ux*o,on=hl.e.includes(e.a+'-'+e.b)||!G.dir&&hl.e.includes(e.b+'-'+e.a);
h+=`<line class="e ${hl.d&&(hl.d.includes(e.a+'-'+e.b)||!G.dir&&hl.d.includes(e.b+'-'+e.a))?'ed':on?'eh':''}" x1="${A.x+nx+ux*18}" y1="${A.y+ny+uy*18}" x2="${B.x+nx-ux*(G.dir?20:18)}" y2="${B.y+ny-uy*(G.dir?20:18)}" ${G.dir?'marker-end="url(#ar)"':''}/><text class="w" data-e="${i}" x="${(A.x+B.x)/2+nx*2.2}" y="${(A.y+B.y)/2+ny*2.2}">${e.w}</text>`});
G.nodes.forEach((p,i)=>{h+=`<circle class="n ${hl.n.includes(i)?'nh':''} ${sel===i?'ns':''}" cx="${p.x}" cy="${p.y}" r="18"/><text x="${p.x}" y="${p.y}">${L(i)}</text>`});s.innerHTML=h}
function initGraph(){const s=$('#gs'),P=e=>{const r=s.getBoundingClientRect();return{x:(e.clientX-r.left)*560/r.width,y:(e.clientY-r.top)*340/r.height}},at=p=>G.nodes.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<22);
s.onpointerdown=e=>{const p=P(e),i=at(p),ei=e.target.dataset.e;
if(ei!==undefined){if(mode=='del'){G.edges.splice(+ei,1);draw()}return}
if(i<0){if(mode=='node'){G.nodes.push({x:p.x,y:p.y});draw()}return}
if(mode=='move'){drag=i;s.setPointerCapture(e.pointerId)}
else if(mode=='del'){G.nodes.splice(i,1);G.edges=G.edges.filter(x=>x.a!=i&&x.b!=i).map(x=>({...x,a:x.a>i?x.a-1:x.a,b:x.b>i?x.b-1:x.b}));draw()}
else if(mode=='edge'){if(sel==null)sel=i;else{if(sel!=i)addE(sel,i);sel=null}draw()}};
s.onpointermove=e=>{if(drag!=null){const p=P(e);G.nodes[drag].x=p.x;G.nodes[drag].y=p.y;draw()}};s.onpointerup=()=>drag=null;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;sel=null;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x==b));draw()});
$('#dr').onchange=e=>{G.dir=e.target.checked;draw()};$('#rg').onclick=rndG;$('#cl').onclick=()=>load(0,[],G.dir);
$('#ps').onchange=e=>{const p=PRE[e.target.value];if(p)load(...p);e.target.selectedIndex=0};
if(!G.nodes.length)load(...PRE['Dijkstra practice (6 nodes)']);else{$('#dr').checked=G.dir;draw()}}
const graphUI=()=>`<div class="bar"><b>Build:</b><button data-m="move" class="on">✋ Move</button><button data-m="node">➕ Node</button><button data-m="edge">🔗 Edge</button><button data-m="del">🗑 Delete</button></div>
<div class="bar"><label>Weight <input id="wt" type="number" min="1" value="3"></label><label><input id="dr" type="checkbox" checked> directed</label>
<select id="ps"><option>Examples…</option>${Object.keys(PRE).map(k=>`<option>${k}</option>`).join('')}</select><button id="rg">🎲 Random graph</button><button id="cl">Clear</button></div>
<small>➕ tap empty space to add a node · 🔗 tap node A then node B (same pair again = change weight) · 🗑 tap a node or a weight number</small>
<svg id="gs" viewBox="0 0 560 340"></svg>`;
/* ---------- algorithms ---------- */
function dij(s){const W=Wm(),n=W.length,D=Array(n).fill(INF),P=Array(n).fill(-1),S=[s],st=[];D[s]=0;
const oth=W.map((_,i)=>i).filter(i=>i!=s),snap=(t,w=-1)=>st.push({t,n:[...S],e:S.filter(i=>P[i]>=0).map(i=>P[i]+'-'+i),d:w>=0&&P[w]>=0?[P[w]+'-'+w]:[],h:`<div class="vw"><b>S</b><br>{${S.map(L).join(', ')}}</div>`+vec('Vector D',oth.map(L),oth.map(i=>f(D[i])))+vec('Vector P',oth.map(L),oth.map(i=>P[i]<0?'-':L(P[i])))});
for(let i=0;i<n;i++)if(i!=s&&W[s][i]<INF){D[i]=W[s][i];P[i]=s}
snap(`Start with S={${L(s)}}. D = direct cost from ${L(s)} (∞ = no direct road).`);
while(S.length<n){let w=-1;for(let i=0;i<n;i++)if(!S.includes(i)&&D[i]<INF&&(w<0||D[i]<D[w]))w=i;if(w<0){st.push({...st[st.length-1],t:'Nothing else is reachable: the remaining ∞ stay ∞. Done!'});break}
S.push(w);const ch=[];for(let m=0;m<n;m++)if(!S.includes(m)&&D[w]+W[w][m]<D[m]){D[m]=D[w]+W[w][m];P[m]=w;ch.push(L(m))}
snap(`Lock ${L(w)}: it has the smallest D (${D[w]}) among nodes not in S. ${ch.length?'Shortcut through it for '+ch.join(', ')+' → update D and P.':'No shortcut through it.'}`,w)}
return{st,title:'Vector D (minimum cost from '+L(s)+')',q:D.map((d,i)=>i==s?null:[L(i),f(d)]).filter(Boolean)}}
function floyd(){const W=Wm(),n=W.length,A=W.map((r,i)=>r.map((x,j)=>i==j?0:x)),P=A.map(r=>r.map(()=>-1)),st=[],H=['',...W.map((_,i)=>L(i))];
const mt=(r,k,ch)=>`<table class="m"><tr><th></th>${W.map((_,j)=>`<th class="${j==k?'rk':''}">${L(j)}</th>`).join('')}</tr>${r.map((row,i)=>`<tr><th class="${i==k?'rk':''}">${L(i)}</th>${row.map((x,j)=>`<td class="${i==k||j==k?'rk':''}" ${ch.includes(i+','+j)?'style="background:#86efac"':''}>${f(x)}</td>`).join('')}</tr>`).join('')}</table>`;
const snap=(t,ch=[],k=-1)=>st.push({t,n:[],e:[],h:`<div class="vw"><b>Vector A${k>=0?' (k = '+L(k)+')':''}</b>${mt(A,k,ch)}</div><div class="vw"><b>Vector P (middle node)</b>${mt(P.map(r=>r.map(x=>x<0?'-':L(x))),-1,[])}</div>`});
snap('Start: A = weights, 0 on the diagonal, ∞ where there is no arc.');
for(let k=0;k<n;k++){const ch=[],ms=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(A[i][k]+A[k][j]<A[i][j]){ms.push(`${L(i)} to ${L(j)} via ${L(k)} (${A[i][k]} + ${A[k][j]} = ${A[i][k]+A[k][j]}) is cheaper than ${f(A[i][j])}`);A[i][j]=A[i][k]+A[k][j];P[i][j]=k;ch.push(i+','+j)}
snap(`k = ${L(k)}: row and column ${L(k)} are outlined in red. ${ms.length?'Going '+ms.join('; ')+'. (green cells improved)':'No trip gets cheaper by stopping at '+L(k)+'.'}`,ch,k)}
return{st,A,n}}
function floydRun(){const{st,A,n}=floyd(),pr=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(i!=j)pr.push([i,j]);
return{st,mat:A.map(r=>r.map(f)),q:[1]}}
function centerRun(){const{st,A,n}=floyd(),ec=[...Array(n)].map((_,j)=>Math.max(...A.map(r=>r[j]))),m=Math.min(...ec),c=ec.indexOf(m);
st.push({t:`Eccentricity of a node = biggest number in its column of A. The smallest eccentricity wins → center = ${m<INF?L(c):'none (every column has ∞)'}.`,n:m<INF?[c]:[],e:[],h:tbl(['',...ec.map((_,i)=>L(i))],[['ecc',...ec.map(f)]])});
return{st,q:[...ec.map((x,j)=>['ecc('+L(j)+')',f(x)]),['Center node (number, or none)',m<INF?c+1:'none']]}}
function dfsRun(s){const W=Wm(),n=W.length,vis=[],o=[],te=[],st=[];
const go=(v,p)=>{vis[v]=1;o.push(v);if(p>=0)te.push(p+'-'+v);st.push({t:`Visit ${L(v)}${p>=0?' (came from '+L(p)+')':' (start)'}.`,n:[...o],e:[...te],h:`<p>Order so far: <b>${o.map(L).join(' → ')}</b></p>`});
for(let w=0;w<n;w++)if(W[v][w]<INF&&!vis[w])go(w,v);if(p>=0)st.push({t:`${L(v)} has no unvisited neighbours left → go back to ${L(p)}.`,n:[...o],e:[...te],h:`<p>Order so far: <b>${o.map(L).join(' → ')}</b></p>`})};
go(s,-1);return{st,q:[['Visit order from '+L(s)+' (lowest number first), e.g. 1 2 4',o.map(x=>x+1).join(' '),1]]}}
function primRun(s){const W=Wm(),n=W.length,U=[s],T2=[],st=[];let tot=0;const c=(i,j)=>Math.min(W[i][j],W[j][i]);
st.push({t:`Start with U={${L(s)}}. Arrow directions are ignored for Prim.`,n:[s],e:[],h:''});
while(U.length<n){let b=null;U.forEach(u=>{for(let v=0;v<n;v++)if(!U.includes(v)&&c(u,v)<INF&&(!b||c(u,v)<b[2]))b=[u,v,c(u,v)]});if(!b){st.push({...st[st.length-1],t:'No edge reaches the rest: the graph is not connected.'});break}
U.push(b[1]);T2.push(b[0]+'-'+b[1]);tot+=b[2];st.push({t:`Cheapest edge leaving U: ${L(b[0])}–${L(b[1])} (cost ${b[2]}). Add ${L(b[1])}.`,n:[...U],e:[...T2],d:[b[0]+'-'+b[1]],h:`<div class="vw"><b>U</b><br>{${U.map(L).join(', ')}}</div><div class="vw"><b>T (edges)</b><br>{${T2.map(x=>{const[a,c]=x.split('-');return '('+L(+a)+','+L(+c)+')'}).join(', ')}}</div><div class="vw"><b>Total cost</b><br>${tot}</div>`})}
return{st,q:[['Total cost of the MST (inf if not connected)',U.length==n?tot:'∞']]}}
function basicsRun(){const W=Wm(),n=W.length,E=G.edges.length,mx=G.dir?n*n-n:n*(n-1)/2;
const li=W.map((r,i)=>`${L(i)} → ${r.map((x,j)=>x<INF?L(j)+'('+x+')':'').filter(Boolean).join(', ')||'∅'}`).join('<br>');
return{st:[{t:'Here is your graph stored two ways.',n:[],e:[],h:'<b>Adjacency matrix</b>'+tbl(['',...W.map((_,i)=>L(i))],W.map((r,i)=>[L(i),...r.map(f)]))+'<b>Adjacency lists</b><p>'+li+'</p>'}],
q:[['Number of nodes n',n],[G.dir?'Number of arcs':'Number of edges',E],['Max possible '+(G.dir?'arcs':'edges')+' without loops (n²−n for directed)',mx],['Is it a complete graph? (yes/no)',E==mx?'yes':'no']]}}
/* ---------- trees ---------- */
const ins=(t,v)=>!t?{v,l:null,r:null}:(v<t.v?t.l=ins(t.l,v):v>t.v&&(t.r=ins(t.r,v)),t),mx=t=>t.r?mx(t.r):t.v;
const del=(t,v)=>{if(!t)return t;if(v<t.v)t.l=del(t.l,v);else if(v>t.v)t.r=del(t.r,v);else{if(!t.l)return t.r;if(!t.r)return t.l;t.v=mx(t.l);t.l=del(t.l,t.v)}return t};
const ht=t=>t?1+Math.max(ht(t.l),ht(t.r)):0,cnt=t=>t?1+cnt(t.l)+cnt(t.r):0,lv=(t,d=1)=>t?d+lv(t.l,d+1)+lv(t.r,d+1):0;
const pre=t=>t?[t.v,...pre(t.l),...pre(t.r)]:[],ino=t=>t?[...ino(t.l),t.v,...ino(t.r)]:[],post=t=>t?[...post(t.l),...post(t.r),t.v]:[];
const isAVL=t=>!t||Math.abs(ht(t.l)-ht(t.r))<=1&&isAVL(t.l)&&isAVL(t.r),isPBT=t=>!t||Math.abs(cnt(t.l)-cnt(t.r))<=1&&isPBT(t.l)&&isPBT(t.r);
const path=(t,v)=>{const p=[];while(t){p.push(t.v);if(v==t.v)break;t=v<t.v?t.l:t.r}return p},find=(t,v)=>{while(t&&t.v!=v)t=v<t.v?t.l:t.r;return t};
function setT(a){T=null;a.forEach(v=>T=ins(T,v));hv=[];drawT()}
function drawT(){const s=$('#ts');if(!s)return;const n=cnt(T);let i=0,h='';const pos=new Map();
const go=(t,d)=>{if(!t)return;go(t.l,d+1);pos.set(t,{x:30+i++*40,y:30+d*58});go(t.r,d+1)};go(T,0);
s.setAttribute('viewBox',`0 0 ${Math.max(n*40+30,300)} ${Math.max(ht(T)*58+30,120)}`);
pos.forEach((p,t)=>{[t.l,t.r].forEach(c=>{if(c){const q=pos.get(c);h+=`<line class="e" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`}})});
pos.forEach((p,t)=>{const bf=ht(t.l)-ht(t.r);h+=`<circle class="n ${hv.includes(t.v)?'nh':''}" cx="${p.x}" cy="${p.y}" r="16"/><text x="${p.x}" y="${p.y}">${t.v}</text>`;
if(PG[cur].avl)h+=`<text x="${p.x+20}" y="${p.y-18}" style="font-size:11px;fill:${Math.abs(bf)>1?'var(--bad)':'var(--ok)'}">${bf>0?'+':''}${bf}</text>`});
s.style.height=Math.max(ht(T)*58+30,120)*(s.clientWidth/Math.max(n*40+30,300))+'px';s.innerHTML=h;
$('#tinfo').innerHTML=T?`Nodes <b>${n}</b> · height <b>${ht(T)}</b> · average internal path (ALIP) <b>${(lv(T)/n).toFixed(2)}</b>`+(PG[cur].avl?` · AVL? <b>${isAVL(T)?'✅ yes':'❌ no'}</b> · PBT? <b>${isPBT(T)?'✅ yes':'❌ no'}</b>`:''):'Empty tree. Insert something!'}
function say(t){$('#tmsg').innerHTML=t}
function initTree(){$('#tp').onchange=e=>{const p=TP[e.target.value];if(p)setT(p);e.target.selectedIndex=0;say('')};
const v=()=>{const x=parseInt($('#tv').value);if(isNaN(x)){say('Type a number first.');return null}return x};
$('#bi').onclick=()=>{const x=v();if(x==null)return;if(find(T,x))return say(x+' already exists (BSTs ignore duplicates).');const p=path(T,x);T=ins(T,x);hv=[...p,x];say(`Insert ${x}: compare down the path <b>${p.join(' → ')||'(empty tree: it becomes the root)'}</b> (smaller → left, bigger → right) and hang it as a leaf.`);drawT()};
$('#bd').onclick=()=>{const x=v();if(x==null)return;const n=find(T,x);if(!n)return say(x+' is not in the tree.');
const sc=!n.l&&!n.r?'Scenery I (leaf): just remove it.':!n.l||!n.r?'Scenery II (one child): the child takes its place.':`Scenery III (two children): copy the biggest value of the left subtree (<b>${mx(n.l)}</b>) into this node, then delete that one.`;hv=path(T,x);T=del(T,x);say(`Delete ${x}: ${sc}`);drawT()};
$('#bs2').onclick=()=>{const x=v();if(x==null)return;const p=path(T,x);hv=p;say(`Search ${x}: ${p.join(' → ')||'(empty)'} → ${find(T,x)?'found ✅':'not found ❌'}`);drawT()};
$('#br').onclick=()=>{const a=new Set,n=6+Math.floor(Math.random()*4);while(a.size<n)a.add(1+Math.floor(Math.random()*50));setT([...a]);say('Random tree built by inserting in random order.')};
$('#bc').onclick=()=>{T=null;hv=[];drawT();say('')};
[['pre',pre,'Pre-order (N-L-R)'],['ino',ino,'In-order (L-N-R) = sorted!'],['pos',post,'Post-order (L-R-N)']].forEach(([id,fn,lb])=>$('#'+id).onclick=()=>{const q=fn(T);clearInterval(tm);let i=0;tm=setInterval(()=>{hv=q.slice(0,++i);drawT();say(lb+': <b>'+q.slice(0,i).join(' → ')+'</b>');if(i>=q.length)clearInterval(tm)},550)});
if(!T)setT(TP['Slides tree (p. 126)']);else drawT()}
const treeUI=()=>`<div class="bar"><input id="tv" type="number" placeholder="value"><button id="bi">Insert</button><button id="bd">Delete</button><button id="bs2">Search</button>
<select id="tp"><option>Examples…</option>${Object.keys(TP).map(k=>`<option>${k}</option>`).join('')}</select><button id="br">🎲 Random tree</button><button id="bc">Clear</button></div>
<div class="bar">Walk the tree: <button id="pre">Pre-order</button><button id="ino">In-order</button><button id="pos">Post-order</button></div>
<p id="tmsg" class="tip">Insert, delete or search and I’ll explain what happened.</p><div class="scroll"><svg id="ts"></svg></div><p id="tinfo"></p>`;
function treeRun(){if(!T)return{q:[]};if(PG[cur].avl)return{q:[['Is it an AVL tree? (yes/no)',isAVL(T)?'yes':'no'],['Is it a perfectly balanced tree (PBT)? (yes/no)',isPBT(T)?'yes':'no'],['Balance factor of the root (hleft − hright)',ht(T.l)-ht(T.r)]]};
return{q:[['In-order (e.g. 3 4 5)',ino(T).join(' '),1],['Pre-order',pre(T).join(' '),1],['Post-order',post(T).join(' '),1],['Height (a single node = 1)',ht(T)]]}}
/* ---------- pages ---------- */
const tip=(a,b)=>`<div class="tip"><b>${a}</b> ${b}</div>`;
const PG={
basics:{t:'Graph basics',run:basicsRun,learn:tip('🧒 Like you’re 5:','a graph is a map. <b>Nodes</b> = cities, <b>arcs</b> = roads. A <b>directed</b> graph has one-way roads; a <b>weight</b> is the cost (km, euros…) of a road.')+`<ul><li>With n nodes you can have at most <b>n² − n</b> arcs (no loops), n² with loops. All of them = <b>complete graph</b>. Zero arcs is the minimum.</li><li><b>Matrix</b> = a table “is there a road from row to column?”. Instant lookup O(1) but always uses n² memory → best for <b>heavy</b> graphs (many arcs).</li><li><b>Lists</b> = each city keeps a list of its roads. Memory only for real roads, but finding one means walking a list O(n) → best for <b>light</b> graphs (about 1 arc per node).</li></ul>`+tip('⚠️ Common mistake:','mixing up “nodes” (n) with “arcs”. Count them separately!')},
dij:{t:'Dijkstra (cheapest route from ONE node)',start:1,run:dij,learn:tip('🧒 Like you’re 5:','you’re a GPS standing in one city and you want the cheapest trip to every other city.')+`<ol><li>Put the start in the set <b>S</b> (done nodes). <b>D</b> = direct cost from start (∞ if no road). <b>P</b> = who we came from.</li><li>Pick the node <b>w</b> outside S with the <b>smallest D</b>. Lock it into S: its D can’t get better.</li><li>For every node m outside S: if <b>D[w] + weight(w,m) &lt; D[m]</b> you found a shortcut → update D[m] and P[m] = w.</li><li>Repeat n−1 times.</li></ol><p>Time: n−1 rounds × O(n) work = <b>O(n²)</b>.</p>`+tip('⚠️ Mistakes:','it gives costs from ONE start only; it breaks with <b>negative weights</b> (a loop could shrink the cost forever); put 1 on every arc to get minimum <i>length</i> instead of cost.')},
floyd:{t:'Floyd–Warshall (cheapest route between ALL pairs)',run:floydRun,learn:tip('🧒 Like you’re 5:','same GPS, but for every pair of cities at once. Trick: try each city k as a possible stop-over.')+`<ol><li>Matrix <b>A</b> starts as the weights, 0 on the diagonal, ∞ if no arc. Matrix <b>P</b> starts empty.</li><li>For each <b>k</b>, for each <b>i</b>, for each <b>j</b>: if <b>A[i][k] + A[k][j] &lt; A[i][j]</b> → A[i][j] gets that smaller value and P[i][j] = k.</li><li>To print a path i→j: look at k = P[i][j]. If empty, go direct. Otherwise print path(i,k), k, path(k,j).</li></ol><p>Three loops → <b>O(n³)</b>.</p>`+tip('💡 Trick:','in step k, row k and column k never change, so you can skip them when working on paper.')},
center:{t:'Center of a graph (uses Floyd)',run:centerRun,learn:tip('🧒 Like you’re 5:','where do you build the hospital so even the unluckiest person is as close as possible?')+`<ol><li>Run Floyd to get matrix A.</li><li><b>Eccentricity</b> of node v = the <b>biggest number in v’s column</b> (the worst trip that ends at v).</li><li>The <b>center</b> is the node with the <b>smallest eccentricity</b>.</li></ol>`+tip('⚠️ Mistake:','use the <i>column</i> (trips arriving at v), not the row. If a column has ∞ that node can’t be reached from everywhere.')},
dfs:{t:'Depth-First Search',start:1,run:dfsRun2,learn:tip('🧒 Like you’re 5:','you’re in a maze with chalk. Always walk forward to a new room, chalk it (visited). Dead end? Walk back until some room has an unchalked door.')+`<ol><li>Mark the node visited and print it.</li><li>For each neighbour not visited yet, repeat from that neighbour.</li><li>When nothing is left, return (backtrack).</li></ol><p>To cover <i>every</i> node (graph not connected) call it again from any node still unvisited, after one <code>resetVisited()</code>. Here neighbours are tried <b>lowest number first</b>.</p>`+tip('⚠️ Mistake:','forgetting the visited mark → infinite loops on cycles.')},
prim:{t:'Prim (Minimum Spanning Tree)',start:1,run:primRun,learn:tip('🧒 Like you’re 5:','connect all houses with the least cable. Start with one house, always add the cheapest cable that reaches a new house.')+`<ol><li>U = {start}, T = no edges.</li><li>Look at all edges with one end in U and the other outside. Take the <b>cheapest</b>.</li><li>Add the edge to T and the new node to U. Stop when U has every node (n−1 edges).</li></ol><p>Naive: O(n³); with auxiliary sorted vectors O(n²). Ties can give different trees, but <b>the total cost is always the same</b>.</p>`+tip('⚠️ Mistake:','a tree never has a cycle: if the edge joins two nodes already in U, skip it. Works on undirected graphs.')},
bst:{t:'Binary Search Tree',tree:1,run:treeRun,learn:tip('🧒 Like you’re 5:','a guessing game. At every node: smaller → go left, bigger → go right.')+`<ul><li><b>Insert:</b> walk down comparing, hang the new value as a leaf.</li><li><b>Delete</b> has 3 sceneries: <b>I</b> leaf → remove it; <b>II</b> one child → child takes its place; <b>III</b> two children → copy the <b>max of the left subtree</b> into the node, then delete that max (it’s a case I or II).</li><li><b>Traversals:</b> pre-order = N-L-R, in-order = L-N-R (gives sorted order!), post-order = L-R-N.</li><li><b>Speed depends on height:</b> between log₂n and n. Inserting 1,2,3,4… builds a stick (degenerate) → O(n). Try the “Degenerate” example!</li></ul>`+tip('⚠️ Mistake:','the traversal name says where the <b>node N</b> goes: before (pre), between (in) or after (post) its children.')},
avl:{t:'AVL trees (is it balanced?)',tree:1,avl:1,run:treeRun,learn:tip('🧒 Like you’re 5:','a see-saw at every node: the two sides may differ by at most one level.')+`<ul><li><b>AVL rule:</b> for every node |h<sub>left</sub> − h<sub>right</sub>| ≤ 1 (heights). The little number by each node is its balance factor (left − right).</li><li><b>PBT rule:</b> for every node |#nodes left − #nodes right| ≤ 1 (<b>counting nodes</b>, stricter).</li><li>Goal of AVL: keep search, insert and delete at <b>O(log₂n)</b> even in the worst case. PBTs also search in log₂n but rebuilding them after insert/delete is O(n).</li><li>An AVL tree can fail the PBT test (see the example). Rotations that repair a broken tree come later in your slides, so here you only <b>check</b>.</li></ul>`+tip('⚠️ Mistake:','checking only the root. The rule must hold at <b>every</b> node (red numbers show the culprits).')}};
const ORDER=Object.keys(PG);
function go(id){cur=id;clearInterval(tm);const p=PG[id];hl={n:[],e:[]};
$('#nav').innerHTML=ORDER.map(k=>`<button class="${k==id?'on':''}" onclick="go('${k}')">${PG[k].t.split(' (')[0]}</button>`).join('');
$('#main').innerHTML=`<details class="card" open><summary>📖 Learn: ${p.t}</summary>${p.learn}<div class="bar"><button id="dm">🎬 Watch a demo on a tiny example</button></div></details><div class="card">${p.tree?treeUI():graphUI()}</div><div class="card"><div class="bar">${p.start?'<label>Start node # <input id="sn0" type="number" min="1" value="1"></label>':''}${p.tree?'':'<button id="bs">▶ Show me step by step</button>'}<button id="bq">🧪 Quiz me</button></div><div id="qz"></div><div id="out"></div></div>`;
p.tree?initTree():initGraph();$('#dm').onclick=()=>demo(id);
const run=()=>{const s=p.start?Math.min(Math.max(+$('#sn0').value||1,1),G.nodes.length)-1:0;if(!p.tree&&!G.nodes.length)return null;return p.run(s)};
if($('#bs'))$('#bs').onclick=()=>{const R=run();$('#qz').innerHTML='';if(R)steps(R)};
$('#bq').onclick=()=>{const R=run();$('#out').innerHTML='';hl={n:[],e:[]};if(!p.tree)draw();R&&R.q.length?quiz(R):$('#qz').innerHTML='Add some nodes first!'}}
function steps(R){let i=0;$('#out').innerHTML=`<div class="bar"><button id="pv">◀ Prev</button><button id="nx">Next ▶</button><b id="sc0"></b></div><p id="stt" class="tip"></p><div class="scroll" id="sh"></div>`;
const u=()=>{const s=R.st[i];hl={n:s.n,e:s.e,d:s.d||[]};draw();$('#sc0').textContent=`Step ${i+1} / ${R.st.length}`;$('#stt').innerHTML=s.t;$('#sh').innerHTML=s.h};
$('#pv').onclick=()=>{i=Math.max(0,i-1);u()};$('#nx').onclick=()=>{i=Math.min(R.st.length-1,i+1);u()};u()}
const norm=v=>{v=v.trim().toLowerCase().replace(/\s+/g,' ');return v=='inf'||v=='infinity'?'∞':v=='y'?'yes':v=='n'?'no':v};
function mquiz(R){$('#qz').innerHTML=`<p><b>Fill in Vector A</b> (the final Floyd result; diagonal is given). Use <code>inf</code> for ∞.</p><table class="m"><tr><th></th>${R.mat.map((_,j)=>`<th>${L(j)}</th>`).join('')}</tr>${R.mat.map((r,i)=>`<tr><th>${L(i)}</th>${r.map((x,j)=>i==j?'<td>0</td>':`<td><input data-i="${i}" data-j="${j}"></td>`).join('')}</tr>`).join('')}</table><div class="bar"><button id="ck">✔ Check</button><b id="sc"></b><button id="rv">Show me the steps</button></div>`;
$('#ck').onclick=()=>{let ok=0,t=0;document.querySelectorAll('table.m input').forEach(el=>{t++;const a=String(R.mat[el.dataset.i][el.dataset.j]),c=norm(el.value)==a;ok+=c;el.style.outline='3px solid '+(c?'#16a34a':'#dc2626');el.title=c?'':'answer: '+a;if(!c&&el.value)el.style.color='#b91c1c'});$('#sc').textContent=ok==t?'🎉 Perfect!':`${ok} / ${t} correct (red = wrong; hover for the answer, or press Show me the steps)`};$('#rv').onclick=()=>steps(R)}
function quiz(R){if(R.mat)return mquiz(R);$('#qz').innerHTML=`<p><b>Your turn!</b> Work it out on paper, then type your answers (use <code>inf</code> for ∞).</p>${R.title?'<b>'+R.title+'</b>':''}<div class="qs">${R.q.map(([l],i)=>`<label>${l}<input data-i="${i}"><small></small></label>`).join('')}</div><div class="bar"><button id="ck">✔ Check</button><b id="sc"></b><button id="rv" style="display:none">Show me the steps</button></div>`;
$('#ck').onclick=()=>{let ok=0;document.querySelectorAll('.qs input').forEach(el=>{const[,a,sq]=R.q[el.dataset.i],g=sq?(el.value.match(/\d+/g)||[]).join(' '):norm(el.value),c=g==String(a).toLowerCase();ok+=c;el.className=c?'ok':'bad';el.nextElementSibling.textContent=c?'✓':'✗ answer: '+a});
$('#sc').textContent=ok==R.q.length?'🎉 Perfect!':`${ok} / ${R.q.length} correct`;if(R.st){$('#rv').style.display='';$('#rv').onclick=()=>steps(R)}}}
go('basics');
</script></body></html>
