out 1 arc per node).\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Common mistake:','mixing up \u201cnodes\u201d (n) with \u201carcs\u201d. Count them separately!')},\ndij:{t:'Dijkstra (cheapest route from ONE node)',start:1,run:dij,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','you\u2019re a GPS standing in one city and you want the cheapest trip to every other city.')+`\u003col>\u003cli>Put the start in the set \u003cb>S\u003c/b> (done nodes). \u003cb>D\u003c/b> = direct cost from start (\u221e if no road). \u003cb>P\u003c/b> = who we came from.\u003c/li>\u003cli>Pick the node \u003cb>w\u003c/b> outside S with the \u003cb>smallest D\u003c/b>. Lock it into S: its D can\u2019t get better.\u003c/li>\u003cli>For every node m outside S: if \u003cb>D[w] + weight(w,m) &lt; D[m]\u003c/b> you found a shortcut \u2192 update D[m] and P[m] = w.\u003c/li>\u003cli>Repeat n\u22121 times.\u003c/li>\u003c/ol>\u003cp>Time: n\u22121 rounds \u00d7 O(n) work = \u003cb>O(n\u00b2)\u003c/b>.\u003c/p>`+tip('\u26a0\ufe0f Mistakes:','it gives costs from ONE start only; it breaks with \u003cb>negative weights\u003c/b> (a loop could shrink the cost forever); put 1 on every arc to get minimum \u003ci>length\u003c/i> instead of cost.')},\nfloyd:{t:'Floyd\u2013Warshall (cheapest route between ALL pairs)',run:floydRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','same GPS, but for every pair of cities at once. Trick: try each city k as a possible stop-over.')+`\u003col>\u003cli>Matrix \u003cb>A\u003c/b> starts as the weights, 0 on the diagonal, \u221e if no arc. Matrix \u003cb>P\u003c/b> starts empty.\u003c/li>\u003cli>For each \u003cb>k\u003c/b>, for each \u003cb>i\u003c/b>, for each \u003cb>j\u003c/b>: if \u003cb>A[i][k] + A[k][j] &lt; A[i][j]\u003c/b> \u2192 A[i][j] gets that smaller value and P[i][j] = k.\u003c/li>\u003cli>To print a path i\u2192j: look at k = P[i][j]. If empty, go direct. Otherwise print path(i,k), k, path(k,j).\u003c/li>\u003c/ol>\u003cp>Three loops \u2192 \u003cb>O(n\u00b3)\u003c/b>.\u003c/p>`+tip('\ud83d\udca1 Trick:','in step k, row k and column k never change, so you can skip them while solving.')},\ncenter:{t:'Center of a graph (uses Floyd)',run:centerRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','where do you build the hospital so even the unluckiest person is as close as possible?')+`\u003col>\u003cli>Run Floyd to get matrix A.\u003c/li>\u003cli>\u003cb>Eccentricity\u003c/b> of node v = the \u003cb>biggest number in v\u2019s column\u003c/b> (the worst trip that ends at v).\u003c/li>\u003cli>The \u003cb>center\u003c/b> is the node with the \u003cb>smallest eccentricity\u003c/b>.\u003c/li>\u003c/ol>`+tip('\u26a0\ufe0f Mistake:','use the \u003ci>column\u003c/i> (trips arriving at v), not the row. If a column has \u221e that node can\u2019t be reached from everywhere.')},\ndfs:{t:'Depth-First Search',start:1,run:dfsRun2,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','you\u2019re in a maze with chalk. Always walk forward to a new room, chalk it (visited). Dead end? Walk back until some room has an unchalked door.')+`\u003col>\u003cli>Mark the node visited and print it.\u003c/li>\u003cli>For each neighbour not visited yet, repeat from that neighbour.\u003c/li>\u003cli>When nothing is left, return (backtrack).\u003c/li>\u003c/ol>\u003cp>To cover \u003ci>every\u003c/i> node (graph not connected) call it again from any node still unvisited, after one \u003ccode>resetVisited()\u003c/code>. Here neighbours are tried \u003cb>lowest number first\u003c/b>.\u003c/p>`+tip('\u26a0\ufe0f Mistake:','forgetting the visited mark \u2192 infinite loops on cycles.')},\nprim:{t:'Prim (Minimum Spanning Tree)',start:1,run:primRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','connect all houses with the least cable. Start with one house, always add the cheapest cable that reaches a new house.')+`\u003col>\u003cli>U = {start}, T = no edges.\u003c/li>\u003cli>Look at all edges with one end in U and the other outside. Take the \u003cb>cheapest\u003c/b>.\u003c/li>\u003cli>Add the edge to T and the new node to U. Stop when U has every node (n\u22121 edges).\u003c/li>\u003c/ol>\u003cp>Naive: O(n\u00b3); with auxiliary sorted vectors O(n\u00b2). Ties can give different trees, but \u003cb>the total cost is always the same\u003c/b>.\u003c/p>`+tip('\u26a0\ufe0f Mistake:','a tree never has a cycle: if the edge joins two nodes already in U, skip it. Works on undirected graphs.')},\nbst:{t:'Binary Search Tree',tree:1,run:treeRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a guessing game. At every node: smaller \u2192 go left, bigger \u2192 go right.')+`\u003cul>\u003cli>\u003cb>Insert:\u003c/b> walk down comparing, hang the new value as a leaf.\u003c/li>\u003cli>\u003cb>Delete\u003c/b> has 3 sceneries: \u003cb>I\u003c/b> leaf \u2192 remove it; \u003cb>II\u003c/b> one child \u2192 child takes its place; \u003cb>III\u003c/b> two children \u2192 copy the \u003cb>max of the left subtree\u003c/b> into the node, then delete that max (it\u2019s a case I or II).\u003c/li>\u003cli>\u003cb>Traversals:\u003c/b> pre-order = N-L-R, in-order = L-N-R (gives sorted order!), post-order = L-R-N.\u003c/li>\u003cli>\u003cb>Speed depends on height:\u003c/b> between log\u2082n and n. Inserting 1,2,3,4\u2026 builds a stick (degenerate) \u2192 O(n). Try the \u201cDegenerate\u201d example!\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Mistake:','the traversal name says where the \u003cb>node N\u003c/b> goes: before (pre), between (in) or after (post) its children.')},\ntrav:{t:'Traversals (pre / in / post)',tree:1,run:treeRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','you walk around a tree statue, hugging it with your hand, and shout a node\u2019s number when you pass a certain spot on it. Different spot = different traversal.')+`\u003csvg viewBox='0 0 360 165' style='max-width:440px;width:100%;display:block;margin:auto;background:none;border:0'>${[[180,28,90,88],[180,28,270,88]].map(([a,b,c,d])=>`\u003cline class='e' x1='${a}' y1='${b}' x2='${c}' y2='${d}'/>`).join('')}${[[180,28,5],[90,88,3],[270,88,8]].map(([x,y,v])=>`\u003ccircle class='n' cx='${x}' cy='${y}' r='16'/>\u003ctext x='${x}' y='${y}'>${v}\u003c/text>\u003ccircle cx='${x-26}' cy='${y}' r='6' fill='#ef4444'/>\u003ccircle cx='${x}' cy='${y+27}' r='6' fill='#16a34a'/>\u003ccircle cx='${x+26}' cy='${y}' r='6' fill='#3b82f6'/>`).join('')}\u003c/svg>\u003cp>\ud83d\udd34 \u003cb>Pre-order\u003c/b>: shout the number when you pass its \u003cb>left\u003c/b> dot \u2192 \u003cb>5 3 8\u003c/b>\u003cbr>\ud83d\udfe2 \u003cb>In-order\u003c/b>: when you pass the dot \u003cb>below\u003c/b> \u2192 \u003cb>3 5 8\u003c/b>\u003cbr>\ud83d\udd35 \u003cb>Post-order\u003c/b>: when you pass its \u003cb>right\u003c/b> dot \u2192 \u003cb>3 8 5\u003c/b>\u003c/p>\u003col>\u003cli>\u003cb>Pre-order N-L-R\u003c/b>\u003cbr>Node, then the whole Left subtree, then the whole Right subtree.\u003c/li>\u003cli>\u003cb>In-order L-N-R\u003c/b>\u003cbr>Left subtree, Node, Right subtree. On a BST this prints the numbers \u003cb>sorted\u003c/b>.\u003c/li>\u003cli>\u003cb>Post-order L-R-N\u003c/b>\u003cbr>Both subtrees first, the Node last.\u003c/li>\u003c/ol>`+tip('\ud83d\udca1 Memory trick:','the letter N shows where the Node goes: Pre = before, In = in between, Post = after its children.')+tip('\u26a0\ufe0f Mistake:','the rule applies inside \u003cb>every\u003c/b> subtree, not only at the root. Press \u201c\u270d Solve it here\u201d and the app tells you why a step is wrong.')},\navl:{t:'AVL trees (is it balanced?)',tree:1,avl:1,run:treeRun,learn:tip('\ud83e\uddd2 Like you\u2019re 5:','a see-saw at every node: the two sides may differ by at most one level.')+`\u003cul>\u003cli>\u003cb>AVL rule:\u003c/b> for every node |h\u003csub>left\u003c/sub> \u2212 h\u003csub>right\u003c/sub>| \u2264 1 (heights). The little number by each node is its balance factor (left \u2212 right).\u003c/li>\u003cli>\u003cb>PBT rule:\u003c/b> for every node |#nodes left \u2212 #nodes right| \u2264 1 (\u003cb>counting nodes\u003c/b>, stricter).\u003c/li>\u003cli>Goal of AVL: keep search, insert and delete at \u003cb>O(log\u2082n)\u003c/b> even in the worst case. PBTs also search in log\u2082n but rebuilding them after insert/delete is O(n).\u003c/li>\u003cli>An AVL tree can fail the PBT test (see the example). Rotations that repair a broken tree come later in your slides, so here you only \u003cb>check\u003c/b>.\u003c/li>\u003c/ul>`+tip('\u26a0\ufe0f Mistake:','checking only the root. The rule must hold at \u003cb>every\u003c/b> node (the balance numbers will show the culprits).')},\nwordle:{t:'Daily Golf \u26f3',game:1}};\nconst ORDER=Object.keys(PG);\nfunction go(id){cur=id;clearInterval(tm);const p=PG[id];hl={n:[],e:[]};\n$('#nav').innerHTML=ORDER.map(k=>`\u003cbutton class=\"${k==id?'on':''}\" onclick=\"go('${k}')\">${PG[k].t.split(' (')[0]}\u003c/button>`).join('');\ndocument.onkeydown=null;if(p.game){$('#main').innerHTML='\u003cdiv class=\"card\" id=\"wd\">\u003c/div>';return daily()}\n$('#main').innerHTML=`\u003cdetails class=\"card\" open>\u003csummary>\ud83d\udcd6 Learn: ${p.t}\u003c/summary>${p.learn}\u003cdiv class=\"bar\">\u003cbutton id=\"dm\">\ud83c\udfac Watch a demo on a tiny example\u003c/button>\u003c/div>\u003c/details>\u003cdiv class=\"card\">${p.tree?treeUI():graphUI()}\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">${p.start?'\u003clabel>Start node # \u003cinput id=\"sn0\" type=\"number\" min=\"1\" value=\"1\">\u003c/label>':''}${p.tree?'':'\u003cbutton id=\"bs\">\u25b6 Show me step by step\u003c/button>'}\u003cbutton id=\"bq\">\u270d Solve it here\u003c/button>\u003c/div>\u003cdiv id=\"qz\">\u003c/div>\u003cdiv id=\"out\">\u003c/div>\u003c/div>`;\np.tree?initTree():initGraph();$('#dm').onclick=()=>demo(id);\nconst run=()=>{const s=p.start?Math.min(Math.max(+$('#sn0').value||1,1),G.nodes.length)-1:0;if(!p.tree&&!G.nodes.length)return null;return p.run(s)};\nif($('#bs'))$('#bs').onclick=()=>{const R=run();$('#qz').innerHTML='';if(R)steps(R)};\n$('#bq').onclick=()=>{if(id=='avl')return avlQ();if(id=='trav')return travWalk();const R=run();$('#out').innerHTML='';hl={n:[],e:[]};if(!p.tree)draw();!R||!R.q.length?$('#qz').innerHTML='Add some nodes first!':R.st&&R.st.some(s=>s.f||s.m)?solve(R):quiz(R)}}\nfunction steps(R){let i=0;$('#out').innerHTML=`\u003cdiv class=\"bar\">\u003cbutton id=\"pv\">\u25c0 Prev\u003c/button>\u003cbutton id=\"nx\">Next \u25b6\u003c/button>\u003cb id=\"sc0\">\u003c/b>\u003c/div>\u003cp id=\"stt\" class=\"tip\">\u003c/p>\u003cdiv class=\"scroll\" id=\"sh\">\u003c/div>`;\nconst u=()=>{const s=R.st[i];hl={n:s.n,e:s.e,d:s.d||[]};draw();$('#sc0').textContent=`Step ${i+1} / ${R.st.length}`;$('#stt').innerHTML=s.t;$('#sh').innerHTML=s.h};\n$('#pv').onclick=()=>{i=Math.max(0,i-1);u()};$('#nx').onclick=()=>{i=Math.min(R.st.length-1,i+1);u()};u()}\nconst norm=v=>{v=v.trim().toLowerCase().replace(/\\s+/g,' ');return v=='inf'||v=='infinity'?'\u221e':v=='y'?'yes':v=='n'?'no':v};\nfunction mquiz(R){$('#qz').innerHTML=`\u003cp>\u003cb>Fill in Vector A\u003c/b> (the final Floyd result; diagonal is given). Use \u003ccode>inf\u003c/code> for \u221e.\u003c/p>\u003ctable class=\"m\">\u003ctr>\u003cth>\u003c/th>${R.mat.map((_,j)=>`\u003cth>${L(j)}\u003c/th>`).join('')}\u003c/tr>${R.mat.map((r,i)=>`\u003ctr>\u003cth>${L(i)}\u003c/th>${r.map((x,j)=>i==j?'\u003ctd>0\u003c/td>':`\u003ctd>\u003cinput data-i=\"${i}\" data-j=\"${j}\">\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/table>\u003cdiv class=\"bar\">\u003cbutton id=\"ck\">\u2714 Check\u003c/button>\u003cb id=\"sc\">\u003c/b>\u003cbutton id=\"rv\">Show me the steps\u003c/button>\u003c/div>`;\n$('#ck').onclick=()=>{let ok=0,t=0;document.querySelectorAll('table.m input').forEach(el=>{t++;const a=String(R.mat[el.dataset.i][el.dataset.j]),c=norm(el.value)==a;ok+=c;el.style.outline='3px solid '+(c?'#16a34a':'#dc2626');el.title=c?'':'answer: '+a;if(!c&&el.value)el.style.color='#b91c1c'});$('#sc').textContent=ok==t?'\ud83c\udf89 Perfect!':`${ok} / ${t} correct (red = wrong; hover for the answer, or press Show me the steps)`};$('#rv').onclick=()=>steps(R)}\nfunction quiz(R){if(R.mat)return mquiz(R);$('#qz').innerHTML=`\u003cp>\u003cb>Your turn!\u003c/b> Type your answers (use \u003ccode>inf\u003c/code> for \u221e).\u003c/p>${R.title?'\u003cb>'+R.title+'\u003c/b>':''}\u003cdiv class=\"qs\">${R.q.map(([l],i)=>`\u003clabel>${l}\u003cinput data-i=\"${i}\">\u003csmall>\u003c/small>\u003c/label>`).join('')}\u003c/div>\u003cdiv class=\"bar\">\u003cbutton id=\"ck\">\u2714 Check\u003c/button>\u003cb id=\"sc\">\u003c/b>\u003cbutton id=\"rv\" style=\"display:none\">Show me the steps\u003c/button>\u003c/div>`;\n$('#ck').onclick=()=>{let ok=0;document.querySelectorAll('.qs input').forEach(el=>{const[,a,sq]=R.q[el.dataset.i],g=sq?(el.value.match(/\\d+/g)||[]).join(' '):norm(el.value),c=g==String(a).toLowerCase();ok+=c;el.className=c?'ok':'bad';el.nextElementSibling.textContent=c?'\u2713':'\u2717 answer: '+a});\n$('#sc').textContent=ok==R.q.length?'\ud83c\udf89 Perfect!':`${ok} / ${R.q.length} correct`;if(R.st){$('#rv').style.display='';$('#rv').onclick=()=>steps(R)}}}\ngo('basics');\n\u003c/script>\u003c/body>\u003c/html>\n", "logic": "\u003c!DOCTYPE html>\u003chtml data-theme=\"light\" lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>Logic Lab\u003c/title>\u003cstyle>\n:root{--bg:#fafaf7;--fg:#1c1c1a;--mu:#6b6b66;--cd:#fff;--bd:#dcdcd4;--ac:#0f766e;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141413;--fg:#eceae4;--mu:#9a9a92;--cd:#1e1e1c;--bd:#3a3a36;--ac:#2dd4bf;--ok:#4ade80;--no:#f87171;color-scheme:dark}}\n:root[data-theme=dark]{--bg:#141413;--fg:#eceae4;--mu:#9a9a92;--cd:#1e1e1c;--bd:#3a3a36;--ac:#2dd4bf;--ok:#4ade80;--no:#f87171;color-scheme:dark}\nhtml{scroll-pad 03c.5);return'dom=A,B; p={'+t+'}; q={'+d.filter(()=>Math.random()\u003c.5)+'}; a='+pick(d)}\nfunction gen(c){let r=Math.random()\u003c.5;switch(c){case'evalp':return{c,d:{f:rf(),I:'p:'+pick('TF')+', q:'+pick('TF')+', r:'+pick('TF')}};case'cnf':case'class':return{c,d:r?rf():pick(B[c])};case'entail':return r?{c,d:['Random',[rf(2),rf(2)],rf(2)]}:{c,d:pick(B.entail)};case'pev':return{c,d:[pick(TP),rmodel()]}}return{c,d:pick(B[c])}}\nlet S={d:'prop',m:'tut',c:'cnf',i:0,mist:[],ok:0,no:0,ex:null,mi:-1};\nconst CATS={prop:{wff:'Syntax',formal:'Formalization',evalp:'Evaluation',cnf:'CNF',class:'Classification',entail:'Soundness'},pred:{pev:'Evaluation',pform:'Formalization'}};\nconst MODES={tut:'Tutorial',prac:'Practice',rand:'Random',ct:'Contradiction',ls:'Rule lessons',nd:'Deduction',wd:'Symbolix \ud83c\udfae',sim:'Simulator',mist:'Mistakes'};\nfunction nav(){$('#n1').innerHTML=[['prop','Propositional logic'],['pred','Predicate logic']].map(([k,v])=>`\u003cbutton class=\"${S.d==k?'on':''}\" onclick=\"S.d='${k}';S.c=Object.keys(CATS[S.d])[1-1];S.i=0;go()\">${v}\u003c/button>`).join('');\n$('#n2').innerHTML=Object.entries(MODES).map(([k,v])=>`\u003cbutton class=\"${S.m==k?'on':''}\" onclick=\"S.m='${k}';S.i=0;go()\">${v}${k=='mist'?' ('+S.mist.length+')':''}\u003c/button>`).join('')+`\u003cspan class=mu style=\"align-self:center\">\u2713 ${S.ok} \u00b7 \u2717 ${S.no}\u003c/span>`;\n$('#n3').innerHTML=S.m=='prac'||S.m=='rand'?Object.entries(CATS[S.d]).map(([k,v])=>`\u003cbutton class=\"${S.c==k?'on':''}\" onclick=\"S.c='${k}';S.i=0;go()\">${v}\u003c/button>`).join(''):''}\nfunction go(){nav();({tut,prac:ex,rand:ex,ct,ls,nd,wd,sim,mist:mi})[S.m]()}\nconst sec=(h,b)=>`\u003cdiv class=card>\u003ch3>${h}\u003c/h3>${b}\u003c/div>`;\nfunction tut(){$('#M').innerHTML=S.d=='prop'?\nsec('1 \u00b7 Syntax and formalization','Atoms p, q, r; connectives \u00ac \u2227 \u2228 \u2192 \u2194. Precedence: \u00ac > \u2227 > \u2228 > \u2192 > \u2194. A formula is well formed if every connective sits between two formulas (no \u003ccode>r(p\u2227q)\u003c/code>, no \u003ccode>p\u00ac\u003c/code>).\u003cpre>if p then q \u00b7 p only if q \u00b7 p is sufficient for q  \u2192  p\u2192q\\np is necessary for q  \u2192  q\u2192p\\np unless q  \u2192  \u00acq\u2192p  \u2261  p\u2228q\\nnot p unless q  \u2192  p\u2192q\\nsufficient but not necessary  \u2192  (p\u2192q)\u2227\u00ac(q\u2192p)\\nnot sufficient  \u2192  \u00ac(p\u2192q)\\nif p then q else r  \u2192  (p\u2192q)\u2227(\u00acp\u2192r)\u003c/pre>')+\nsec('2 \u00b7 Truth tables and classification','Valid = true under every interpretation. Unsatisfiable = false under every one. Otherwise satisfiable (not valid). \u003cb>Proof by contradiction\u003c/b>: assume the formula is false, propagate truth values; if you always hit a contradiction it is valid. Split in cases when you must; \u003ci>every\u003c/i> case must contradict. A case without contradiction gives a counterexample.')+\nsec('3 \u00b7 Logical consequence','Thm I: {P1\u2026Pn} \u22a8 Q is sound iff P1\u2227\u2026\u2227Pn\u2192Q is valid. Thm II: it is sound iff {P1\u2026Pn, \u00acQ} is inconsistent (unsatisfiable). Premises true and conclusion false = counterexample.')+\nsec('4 \u00b7 CNF','1) Eliminate \u2194 and \u2192 (\u003ccode>A\u2192B \u2261 \u00acA\u2228B\u003c/code>). 2) Push \u00ac inwards (De Morgan) and cancel \u00ac\u00ac. 3) Distribute: \u003ccode>A\u2228(B\u2227C) \u2261 (A\u2228B)\u2227(A\u2228C)\u003c/code>. 4) Simplify: drop clauses with p\u2228\u00acp, duplicates, absorbed clauses. In CNF: valid iff every clause is a tautology (result True); unsatisfiable iff some clause is empty/contradiction; to falsify, make one clause false.')+\nsec('5 \u00b7 Resolution','Premises + negated conclusion \u2192 clauses. From (A\u2228l) and (B\u2228\u00acl) derive (A\u2228B). Reaching the empty clause \u25a1 means inconsistent, so the reasoning is \u003cb>sound\u003c/b>. If no new clauses appear and \u25a1 was never derived, the set is consistent and the reasoning is \u003cb>not sound\u003c/b>. Add each resolvent to the set; write proofs as numbered lines Res(i,j).')+\nsec('6 \u00b7 Natural deduction','Rules: \u2227I, \u2227E, \u2228I, \u2228E (cases), \u2192I (assume A, derive B, discharge), \u2192E (modus ponens), \u00acI/\u00acE (assume, reach contradiction), \u2194I, \u2194E. Strategy: work backwards from the goal. Goal A\u2192B: assume A. Goal \u00acA: assume A, get \u22a5. Premise A\u2228B: prove the goal in both cases. Since \u22a2 and \u22a8 agree, use \u003ci>Soundness\u003c/i> practice to learn whether a derivation exists before attempting it.'):\nsec('1 \u00b7 Symbols','Constants (a, b, l), variables (x, y), predicates with arity p(x,y), q(x), functions f(x). Write \u2200x and \u2203x (buttons, or \u003ccode>all x\u003c/code> / \u003ccode>ex x\u003c/code>). Quantifiers bind the next unit: \u003ccode>\u2200x(p(x)\u2192q(x))\u003c/code>.')+\nsec('2 \u00b7 Formalization patterns','\u003cpre>All S are P        \u2200x(S(x)\u2192P(x))\\nSome S are P       \u2203x(S(x)\u2227P(x))\\nNo S is P          \u00ac\u2203x(S(x)\u2227P(x))  \u2261  \u2200x(S(x)\u2192\u00acP(x))\\nNot all S are P    \u00ac\u2200x(S(x)\u2192P(x))\\nEverybody loves somebody  \u2200x\u2203y L(x,y)\\nSomebody loves everybody  \u2203x\u2200y L(x,y)\u003c/pre>Never pair \u2200 with \u2227, or \u2203 with \u2192, for restricted statements. \"p unless q\" and \"only when\" follow the propositional patterns. Answers are tested against the reference on many random models, so any equivalent formula is accepted.')+\nsec('3 \u00b7 Interpretations and evaluation','An interpretation gives a domain, the extension of each predicate (set of tuples) and a value for each constant. \u2200x F is true iff F holds for \u003ci>every\u003c/i> d in the domain; \u2203x F iff for \u003ci>some\u003c/i> d. Evaluate inside-out, trying each element. Write it as \u003ccode>dom=A,B; p={(A,B),(B,B)}; q={A}; a=B\u003c/code>.')}\nfunction exH(e){let d=e.d,c=e.c,q='',a='';const btn=(v,l)=>`\u003cbutton onclick=\"jd('${v}')\">${l}\u003c/button>`,inp=`\u003cinput id=ans placeholder=\"Your formula\" autocomplete=off>\u003cdiv class=row>\u003cbutton class=on onclick=\"jd($('#ans').value)\">Check\u003c/button>\u003c/div>`;\nif(c=='wff')q='Is this a well-formed formula?\u003cdiv class=f>'+d+'\u003c/div>',a=btn('y','Yes')+btn('n','No');\nif(c=='formal'||c=='pform')q='Formalize:\u003cbr>\u003cb>'+d[0]+'\u003c/b>',a=inp;\nif(c=='evalp')q='Evaluate under I = {'+d.I+'}\u003cdiv class=f>'+d.f+'\u003c/div>',a=btn('T','True')+btn('F','False');\nif(c=='cnf')q='Write in CNF:\u003cdiv class=f>'+d+'\u003c/div>',a=inp;\nif(c=='class')q='Classify:\u003cdiv class=f>'+d+'\u003c/div>',a=btn('valid','Valid')+btn('sat','Satisfiable, not valid')+btn('unsat','Unsatisfiable');\nif(c=='entail')q='\u003cspan class=mu>'+d[0]+'\u003c/span>\u003cdiv class=f>{ '+d[1].join(',  ')+' } \u22a8 '+d[2]+'\u003c/div>Is the reasoning sound?',a=btn('s','Sound')+btn('n','Not sound');\nif(c=='pev')q='Evaluate:\u003cdiv class=f>'+d[0]+'\u003c/div>under \u003ccode>'+d[1]+'\u003c/code>'+mview(pint(d[1])),a=btn('T','True')+btn('F','False');\nif(c=='puz')q=puzQ(d),a=puzA(d);return`\u003cdiv class=card>${q}\u003cdiv class=row>${c=='formal'||c=='pform'||c=='cnf'?'':''}${a}\u003c/div>\u003cdiv id=fb>\u003c/div>\u003c/div>`}\nfunction ex(){S.ex=S.m=='rand'||S.c=='evalp'||S.c=='pev'&&0?gen(S.c):{c:S.c,d:B[S.c][S.i%B[S.c].length]};if(S.m=='prac'&&S.c=='evalp')S.ex=gen('evalp');show()}\nfunction show(){const e=S.ex;$('#M').innerHTML=exH(e)+`\u003cdiv class=row>${S.m=='prac'&&B[e.c]?`\u003cbutton onclick=\"S.i=(S.i+${B[e.c].length}-1)%${B[e.c].length};ex()\">\u2190 Prev\u003c/button>\u003cspan class=mu style=\"align-self:center\">${S.i%B[e.c].length+1}/${B[e.c].length}\u003c/span>`:''}\u003cbutton onclick=\"S.i++;ex()\">${S.m=='rand'?'New random':'Next \u2192'}\u003c/button>\u003cbutton onclick=\"tutHint()\">Tutorial\u003c/button>\u003c/div>`;pal()}\nfunction tutHint(){S.m='tut';go()}\nfunction pal(){$('#M').insertAdjacentHTML('beforeend','\u003cdiv class=row>'+['\u00ac','\u2227','\u2228','\u2192','\u2194','\u2200','\u2203','(',')'].filter(s=>S.d=='pred'||!'\u2200\u2203'.includes(s)).map(s=>`\u003cbutton onmousedown=\"event.preventDefault()\" onclick=\"ins('${s}')\">${s}\u003c/button>`).join('')+'\u003c/div>')}\nlet last=null;document.addEventListener('focusin',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))last=e.target});\nfunction ins(s){let t=last&&document.body.contains(last)?last:$('input,textarea');if(!t)return;t.focus();let a=t.selectionStart??t.value.length;t.value=t.value.slice(0,a)+s+t.value.slice(t.selectionEnd??a);t.selectionStart=t.selectionEnd=a+1}\nfunction judge(e,a){let c=e.c,d=e.d,ok,h='',pr=S.d=='pred';\nif(c=='wff'){let w=1;try{parse(d)}catch(x){w=0;h=x.message}ok=(a=='y')==!!w;h=w?'It is well formed.':'Not well formed: '+h+'.'}\nif(c=='formal'){let u=parse(a),s=parse(d[1]),w=eqv(u,s);ok=!w;h=(ok?'Equivalent to the reference.':'Differs from the reference under \u003ccode>'+ist(w)+'\u003c/code>: yours = '+(ev(u,w)?'T':'F')+', reference = '+(ev(s,w)?'T':'F')+'.')+'\u003cbr>Reference: \u003cb>'+sh(s)+'\u003c/b>'}\nif(c=='evalp'){let I={};d.I.split(', ').forEach(x=>I[x[0]]=x[2]=='T');let f=parse(d.f),v=ev(f,I);ok=(a=='T')==v;h='Value: \u003cb>'+(v?'True':'False')+'\u003c/b>\u003cpre>'+subs(f,I).join('\\n')+'\u003c/pre>'}\nif(c=='cnf'){let f=parse(d),u=parse(a),C=cnf(f);let eq=eqv(u,f);ok=isC(u)&&!eq;h=(!isC(u)?'Not in CNF (need a conjunction of disjunctions of literals). ':eq?'Not equivalent: differs under \u003ccode>'+ist(eq)+'\u003c/code>. ':'Correct. ')+'\u003cbr>Reference CNF: \u003cb>'+cs(C)+'\u003c/b>\u003cbr>'+(!C.length?'No clauses: the formula is \u003cb>valid\u003c/b>.':C.some(c=>!c.length)?'Empty clause: \u003cb>unsatisfiable\u003c/b>.':'Not valid: falsify one clause, e.g. \u003ccode>'+ist(cls(f).c||{})+'\u003c/code>.')}\nif(c=='class'){let f=parse(d),r=cls(f);ok=a==r.type;h='Answer: \u003cb>'+{valid:'valid',sat:'satisfiable but not valid',unsat:'unsatisfiable'}[r.type]+'\u003c/b>.'+(r.c?' Falsified by \u003ccode>'+ist(r.c)+'\u003c/code>.':'')+(r.m?' Model: \u003ccode>'+ist(r.m)+'\u003c/code>.':'')+tbl(r.vs,[f],I=>!ev(f,I))}\nif(c=='entail'){let P=d[1].map(x=>parse(x)),Q=parse(d[2]),w=ent(P,Q),C=[...P.flatMap(p=>cnf(p)),...cnf({t:'n',a:Q})],R=res(C);ok=(a=='s')==!w;h=w?'\u003cb>Not sound.\u003c/b> Counterexample \u003ccode>'+ist(w)+'\u003c/code> makes every premise true and the conclusion false. Resolution saturates without \u25a1 over the clauses {'+C.map(x=>x.join('\u2228')).join(', ')+'}.':'\u003cb>Sound.\u003c/b> No counterexample. Resolution on premises + \u00acconclusion:\u003cpre>'+proof(R)+'\u003c/pre>';if(!w)h+=R.ok?'':'';h+=tbl(vsOf([...P,Q]),[...P,Q],I=>P.every(p=>ev(p,I))&&!ev(Q,I))}\nif(c=='pev'){let f=parse(d[0],1),M=pint(d[1]),v=pev(f,M);ok=(a=='T')==v;h='Value: \u003cb>'+(v?'True':'False')+'\u003c/b>'+wit(f,M)}\nif(c=='pform'){let u=parse(a,1),s=parse(d[1],1),w=peq(u,s);ok=!w;h=(ok?'Equivalent to the reference (tested on 800 random models).':'Differs in the model \u003ccode>'+mstr(w)+'\u003c/code>: yours = '+pev(u,w)+', reference = '+pev(s,w)+'.')+'\u003cbr>Reference: \u003cb>'+sh(s)+'\u003c/b>'}\nif(c=='puz'){let r=puzJ(d,a);ok=r.ok;h=r.h}return{ok,h}}\nfunction jd(a){let r;try{r=judge(S.ex,a)}catch(x){$('#fb').innerHTML='\u003cp class=no>Syntax error: '+x.message+'\u003c/p>';return}\n$('#fb').innerHTML='\u003cp class='+(r.ok?'ok>\u2713 Correct':'no>\u2717 Not quite')+'\u003c/p>'+r.h;let m=S.mist.indexOf(S.ex);if(r.ok){S.ok++;addXP(2);if(m>=0)S.mist.splice(m,1)}else{S.no++;if(m\u003c0)S.mist.push(S.ex)}nav()}\nfunction mi(){if(!S.mist.length){$('#M').innerHTML=sec('Mistakes','Nothing to review. Wrong answers collect here so you can retry them.');return}S.mi=(S.mi+1)%S.mist.length;S.ex=S.mist[S.mi];S.d=['pev','pform'].includes(S.ex.c)?'pred':'prop';$('#M').innerHTML=exH(S.ex)+'\u003cdiv class=row>\u003cbutton onclick=\"mi()\">Next mistake\u003c/button>\u003c/div>';pal()}\nfunction sim(){$('#M').innerHTML=S.d=='prop'?`\u003cdiv class=card>\u003ch3>Formula\u003c/h3>\u003cinput id=sf placeholder=\"e.g. (p\u2192q)\u2227p\u2192q\">\u003cdiv class=row>\u003cbutton class=on onclick=\"sT()\">Table \u00b7 class \u00b7 CNF\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=card>\u003ch3>Soundness\u003c/h3>\u003cdiv class=row>${SGN()}\u003c/div>\u003ctextarea id=sp rows=3 placeholder=\"Premises, one per line\">\u003c/textarea>\u003cinput id=sq placeholder=\"Conclusion\" style=\"margin-top:6px\">\u003cdiv class=row>\u003cbutton class=on onclick=\"sE()\">Check (table + resolution)\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=out>\u003c/div>`:\n`\u003cdiv class=card>\u003ch3>Formula\u003c/h3>\u003cinput id=pf placeholder=\"\u2200x\u2203y p(x,y)\">\u003cdiv class=row>${SGP()}\u003c/div>\u003ch3>Interpretation\u003c/h3>\u003ctextarea id=pm rows=3 placeholder=\"dom=A,B; p={(A,B)}; q={A}; a=B\">\u003c/textarea>\u003cdiv class=row>\u003cbutton class=on onclick=\"sP()\">Evaluate\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=out>\u003c/div>`}\nfunction out(f,o='#out'){try{$(o).innerHTML='\u003cdiv class=card>'+f()+'\u003c/div>'}catch(x){$(o).innerHTML='\u003cdiv class=card no>Error: '+x.message+'\u003c/div>'}}\nconst out2=f=>out(f,'#out2');\nfunction sT(){out(()=>{let f=parse($('#sf').value),r=cls(f),C=cnf(f);return tbl(r.vs,[f])+'\u003cp>\u003cb>'+{valid:'Valid',sat:'Satisfiable, not valid',unsat:'Unsatisfiable'}[r.type]+'\u003c/b>'+(r.c?' \u00b7 falsified by \u003ccode>'+ist(r.c)+'\u003c/code>':'')+(r.m?' \u00b7 model \u003ccode>'+ist(r.m)+'\u003c/code>':'')+'\u003c/p>CNF: \u003cb>'+cs(C)+'\u003c/b>'})}\nfunction sE(){out2(()=>{let P=$('#sp').value.split('\\n').filter(x=>x.trim()).map(x=>parse(x)),Q=parse($('#sq').value),w=ent(P,Q),C=[...P.flatMap(p=>cnf(p)),...cnf({t:'n',a:Q})],R=res(C);return(w?'\u003cb class=no>Not sound\u003c/b> \u00b7 counterexample \u003ccode>'+ist(w)+'\u003c/code>':'\u003cb class=ok>Sound\u003c/b>')+'\u003cp>Clauses: ' on \u21d2 the formula is VALID':'No contradiction: '+ist(cex)+' makes it false \u21d2 NOT valid',0,'f');return{L,valid:r=='X',cex,F}}\nconst tv=(n,V)=>{const v=V[n.id],k=n.t=='n'?[n.a]:n.l?[n.l,n.r]:[];return`\u003cspan class=nb>\u003cb class=\"vb ${v===undefined?'':v?'T':'F'}\">${v===undefined?'?':v?'T':'F'}\u003c/b>\u003cbr>${n.t=='v'?n.n:OP[n.t]||'\u00ac'}\u003cbr>${k.map(c=>tv(c,V)).join('')}\u003c/span>`};\nconst CX=[...B.entail.slice(0,8).map(e=>[e[0],e[1],e[2]]),...B.class.slice(0,5).map((f,i)=>['Formula '+(i+1),[],f])];\nfunction ct(){if(S.d=='pred'){$('#M').innerHTML=cv('Proof by contradiction','Available in propositional logic. For predicate logic use the Deduction tab.');return}\n$('#M').innerHTML=`\u003cdiv class=card>\u003ch3>Proof by contradiction\u003c/h3>\u003cspan class=mu>Assume it is false, propagate, split into cases.\u003c/span>\u003cdiv class=row>${SGN()}\u003c/div>\u003ctextarea id=cp rows=2 placeholder=\"Premises (optional), one per line\">\u003c/textarea>\u003cinput id=cq placeholder=\"Formula, or conclusion if premises given\" style=\"margin-top:6px\">\u003cdiv class=row>${CX.map((x,i)=>`\u003cbutton onclick=\"ldC(${i})\">${x[0]}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=row>\u003cbutton class=on onclick=\"ctRun()\">Prove\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=ctout>\u003c/div>`}\nfunction ldC(i){$('#cp').value=CX[i][1].join('\\n');$('#cq').value=CX[i][2];ctRun()}\nfunction ctRun(){try{let ps=$('#cp').value.split('\\n').filter(x=>x.trim()).map(x=>parse(x)),q=parse($('#cq').value),F=ps.length?{t:'i',l:ps.reduce((a,b)=>({t:'a',l:a,r:b})),r:q}:q;S.ct=prove(F);S.ctk=1;ctShow()}catch(e){$('#ctout').innerHTML='\u003cdiv class=card>\u003cspan class=no>'+e.message+'\u003c/span>\u003c/div>'}}\nfunction ctShow(){const c=S.ct,k=S.ctk,n=c.L.length,s=c.L[k-1];$('#ctout').innerHTML=`\u003cdiv class=card>\u003cb>${sh(c.F)}\u003c/b>\u003cdiv class=sc style=\"margin:8px 0\">${tv(c.F,s.V)}\u003c/div>`+c.L.slice(0,k).map((x,i)=>`\u003cdiv class=ln style=\"margin-left:${x.d*16}px;${x.k=='x'?'border-color:var(--no);':x.k=='c'?'border-color:var(--ok);':''}${i==k-1?'background:color-mix(in srgb,var(--ok) 16%,transparent);':''}\">${x.k=='c'||x.k=='f'?'\u003cb>'+x.txt+'\u003c/b>':x.txt}\u003c/div>`).join('')+(k==n?`\u003cp class=${c.valid?'ok':'no'}>${c.valid?'\u2705 VALID \u21d2 the reasoning is SOUND':'\u274c NOT valid \u21d2 the reasoning is NOT sound'}\u003c/p>`:'')+`\u003cdiv class=row>\u003cbutton onclick=\"S.ctk=Math.max(1,S.ctk-1);ctShow()\">\u25c0 Back\u003c/button>\u003cbutton class=on onclick=\"S.ctk=${k\u003cn?'S.ctk+1':'1'};ctShow()\">${k\u003cn?'Next \u25b6':'\u21ba Restart'}\u003c/button>\u003cbutton onclick=\"S.ctk=${n};ctShow()\">Show all\u003c/button>\u003c/div>\u003cspan class=mu>Step ${k}/${n}\u003c/span>\u003c/div>`}\n\nfunction tctInit(){const e=$('#tctx');if(!e)return;e.innerHTML=`\u003cdiv class=g>${[['1','Assume the formula is FALSE'],['2','Propagate T/F through \u00ac \u2227 \u2228 \u2192 \u2194'],['3','One atom both T and F? Contradiction'],['4','All cases contradict \u21d2 VALID. One survives \u21d2 counterexample']].map(x=>rw(...x)).join('')}\u003c/div>\u003cdiv class=row>\u003cbutton class=on onclick=\"tctEx(0)\">Valid example\u003c/button>\u003cbutton onclick=\"tctEx(1)\">Not valid example\u003c/button>\u003cbutton onclick=\"S.m='ct';go()\">Open the Contradiction tab \u2192\u003c/button>\u003c/div>\u003cdiv id=ctout>\u003c/div>`;tctEx(0)}\nfunction tctEx(i){S.ct=prove(parse(['(p\u2192q)\u2227p\u2192q','(p\u2192q)\u2227q\u2192p'][i]));S.ctk=1;ctShow()}\ngo()\n\u003c/script>\n\u003c/body>\u003c/html>\n", "tec": "\u003c!DOCTYPE html>\n\u003chtml data-theme=\"light\" lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>TEC Lab \u2013 learn electronics by playing\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f8fb;--grid:#dfe6f0;--card:#fff;--ink:#14213d;--mut:#5b6679;--blue:#1d4ed8;--red:#d62839;--ok:#0f9d58;--line:#cfd8e6;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--grid:#1a2438;--card:#17203a;--ink:#e7ecf7;--mut:#9aa7c0;--blue:#7aa2ff;--red:#ff6b7a;--ok:#4cd391;--line:#2a3757;color-scheme:dark}}\n:root[data-theme=dark]{--bg:#0f1624;--grid:#1a2438;--card:#17203a;--ink:#e7ecf7;--mut:#9aa7c0;--blue:#7aa2ff;--red:#ff6b7a;--ok:#4cd391;--line:#2a3757;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{padding:22px 16px 6px;max-width:980px;margin:auto}\nh1{font:700 clamp(26px,5vw,40px)/1.1 Georgia,serif;margin:0;color:var(--blue)}\nh1 span{color:var(--red)}\nheader p{margin:6px 0 0;color:var(--mut);max-width:60ch}\nnav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--red);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;margin-top:10px}\nnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font:600 14px inherit;cursor:pointer;white-space:nowrap}\nnav button[aria-selected=true]{background:var(--blue);color:#fff;border-color:var(--blue)}\n:focus-visible{outline:3px solid var(--red);outline-offset:2px}\nmain{max-width:980px;margin:auto;padding:16px}\nsection{display:none}section.on{display:block}\nh2{font:700 24px Georgia,serif;margin:0 0 4px;color:var(--blue)}\n.lead{color:var(--mut);margin:0 0 14px}\n.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}\n.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}\n.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0;font-size:14px}\n.sl b{font-family:ui-monospace,Consolas,monospace;color:var(--blue)}\n.sl input{grid-column:1/-1;width:100%;accent-color:var(--red)}\nselect,input[type=search]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}\ncanvas{width:100%;height:260px;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px}\n.res{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border-left:4px solid var(--red);padding:8px 10px;border-radius:4px;margin-top:8px;font-size:14px}\n.tag{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:13px}\n.say{background:var(--bg);border:1px dashed var(--blue);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}\ndetails{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--card)}\nsummary{cursor:pointer;font-weight:700}\n.f{font-family:ui-monospace,Consolas,monospace;color:var(--red);font-weight:700}\n.bar{height:26px;border-radius:5px;margin:4px 0;color:#fff;font-size:13px;line-height:26px;padding-left:8px;white-space:nowrap;overflow:hidden;min-width:4px}\n.fi{margin:0 0 10px;padding:10px;border-left:4px solid var(--blue);background:var(--card);border-radius:4px}\n.fi small{color:var(--mut);display:block}.b{border:1px solid var(--blue);background:var(--card);color:var(--blue);padding:7px 12px;border-radius:8px;font:600 14px inherit;cursor:pointer;margin:4px 4px 4px 0}.srow{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 36px 36px;gap:4px;margin:4px 0}.srow select,.srow input,#gi,#gv,#kvin{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}.tl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px;margin:6px 0}.t{padding:12px 6px;border-radius:8px;text-align:center;font:700 15px ui-monospace,monospace;color:#fff;min-height:46px;display:flex;align-items:center;justify-content:center}.t.g{background:var(--ok)}.t.y{background:#d49a00}.t.x{background:#6b7690}.t.e{background:var(--card);border:2px dashed var(--line);color:var(--mut)}.leg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px;text-align:center}.krow{display:grid;grid-template-columns:64px 1fr 1fr 1fr 36px;gap:4px;margin:4px 0}.krow input,#pin{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}#pin{margin:8px 0}\n\u003c/style>\u003cstyle id='mp-theme'>html[data-theme=light]:root:root{--bg:#f6f5f1;--grid:#d6d4cb;--card:#ffffff;--ink:#1d1d1b;--mut:#6b6a64;--ok:#1a8a3a;--line:#d6d4cb;--blue:#c62828;color-scheme:light}html[data-theme=dark]:root:root{--bg:#121211;--grid:#35342f;--card:#1b1b19;--ink:#e8e6df;--mut:#928f85;--ok:#5fd07f;--line:#35342f;--blue:#ff6b6b;color-scheme:dark}body{font-family:ui-monospace,\"SFMono-Regular\",Menlo,Consolas,monospace;background-image:none!important}button,input,select,textarea{font-family:inherit}h1{font-family:ui-monospace,\"SFMono-Regular\",Menlo,Consolas,monospace!important;font-size:18px!important;font-weight:700;color:var(--acc,var(--ac,var(--red,#c62828)))!important;letter-spacing:0}h1 span{color:inherit!important}h1::before{content:'\u258c'}.card{border-radius:8px!important}button{border-radius:6px}h1{color:#c62828!important}html[data-theme=dark] h1{color:#ff6b6b!important}html[data-hw]:root:root{--bg:#0d0612;--grid:#3a2250;--card:#1a0f24;--ink:#f2e6d0;--mut:#a089b8;--ok:#8bd450;--line:#3a2250;--blue:#ff7a18;color-scheme:dark}html[data-hw] h1{text-shadow:0 0 10px #ff7a1866}html[data-hw] input{accent-color:#ff7a18}html[data-hw] h1::before{content:'\ud83c\udf83 '}\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>TEC \u003cspan>Lab\u003c/span>\u003c/h1>\u003cp>Electronics and Computer Technology, explained step by step. Start at \u201cStart here\u201d, then move the sliders: everything updates live.\u003c/p>\u003c/header>\n\u003cnav role=\"tablist\" id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection id=\"learn\">\u003ch2>Start here\u003c/h2>\u003cp class=\"lead\">No prior knowledge needed. Open each card in order.\u003c/p>\n\u003cdetails open>\u003csummary>1. Voltage, current, resistance\u003c/summary>\u003cp>\u003cb>Voltage (V)\u003c/b> is the \u201cpush\u201d on the charges, like water pressure from a tank. \u003cb>Current (I)\u003c/b> is how much charge flows per second, like the water flow. \u003cb>Resistance (R)\u003c/b> is the friction, like a narrow pipe.\u003c/p>\u003cp>They are linked by Ohm\u2019s law: \u003cspan class=\"f\">V = I\u00b7R\u003c/span>. Voltage is applied \u003ci>across\u003c/i> things; current flows \u003ci>through\u003c/i> them. Try it in \u201cCircuits\u201d.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>2. Sources and the sign convention\u003c/summary>\u003cp>A \u003cb>voltage source\u003c/b> keeps its voltage whatever the current. A \u003cb>current source\u003c/b> keeps its current whatever the voltage. If the current leaves the + terminal, the element \u003cb>delivers\u003c/b> energy (source); if it enters the +, it \u003cb>absorbs\u003c/b> it (load). Resistors always absorb.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>3. Series and parallel\u003c/summary>\u003cp>\u003cb>Series\u003c/b>: same current, resistances add. \u003cb>Parallel\u003c/b>: same voltage, conductances add, so the total is always smaller than the smallest resistor. Trick: in series the biggest resistor dominates; in parallel the smallest does.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>4. Kirchhoff\u2019s laws\u003c/summary>\u003cp>\u003cb>KCL\u003c/b>: currents entering a node = currents leaving it. \u003cb>KVL\u003c/b>: voltages around any closed loop add up to zero. Write the sign you meet first on each element as you walk the loop. A negative result just means the real current goes the other way.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>5. Thevenin: the big trick\u003c/summary>\u003cp>Any linear circuit seen from two terminals A\u2013B equals one source \u003cb>V\u003csub>TH\u003c/sub>\u003c/b> in series with one resistor \u003cb>R\u003csub>TH\u003c/sub>\u003c/b>. Steps: open the load \u2192 V\u003csub>TH\u003c/sub> = open-circuit voltage \u2192 \u201ckill\u201d sources (voltage source \u2192 wire, current source \u2192 open) \u2192 R\u003csub>TH\u003c/sub> = resistance seen from A\u2013B. Then changing the load is trivial.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>6. Diodes and the Q point\u003c/summary>\u003cp>A diode is a one-way valve. \u003cb>Ideal\u003c/b>: ON (0 V) when current flows anode\u2192cathode, OFF (no current) otherwise. \u003cb>Real silicon\u003c/b>: needs \u22480.7 V to turn on. \u003cb>Zener\u003c/b>: also conducts backwards once the reverse voltage reaches V\u003csub>Z\u003c/sub>. The \u003cb>Q point\u003c/b> (operation point) is where the diode\u2019s curve meets the circuit\u2019s \u003cb>load line\u003c/b>. Practice in the \u201cDiode\u201d tab.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>7. Transistors: electric switches and amplifiers\u003c/summary>\u003cp>\u003cb>MOSFET\u003c/b>: voltage V\u003csub>GS\u003c/sub> on the gate (no gate current) opens a channel between drain and source. Below the threshold: cutoff (open switch). Above: ohmic (resistor, a closed switch) or saturation (current source). \u003cb>BJT\u003c/b>: a small base current I\u003csub>B\u003c/sub> controls a big collector current: \u003cspan class=\"f\">I\u003csub>C\u003c/sub> = \u03b2\u00b7I\u003csub>B\u003c/sub>\u003c/span>. Try both in the next tabs.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>8. Capacitors\u003c/summary>\u003cp>A capacitor stores energy in an electric field. It blocks DC when full and its voltage can\u2019t jump. With a resistor it charges exponentially with time constant \u03c4 = R\u00b7C: 63% after 1\u03c4, 99% after 5\u03c4.\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"circ\">\u003ch2>Circuits: divider + Thevenin\u003c/h2>\u003cp class=\"lead\">A voltage divider gives a fraction of V\u003csub>in\u003c/sub>. Add a load R\u003csub>L\u003c/sub> and see why Thevenin matters.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"c1\">\u003c/div>\u003cdiv class=\"box\">\u003cdiv id=\"c2\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"dio\">\u003ch2>Diode simulator\u003c/h2>\u003cp class=\"lead\">The circuit is already reduced with Thevenin: V\u003csub>TH\u003c/sub> \u2013 R\u003csub>TH\u003c/sub> \u2013 diode (anode at the resistor). Move V\u003csub>TH\u003c/sub> and watch the Q point slide along the load line.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"d1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"dc\">\u003c/canvas>\u003cdiv class=\"res\" id=\"dres\">\u003c/div>\u003cdiv class=\"say\" id=\"dsay\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"mos\">\u003ch2>MOSFET simulator (NMOS)\u003c/h2>\u003cp class=\"lead\">Switch driving a load R\u003csub>D\u003c/sub> from V\u003csub>DD\u003c/sub>. Ideal linear curves like the course exercises: cutoff below 2.5 V, saturation current 40 mA per volt above it, knee at 2 V.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"m1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"mc\">\u003c/canvas>\u003cdiv class=\"res\" id=\"mosres\">\u003c/div>\u003cdiv class=\"say\" id=\"mossay\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"bjt\">\u003ch2>BJT simulator (NPN, common emitter)\u003c/h2>\u003cp class=\"lead\">V\u003csub>BB\u003c/sub> feeds the base through R\u003csub>B\u003c/sub>. Increase V\u003csub>BB\u003c/sub> and see the transistor go from cutoff to active to saturation (switch ON).\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"b1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"bcv\">\u003c/canvas>\u003cdiv class=\"res\" id=\"bres\">\u003c/div>\u003cdiv class=\"say\" id=\"bsay\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"rc\">\u003ch2>RC charging\u003c/h2>\u003cp class=\"lead\">Capacitor charging from 0 V through a resistor.\u003c/p>\n\u003cdiv class=\"grid\">\u003cdiv class=\"box\" id=\"r1\">\u003c/div>\u003cdiv class=\"box\">\u003ccanvas id=\"rcv\">\u003c/canvas>\u003cdiv class=\"res\" id=\"rres\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"sv\">\u003ch2>Solve it step by step\u003c/h2>\u003cp class=\"lead\">Pick the kind of problem, change the numbers, and every step is shown with the formula, your numbers, and why you do it. Use it as a template for your own exercises.\u003c/p>\u003cdetails>\u003csummary>What are they asking? What do I do?\u003c/summary>\u003cdiv id=\"svq\">\u003c/div>\u003c/details>\u003cdiv class=\"box\">\u003cselect id=\"svt\" aria-label=\"Problem type\">\u003c/select>\u003cdiv class=\"say\" id=\"svask\">\u003c/div>\u003cdiv id=\"svf\">\u003c/div>\u003c/div>\u003cdiv id=\"svs\">\u003c/div>\u003c/section>\n\u003csection id=\"ex\">\u003ch2>Exercises from your notes\u003c/h2>\u003cp class=\"lead\">Try each one on paper first, then open the solution. Units: V, k\u03a9, mA unless stated.\u003c/p>\u003cselect id=\"exf\" aria-label=\"Topic\">\u003c/select>\u003cdiv id=\"exl\" style=\"margin-top:10px\">\u003c/div>\u003c/section>\n\u003csection id=\"mk\">\u003ch2>Circuit maker + solver\u003c/h2>\u003cp class=\"lead\">Build a real circuit: a source on the left, a top wire (the rail) and a bottom wire (ground). Add parts \u003cb>on the rail\u003c/b> (in series) or \u003cb>to ground\u003c/b> (hanging down). The schematic redraws live with node voltages, the current through every part and the ON/OFF state of diodes.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"box\">\u003cb>Start from an example\u003c/b>\u003cselect id=\"kpre\" aria-label=\"Preset\">\u003c/select>\u003cp style=\"margin:10px 0 2px\">\u003clabel for=\"kvin\">\u003cb>Source voltage Vin (V)\u003c/b>\u003c/label>\u003c/p>\u003cinput type=\"number\" step=\"any\" id=\"kvin\" value=\"10\">\u003cp style=\"margin:10px 0 2px\">\u003cb>Parts, from left to right\u003c/b>\u003c/p>\u003cdiv id=\"krows\">\u003c/div>\u003cbutton class=\"b\" id=\"kadd\">+ Add on the rail\u003c/button>\u003cbutton class=\"b\" id=\"kadd2\">+ Add to ground\u003c/button>\u003cdiv class=\"say\">\u21c4 flips a part\u2019s direction (diode, battery, sink). Parts on the same node can be added one after another to the ground side (a load, a zener\u2026). Symbols:\u003c/div>\u003cdiv class=\"leg\" id=\"kleg\">\u003c/div>\u003c/div>\u003cdiv class=\"box\">\u003cdiv id=\"kdraw\" style=\"overflow-x:auto\">\u003c/div>\u003cdiv id=\"kres\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"pr\">\u003ch2>Practice\u003c/h2>\u003cp class=\"lead\">Pick a topic and get a new random problem each time. Type your answer and check it.\u003c/p>\u003cdiv class=\"box\">\u003cselect id=\"ptop\" aria-label=\"Topic\">\u003c/select>\u003cbutton class=\"b\" id=\"pnew\">New problem\u003c/button>\u003cdiv id=\"pq\" class=\"say\" style=\"font-size:16px\">Press \u201cNew problem\u201d.\u003c/div>\u003cdiv id=\"pg\">\u003c/div>\u003cinput type=\"number\" step=\"any\" id=\"pin\" placeholder=\"Your answer\" aria-label=\"Your answer\">\u003cbutton class=\"b\" id=\"pchk\">Check\u003c/button>\u003cbutton class=\"b\" id=\"psh\">Show solution\u003c/button>\u003cdiv id=\"pfb\">\u003c/div>\u003cdiv id=\"pscore\" class=\"lead\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"gm\">\u003ch2>Crack the Q \ud83c\udfaf\u003c/h2>\u003cp class=\"lead\">A hidden operating point. You have 6 tries to find where the circuit settles: its \u003cb>region\u003c/b>, the \u003cb>current\u003c/b> and the \u003cb>voltage\u003c/b>. After each try the tiles tell you how close you are. Do the math, draw the load line, crack it.\u003c/p>\u003cdiv class=\"box\">\u003cdiv class=\"grid\">\u003cselect id=\"gmode\" aria-label=\"Mode\">\u003coption value=\"daily\">Daily puzzle (same for everyone)\u003c/option>\u003coption value=\"rnd\">Random puzzle\u003c/option>\u003c/select>\u003cselect id=\"gtop\" aria-label=\"Circuit\">\u003coption value=\"any\">Any circuit\u003c/option>\u003coption value=\"dio\">Diode\u003c/option>\u003coption value=\"mos\">MOSFET\u003c/option>\u003coption value=\"bjt\">BJT\u003c/option>\u003c/select>\u003c/div>\u003cbutton class=\"b\" id=\"gnew\">New game\u003c/button>\u003cdiv id=\"gdg\">\u003c/div>\u003cdiv class=\"say\" id=\"gtxt\">\u003c/div>\u003cdiv class=\"grid\" style=\"margin-top:8px\">\u003cselect id=\"greg\" aria-label=\"Region\">\u003c/select>\u003cinput type=\"number\" step=\"any\" id=\"gi\" placeholder=\"Current I (mA)\" aria-label=\"Current in mA\">\u003cinput type=\"number\" step=\"any\" id=\"gv\" placeholder=\"Voltage V (V)\" aria-label=\"Voltage in V\">\u003c/div>\u003cbutton class=\"b\" id=\"gsub\">Guess\u003c/button>\u003cbutton class=\"b\" id=\"ghint\">Hint\u003c/button>\u003cdiv id=\"gbd\">\u003c/div>\u003cdiv id=\"gmsg\">\u003c/div>\u003cdiv class=\"lead\" id=\"gst\">\u003c/div>\u003cdiv class=\"say\">\ud83d\udfe9 right \u00b7 \ud83d\udfe8 within 25% \u00b7 \u2b1b far. \u25b2 the real value is higher, \u25bc lower. Current and voltage keep their sign (V is V_AK, V_DS or V_CE).\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"form\">\u003ch2>Formulas and tricks\u003c/h2>\u003cdiv class=\"grid\">\u003cinput type=\"search\" id=\"q\" placeholder=\"Search: ohm, thevenin, mosfet, tau\u2026\" aria-label=\"Search formulas\">\u003cselect id=\"fc\" aria-label=\"Topic\">\u003c/select>\u003c/div>\u003cdiv id=\"fl\" style=\"margin-top:12px\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id),V=id=>+$(id).value;\nconst tabs=[['learn','Start here'],['circ','Circuits'],['dio','Diode'],['mos','MOSFET'],['bjt','BJT'],['rc','RC'],['sv','Step by step'],['ex','Exercises'],['mk','Maker'],['pr','Practice'],['gm','Crack the Q \ud83c\udfaf'],['form','Formulas']];\nconst nav=$('nav');\ntabs.forEach(([id,t],i)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('role','tab');b.onclick=()=>show(id);b.dataset.t=id;nav.appendChild(b)});\nfunction show(id){tabs.forEach(([k])=>$(k).classList.toggle('on',k==id));[...nav.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.t==id));draw();scrollTo(0,0)}\nfunction sl(id,l,mn,mx,st,v,u){return `\u003cdiv class=\"sl\">\u003clabel for=\"${id}\">${l}\u003c/label>\u003cb id=\"${id}o\">${v} ${u}\u003c/b>\u003cinput type=\"range\" id=\"${id}\" min=\"${mn}\" max=\"${mx}\" step=\"${st}\" value=\"${v}\" data-u=\"${u}\">\u003c/div>`}\nfunction sel(id,opts){return `\u003cselect id=\"${id}\" aria-label=\"${id}\">${opts.map(o=>`\u003coption>${o}\u003c/option>`).join('')}\u003c/select>`}\ndocument.addEventListener('input',e=>{const t=e.target,o=$(t.id+'o');if(o)o.textContent=t.value+' '+t.dataset.u;draw()});\nconst f=(x,d=2)=>(+x).toFixed(d).replace(/\\.?0+$/,'');\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();\nfunction plot(cv,o){const r=devicePixelRatio||1,W=cv.width=cv.clientWidth*r,H=cv.height=cv.clientHeight*r,c=cv.getContext('2d');c.scale(r,r);const w=W/r,h=H/r,p=34;\nconst X=x=>p+(x-o.x0)/(o.x1-o.x0)*(w-p-8),Y=y=>h-p-(y-o.y0)/(o.y1-o.y0)*(h-p-10);c.clearRect(0,0,w,h);c.font='11px system-ui';c.fillStyle=col('mut');c.strokeStyle=col('line');\nc.beginPath();c.moveTo(p,Y(0));c.lineTo(w-8,Y(0));c.moveTo(X(0),10);c.lineTo(X(0),h-p);c.stroke();c.fillText(o.xl,w-70,Y(0)+(Y(0)>h-p-14?-6:14));c.fillText(o.yl,X(0)+4,18);c.fillText(f(o.x0,1),p,h-p+14);c.fillText(f(o.x1,1),w-30,h-p+14);c.fillText(f(o.y1,1),2,16);c.fillText(f(o.y0,1),2,h-p);\no.ln.forEach(l=>{c.beginPath();c.strokeStyle=col(l.c);c.lineWidth=l.w||2;c.setLineDash(l.d||[]);l.p.forEach((q,i)=>i?c.lineTo(X(q[0]),Y(q[1])):c.moveTo(X(q[0]),Y(q[1])));c.stroke()});c.setLineDash([]);\n(o.dots||[]).forEach(d=>{c.fillStyle=col('ok');c.beginPath();c.arc(X(d[0]),Y(d[1]),7,0,7);c.fill();c.fillStyle=col('ink');c.font='bold 12px system-ui';c.fillText('Q',X(d[0])+10,Y(d[1])-8)})}\nconst tag=(t,c)=>`\u003cspan class=\"tag\" style=\"background:${col(c)}\">${t}\u003c/span>`;\n/* circuits */\n$('c1').innerHTML='\u003cb>Voltage divider\u003c/b>'+sl('vi','V in',1,24,.5,10,'V')+sl('r1','R1',.1,20,.1,1,'k\u03a9')+sl('r2','R2',.1,20,.1,1,'k\u03a9')+sl('rl','R load (20 = none)',.1,20,.1,20,'k\u03a9')+'\u003cdiv id=\"cv\">\u003c/div>';\n$('c2').innerHTML='\u003cb>Thevenin equivalent seen by the load\u003c/b>\u003cdiv id=\"ct\">\u003c/div>\u003cdiv class=\"say\">Trick: if R load is much bigger than R\u003csub>TH\u003c/sub>, the load barely disturbs the divider. Lower R load and V out sags.\u003c/div>';\nfunction circ(){const v=V('vi'),a=V('r1'),b=V('r2'),l=V('rl'),nl=l>=20,vth=v*b/(a+b),rth=a*b/(a+b),vo=nl?vth:vth*l/(l+rth),I=v/(a+b);\nconst bar=(t,x,c)=>`\u003cdiv class=\"bar\" style=\"width:${Math.max(x/v*100,1)}%;background:${col(c)}\">${t}\u003c/div>`;\n$('cv').innerHTML=bar('V in = '+f(v)+' V',v,'ink')+bar('V on R1 = '+f(v-vth)+' V',v-vth,'red')+bar('V out (no load) = '+f(vth)+' V',vth,'blue')+(nl?'':bar('V out with load = '+f(vo)+' V',vo,'ok'))+`\u003cdiv class=\"res\">I = Vin/(R1+R2) = ${f(I)} mA\u003cbr>P total = ${f(v*I)} mW\u003c/div>`;\n$('ct').innerHTML=`\u003cdiv class=\"res\">V\u003csub>TH\u003c/sub> = Vin\u00b7R2/(R1+R2) = ${f(vth)} V\u003cbr>R\u003csub>TH\u003c/sub> = R1\u2016R2 = ${f(rth,3)} k\u03a9\u003cbr>V out = ${f(vo)} V\u003cbr>I load = ${nl?'0':f(vo/l,3)} mA\u003c/div>`}\n/* diode */\n$('d1').innerHTML='\u003cb>Circuit\u003c/b>'+sl('dv','V TH',-20,20,.1,5,'V')+sl('dr','R TH',.1,5,.1,2,'k\u03a9')+'\u003cp>Diode type\u003c/p>'+sel('dt',['Ideal','Silicon 0.7 V','Zener (ideal)','Zener (0.7 V forward)'])+sl('dz','V Z',1,10,.5,5,'V');\nfunction dio(){const vt=V('dv'),R=V('dr'),t=$('dt').selectedIndex,vf=t%2?.7:0,z=t>1,Vz=V('dz');let q,I,m;\nif((vt-vf)/R>0){I=(vt-vf)/R;q=vf;m=['ON (forward)','ok']}else if(z&&vt\u003c-Vz){I=(vt+Vz)/R;q=-Vz;m=['ZENER region','red']}else{I=0;q=vt;m=['OFF (blocking)','blue']}\nconst ext=Math.max(Math.abs(vt),Vz,1)*1.3,ym=Math.max(Math.abs(vt)/R,2)*1.2,ch=[[-ext,z?0:0],[vf,0],[vf,ym]];if(z)ch.splice(0,1,[-Vz,-ym],[-Vz,0]);else ch.unshift([-ext,0]);\nplot($('dc'),{x0:-ext,x1:ext,y0:-ym,y1:ym,xl:'V_AK (V)',yl:'I_D (mA)',ln:[{p:ch,c:'blue',w:3},{p:[[vt,0],[0,vt/R]],c:'red',d:[6,4]}],dots:[[q,I]]});\n$('dres').innerHTML=`Q point = (V\u003csub>AK\u003c/sub> = ${f(q)} V, I\u003csub>D\u003c/sub> = ${f(I,3)} mA)\u003cbr>${tag(m[0],m[1])}`;\n$('dsay').innerHTML='Blue = diode curve, dashed red = load line (all circuit solutions). Q is where they cross. Load line points: diode as short \u2192 I = V\u003csub>TH\u003c/sub>/R\u003csub>TH\u003c/sub>; as open \u2192 V = V\u003csub>TH\u003c/sub>.'}\n/* mosfet */\n$('m1').innerHTML='\u003cb>Circuit\u003c/b>'+sl('mg','V GS',0,12,.5,7.5,'V')+sl('mv','V DD',2,24,1,12,'V')+sl('mr','R D',5,200,5,40,'\u03a9');\nfunction mos(){const g=V('mg'),vdd=V('mv'),R=V('mr'),vth=2.5,kn=2;let I,vds,m;const isat=g\u003cvth?0:(g-vth)*40,ron=isat?kn/isat*1000:1e9;\nif(!isat){I=0;vds=vdd;m=['CUTOFF = open switch','blue']}else if(vdd-isat/1000*R>=kn){I=isat;vds=vdd-I/1000*R;m=['SATURATION = current source','red']}else{I=vdd/(R+ron)*1000;vds=vdd-I/1000*R;m=['OHMIC = closed switch (R_DS(on)='+f(ron)+' \u03a9)','ok']}\nconst ym=Math.max(vdd/R*1000,330)*1.1,xm=Math.max(vdd,4)*1.05,ln=[];[5,7.5,10,12].forEach(v=>{const s=(v-vth)*40;ln.push({p:[[0,0],[kn,s],[xm,s]],c:v==g?'blue':'line',w:v==g?3:1.5})});\nif(g>=vth&&![5,7.5,10,12].includes(g)){const s=(g-vth)*40;ln.push({p:[[0,0],[kn,s],[xm,s]],c:'blue',w:3})}\nln.push({p:[[0,0],[xm,0]],c:'blue',w:g\u003cvth?3:1.5},{p:[[vdd,0],[0,vdd/R*1000]],c:'red',d:[6,4]});\nplot($('mc'),{x0:0,x1:xm,y0:0,y1:ym,xl:'V_DS (V)',yl:'I_D (mA)',ln,dots:[[vds,I]]});\n$('mosres').innerHTML=`Q = (V\u003csub>DS\u003c/sub> = ${f(vds)} V, I\u003csub>D\u003c/sub> = ${f(I,1)} mA)\u003cbr>P in MOSFET = ${f(vds*I)} mW\u003cbr>${tag(m[0],m[1])}`;\n$('mossay').innerHTML='Gray = curves for other V\u003csub>GS\u003c/sub>; blue = yours; dashed red = load line. As a switch you want V\u003csub>GS\u003c/sub> high: low V\u003csub>DS\u003c/sub> means little heat in the transistor.'}\n/* bjt */\n$('b1').innerHTML='\u003cb>Circuit (\u03b2 = 100)\u003c/b>'+sl('bb','V BB',0,10,.1,2,'V')+sl('br','R B',1,100,1,10,'k\u03a9')+sl('bc','V CC',2,24,1,15,'V')+sl('bcr','R C',.1,5,.1,1,'k\u03a9')+sl('bbe','\u03b2',20,300,10,100,'');\nfunction bjt(){const vbb=V('bb'),rb=V('br'),vcc=V('bc'),rc=V('bcr'),be=V('bbe');let ib=Math.max((vbb-.7)/rb,0),ic=be*ib,vce=vcc-ic*rc,m;\nif(ib==0){m=['CUTOFF = open switch','blue']}else if(vce\u003c=0){ic=vcc/rc;vce=0;m=['SATURATION = closed switch (needs I_B > I_C(sat)/\u03b2)','red']}else m=['ACTIVE = amplifier zone','ok'];\nconst ics=vcc/rc,ym=ics*1.2,ln=[],ibl=[...new Set([0.1,.25,.5,.75,1].map(k=>k*ics/be))];ibl.forEach(i=>{const y=Math.min(i*be,ics*1.15);ln.push({p:[[0,0],[.1,y],[vcc*1.05,y]],c:'line',w:1.5})});\nif(ib){const y=Math.min(ic,ym);ln.push({p:[[0,0],[.1,y],[vcc*1.05,y]],c:'blue',w:3})}ln.push({p:[[vcc,0],[0,ics]],c:'red',d:[6,4]});\nplot($('bcv'),{x0:0,x1:vcc*1.05,y0:0,y1:ym,xl:'V_CE (V)',yl:'I_C (mA)',ln,dots:[[vce,ic]]});\n$('bres').innerHTML=`I\u003csub>B\u003c/sub> = (V\u003csub>BB\u003c/sub>\u22120.7)/R\u003csub>B\u003c/sub> = ${f(ib*1000,1)} \u00b5A\u003cbr>I\u003csub>C\u003c/sub> = ${f(ic,2)} mA, V\u003csub>CE\u003c/sub> = ${f(vce)} V\u003cbr>${tag(m[0],m[1])}`;\n$('bsay').innerHTML='Red dashed = load line from V\u003csub>CC\u003c/sub> (cutoff) to V\u003csub>CC\u003c/sub>/R\u003csub>C\u003c/sub> (saturation). Q slides along it when I\u003csub>B\u003c/sub> changes. Switch design: pick I\u003csub>B\u003c/sub> well above I\u003csub>C\u003c/sub>/\u03b2.'}\n/* rc */\n$('r1').innerHTML='\u003cb>Circuit\u003c/b>'+sl('rv','V source',1,24,1,10,'V')+sl('rr','R',1,100,1,10,'k\u03a9')+sl('rcc','C',1,100,1,10,'\u00b5F');\nfunction rc(){const v=V('rv'),R=V('rr'),C=V('rcc'),tau=R*C,N=5*tau,p=[];for(let i=0;i\u003c=60;i++){const t=N*i/60;p.push([t,v*(1-Math.exp(-t/tau))])}\nplot($('rcv'),{x0:0,x1:N,y0:0,y1:v*1.05,xl:'t (ms)',yl:'V_C (V)',ln:[{p,c:'blue',w:3},{p:[[tau,0],[tau,v*.632]],c:'red',d:[4,4]}],dots:[[tau,v*.632]]});\n$('rres').innerHTML=`\u03c4 = R\u00b7C = ${f(tau)} ms\u003cbr>At 1\u03c4: ${f(v*.632)} V (63%)\u003cbr>At 5\u03c4 (${f(5*tau)} ms): ${f(v*.993)} V (99%)\u003cbr>k\u03a9\u00b7\u00b5F = ms`}\n/* formulas */\nconst F=[['Basics','Ohm\u2019s law','V = I\u00b7R','Voltage across, current through. R in \u03a9, I in A.'],['Basics','Power','P = V\u00b7I = V\u00b2/R = I\u00b2\u00b7R','Resistors always absorb power. Source P = V\u00b7I; negative absorbed power = it delivers.'],['Basics','Units','1 k\u03a9\u00b71 mA = 1 V','k\u03a9 with mA gives V. M\u03a9 with \u00b5F gives seconds; k\u03a9 with \u00b5F gives ms.'],['Basics','Series R','R = R1 + R2','Same current. Largest resistor dominates.'],['Basics','Parallel R','1/R = 1/R1 + 1/R2 \u00b7 R = R1\u00b7R2/(R1+R2)','Always smaller than the smallest. Two equal R \u2192 half.'],['Basics','Source power sign','Current out of + \u2192 source; into + \u2192 load','Check with P = V\u00b7I: P \u003c 0 means it delivers energy.'],['Laws','KCL','\u03a3 I in = \u03a3 I out','Choose directions, stay consistent. A negative answer = opposite direction.'],['Laws','KVL','\u03a3 V around a loop = 0','Write the first sign you meet on each element. Direction of the walk doesn\u2019t matter.'],['Laws','Voltage divider','Vout = Vin\u00b7R2/(R1+R2)','Valid only if nothing loads the output.'],['Laws','Series sources','Sources in series just add (mind the polarity)','Example in your notes: 5 V + 5 V against a 10 V source gives 0 A.'],['Laws','Current source \u2225 R','I with R in parallel \u2261 V = I\u00b7R in series with R','Quick source transformation (10 mA \u2225 1 k\u03a9 \u2261 10 V + 1 k\u03a9).'],['Theorems','Thevenin','V_TH = V_AB open \u00b7 R_TH = R seen with sources killed','Voltage source \u2192 short, current source \u2192 open. Include every element when finding R_TH.'],['Theorems','Thevenin trick','Use it whenever the load changes or a diode/transistor is the only nonlinear part','Reduce the circuit around the diode, then only a series loop remains.'],['Theorems','Superposition','Total = \u03a3 effect of each source alone','Linear circuits only. Turn off the others. Try Thevenin first for each partial circuit.'],['Diodes','Ideal diode','ON: V_D = 0, I_D \u2265 0 \u00b7 OFF: I_D = 0, V_AK \u2264 0','Sign convention: V_AK = V_A \u2212 V_K, I from A to K.'],['Diodes','Real diode','ON: V_D = 0.7 V (silicon)','I = (V_TH \u2212 0.7)/R_TH.'],['Diodes','Zener','Forward \u2248 diode \u00b7 reverse: V_AK = \u2212V_Z when breakdown','In the zener region I_D \u003c 0 and I = (V_TH + V_Z)/R_TH.'],['Diodes','Solve by assumption','1) guess ON/OFF/zener 2) solve 3) check compatibility','OFF needs V_AK \u003c 0; ON needs I_D > 0. If incompatible, change the guess.'],['Diodes','Solve by load line','Two points: diode short (V=0, I=V_TH/R_TH) and open (V=V_TH, I=0)','Q = intersection with the characteristic curve. No assumption needed.'],['Diodes','Quick checks','A diode in series with a current source (pointing forward) is always ON','A diode that is in reverse across a source is OFF. Look before calculating.'],['Diodes','LED resistor','R = (V \u2212 V_F)/I_LED','Example: (10 \u2212 2.5)/10 mA = 750 \u03a9.'],['Diodes','Battery life','t = Capacity (Wh) / P load (W)','Remember zener and resistors consume too, not just the LED.'],['MOSFET','Regions (NMOS)','Cutoff: V_GS \u003c V_th \u00b7 Ohmic: V_DS \u003c V_ov \u00b7 Saturation: V_DS > V_ov','V_ov = V_GS \u2212 V_th. PMOS: use V_SG and V_SD.'],['MOSFET','Gate','I_G = 0','The oxide is an insulator. A resistive divider on the gate sets V_GS with no loading.'],['MOSFET','R_DS(on)','R_DS(on) = V_DS(on)/I_D(on)','Inverse of the slope in the ohmic region. Used as a switch.'],['MOSFET','Load line','I_D(sat) = V_DD/R_D \u00b7 V_DS = V_DD \u2212 I_D\u00b7R_D','Q = intersection with the curve of your V_GS.'],['MOSFET','Switch trick','Drive V_GS well above V_th so it works in the ohmic region','Then P = I\u00b2\u00b7R_DS(on): little heat. In saturation it dissipates much more.'],['MOSFET','Zener on gate','V_GS = V_Z if the zener conducts','Check the zener region as you would with a diode.'],['BJT','Currents','I_E = I_C + I_B \u00b7 I_C = \u03b2\u00b7I_B \u00b7 I_C \u2248 I_E','I_B is tiny compared with I_C.'],['BJT','Base loop (ideal V_BE = 0)','I_B = (V_BB \u2212 V_BE)/R_B','Real silicon: V_BE = 0.7 V.'],['BJT','Collector loop','V_CE = V_CC \u2212 I_C\u00b7R_C','Valid in the active region.'],['BJT','Regions','Cutoff I_B = 0 \u00b7 Active I_C = \u03b2 I_B \u00b7 Saturation V_CE \u2248 0','If \u03b2\u00b7I_B > I_C(sat), it is saturated: I_C = V_CC/R_C.'],['BJT','Load line','Cutoff (V_CE = V_CC, I_C = 0) \u00b7 Saturation (V_CE = 0, I_C = V_CC/R_C)','Q moves along it when I_B changes.'],['BJT','Switch design','Force I_B \u2265 a few times I_C(sat)/\u03b2','Then R_B = (V_in \u2212 0.7)/I_B.'],['Capacitor','Equations','i = C\u00b7dv/dt \u00b7 w = \u00bd\u00b7C\u00b7V\u00b2','V can\u2019t change instantly. Open circuit at DC.'],['Capacitor','Association','Parallel: C = C1 + C2 \u00b7 Series: 1/C = 1/C1 + 1/C2','Opposite to resistors.'],['Capacitor','RC charge','v(t) = V\u221e \u2212 (V\u221e \u2212 V\u2080)\u00b7e^(\u2212t/\u03c4) \u00b7 \u03c4 = R\u00b7C','63% at 1\u03c4, 99% at 5\u03c4.'],['Inductor','Equations','v = L\u00b7di/dt \u00b7 w = \u00bd\u00b7L\u00b7i\u00b2','I can\u2019t change instantly. Short circuit at DC. Series add, parallel like resistors.'],['Lab','Resistor colors','Digits, then multiplier, tolerance last (gold 5%, silver 10%)','Black 0 \u00b7 brown 1 \u00b7 red 2 \u00b7 orange 3 \u00b7 yellow 4 \u00b7 green 5 \u00b7 blue 6 \u00b7 violet 7 \u00b7 gray 8 \u00b7 white 9.'],['Lab','Decoupling','100 nF\u20131 \u00b5F close to the IC supply pin','Filters noise on the power supply.'],['Lab','Open vs short','Open: I = 0, V unknown \u00b7 Short: V = 0, I unknown','Overpower destroys transistors; solder splashes create shorts.']];\nfunction list(){const s=$('q').value.toLowerCase(),k=$('fc').value;let h='',c='';F.forEach(r=>{if((s&&!r.join(' ').toLowerCase().includes(s))||(k&&r[0]!=k))return;if(r[0]!=c){c=r[0];h+=`\u003ch2 style=\"margin-top:14px;font-size:20px\">${c}\u003c/h2>`}h+=`\u003cdiv class=\"fi\">\u003cb>${r[1]}\u003c/b>\u003cbr>\u003cspan class=\"f\">${r[2]}\u003c/span>\u003csmall>${r[3]}\u003c/small>${(EXM[r[0]+r[1]]||EXM[r[1]])?`\u003csmall>Example: ${EXM[r[0]+r[1]]||EXM[r[1]]}\u003c/small>`:''}\u003c/div>`});$('fl').innerHTML=h||'\u003cp>No match. Try \u201cohm\u201d, \u201czener\u201d or \u201ctau\u201d.\u003c/p>'}\n$('q').oninput=list;\n/* v2: diagrams, exercises, maker, practice */\nconst S=b=>`\u003csvg viewBox=\"0 0 300 150\" style=\"width:100%;max-width:340px;display:block;margin:6px auto;color:var(--ink)\" role=\"img\" aria-label=\"circuit diagram\">${b}\u003c/svg>`,w=d=>`\u003cpath d=\"${d}\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>`,tx=(x,y,s)=>`\u003ctext x=\"${x}\" y=\"${y}\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-family=\"system-ui\">${s}\u003c/text>`,zg=(x,y,r,l)=>`\u003cpath transform=\"translate(${x} ${y}) rotate(${r})\" d=\"M-22,0h6l4,-8l8,16l8,-16l8,16l4,-8h6\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"2\"/>`+tx(r?x+28:x,r?y+4:y-14,l),bt=(x,y,l)=>w(`M${x},${y-22}v18M${x-12},${y-4}h24M${x-7},${y+4}h14M${x},${y+4}v18`)+tx(x-28,y+4,l)+tx(x+10,y-8,'+'),gnd=(x,y)=>w(`M${x-10},${y}h20M${x-6},${y+5}h12M${x-2},${y+10}h4`),ct=(x,y,l)=>`\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"3\" fill=\"var(--card)\" stroke=\"currentColor\" stroke-width=\"2\"/>`+tx(x,y+(y\u003c30?-8:22),l);\nconst dg={div:()=>S(bt(40,7 ard) \u2192 ON; in reverse across a source \u2192 OFF','Saves a page of equations.'],['Tricks','Which resistor wins?','Series: the biggest \u00b7 Parallel: the smallest','100 \u03a9 \u2016 10 k\u03a9 \u2248 99 \u03a9.'],['Tricks','Sanity check','V_out \u2264 V_in (divider) \u00b7 V_DS \u2264 V_DD \u00b7 V_CE \u2264 V_CC','If not, an assumption or a sign is wrong.'],['Tricks','Negative result?','You guessed the direction backwards; the math is still right','For a diode, a wrong sign means a wrong ON/OFF assumption.'],['Tricks','Guess the zener','Remove it, compute V_KA; if \u2265 V_Z it conducts in reverse','Check forward first when V_TH is positive at the anode.'],['Tricks','Universal recipe','1) simplify with Thevenin 2) assume or draw the load line 3) verify 4) compute power','Works for diodes, MOSFETs and BJTs.'],['Tricks','Common mistakes','Not killing sources for R_TH \u00b7 mixing k\u03a9 with A \u00b7 wrong V_AK sign \u00b7 wrong terminals for Thevenin','k\u03a9\u00b7mA = V, V/k\u03a9 = mA.'],['Tricks','Power budget','MOSFET: P = V_DS\u00b7I_D \u00b7 BJT: P \u2248 V_CE\u00b7I_C','Switch fully ON \u21d2 small V \u21d2 cool transistor.']);\n$('fc').innerHTML='\u003coption value=\"\">All topics\u003c/option>'+[...new Set(F.map(r=>r[0]))].map(c=>`\u003coption>${c}\u003c/option>`).join('');\n/* exercises */\nconst EX=[['Circuits','Kirchhoff / Thevenin','V1 = 10 V \u2192 1k \u2192 node A; 1 mA source from A to ground; A \u2192 0.5k \u2192 0.5k \u2192 V2 = 5 V (\u2212 on the circuit side). Find I_B (through the 0.5k + 0.5k branch) and the voltage across the current source.','Open the 0.5k branch: R_TH = 1k + 0.5k = 1.5k, V_TH = 9 V. I_B = (9 + 5)/(1.5k + 0.5k) = 14 V/2k = \u003cb>7 mA\u003c/b>, I_A = 8 mA, V_source = \u003cb>\u22122 V\u003c/b>. Load it in Maker (preset \u201cBack to basics\u201d).'],['Circuits','Thevenin on a bridge-like net','V1 = 10 V feeds R1 = 1k; R2 = 1k goes from that node to ground; R3 = 1k is in series with a 5 mA current sink to ground; loa
