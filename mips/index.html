dget':'V_CE = 5 V at 100 mA \u2192 0.5 W, check the transistor rating'});\n/* step-by-step solver */\nconst E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2],e12=r=>{const d=10**Math.floor(Math.log10(r)),m=r/d;return(E12.find(e=>e>=m-1e-9)||10)*d};\nconst SOL={div:{n:'Voltage divider output',a:'\u201cFind V_out\u201d, \u201cvoltage across R2\u201d, \u201cwhat voltage does the next stage get?\u201d',F:[['vi','Vin (V)',10],['r1','R1 (k\u03a9)',1],['r2','R2 (k\u03a9)',3]],S:v=>{const I=v.vi/(v.r1+v.r2);return{s:[['Check what is in series','R1 and R2 carry the same current (nothing else hangs on the middle node).','That is the condition for a divider.'],['Total current',`I = Vin/(R1+R2) = ${f(v.vi)}/${f(v.r1+v.r2)} = ${f(I,3)} mA`,'k\u03a9 with V gives mA.'],['Voltage across R2',`V_out = I\u00b7R2 = ${f(I,3)}\u00b7${f(v.r2)} = ${f(I*v.r2,3)} V`,'Same as Vin\u00b7R2/(R1+R2).'],['Sanity check',`V_out ${f(I*v.r2,2)} V \u2264 Vin ${f(v.vi)} V \u2713`,'A divider never gives more than the input.']],a:`V_out = ${f(I*v.r2,3)} V`}}},\nthev:{n:'Thevenin + load current',a:'\u201cReplace by its Thevenin equivalent\u201d, \u201ccurrent through R_L\u201d, \u201cwhat if R_L changes?\u201d',F:[['vi','Vin (V)',10],['r1','R1 (k\u03a9)',1],['r2','R2 (k\u03a9)',1],['rl','Load R_L (k\u03a9)',1]],S:v=>{const vt=v.vi*v.r2/(v.r1+v.r2),rt=v.r1*v.r2/(v.r1+v.r2),I=vt/(rt+v.rl);return{s:[['Open the load',`V_TH = Vin\u00b7R2/(R1+R2) = ${f(vt,3)} V`,'Voltage between A and B with nothing attached.'],['Kill the sources',`R_TH = R1\u2016R2 = ${f(rt,3)} k\u03a9`,'Voltage source \u2192 wire, then look into A\u2013B.'],['Draw the equivalent','V_TH in series with R_TH, then R_L.','Now it is a one-loop circuit.'],['Load current',`I_L = V_TH/(R_TH+R_L) = ${f(vt,3)}/${f(rt+v.rl,3)} = ${f(I,3)} mA`,'Change R_L and only this step changes.'],['Load voltage and power',`V_L = I_L\u00b7R_L = ${f(I*v.rl,3)} V, P_L = ${f(I*I*v.rl,3)} mW`,'']],a:`V_TH = ${f(vt,3)} V, R_TH = ${f(rt,3)} k\u03a9, I_L = ${f(I,3)} mA`}}},\neq:{n:'Equivalent resistance',a:'\u201cFind R_eq\u201d, \u201ctotal current drawn from the source\u201d',F:[['r1','R1 (k\u03a9)',1],['r2','R2 (k\u03a9)',2],['r3','R3 (k\u03a9)',2],['vs','Source (V)',10]],S:v=>{const rp=v.r2*v.r3/(v.r2+v.r3),rt=v.r1+rp,I=v.vs/rt,vp=I*rp;return{s:[['Find what is in parallel','R2 and R3 share the same two nodes (R1 is in series with them).','Always start with the parallel part.'],['Parallel part',`R2\u2016R3 = R2\u00b7R3/(R2+R3) = ${f(rp,3)} k\u03a9`,'Always smaller than the smallest one.'],['Add the series',`R_eq = R1 + R2\u2016R3 = ${f(rt,3)} k\u03a9`,'Series resistors add.'],['Total current',`I = Vs/R_eq = ${f(v.vs)}/${f(rt,3)} = ${f(I,3)} mA`,'Ohm\u2019s law.'],['Voltage on the parallel part',`V = I\u00b7(R2\u2016R3) = ${f(vp,3)} V`,'Then split into branches.'],['Branch currents',`I2 = ${f(vp/v.r2,3)} mA, I3 = ${f(vp/v.r3,3)} mA`,'Check: I2 + I3 = I.']],a:`R_eq = ${f(rt,3)} k\u03a9, I = ${f(I,3)} mA`}}},\nkcl:{n:'Two sources: KCL + KVL',a:'\u201cFind I1, I2, I3\u201d in a circuit with two batteries sharing a branch',F:[['v1','V1 (V)',10],['r1','R1 (\u03a9)',10],['v2','V2 (V)',20],['r3','R3 (\u03a9)',20],['r2','R2 shared (\u03a9)',40]],S:v=>{const Va=(v.v1/v.r1+v.v2/v.r3)/(1/v.r1+1/v.r2+1/v.r3),i1=(v.v1-Va)/v.r1,i3=(v.v2-Va)/v.r3,i2=Va/v.r2;return{s:[['Choose directions','I1 and I3 flow into node A, I2 flows out through R2 to ground.','Any choice works if you stay consistent. A negative result means the real direction is opposite.'],['KCL at A','I1 + I3 = I2','Currents in = currents out.'],['KVL on each loop','\u2212V1 + I1\u00b7R1 + I2\u00b7R2 = 0 and \u2212V2 + I3\u00b7R3 + I2\u00b7R2 = 0','Each drop is I\u00b7R.'],['Shortcut: voltage at node A',`V_A = (V1/R1 + V2/R3)/(1/R1 + 1/R2 + 1/R3) = ${f(Va,3)} V`,'It packs the equations into one.'],['Currents',`I1 = (V1\u2212V_A)/R1 = ${f(i1,4)} A \u00b7 I3 = (V2\u2212V_A)/R3 = ${f(i3,4)} A \u00b7 I2 = V_A/R2 = ${f(i2,4)} A`,'With \u03a9 and V you get A.'],['Check KCL',`I1 + I3 = ${f(i1+i3,4)} and I2 = ${f(i2,4)} \u2713`,'Always verify.']],a:`I1 = ${f(i1,4)} A, I2 = ${f(i2,4)} A, I3 = ${f(i3,4)} A`}}},\ndio:{n:'Diode operation point',a:'\u201cFind the Q point\u201d, \u201cis the diode ON?\u201d, \u201cdetermine the operation point of the diodes\u201d',F:[['vth','V_TH (V)',5],['rth','R_TH (k\u03a9)',2],['kind','Diode: 0 ideal, 1 silicon 0.7 V, 2 zener',1],['vz','Zener V_Z (V)',5]],S:v=>{const vf=v.kind==1?.7:0,z=v.kind==2,a=(v.vth-vf)/v.rth;let reg='OFF',I=0,Vd=v.vth;if(a>0){reg='ON';I=a;Vd=vf}else if(z&&v.vth\u003c-v.vz){reg='ZENER';I=(v.vth+v.vz)/v.rth;Vd=-v.vz}return{s:[['Reduce the circuit',`Everything around the diode becomes V_TH in series with R_TH (Thevenin). Here V_TH = ${f(v.vth)} V, R_TH = ${f(v.rth)} k\u03a9.`,'The diode is then alone in a single loop.'],['First guess',reg=='ON'?`V_TH \u2212 V_F = ${f(v.vth-vf,2)} V > 0: the source pushes current forward \u2192 guess ON`:reg=='ZENER'?`V_TH = ${f(v.vth)} V is below \u2212V_Z = ${f(-v.vz)} V \u2192 guess ZENER breakdown`:`V_TH \u2212 V_F = ${f(v.vth-vf,2)} V \u2264 0 \u2192 guess OFF`,'Look at what sign the source pushes on the anode.'],['Solve with that guess',reg=='ON'?`I = (V_TH \u2212 V_F)/R_TH = (${f(v.vth)} \u2212 ${f(vf)})/${f(v.rth)} = ${f(I,3)} mA, V_AK = ${f(vf)} V`:reg=='ZENER'?`I = (V_TH + V_Z)/R_TH = ${f(I,3)} mA (negative = reverse), V_AK = \u2212${f(v.vz)} V`:`I = 0, V_AK = V_TH = ${f(Vd)} V`,'ON = a source of V_F. ZENER = a source of \u2212V_Z. OFF = open circuit.'],['Check the guess',reg=='ON'?`I = ${f(I,3)} mA > 0 \u2713`:reg=='ZENER'?'I \u003c 0 and V_AK = \u2212V_Z \u2713':`V_AK = ${f(Vd)} V \u2264 V_F${z?' and \u2265 \u2212V_Z':''} \u2713`,'If it fails, change the guess and redo the previous step.'],['Load line (to draw it)',`Diode as a short: (V_AK = 0, I = ${f(v.vth/v.rth,2)} mA). As an open circuit: (V_AK = ${f(v.vth)} V, I = 0). Q is where it meets the diode curve.`,'Two points define a line.']],a:`Q = (V_AK = ${f(Vd,3)} V, I_D = ${f(I,3)} mA), diode ${reg}`}}},\nled:{n:'LED series resistor',a:'\u201cCalculate R to limit the current to \u2026\u201d, \u201cdesign the LED circuit\u201d',F:[['vs','Supply (V)',5],['vf','LED V_F (V)',2],['i','Desired current (mA)',20]],S:v=>{const R=(v.vs-v.vf)/v.i*1000,Rs=e12(R),Ia=(v.vs-v.vf)/Rs*1000;return{s:[['KVL around the loop',`Vs = V_R + V_F \u2192 V_R = ${f(v.vs)} \u2212 ${f(v.vf)} = ${f(v.vs-v.vf,2)} V`,'The resistor takes whatever the LED does not.'],['Ohm for R',`R = V_R/I = ${f(v.vs-v.vf,2)} V / ${f(v.i)} mA = ${f(R,1)} \u03a9`,'V/mA = k\u03a9.'],['Pick a standard value',`Next E12 value \u2265 ${f(R,1)} \u03a9 \u2192 ${f(Rs,1)} \u03a9, giving I = ${f(Ia,2)} mA`,'Round up so you never exceed the current.'],['Power in R',`P = V_R\u00b7I = ${f((v.vs-v.vf)*v.i,1)} mW`,'The resistor rating must be above this.']],a:`R \u2248 ${f(R,1)} \u03a9 (use ${f(Rs,1)} \u03a9)`}}},\nmos:{n:'MOSFET operation point',a:'\u201cCalculate the operation point of the MOSFET\u201d, \u201cdraw the load line\u201d, \u201cpower dissipated in the transistor\u201d',F:[['g','V_GS (V)',7.5],['vdd','V_DD (V)',12],['rd','R_D (\u03a9)',40]],S:v=>{const s=v.g\u003c2.5?0:(v.g-2.5)*40,[I,vds]=mosQ(v.g,v.vdd,v.rd),reg=!s?'cutoff':v.vdd-s*v.rd/1000>=2?'saturation':'ohmic',st=[['Is it ON at all?',`V_GS = ${f(v.g)} V vs threshold 2.5 V \u2192 ${s?'above: a channel exists':'below: CUTOFF'}`,'Below the threshold the MOSFET is an open switch: I_D = 0, V_DS = V_DD.']];if(s)st.push(['Current if it were a current source',`I_sat = (V_GS \u2212 2.5)\u00b740 = ${f(s)} mA`,'Course curves: each volt above the threshold adds 40 mA.'],['Try saturation',`V_DS = V_DD \u2212 I_sat\u00b7R_D = ${f(v.vdd)} \u2212 ${f(s*v.rd/1000,2)} = ${f(v.vdd-s*v.rd/1000,2)} V`,'Saturation needs V_DS \u2265 2 V (the knee).'],['Verdict: '+reg,reg=='saturation'?'V_DS \u2265 2 V \u2192 saturation, so I_D = I_sat.':`V_DS \u003c 2 V \u2192 ohmic. R_on = 2 V/I_sat = ${f(2/s*1000,2)} \u03a9, I_D = V_DD/(R_D+R_on) = ${f(I,2)} mA`,'Ohmic = closed switch that acts like a small resistor.']);st.push(['Voltage and power',`V_DS = V_DD \u2212 I_D\u00b7R_D = ${f(vds,3)} V, P = V_DS\u00b7I_D = ${f(vds*I,2)} mW`,'A good switch has a small V_DS, so little heat.'],['Load line (to draw it)',`Short: I = V_DD/R_D = ${f(v.vdd/v.rd*1000,1)} mA. Open: V_DS = ${f(v.vdd)} V.`,'Q is where it meets the curve of your V_GS.']);return{s:st,a:`${reg} \u00b7 I_D = ${f(I,2)} mA \u00b7 V_DS = ${f(vds,3)} V`}}},\nbjt:{n:'BJT operation point',a:'\u201cDetermine the operation point of the transistor\u201d, \u201cis it saturated?\u201d, \u201ccalculate V_CE\u201d',F:[['vbb','V_BB (V)',5],['rb','R_B (k\u03a9)',10],['vcc','V_CC (V)',15],['rc','R_C (k\u03a9)',1],['be','\u03b2',100]],S:v=>{const ib=Math.max((v.vbb-.7)/v.rb,0),ics=v.vcc/v.rc,ic=Math.min(v.be*ib,ics),reg=!ib?'cutoff':v.be*ib>=ics?'saturation':'active',vce=v.vcc-ic*v.rc;return{s:[['Base loop',`I_B = (V_BB \u2212 0.7)/R_B = (${f(v.vbb)} \u2212 0.7)/${f(v.rb)} = ${f(ib*1000,1)} \u00b5A`,ib?'If V_BB \u003c 0.7 V nothing flows: cutoff.':'V_BB \u003c 0.7 V: the base junction does not conduct \u2192 CUTOFF.'],['Current if active',`\u03b2\u00b7I_B = ${f(v.be)}\u00b7${f(ib,4)} mA = ${f(v.be*ib,2)} mA`,'In the active region I_C = \u03b2\u00b7I_B.'],['Maximum possible current',`I_C(sat) = V_CC/R_C = ${f(v.vcc)}/${f(v.rc)} = ${f(ics,2)} mA`,'The collector resistor limits it.'],['Compare',`${f(v.be*ib,2)} mA ${v.be*ib>=ics?'\u2265':'\u003c'} ${f(ics,2)} mA \u2192 ${reg.toUpperCase()}`,'Larger: saturated (switch ON). Smaller: active (amplifier).'],['Collector loop',`I_C = ${f(ic,2)} mA, V_CE = V_CC \u2212 I_C\u00b7R_C = ${f(vce,2)} V`,'In saturation V_CE \u2248 0.'],['Power',`P = V_CE\u00b7I_C = ${f(vce*ic,2)} mW`,'']],a:`${reg} \u00b7 I_C = ${f(ic,2)} mA \u00b7 V_CE = ${f(vce,2)} V`}}},\nrc:{n:'RC charging time',a:'\u201cTime constant\u201d, \u201ctime to reach X volts\u201d, \u201cvoltage after t ms\u201d',F:[['r','R (k\u03a9)',10],['c','C (\u00b5F)',10],['v','Source V (V)',10],['vt','Target voltage (V)',6.3]],S:v=>{const tau=v.r*v.c,k=v.vt>0&&v.vt\u003cv.v,t=k?-tau*Math.log(1-v.vt/v.v):0;return{s:[['Time constant',`\u03c4 = R\u00b7C = ${f(v.r)} k\u03a9 \u00b7 ${f(v.c)} \u00b5F = ${f(tau)} ms`,'k\u03a9\u00b7\u00b5F = ms.'],['Charging law','v(t) = V\u00b7(1 \u2212 e^(\u2212t/\u03c4))','Starts at 0 and heads to V exponentially.'],['Time to the target',k?`t = \u2212\u03c4\u00b7ln(1 \u2212 ${f(v.vt)}/${f(v.v)}) = ${f(t,2)} ms`:'The target must be between 0 and V','Rearrange the law for t.'],['Rules of thumb',`1\u03c4 \u2192 63% (${f(.632*v.v,2)} V). 5\u03c4 = ${f(5*tau)} ms \u2192 99%`,'Handy for quick estimates.']],a:k?`t = ${f(t,2)} ms to reach ${f(v.vt)} V`:'Choose a target between 0 and V'}}}};\nconst ASK=[['\u201cFind the operation point / Q point\u201d','Thevenin around the nonlinear part \u2192 guess a region \u2192 solve \u2192 check it is consistent (or draw the load line).'],['\u201cCalculate the current through \u2026\u201d','Reduce to one loop and use Ohm\u2019s law. With several sources or nodes use KCL + KVL or Thevenin.'],['\u201cFind the voltage across \u2026\u201d','Resistors in series with nothing else on the node \u2192 voltage divider. A load or several sources \u2192 Thevenin.'],['\u201cIs it a source or a load?\u201d','Current leaving the + terminal means source. Compute P = V\u00b7I with the passive sign: negative means it delivers.'],['\u201cPower dissipated in the transistor\u201d','Find Q first, then P = V_DS\u00b7I_D (MOSFET) or V_CE\u00b7I_C (BJT).'],['\u201cCalculate R so that \u2026\u201d','Write KVL with the target current, solve for R, then round to a standard value.'],['\u201cDraw the load line\u201d','Two points: device short (I = V/R) and device open (V = source). Mark Q where the line meets the curve.'],['\u201cTime to charge\u201d, \u201cvoltage after t\u201d','\u03c4 = R\u00b7C and v(t) = V(1 \u2212 e^(\u2212t/\u03c4)).'],['\u201cDoes it work as a switch?\u201d','ON = saturation (BJT: \u03b2\u00b7I_B \u2265 I_C(sat)) or ohmic with V_GS well above the threshold (MOSFET).']];\n$('svq').innerHTML=ASK.map(a=>`\u003cdiv class=\"fi\">\u003cb>${a[0]}\u003c/b>\u003csmall>${a[1]}\u003c/small>\u003c/div>`).join('');\nfunction svForm(){const t=SOL[$('svt').value];$('svask').innerHTML='\u003cb>You will see it as:\u003c/b> '+t.a;$('svf').innerHTML=t.F.map(([id,l,d])=>`\u003cdiv class=\"sl\">\u003clabel for=\"sv_${id}\">${l}\u003c/label>\u003cinput type=\"number\" step=\"any\" id=\"sv_${id}\" value=\"${d}\" style=\"padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit\">\u003c/div>`).join('')}\nfunction svSolve(){const t=SOL[$('svt').value],v={};for(const[id]of t.F){const e=$('sv_'+id);if(!e||e.value==='')return;v[id]=+e.value}if(v.r1\u003c=0||v.r2\u003c=0||v.r3\u003c=0||v.rth\u003c=0||v.rb\u003c=0||v.rc\u003c=0||v.rd\u003c=0)return;const o=t.S(v);$('svs').innerHTML=o.s.map((s,i)=>`\u003cdiv class=\"fi\">\u003cb>${i+1}. ${s[0]}\u003c/b>\u003cbr>\u003cspan class=\"f\">${s[1]}\u003c/span>\u003csmall>${s[2]||''}\u003c/small>\u003c/div>`).join('')+`\u003cdiv class=\"res\">\u003cb>Answer:\u003c/b> ${o.a}\u003c/div>`}\n$('svt').innerHTML=Object.entries(SOL).map(([k,t])=>`\u003coption value=\"${k}\">${t.n}\u003c/option>`).join('');$('svt').onchange=()=>{svForm();draw()};svForm();\nfunction draw(){circ();dio();mos();bjt();rc();mkSolve();svSolve();list()}\naddEventListener('resize',draw);show('learn');\n\u003c/script>\u003c/body>\u003c/html>\n"}</script>
<script>
const META=JSON.parse(document.getElementById('meta').textContent),SRC=JSON.parse(document.getElementById('srcs').textContent);
const $=id=>document.getElementById(id),views=$('views'),home=$('home'),tabs=$('tabs'),grid=$('grid');
let mode='auto',cur='',unlocked=false;
try{mode=localStorage.getItem('mp-theme')||'auto';unlocked=localStorage.getItem('mp-hw')==='1'}catch(e){}
if(mode==='halloween'&&!unlocked)mode='auto';
const mq=window.matchMedia('(prefers-color-scheme:dark)'),root=document.documentElement;
const eff=()=>mode==='halloween'?'dark':mode==='auto'?(mq.matches?'dark':'light'):mode;
function syncFrame(f){try{const d=f.contentDocument.documentElement;d.dataset.theme=eff();if(mode==='halloween')d.dataset.hw='1';else delete d.dataset.hw}catch(e){}}
function buildOpts(){const o=[['auto','Default'],['light','Light'],['dark','Dark']];if(unlocked)o.push(['halloween','🎃 Halloween']);
 $('th').innerHTML=o.map(x=>`<option value="${x[0]}">Theme: ${x[1]}</option>`).join('');$('th').value=mode}
function applyTheme(){root.dataset.theme=eff();if(mode==='halloween')root.dataset.hw='1';else delete root.dataset.hw;
 buildOpts();views.querySelectorAll('iframe').forEach(syncFrame);mode==='halloween'?hwStart():hwStop()}
$('th').onchange=()=>{mode=$('th').value;try{localStorage.setItem('mp-theme',mode)}catch(e){}applyTheme();if(mode==='halloween')audio()};
mq.addEventListener&&mq.addEventListener('change',applyTheme);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
let taps=[];$('hh').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(t=>n-t<4000);taps.push(n);
 if(taps.length>=7){taps=[];const first=!unlocked;unlocked=true;try{localStorage.setItem('mp-hw','1');localStorage.setItem('mp-theme','halloween')}catch(e){}
  mode='halloween';applyTheme();audio();toast(first?'🎃 Secret theme unlocked… sleep well.':'🎃 Halloween theme on')}});

/* ---------- Halloween ambience (synthesised, no audio files) ---------- */
let AC=null,master=null,verb=null,sndOn=true,scareOn=true,hwOn=false,sndT=0,scareT=0;
try{sndOn=localStorage.getItem('mp-hw-snd')!=='0';scareOn=localStorage.getItem('mp-hw-scare')!=='0'}catch(e){}
function paintPanel(){$('hwSnd').textContent=sndOn?'🔊':'🔇';$('hwSc').textContent=scareOn?'👻':'🚫';$('hwEye').textContent=eyeOn?'👁':'🙈';$('hwCam').textContent=camOn?'📹':'📷'}
function audio(){
 try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
  const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.6;master.connect(comp);comp.connect(AC.destination);
  verb=AC.createConvolver();const n=AC.sampleRate*2.5,b=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
  verb.buffer=b;const vg=AC.createGain();vg.gain.value=.8;verb.connect(vg);vg.connect(master)}
 if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
['pointerup','click','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(hwOn)audio()},true));
const rr=(a,b)=>a+Math.random()*(b-a);
function noiseBuf(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b}
function chain(node,wet,pan){let last=node;if(pan!==undefined&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;last.connect(p);last=p}
 last.connect(master);if(wet){const g=AC.createGain();g.gain.value=wet;last.connect(g);g.connect(verb)}}
function envG(t,a,d,peak){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);return g}
const SND={

 [187,271,419,563,911].forEach(fq=>{const o=AC.createOscillator();o.frequency.value=fq;const g=envG(L,.002,.7,.16);o.connect(g);o.start(L);o.stop(L+.8);to(g)});

function scare(v){

/* ---------- watchers: things that look back at you ---------- */
const ptr={x:-999,y:-999},live=new Set();
function lookAt(){live.forEach(o=>{const r=o.el.getBoundingClientRect(),dx=ptr.x-(r.left+r.width/2),dy=ptr.y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1;
 o.el.style.setProperty('--px',Math.max(-4,Math.min(4,dx/d*4)));o.el.style.setProperty('--py',Math.max(-3,Math.min(3,dy/d*3)));if(d<o.flee)o.kill(true)})}
document.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;lookAt()},{passive:true});
function eyes(){
 hunt();const el=document.createElement('div');el.className='eyes';el.style.setProperty('--s',rr(.9,1.9).toFixed(2));el.innerHTML='<i></i><i></i>';
 const e=Math.random(),x=e<.5?rr(2,22):e<.8?rr(70,92):rr(25,70);el.style.left=x+'%';el.style.top=rr(12,88)+'%';document.body.appendChild(el);
 let life;const o={el,flee:120,kill(fast){if(!live.has(o))return;live.delete(o);clearTimeout(life);if(fast)el.style.transitionDuration='.12s';el.classList.remove('on');setTimeout(()=>el.remove(),fast?200:1900)}};
 live.add(o);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));life=setTimeout(()=>o.kill(false),rr(7000,14000));
}

 pk.style.display='block';pk.style.top=rr(22,55)+'%';pk.style.left=left?'0':'auto';pk.style.right=left?'auto':'0';
 pk.style.transitionDuration='3s';pk.style.transform=`translateX(${sx*-160}px) scaleX(${sx})`;void pk.offsetWidth;
 pk.style.transform=`translateX(${sx*-30}px) scaleX(${sx})`;try{if(Math.random()<.4)SND.creak()}catch(e){}
 const t0=Date.now(),iv=setInterval(()=>{const r=pk.getBoundingClientRect(),d=Math.hypot(ptr.x-(r.left+r.width/2),ptr.y-(r.top+r.height/2));
  if(d<210||Date.now()-t0>rr(4500,7500)||!hwOn){clearInterval(iv);pk.style.transitionDuration=d<210?'.5s':'2.2s';pk.style.transform=`translateX(${sx*-170}px) scaleX(${sx})`;
   setTimeout(()=>{pk.style.display='none';delete pk.dataset.busy},d<210?600:2300)}},150);
}

 el.className='gtxt';el.textContent=w[Math.floor(Math.random()*w.length)];el.style.left=rr(6,70)+'%';el.style.top=rr(15,85)+'%';document.body.appendChild(el);setTimeout(()=>el.remove(),4400)}
