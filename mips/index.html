display:flex;flex-direction:column;gap:8px}\n.grp h3{margin:0;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}\n.grp label{color:var(--fg);margin:0;display:flex;gap:8px;align-items:center;cursor:pointer;flex-wrap:wrap}\n.grp select{width:100%}\nbutton{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}\nbutton:hover{border-color:var(--acc)}\nbutton.pri{background:var(--acc);border-color:var(--acc);color:#fff}\n.pal{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}\n.pal button.sel{outline:2px solid var(--fg);outline-offset:1px}\n.st{color:var(--cellfg)!important;border-color:#0004!important}\n.IF{background:var(--IF)}.ID{background:var(--ID)}.EX{background:var(--EX)}.MEM{background:var(--MEM)}.WB{background:var(--WB)}\n.scroll{overflow-x:auto;padding-bottom:6px}\n.grid{display:grid;gap:3px;width:max-content;user-select:none;-webkit-user-select:none}\n.hd{color:var(--acc);text-align:center;font-size:12px}\n.ins{white-space:nowrap;padding-right:10px;display:flex;align-items:center;font-weight:700}\n.ins small{font-weight:400;color:var(--mut);margin-left:6px}\n.ins.fl{color:var(--mut);text-decoration:line-through}\n.c{width:46px;height:30px;border:1px solid var(--bd);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--cellfg);cursor:pointer;touch-action:none}\n.c.empty{background:transparent;color:var(--mut)}\n.c.stall{background-image:repeating-linear-gradient(135deg,#0000 0 4px,#0002 4px 6px)}\n.c.ok{outline:2px solid var(--ok);outline-offset:-2px}\n.c.no{outline:2px solid var(--bad);outline-offset:-2px}\n.c.miss{outline:2px dashed var(--bad);outline-offset:-2px;color:var(--bad)}\n.ro .c{cursor:default}\n.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}\n#res{font-weight:700;margin:10px 0 0}\n.good{color:var(--ok)}.badc{color:var(--bad)}.mut{color:var(--mut)}\nul{margin:6px 0 0;padding-left:18px}\n.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}\n.stats div{border:1px solid var(--bd);border-radius:6px;padding:4px 10px}\n.stats b{color:var(--acc)}\n.out{margin-top:10px;white-space:pre-wrap}\n\n.lsn p{margin:8px 0}\n.tip{border-left:3px solid var(--acc);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:0 6px 6px 0}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:10px}\n.two h4{margin:0 0 6px;font-size:13px}\n.two .tot{color:var(--acc);font-weight:700}\n.narr{margin-top:8px;font-size:13px}\n.narr li{margin:2px 0}\ninput[type=range]{width:220px;vertical-align:middle}\n.qz{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.tabs button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}\ncode{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:0 4px}\n\n.bz .top2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px}\n.bz .hud{display:flex;gap:8px;flex-wrap:wrap}.bz .hud div{border:1px solid var(--bd);border-radius:6px;padding:2px 10px}.bz .hud b{color:var(--acc)}\n.bz pre{margin:8px 0;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);overflow-x:auto;white-space:pre}\n.bz .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}\n.bz .opts button{padding:10px 12px;text-align:left}.bz .opts button.ok{outline:2px solid var(--ok);outline-offset:-2px}.bz .opts button.no{outline:2px solid var(--bad);outline-offset:-2px}\n.bz .bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:6px 0}.bz .bar i{display:block;height:100%;background:var(--acc);width:100%}\n.bz .q{font-weight:700;margin:6px 0}.bz .big{font-size:22px;font-weight:700;color:var(--acc)}\n\n.bz .arc{background:#0b0b0a;color:#ffd54a;border:2px solid var(--acc);border-radius:8px;padding:14px;margin-top:14px;text-align:center;letter-spacing:.08em}\n.bz .arc h3{margin:0 0 8px;color:#ff6b6b;letter-spacing:.25em;font-size:15px}\n.bz .arc table{width:100%;max-width:440px;margin:0 auto;border-collapse:collapse}.bz .arc td,.bz .arc th{padding:2px 8px;text-align:left;font-weight:400}\n.bz .arc th{color:#928f85;font-size:11px}.bz .arc td:nth-child(3),.bz .arc th:nth-child(3){text-align:right}\n.bz .arc tr.r1 td{color:#ff6b6b}.bz .arc tr.r2 td{color:#ffd54a}.bz .arc tr.r3 td{color:#7cfc7c}.bz .arc tr td{color:#e8e6df}\n.bz .arc tr.r1 td{color:#ff6b6b}.bz .arc tr.r2 td{color:#ffd54a}.bz .arc tr.r3 td{color:#7cfc7c}\n.bz .arc tr.me td{animation:bzb .9s steps(2) infinite;font-weight:700}@keyframes bzb{50%{opacity:.2}}\n.bz .arc .tabs2{display:flex;gap:6px;justify-content:center;margin-bottom:10px}.bz .arc .tabs2 button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}\n.bz .ini{display:inline-flex;flex-direction:column;align-items:center;margin:6px 8px}.bz .ini span{font-size:38px;font-weight:700;color:#fff;border-bottom:3px solid #ffd54a;min-width:42px;cursor:pointer}\n.bz .ini.cur span{animation:bzb .8s steps(2) infinite}.bz .arc .hint{color:#928f85;font-size:12px;margin-top:8px}\n\u003c/style>\n\u003cstyle id='mp-theme'>html[data-hw]:root:root{--bg:#0d0612;--fg:#f2e6d0;--mut:#a089b8;--card:#1a0f24;--bd:#3a2250;--ok:#8bd450;--bad:#ff5a4d;--acc:#ff7a18;color-scheme:dark}html[data-hw] h1{text-shadow:0 0 10px #ff7a1866}html[data-hw] input{accent-color:#ff7a18}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003ch1>\u258cMIPS64 pipeline simulator\u003c/h1>\n\u003cp class=\"sub\">Predict the diagram yourself, then compare it with the computed one. Turn features on and off in the menu.\u003c/p>\n\n\n\u003cdiv class=\"card lsn\" id=\"learnCard\">\n  \u003cdetails open>\n  \u003csummary>\ud83c\udf93 Learn mode \u2014 one idea at a time, with before/after diagrams\u003c/summary>\n  \u003cdiv class=\"pal tabs\" id=\"lsnTabs\" style=\"margin-top:12px\">\u003c/div>\n  \u003cdiv id=\"lsnBody\">\u003c/div>\n  \u003c/details>\n\u003c/div>\n\u003cdiv class=\"card bz\" id=\"blitzCard\">\n  \u003cdetails open>\n  \u003csummary>\ud83c\udfae Pipeline Blitz \u2014 10 rounds or endless, 3 lives\u003c/summary>\n  \u003cdiv id=\"blitz\" style=\"margin-top:12px\">\u003c/div>\n  \u003c/details>\n\u003c/div>\n\u003cdiv class=\"card\">\n  \u003clabel for=\"pre\">Examples (slides and Unit 2 exercises)\u003c/label>\n  \u003cselect id=\"pre\" style=\"margin-bottom:10px;width:100%\">\u003c/select>\n  \u003clabel for=\"code\">Instructions (one per line, labels like \u003cb>loop:\u003c/b>)\u003c/label>\n  \u003ctextarea id=\"code\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"mut\" style=\"margin-top:6px;font-size:12px\">Branches follow real register values (set them in the menu; all registers start at 0, \u003cb>ld\u003c/b> loads 0). Force an outcome by ending a branch line with \u003cb>; taken\u003c/b> or \u003cb>; nt\u003c/b>. Loops are executed up to the instruction limit.\u003c/div>\n\u003c/div>\n\n\u003cdetails class=\"card\" open>\n  \u003csummary>\u2699 Settings menu \u2014 choose which features are active\u003c/summary>\n  \u003cdiv class=\"menu\">\n    \u003cdiv class=\"grp\">\u003ch3>Data hazards\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"fwd\"> Forwarding paths\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"ren\"> Register renaming (no WAW stalls)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Structural\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"mem\"> Single memory port (IF vs load/store MEM)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Control hazards\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"early\"> Early branches (resolved in ID)\u003c/label>\n      \u003cselect id=\"pred\">\u003coption value=\"stall\">No prediction (stall fetch)\u003c/option>\u003coption value=\"nt\">Always not taken\u003c/option>\u003coption value=\"bht\">2-bit predictor (BHT/BTB, starts at 01)\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Execution units\u003c/h3>\n      \u003clabel>Int mul/div latency \u003cinput type=\"number\" id=\"mulLat\" min=\"1\" max=\"30\" value=\"1\"> cycles\u003c/label>\n      \u003clabel>Floating point (.d/.s) latency \u003cinput type=\"number\" id=\"fpLat\" min=\"1\" max=\"30\" value=\"1\"> cycles\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"pipe\"> Pipelined multi-cycle units (EX1\u2026EXn)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Ordering\u003c/h3>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"ooo\"> Out-of-order execution\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"oooRet\"> Out-of-order retirement (off = precise exceptions)\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"grp\">\u003ch3>Display and program\u003c/h3>\n      \u003clabel>Clock cycles shown \u003cinput type=\"number\" id=\"cyc\" min=\"1\" max=\"500\" value=\"12\">\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"auto\" checked> Extend automatically to fit the solution\u003c/label>\n      \u003clabel>Max instructions executed \u003cinput type=\"number\" id=\"maxI\" min=\"1\" max=\"500\" value=\"60\">\u003c/label>\n      \u003clabel>Initial registers \u003cinput type=\"text\" id=\"init\" placeholder=\"r1=8, r2=2\" style=\"flex:1;min-width:120px\">\u003c/label>\n    \u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\n\u003cdiv class=\"card\" id=\"pracCard\">\n  \u003ch2>\ud83c\udfb2 Practice test \u2014 a new random exercise\u003c/h2>\n  \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n    \u003cselect id=\"lvl\">\u003coption value=\"1\">Easy \u00b7 basic RAW stalls\u003c/option>\u003coption value=\"2\">Medium \u00b7 loads, ports, branches\u003c/option>\u003coption value=\"3\">Hard \u00b7 loops, mul units, predictors\u003c/option>\u003c/select>\n    \u003clabel style=\"margin:0\">Seed \u003cinput type=\"number\" id=\"seed\" placeholder=\"random\" style=\"width:110px\">\u003c/label>\n    \u003cbutton class=\"pri\" id=\"newEx\">New exercise\u003c/button>\n    \u003cbutton id=\"retryEx\">Retry this one\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"exInfo\" class=\"mut\" style=\"margin-top:10px\">\u003c/div>\n  \u003cdiv id=\"score\" style=\"margin-top:6px;font-weight:700\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\n  \u003ch2>Your prediction\u003c/h2>\n  \u003cdiv class=\"pal\" id=\"pal\">\u003c/div>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"grid\" id=\"mine\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"pri\" id=\"chk\">Check my answer\u003c/button>\n    \u003cbutton id=\"hint\">Hint\u003c/button>\n    \u003cbutton id=\"rev\">Show solution\u003c/button>\n    \u003cbutton id=\"clr\">Clear grid\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"res\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\" id=\"solCard\" hidden>\n  \u003ch2>Expected solution\u003c/h2>\n  \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"grid ro\" id=\"sol\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"why\" class=\"mut\" style=\"margin-top:10px\">\u003c/div>\n\u003c/div>\n\n\u003cdetails class=\"card\">\n  \u003csummary>\ud83e\uddee Performance calculator (exercises 10\u201313, 15.1\u201315.3)\u003c/summary>\n  \u003cdiv style=\"margin-top:10px\">\n    \u003clabel for=\"stg\">Stage times in ns, comma separated (sequential CPU executes them one after another)\u003c/label>\n    \u003cinput type=\"text\" id=\"stg\" value=\"50, 50, 60, 50, 40\" style=\"width:100%\">\n    \u003cdiv class=\"btns\">\u003cbutton id=\"calc\">Calculate\u003c/button>\u003c/div>\n    \u003cdiv class=\"out\" id=\"calcOut\">\u003c/div>\n    \u003clabel for=\"fq\" style=\"margin-top:14px\">Frequency \u2194 cycle time and MIPS\u003c/label>\n    \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n      \u003cinput type=\"number\" id=\"fq\" value=\"2\" step=\"any\" style=\"width:100px\"> GHz,\n      \u003cinput type=\"number\" id=\"cpi\" value=\"1\" step=\"any\" style=\"width:80px\"> CPI\n      \u003cbutton id=\"calc2\">Calculate\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"out\" id=\"calc2Out\">\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003c/div>\n\n\u003cscript>\nconst ST=['IF','ID','EX','MEM','WB'];\nconst $=id=>document.getElementById(id);\nconst LOAD=/^(ld|lw|lwu|lh|lhu|lb|lbu|l\\.d|l\\.s)$/,STORE=/^(sd|sw|sh|sb|s\\.d|s\\.s)$/,BR=/^(beq|bne|beqz|bnez|bgez|bltz|blez|bgtz)$/;\nconst MUL=/^(dmul|dmulu|mul|mult|dmult|ddiv|ddivu|div|divu)$/;\nconst isReg=t=>/^(r\\d+|\\$\\w+|f\\d+)$/i.test(t||'')&&!/^(r0|\\$0|\\$zero)$/i.test(t);\n\nconst D={fwd:0,mem:0,early:0,pred:'stall',mulLat:1,fpLat:1,pipe:0,ooo:0,oooRet:0,ren:0,cyc:12,auto:1,maxI:60,init:''};\nconst P1=\"ori r1, r0, 2 ; r1 = 2\\nstartf:\\nbeqz r1, endf ; jump to endf if r1 zero\\ndaddi r1, r1, -1 ; r1 = r1-1\\nj startf ; jump to startf\\nendf:\\nld r5, 100(r3)\";\nconst P20=\"ori r1, r0, 8 ; r1 = 8\\ndaddi r2, r0, 2 ; r2 = 2\\nloop:\\nbeqz r1, dest\\ndmul r3, r2, r7\\nxor r6, r4, r5\\ndadd r6, r7, r6\\ndsub r1, r1, r2\\nj loop\\ndest:\\ndmul r5, r4, r2\";\nconst PRE=[\n ['Slide 46 \u00b7 Basic pipeline',\"dadd r4, r3, r2\\ndsub r12, r13, r14\\nxor r5, r5, r5\\nand r13, r14, r15\",{}],\n ['Slide 56 \u00b7 Structural hazard',\"ld r11, 120(r0)\\ndadd r2, r3, r6\\nxor r15, r15, r15\\ndsub r4, r1, r9\\nand r12, r13, r10\",{mem:1}],\n ['Slide 57 \u00b7 RAW, no forwarding',\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\\nxor r18, r18, r18\",{}],\n ['Slide 74 \u00b7 RAW, forwarding',\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\",{fwd:1}],\n ['Slide 77 \u00b7 Load-use, forwarding',\"ld r2, 120(r3)\\ndsub r1, r10, r2\\nor r12, r11, r14\",{fwd:1}],\n ['Slide 80 \u00b7 Two forwarding paths',\"dadd r1, r3, r5\\nld r2, 120(r0)\\ndsub r4, r1, r2\",{fwd:1}],\n ['Slide 60 \u00b7 Branch not taken',\"beq r0, r3, loop ; nt\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",{}],\n ['Slide 60 \u00b7 Branch taken',\"beq r0, r3, loop ; taken\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",{}],\n ['Slide 61 \u00b7 Jump',\"j loop\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",{}],\n ['Slide 90 \u00b7 Early branch + RAW',\"daddi r1, r1, 4\\nbeq r1, r6, target ; nt\\nor r3, r4, r9\\ntarget: and r12, r2, r5\",{fwd:1,early:1}],\n ['Slide 93 \u00b7 Always-not-taken miss',\"beq r4, r5, target ; taken\\ndadd r9, r0, r7\\ndsub r11, r10, r5\\nor r12, r5, r14\\ntarget: dadd r7, r1, r3\",{pred:'nt'}],\n ['Slide 65 \u00b7 Pipelined mul unit',\"xor r1, r4, r5\\ndmul r1, r2, r3\\ndmul r8, r9, r10\\ndadd r9, r11, r12\",{mulLat:5,pipe:1,ooo:1,oooRet:1,ren:1}],\n ['Ex 15.4 \u00b7 Loop with dmul (mul = 3 cycles)',\"daddi r1, r0, 200\\nloop:\\nld r2, 0(r2)\\ndmul r2, r3, r1\\ndaddi r1, r1, -1\\ndmul r2, r3, r2\\nbnez r1, loop\\ndadd r9, r2, r3\",{mulLat:3,oooRet:1,cyc:15,auto:0,init:'r1=0, r2=0'}],\n ['Ex 16.1/16.2 \u00b7 Mul unit, OoO execution and retirement',\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndmul r4, r6, r8\\nld r3, 100(r2)\",{mulLat:4,ooo:1,oooRet:1}],\n ['Ex 16.3 \u00b7 Same, precise exceptions',\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndmul r4, r6, r8\\nld r3, 100(r2)\",{mulLat:4,ooo:1}],\n ['Ex 16.4 \u00b7 Pipelined mul unit + precise exceptions',\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndmul r4, r6, r8\\nld r3, 100(r2)\",{mulLat:4,ooo:1,pipe:1}],\n ['Ex 17.2 \u00b7 Original order (stall)',\"dadd r9, r5, r7\\nxor r4, r6, r7\\nori r9, r6, 1\\nld r3, 100(r4)\",{}],\n ['Ex 17.4 \u00b7 Reordered by the compiler',\"xor r4, r6, r7\\ndadd r9, r5, r7\\nori r9, r6, 1\\nld r3, 100(r4)\",{}],\n ['Ex 18 \u00b7 Forwarding EX\u2192EX and MEM\u2192EX',\"dadd r9, r5, r7\\nxor r2, r6, r7\\nld r4, 100(r9)\\ndsub r2, r4, r9\",{fwd:1}],\n ['Ex 18 \u00b7 Same without forwarding',\"dadd r9, r5, r7\\nxor r2, r6, r7\\nld r4, 100(r9)\\ndsub r2, r4, r9\",{}],\n ['Ex 19.1 \u00b7 Early branches + forwarding',P1,{fwd:1,early:1,cyc:20}],\n ['Ex 19.3 \u00b7 Always not taken',P1,{fwd:1,early:1,pred:'nt',cyc:20}],\n ['Ex 19.4 \u00b7 2-bit predictor',P1,{fwd:1,early:1,pred:'bht',cyc:20}],\n ['Ex 20.3 \u00b7 No forwarding, mul 3 cycles pipelined, OoO',P20,{early:1,pred:'nt',mulLat:3,pipe:1,ooo:1,oooRet:1,cyc:25}],\n ['Ex 20.5 \u00b7 Same with all forwarding paths',P20,{fwd:1,early:1,pred:'nt',mulLat:3,pipe:1,ooo:1,oooRet:1,cyc:13,auto:0}],\n ['Ex 21.1 \u00b7 ddiv (4 cycles), forwarding, imprecise',\"daddi r3, r0, 5\\nddiv r2, r4, r5\\nxor r3, r6, r8\\ndsub r2, r9, r10\",{fwd:1,mulLat:4,ooo:1,oooRet:1}],\n ['Ex 21.2 \u00b7 Same with register renaming',\"daddi r3, r0, 5\\nddiv r2, r4, r5\\nxor r3, r6, r8\\ndsub r2, r9, r10\",{fwd:1,mulLat:4,ooo:1,oooRet:1,ren:1}]\n];\n\n//SIM-START\nfunction parse(txt){\n  const out=[],lab={};\n  txt.split('\\n').forEach(raw=>{\n    const s=raw.trim();if(!s)return;\n    const cm=s.match(/;\\s*(taken|t|nt)\\s*$/i);\n    const force=cm?(/^nt$/i.test(cm[1])?0:1):null;\n    let b=s.replace(/;.*$/,'').trim();\n    const m=b.match(/^(\\w+):\\s*(.*)$/);\n    if(m){lab[m[1].toLowerCase()]=out.length;b=m[2];if(!b)return}\n    const a0=b.toLowerCase().split(/[,\\s()]+/).filter(Boolean),op=a0[0],a=a0.slice(1);\n    let dest=null,src=[],load=false,kind='alu',target=null,unit='gen';\n    if(op==='j'){kind='j';target=a[0]}\n    else if(BR.test(op)){kind='br';src=a.slice(0,/z$/.test(op)?1:2);target=a[a.length-1]}\n    else if(LOAD.test(op)){dest=a[0];src=[a[2]];load=true;kind='ld'}\n    else if(STORE.test(op)){src=[a[0],a[2]];kind='st'}\n    else if(/i$|iu$/.test(op)){dest=a[0];src=[a[1]]}\n    else{dest=a[0];src=[a[1],a[2]]}\n    if(kind==='alu'){if(MUL.test(op))unit='mul';else if(/\\.(d|s)$/.test(op))unit='fp'}\n    out.push({line:b.replace(/\\s+/g,' '),op,a,kind,target,force,unit,load,dest:isReg(dest)?dest:null,src:src.filter(isReg)});\n  });\n  return{out,lab};\n}\nfunction runVal(x,R){\n  const v=t=>/^(r0|\\$0|\\$zero)$/.test(t)?0:(R[t]||0),n=t=>Number(t)||0,a=x.a,o=x.op;let r=null;\n  if(/^(dadd|add|daddu|addu)$/.test(o))r=v(a[1])+v(a[2]);\n  else if(/^(dsub|sub|dsubu|subu)$/.test(o))r=v(a[1])-v(a[2]);\n  else if(o==='and')r=v(a[1])&v(a[2]);else if(o==='or')r=v(a[1])|v(a[2]);else if(o==='xor')r=v(a[1])^v(a[2]);\n  else if(/^(dmul|dmulu|mul|mult|dmult)$/.test(o))r=v(a[1])*v(a[2]);\n  else if(MUL.test(o))r=v(a[2])?Math.trunc(v(a[1])/v(a[2])):0;\n  else if(/^(daddi|addi|daddiu|addiu)$/.test(o))r=v(a[1])+n(a[2]);\n  else if(o==='ori')r=v(a[1])|n(a[2]);else if(o==='andi')r=v(a[1])&n(a[2]);else if(o==='xori')r=v(a[1])^n(a[2]);\n  else if(x.load)r=0;else if(x.dest)r=0;\n  if(r!==null&&x.dest)R[x.dest]=r;\n  if(x.kind!=='br')return null;\n  if(o==='beq')return v(a[0])===v(a[1]);if(o==='bne')return v(a[0])!==v(a[1]);\n  if(o==='beqz')return v(a[0])===0;if(o==='bnez')return v(a[0])!==0;\n  if(o==='bgez')return v(a[0])>=0;if(o==='bltz')return v(a[0])\u003c0;\n  if(o==='blez')return v(a[0])\u003c=0;return v(a[0])>0;\n}\nfunction simulate(P,o){\n  const L=P.out,R=Object.assign({},o.init),rows=[],notes=[],ex=[],cnt={};\n  const busy={gen:new Set(),mul:new Set(),fp:new Set()},memC=new Set(),wbC=new Set(),port=new Set(),bht={},ren={};\n  let pc=0,prev=null,redir=0,tk=false,maxC=0,steps=0,rq=32,lastWb=0;\n  const put=(row,c,l,s)=>{row.cells[c]={l,s:!!s};if(c>maxC)maxC=c};\n  const wrong=(start,idS,Rr)=>{\n    for(let j=0;start+j\u003cL.length;j++){\n      const c0=idS+j;if(c0>Rr)break;\n      const w={x:L[start+j],cells:{},fl:true,n:0};rows.push(w);\n      ST.forEach((l,k)=>{if(c0+k\u003c=Rr)put(w,c0+k,l)});\n    }\n  };\n  while(pc\u003cL.length&&steps\u003co.maxI){\n    steps++;\n    const x=L[pc];cnt[pc]=(cnt[pc]||0)+1;\n    const row={x,cells:{},fl:false,n:cnt[pc]};rows.push(row);\n    const ifS=prev?prev.idS:1;\n    let f=Math.max(ifS,redir);const showFrom=tk?f:ifS;tk=false;redir=0;\n    const f0=f;if(o.mem)while(port.has(f))f++;\n    const why={id:[],ex:[]};\n    if(f>f0)why.id.push('single memory port busy during fetch');\n    const idS=Math.max(f+1,prev?prev.exFirst:0);\n    const early=x.kind==='br'&&o.early;\n    const Lat=x.unit==='mul'?o.mulLat:x.unit==='fp'?o.fpLat:1,pipe=Lat>1&&o.pipe;\n    let idNeed=0,exNeed=0,dep=null;\n    x.src.forEach(reg=>{for(let k=ex.length-1;k>=0;k--){const p=ex[k];if(p.x.dest===reg){\n      const av=p.x.load?p.mem+1:p.execEnd+1;\n      if(early)idNeed=Math.max(idNeed,o.fwd?av:p.wb);\n      else if(o.fwd)exNeed=Math.max(exNeed,av);\n      else idNeed=Math.max(idNeed,p.wb);\n      dep=dep||{reg,p:p.x.line};break}}});\n    const b1=Math.max(idS+1,idNeed+1);\n    if(idNeed+1>idS+1)why.id.push(`RAW on ${dep.reg} (from \u201c${dep.p}\u201d)`);\n    const b2=Math.max(b1,prev?(o.ooo?prev.exFirst+1:prev.execEndAll+1):0);\n    if(b2>b1)why.id.push('previous instruction still in EX');\n    let e=b2,s;\n    for(;;){s=Math.max(e,exNeed);let bz=false;\n      if(pipe)bz=busy[x.unit].has(s);else for(let c=s;c\u003cs+Lat;c++)if(busy[x.unit].has(c))bz=true;\n      if(!bz)break;e++}\n    if(e>b2)why.id.push(`${x.unit==='gen'?'EX':x.unit==='mul'?'mul/div':'FP'} unit busy`);\n    const exFirst=e,execEnd=s+Lat-1;\n    if(s>exFirst)why.ex.push(`waiting for ${dep?dep.reg:'operand'} through forwarding${dep?` (from \u201c${dep.p}\u201d)`:''}`);\n    if(pipe)busy[x.unit].add(s);else for(let c=s;c\u003c=execEnd;c++)busy[x.unit].add(c);\n    let wbMin=0;\n    if(!o.ren&&x.dest)for(let k=ex.length-1;k>=0;k--)if(ex[k].x.dest===x.dest){wbMin=Math.max(wbMin,ex[k].wb+1);break}\n    if(!o.oooRet)wbMin=Math.max(wbMin,lastWb+1);\n    let w=Math.max(execEnd+2,wbMin);\n    while(memC.has(w-1)||wbC.has(w))w++;\n    if(w>execEnd+2)why.ex.push(!o.oooRet?'in-order retirement / MEM-WB conflict':'WAW ordering / MEM-WB conflict');\n    const mem=w-1;memC.add(mem);wbC.add(w);lastWb=Math.max(lastWb,w);\n    for(let c=showFrom;c\u003cidS;c++)put(row,c,'IF',c>showFrom);\n    for(let c=idS;c\u003cexFirst;c++)put(row,c,'ID',c>idS);\n    for(let c=exFirst;c\u003cs;c++)put(row,c,'EX',1);\n    for(let k=0;k\u003cLat;k++)put(row,s+k,pipe?'EX'+(k+1):'EX',!pipe&&k>0);\n    for(let c=execEnd+1;c\u003cmem;c++)put(row,c,pipe?'EX'+Lat:'EX',1);\n    put(row,mem,'MEM');put(row,w,'WB');\n    if(o.mem&&(x.kind==='ld'||x.kind==='st'))port.add(mem);\n    if(o.ren&&x.dest){ren[x.dest]='rr'+(rq++)}\n    const st=(exFirst-idS-1);\n    if(why.id.length&&st>0)notes.push(`${x.line}: ${st} stall${st>1?'s':''} in ID \u2014 ${why.id.join('; ')}`);\n    else if(why.id.length&&f>f0)notes.push(`${x.line}: fetch delayed \u2014 ${why.id.join('; ')}`);\n    const xs=(s-exFirst)+(mem-1-execEnd);\n    if(why.ex.length&&xs>0)notes.push(`${x.line}: ${xs} stall${xs>1?'s':''} in EX \u2014 ${why.ex.join('; ')}`);\n    else if(dep&&o.fwd&&!st&&!xs)notes.push(`${x.line}: ${dep.reg} forwarded from \u201c${dep.p}\u201d, no stall`);\n    const r={x,idS,exFirst,execEnd,execEndAll:mem-1,mem,wb:w};ex.push(r);prev=r;\n    const cond=runVal(x,R);let next=pc+1;\n    if(x.kind==='br'||x.kind==='j'){\n      const Rr=x.kind==='j'?idS:(early?exFirst-1:mem);\n      let tgt=P.lab[(x.target||'').toLowerCase()];\n      let taken=x.kind==='j'?true:(x.force!==null?!!x.force:!!cond);\n      if(tgt===undefined){taken=false;notes.push(`${x.line}: unknown label, treated as not taken`)}\n      const jk=x.kind==='j'?'jump':'branch';\n      let predT=false;\n      if(x.kind==='br'&&o.pred==='bht'){const sv=bht[pc];predT=sv!==undefined&&sv>=2;\n        if(sv===undefined)bht[pc]=1;\n        bht[pc]=taken?Math.min(3,bht[pc]+1):Math.max(0,bht[pc]-1)}\n      if(x.kind==='br'&&o.pred==='stall'){\n        if(taken){const w2={x:L[pc+1]||x,cells:{},fl:true,n:0};\n          if(pc+1\u003cL.length&&tgt!==pc+1){rows.push(w2);for(let c=idS;c\u003c=Rr;c++)put(w2,c,'IF',c>idS)}\n          redir=Rr+1;tk=true;notes.push(`${x.line}: taken, resolved in cycle ${Rr} \u2192 target fetched in cycle ${Rr+1}`)}\n        else{redir=Rr+1;notes.push(`${x.line}: not taken, but fetch waits for resolution (cycle ${Rr})`)}\n      }else{\n        if(predT&&taken)notes.push(`${x.line}: predicted taken, hit \u2192 no stall`);\n        else if(predT&&!taken){wrong(tgt,idS,Rr);redir=Rr+1;notes.push(`${x.line}: predicted taken, was not taken \u2192 flush, refetch in cycle ${Rr+1}`)}\n        else if(taken){wrong(pc+1,idS,Rr);redir=Rr+1;tk=true;notes.push(`${x.line}: ${jk} taken (not predicted) \u2192 ${Math.max(0,Rr-idS+1)} wrong-path cycle(s), target fetched in cycle ${Rr+1}`)}\n        else notes.push(`${x.line}: not taken, prediction hit \u2192 no stall`);\n      }\n      if(taken)next=tgt;\n    }\n    pc=next;\n  }\n  if(steps>=o.maxI&&pc\u003cL.length)notes.push(`Stopped after ${o.maxI} executed instructions (limit in the menu).`);\n  Object.keys(bht).forEach(k=>notes.push(`BTB/BHT entry: \u201c${L[k].line}\u201d \u2192 ${bht[k].toString(2).padStart(2,'0')}`));\n  if(o.ren){const m=Object.keys(ren).map(k=>`${k}\u2192${ren[k]}`);if(m.length)notes.push('Last physical register of each destination (FIFO from rr32): '+m.join(', '))}\n  return{rows,notes,total:lastWb,n:ex.length,maxC};\n}\n//SIM-END\n\nlet sel='IF',N=12,grid=[],P,sim,painting=false,erase=false;\nfunction getO(){\n  const init={};($('init').value||'').split(/[,\\s]+/).forEach(t=>{const m=t.match(/^(\\$?\\w+)=(-?\\w+)$/);if(m)init[m[1].toLowerCase()]=Number(m[2])||0});\n  return{fwd:$('fwd').checked,mem:$('mem').checked,early:$('early').checked,pred:$('pred').value,ren:$('ren').checked,\n    pipe:$('pipe').checked,ooo:$('ooo').checked,oooRet:$('oooRet').checked,\n    mulLat:Math.max(1,+$('mulLat').value||1),fpLat:Math.max(1,+$('fpLat').value||1),maxI:Math.max(1,+$('maxI').value||60),init};\n}\nconst stages=()=>{const o=getO(),m=Math.max(o.mulLat,o.fpLat);const ex=(o.pipe&&m>1)?Array.from({length:m},(_,k)=>'EX'+(k+1)):[];return['IF','ID','EX',...ex,'MEM','WB']};\nconst base=l=>l.replace(/\\d+$/,'');\nfunction build(){\n  const keep=grid;\n  P=parse($('code').value);sim=simulate(P,getO());\n  const c=Math.max(1,+$('cyc').value||12);\n  N=$('auto').checked?Math.max(c,sim.maxC+1):c;\n  grid=sim.rows.map((_,i)=>Array.from({length:N},(_,k)=>(keep[i]&&keep[i][k])||''));\n  render();$('res').textContent='';\n  if(!$('solCard').hidden)showSol();\n  buildPal();\n}\nconst head=()=>'\u003cdiv>\u003c/div>'+Array.from({length:N},(_,c)=>`\u003cdiv class=\"hd\">${c+1}\u003c/div>`).join('');\nconst cols=g=>g.style.gridTemplateColumns=`max-content repeat(${N},46px)`;\nconst esc=s=>s.replace(/\u003c/g,'&lt;');\nconst lbl=r=>`\u003cdiv class=\"ins ${r.fl?'fl':''}\">${esc(r.x.line)}${r.n>1?`\u003csmall>#${r.n}\u003c/small>`:''}${r.fl?'\u003csmall>(flushed)\u003c/small>':''}\u003c/div>`;\nfunction render(marks){\n  const g=$('mine');cols(g);let h=head();\n  sim.rows.forEach((r,i)=>{\n    h+=lbl(r);\n    for(let c=0;c\u003cN;c++){\n      const v=grid[i][c],m=marks?marks[i][c]:'',e=r.cells[c+1];\n      const show=m==='miss'?(e?e.l:''):v;\n      h+=`\u003cdiv class=\"c ${m!=='miss'&&v?base(v)+' st':'empty'} ${m}\" data-i=\"${i}\" data-c=\"${c}\">${show||'\u00b7'}\u003c/div>`;\n    }\n  });\n  g.innerHTML=h;\n}\nfunction paint(el){\n  if(!el||el.dataset.i===undefined)return;\n  const i=+el.dataset.i,c=+el.dataset.c;\n  grid[i][c]=(erase||sel==='\u2715')?'':sel;\n  if($('mine').querySelector('.ok,.no,.miss'))return render();\n  const v=grid[i][c];el.className='c '+(v?base(v)+' st':'empty');el.textContent=v||'\u00b7';\n}\n$('mine').addEventListener('pointerdown',e=>{\n  const el=e.target.closest('.c');if(!el)return;\n  e.preventDefault();painting=true;erase=grid[+el.dataset.i][+el.dataset.c]===sel;paint(el);\n});\n$('mine').addEventListener('pointermove',e=>{if(painting)paint(document.elementFromPoint(e.clientX,e.clientY)?.closest('.c'))});\naddEventListener('pointerup',()=>painting=false);\n\nfunction buildPal(){\n  const S=stages();if(!S.includes(sel)&&sel!=='\u2715')sel='IF';\n  $('pal').innerHTML=[...S,'\u2715'].map((s,k)=>`\u003cbutton class=\"${s!=='\u2715'?base(s)+' st':''} ${s===sel?'sel':''}\" data-s=\"${s}\">${s==='\u2715'?'\u2715 erase':s}${k\u003c9?` \u003cspan style=\"opacity:.6\">${k+1}\u003c/span>`:''}\u003c/button>`).join('')+`\u003cspan class=\"mut\">Click or drag to paint. Repeat a stage for a stall.\u003c/span>`;\n}\n$('pal').addEventListener('click',e=>{const b=e.target.closest('button');if(b){sel=b.dataset.s;buildPal()}});\naddEventListener('keydown',e=>{\n  if(/TEXTAREA|SELECT|INPUT/.test(e.target.tagName))return;\n  const k='123456789'.indexOf(e.key),S=[...stages(),'\u2715'];if(k>-1&&S[k]){sel=S[k];buildPal()}\n});\n\n$('chk').onclick=()=>{\n  let ok=0,total=0,bad=0;\n  const marks=sim.rows.map((r,i)=>Array.from({length:N},(_,c)=>{\n    const e=r.cells[c+1],v=grid[i][c];\n    if(e){total++;if(v===e.l){ok++;return'ok'}return v?'no':'miss'}\n    if(v){bad++;return'no'}return'';\n  }));\n  render(marks);\n  const cut=sim.maxC>N?` \u003cspan class=\"mut\">(the solution continues past cycle ${N}; raise \u201cClock cycles shown\u201d)\u003c/span>`:'';\n  $('res').innerHTML=(ok===total&&!bad\n    ?`\u003cspan class=\"good\">\u2713 Perfect \u2014 all ${total} cells match (${sim.total} cycles).\u003c/span>`\n    :`\u003cspan class=\"badc\">${ok}/${total} cells correct${bad?`, ${bad} wrong or extra`:''}.\u003c/span> \u003cspan class=\"mut\">Green = right, red = wrong, dashed = missing (shows the expected stage).\u003c/span>`)+cut;\n};\n$('hint').onclick=()=>{\n  for(let c=0;c\u003cN;c++)for(let i=0;i\u003csim.rows.length;i++){\n    const e=sim.rows[i].cells[c+1],v=grid[i][c];\n    if((e?e.l:'')!==v){\n      $('res').innerHTML=`\u003cspan class=\"badc\">Hint:\u003c/span> first mistake is in cycle ${c+1}, row \u201c${esc(sim.rows[i].x.line)}\u201d \u2014 `+(e?`it should be \u003cb>${e.l}\u003c/b>${e.s?' (a stall: that stage repeats)':''}.`:'that cell should be empty.');\n      return;\n    }\n  }\n  $('res').innerHTML='\u003cspan class=\"good\">No mistakes found so far.\u003c/span>';\n};\n$('rev').onclick=()=>{$('solCard').hidden=false;showSol();$('solCard').scrollIntoView({behavior:'smooth'})};\n$('clr').onclick=()=>{grid=sim.rows.map(()=>Array(N).fill(''));render();$('res').textContent=''};\n\nfunction showSol(){\n  const g=$('sol');cols(g);let h=head();\n  sim.rows.forEach(r=>{\n    h+=lbl(r);\n    for(let c=1;c\u003c=N;c++){const e=r.cells[c];h+=`\u003cdiv class=\"c ${e?base(e.l)+' st':'empty'} ${e&&e.s?'stall':''}\">${e?e.l:'\u00b7'}\u003c/div>`}\n  });\n  g.innerHTML=h;\n  const n=sim.n,T=sim.total;\n  $('stats').innerHTML=`\u003cdiv>Cycles \u003cb>${T}\u003c/b>\u003c/div>\u003cdiv>Instructions executed \u003cb>${n}\u003c/b>\u003c/div>\u003cdiv>CPI \u003cb>${n?(T/n).toFixed(2):'\u2013'}\u003c/b>\u003c/div>\u003cdiv>Ideal (no hazards) \u003cb>${n?n+4:0}\u003c/b>\u003c/div>\u003cdiv>Non-pipelined (5 cyc/instr) \u003cb>${5*n}\u003c/b>\u003c/div>`;\n  $('why').innerHTML=sim.notes.length?`\u003cul>${sim.notes.map(t=>`\u003cli>${esc(t)}\u003c/li>`).join('')}\u003c/ul>`:'No hazards: each instruction enters the pipeline one cycle after the previous one.';\n}\n\nfunction setOpts(p){\n  const v=Object.assign({},D,p);\n  ['fwd','mem','early','pipe','ooo','oooRet','ren','auto'].forEach(k=>$(k).checked=!!v[k]);\n  $('pred').value=v.pred;$('mulLat').value=v.mulLat;$('fpLat').value=v.fpLat;$('cyc').value=v.cyc;$('maxI').value=v.maxI;$('init').value=v.init;\n}\n$('pre').innerHTML='\u003coption value=\"\">\u2014 custom \u2014\u003c/option>'+PRE.map((p,k)=>`\u003coption value=\"${k}\">${p[0]}\u003c/option>`).join('');\n$('pre').onchange=()=>{\n  const p=PRE[$('pre').value];if(!p)return;\n  $('code').value=p[1];setOpts(p[2]);grid=[];$('solCard').hidden=true;build();\n};\nlet t;\n$('code').addEventListener('input',()=>{$('pre').value='';clearTimeout(t);t=setTimeout(build,250)});\n['fwd','mem','early','pred','ren','pipe','ooo','oooRet','mulLat','fpLat','cyc','auto','maxI','init'].forEach(k=>$(k).addEventListener('change',()=>{if(!['cyc','auto'].includes(k))$('pre').value='';build()}));\n\n$('calc').onclick=()=>{\n  const s=$('stg').value.split(/[,\\s]+/).map(Number).filter(x=>x>0);if(!s.length)return;\n  const sum=s.reduce((a,b)=>a+b,0),mx=Math.max(...s),n=s.length,f=x=>+x.toFixed(2);\n  $('calcOut').textContent=`Sequential CPU\\n  Time per instruction: ${f(sum)} ns\\n  Throughput: ${f(1000/sum)} MIPS (${f(1e9/sum)} instr/s)\\n\\nPipelined CPU (${n} stages, cycle = slowest stage)\\n  Clock cycle: ${f(mx)} ns \u2192 frequency ${f(1000/mx)} MHz (${f(1/mx)} GHz)\\n  Time per instruction (latency): ${f(n*mx)} ns\\n  Ideal throughput: ${f(1000/mx)} MIPS\\n  Ideal throughput speedup: ${f(sum/mx)}`;\n};\n$('calc2').onclick=()=>{\n  const g=+$('fq').value,c=+$('cpi').value||1;if(!g)return;\n  $('calc2Out').textContent=`Cycle time: ${+(1/g).toFixed(4)} ns\\nMIPS: ${+(g*1000/c).toFixed(2)}  (at CPI ${c})\\nInstructions per cycle (IPC): ${+(1/c).toFixed(3)}`;\n};\n\n/* ===== helpers shared by Learn and Practice ===== */\nfunction parseInit(s){const o={};(s||'').split(/[,\\s]+/).forEach(t=>{const m=t.match(/^(\\$?\\w+)=(-?\\w+)$/);if(m)o[m[1].toLowerCase()]=Number(m[2])||0});return o}\nfunction mkO(p){const v=Object.assign({},D,p);return{fwd:!!v.fwd,mem:!!v.mem,early:!!v.early,pred:v.pred,ren:!!v.ren,pipe:!!v.pipe,ooo:!!v.ooo,oooRet:!!v.oooRet,mulLat:v.mulLat,fpLat:v.fpLat,maxI:v.maxI,init:parseInit(v.init)}}\nconst MEAN={IF:'is being fetched from memory',ID:'is decoded and its source registers are read',EX:'is being calculated in the ALU / execution unit',MEM:'goes through the memory stage (only ld/sd really use it)',WB:'writes its result into the register'};\nfunction diagHTML(sm,upto,N){\n  let h=`\u003cdiv class=\"grid ro\" style=\"grid-template-columns:max-content repeat(${N},46px)\">\u003cdiv>\u003c/div>`+Array.from({length:N},(_,c)=>`\u003cdiv class=\"hd\">${c+1}\u003c/div>`).join('');\n  sm.rows.forEach(r=>{h+=lbl(r);for(let c=1;c\u003c=N;c++){const e=c\u003c=upto?r.cells[c]:null;h+=`\u003cdiv class=\"c ${e?base(e.l)+' st':'empty'} ${e&&e.s?'stall':''}\">${e?e.l:'\u00b7'}\u003c/div>`}});\n  return h+'\u003c/div>';\n}\nfunction narrate(sm,k){\n  const out=[];\n  sm.rows.forEach(r=>{const e=r.cells[k];if(!e)return;\n    out.push(`\u003cli>\u003ccode>${esc(r.x.line)}\u003c/code> ${e.s?`is \u003cb>stuck\u003c/b> (stall) \u2014 repeats \u003cb>${e.l}\u003c/b> because it has to wait`:`\u003cb>${e.l}\u003c/b>: ${MEAN[base(e.l)]}`}${r.fl?' \u2014 \u003ci>wrong path, will be thrown away\u003c/i>':''}\u003c/li>`)});\n  return out.length?`\u003cul>${out.join('')}\u003c/ul>`:'\u003ci>Nothing is happening in this cycle.\u003c/i>';\n}\n\n/* ===== Learn mode ===== */\nconst MULC=\"dmul r2, r5, r6\\nxor r1, r10, r3\\ndadd r4, r7, r8\";\nconst LS=[\n{t:'1 \u00b7 Pipeline',c:\"dadd r4, r3, r2\\ndsub r12, r13, r14\\nxor r5, r5, r5\\nand r13, r14, r15\",A:{o:{},l:'Ideal pipeline, no problems'},\n b:`\u003cp>A CPU doesn\u2019t finish one instruction before starting the next. Think of a \u003cb>laundry room\u003c/b>: while load 1 is in the dryer, load 2 is already in the washer.\u003c/p>\n \u003cp>Every instruction goes through 5 steps: \u003cb>IF\u003c/b> fetch it from memory \u2192 \u003cb>ID\u003c/b> decode it and read registers \u2192 \u003cb>EX\u003c/b> calculate \u2192 \u003cb>MEM\u003c/b> read/write memory \u2192 \u003cb>WB\u003c/b> write the result back.\u003c/p>\n \u003cdiv class=\"tip\">A new instruction starts every cycle. 4 instructions take only \u003cb>4 + 4 = 8 cycles\u003c/b>, not 4 \u00d7 5 = 20.\u003c/div>`},\n{t:'2 \u00b7 Data hazard (RAW)',c:\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\\nxor r18, r18, r18\",A:{o:{},l:'No forwarding: dsub must wait'},\n b:`\u003cp>\u003ccode>dsub\u003c/code> needs \u003cb>r2\u003c/b>, but \u003ccode>dadd\u003c/code> only \u003ci>writes\u003c/i> r2 in its last step (WB). If dsub read it earlier it would get the \u003cb>old\u003c/b> value.\u003c/p>\n \u003cp>So dsub waits in ID (the hatched cells are \u003cb>stalls\u003c/b>) until the cycle where dadd is in WB. A register can be written in the first half of a cycle and read in the second half of the same cycle, so dsub\u2019s last ID cycle lines up with dadd\u2019s WB.\u003c/p>\n \u003cdiv class=\"tip\">This is a \u003cb>RAW\u003c/b> (Read After Write) hazard. Everything behind dsub is held back too (their IF repeats).\u003c/div>`},\n{t:'3 \u00b7 Forwarding',c:\"dadd r2, r3, r4\\ndsub r1, r10, r2\\nor r12, r11, r14\",A:{o:{},l:'Without forwarding'},B:{o:{fwd:1},l:'With forwarding'},\n b:`\u003cp>Shortcut: \u003ccode>dadd\u003c/code> already \u003ci>knows\u003c/i> r2 at the end of its EX step. \u003cb>Forwarding paths\u003c/b> are extra wires that send that result straight into the next instruction\u2019s EX input, without waiting for WB.\u003c/p>\n \u003cdiv class=\"tip\">Result: the stall disappears completely. Turn forwarding on/off in the menu to see it any time.\u003c/div>`},\n{t:'4 \u00b7 Load-use',c:\"ld r2, 120(r3)\\ndsub r1, r10, r2\\nor r12, r11, r14\",A:{o:{fwd:1},l:'dsub right after the ld'},B:{c:\"ld r2, 120(r3)\\nor r12, r11, r14\\ndsub r1, r10, r2\",o:{fwd:1},l:'Unrelated instruction in between'},\n b:`\u003cp>A \u003ccode>ld\u003c/code> only gets its value at the end of \u003cb>MEM\u003c/b>, one step later than an ALU result. So even with forwarding, the next instruction must wait \u003cb>1 cycle\u003c/b>.\u003c/p>\n \u003cdiv class=\"tip\">Fix: put an unrelated instruction in between (compilers do this). The stall slot gets used for useful work.\u003c/div>`},\n{t:'5 \u00b7 Structural',c:\"ld r11, 120(r0)\\ndadd r2, r3, r6\\nxor r15, r15, r15\\ndsub r4, r1, r9\\nand r12, r13, r10\",A:{o:{},l:'Two memory ports'},B:{o:{mem:1},l:'Single memory port'},\n b:`\u003cp>IF (fetching instructions) and MEM (loading/storing data) both use memory. With only \u003cb>one memory port\u003c/b>, a \u003ccode>ld\u003c/code> in MEM blocks the fetch that wants to happen in the same cycle.\u003c/p>\n \u003cdiv class=\"tip\">That fetch is delayed 1 cycle. This is a \u003cb>structural hazard\u003c/b>: two instructions need the same hardware at the same time.\u003c/div>`},\n{t:'6 \u00b7 Branches',c:\"beq r0, r3, loop ; nt\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",A:{o:{},l:'Branch NOT taken'},B:{c:\"beq r0, r3, loop ; taken\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",o:{},l:'Branch taken'},\n b:`\u003cp>A branch decides where the program goes next, but the CPU only learns the answer late (in \u003cb>MEM\u003c/b>). Meanwhile it doesn\u2019t know what to fetch.\u003c/p>\n \u003cp>Simplest policy: \u003cb>stop fetching\u003c/b> until the branch is resolved. Both diagrams lose the same cycles.\u003c/p>\n \u003cdiv class=\"tip\">When taken, the instruction that was waiting (struck through) is thrown away and the \u003cb>target\u003c/b> is fetched instead.\u003c/div>`},\n{t:'7 \u00b7 Early branch',c:\"beq r0, r3, loop ; taken\\ndaddi r1, r0, 1\\nand r3, r2, r4\\nxor r8, r8, r8\\nloop: dsub r3, r1, r2\",A:{o:{},l:'Resolved in MEM'},B:{o:{early:1},l:'Resolved in ID (early)'},\n b:`\u003cp>Add comparator hardware in the \u003cb>ID\u003c/b> stage so the branch is decided 2 cycles earlier. Less waiting, same result.\u003c/p>\n \u003cdiv class=\"tip\">The cost: if the branch depends on a register written just before, that value must be ready in ID (needs forwarding into ID, or a stall).\u003c/div>`},\n{t:'8 \u00b7 Predict NT',c:\"beq r4, r5, target ; nt\\ndadd r9, r0, r7\\ndsub r11, r10, r5\\nor r12, r5, r14\\ntarget: dadd r7, r1, r3\",A:{o:{pred:'nt'},l:'Guess right (not taken)'},B:{c:\"beq r4, r5, target ; taken\\ndadd r9, r0, r7\\ndsub r11, r10, r5\\nor r12, r5, r14\\ntarget: dadd r7, r1, r3\",o:{pred:'nt'},l:'Guess wrong (taken)'},\n b:`\u003cp>Instead of waiting, \u003cb>guess\u003c/b>: assume the branch is \u003cb>not taken\u003c/b> and keep fetching the next instructions.\u003c/p>\n \u003cp>Right guess \u2192 \u003cb>zero\u003c/b> lost cycles. Wrong guess \u2192 those instructions (struck-through rows) are \u003cb>flushed\u003c/b> and you restart from the target.\u003c/p>\n \u003cdiv class=\"tip\">Careful: both diagrams happen to end in the same cycle, but B only executed 2 useful instructions (the branch and the target) while A executed 5. The wrong guess made B waste fetch slots.\u003c/div>`},\n{t:'9 \u00b7 2-bit predictor',c:\"daddi r1, r0, 5\\nloop:\\ndaddi r1, r1, -1\\nbnez r1, loop\\ndadd r9, r2, r3\",A:{o:{pred:'nt',early:1,fwd:1},l:'Always not taken'},B:{o:{pred:'bht',early:1,fwd:1},l:'2-bit predictor'},\n b:`\u003cp>Guess smarter by \u003cb>remembering\u003c/b>. Each branch gets a 2-bit counter: \u003ccode>00\u003c/code> strongly NT, \u003ccode>01\u003c/code> weakly NT, \u003ccode>10\u003c/code> weakly T, \u003ccode>11\u003c/code> strongly T.\u003c/p>\n \u003cp>Taken \u2192 counter +1, not taken \u2192 \u22121 (stops at 00 and 11). Counter \u2265 \u003ccode>10\u003c/code> \u2192 predict taken. The first time a branch is seen it is predicted not taken (counter starts at \u003ccode>01\u003c/code>).\u003c/p>\n \u003cdiv class=\"tip\">Loops are taken many times, so the predictor learns quickly. The final BHT state is listed under the solution notes.\u003c/div>`},\n{t:'10 \u00b7 Slow units',c:MULC,A:{o:{mulLat:4},l:'In-order: everything waits'},B:{o:{mulLat:4,ooo:1,oooRet:1},l:'Out-of-order execution'},\n b:`\u003cp>Multiplication/division is slow, so its EX takes several cycles (here 4). With \u003cb>in-order execution\u003c/b> every later instruction waits behind it.\u003c/p>\n \u003cp>With \u003cb>out-of-order execution\u003c/b>, instructions that don\u2019t depend on the slow one (like \u003ccode>xor\u003c/code>) go ahead and finish first.\u003c/p>`},\n{t:'11 \u00b7 Precise exceptions',c:MULC,A:{o:{mulLat:4,ooo:1,oooRet:1},l:'Out-of-order retirement'},B:{o:{mulLat:4,ooo:1},l:'In-order retirement (precise)'},\n b:`\u003cp>Finishing early is fast, but if \u003ccode>dmul\u003c/code> later causes an error (exception), younger instructions have \u003cb>already changed registers\u003c/b> \u2014 the program state is a mess.\u003c/p>\n \u003cp>\u003cb>Precise exceptions\u003c/b> force instructions to retire (WB) in program order, so the fast \u003ccode>xor\u003c/code> must wait for the slow \u003ccode>dmul\u003c/code>.\u003c/p>`},\n{t:'12 \u00b7 Pipelined mul',c:\"dmul r2, r5, r6\\ndmul r4, r6, r8\\ndmul r7, r9, r10\",A:{o:{mulLat:4,ooo:1,oooRet:1},l:'Mul unit not pipelined'},B:{o:{mulLat:4,ooo:1,oooRet:1,pipe:1},l:'Pipelined mul unit (EX1\u2026EX4)'},\n b:`\u003cp>A normal mul unit is \u003cb>busy\u003c/b> for all 4 cycles, so the 2nd \u003ccode>dmul\u003c/code> waits in ID (structural hazard).\u003c/p>\n \u003cp>A \u003cb>pipelined\u003c/b> unit is itself an assembly line (EX1, EX2, EX3, EX4): it accepts a new multiplication \u003cb>every cycle\u003c/b>.\u003c/p>`},\n{t:'13 \u00b7 WAW & renaming',c:\"daddi r3, r0, 5\\nddiv r2, r4, r5\\nxor r3, r6, r8\\ndsub r2, r9, r10\",A:{o:{fwd:1,mulLat:4,ooo:1,oooRet:1},l:'No renaming'},B:{o:{fwd:1,mulLat:4,ooo:1,oooRet:1,ren:1},l:'With register renaming'},\n b:`\u003cp>\u003cb>WAW\u003c/b> (Write After Write): two instructions write the same register (\u003ccode>ddiv r2\u003c/code> and \u003ccode>dsub r2\u003c/code>). If the slow one finished last it would overwrite the newer value, so the later write must wait.\u003c/p>\n \u003cp>\u003cb>Register renaming\u003c/b> gives every write its own hidden physical register (rr32, rr33\u2026), so they never collide and nothing waits.\u003c/p>`}\n];\nlet ls={i:0,k:99,w:'B'};\nfunction lessonSims(L){\n  const a=L.A,b=L.B||null;\n  const sa=simulate(parse(a.c||L.c),mkO(a.o)),sb=b?simulate(parse(b.c||L.c),mkO(b.o)):null;\n  return{sa,sb,N:Math.max(sa.maxC,sb?sb.maxC:0)+1};\n}\nfunction renderLesson(){\n  const L=LS[ls.i],{sa,sb,N}=lessonSims(L);\n  $('lsnTabs').innerHTML=LS.map((l,k)=>`\u003cbutton class=\"${k===ls.i?'sel':''}\" data-k=\"${k}\">${l.t}\u003c/button>`).join('');\n  if(ls.k>N)ls.k=N;\n  const which=(ls.w==='B'&&sb)?'B':'A',sm=which==='B'?sb:sa;\n  const slab=(s,l,t)=>`\u003cdiv>\u003ch4>${t?t+' \u2014 ':''}${l}\u003c/h4>\u003cdiv class=\"scroll\">${diagHTML(s,ls.k,N)}\u003c/div>\u003cdiv class=\"tot\">${s.total} cycles in total\u003c/div>\u003c/div>`;\n  $('lsnBody').innerHTML=`${L.b}\n  \u003cdiv class=\"two\">${slab(sa,L.A.l,sb?'A':'')}${sb?slab(sb,L.B.l,'B'):''}\u003c/div>\n  \u003cdiv style=\"margin-top:10px\">Walk through cycle by cycle: \u003cinput type=\"range\" id=\"lk\" min=\"0\" max=\"${N}\" value=\"${ls.k}\"> \u003cb id=\"lkv\">${ls.k>=N?'all':'cycle '+ls.k}\u003c/b>\n   ${sb?`\u003cbutton data-w=\"A\" class=\"${which==='A'?'sel':''}\">Explain A\u003c/button>\u003cbutton data-w=\"B\" class=\"${which==='B'?'sel':''}\">Explain B\u003c/button>`:''}\u003c/div>\n  \u003cdiv class=\"narr\" id=\"narr\">${ls.k>=1&&ls.k\u003cN?`\u003cb>Cycle ${ls.k}:\u003c/b>`+narrate(sm,ls.k):'\u003ci>Drag the slider to see what each instruction is doing in every clock cycle.\u003c/i>'}\u003c/div>\n  \u003cdiv class=\"qz\">\u003cspan>Quiz: how many cycles does diagram \u003cb>${sb?'B':'A'}\u003c/b> take in total?\u003c/span>\u003cinput type=\"number\" id=\"qa\" min=\"0\" style=\"width:80px\">\u003cbutton id=\"qb\">Check\u003c/button>\u003cspan id=\"qr\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"btns\">\u003cbutton id=\"lprev\">\u2190 Previous\u003c/button>\u003cbutton id=\"lnext\">Next \u2192\u003c/button>\u003cbutton id=\"lload\" class=\"pri\">Open in simulator and practise\u003c/button>\u003c/div>`;\n  $('lk').oninput=e=>{ls.k=+e.target.value;renderLesson()};\n  $('qb').onclick=()=>{\n    const tgt=sb||sa,v=+$('qa').value;\n    $('qr').innerHTML=v===tgt.total?`\u003cspan class=\"good\">\u2713 Correct, ${tgt.total} cycles.\u003c/span>`:`\u003cspan class=\"badc\">\u2717 Not ${v}.\u003c/span> \u003cspan class=\"mut\">Look at the stalled (hatched) cells and count again.\u003c/span>`;\n    if(tgt.notes.length)$('qr').innerHTML+=`\u003cul class=\"mut\">${tgt.notes.slice(0,4).map(n=>`\u003cli>${esc(n)}\u003c/li>`).join('')}\u003c/ul>`;\n  };\n  $('lprev').onclick=()=>{ls.i=Math.max(0,ls.i-1);ls.k=99;renderLesson()};\n  $('lnext').onclick=()=>{ls.i=Math.min(LS.length-1,ls.i+1);ls.k=99;renderLesson()};\n  $('lload').onclick=()=>{const s=L.B||L.A;$('code').value=s.c||L.c;setOpts(Object.assign({},s.o,{cyc:12}));$('pre').value='';practice.active=false;grid=[];$('solCard').hidden=true;build();$('mine').scrollIntoView({behavior:'smooth',block:'center'})};\n}\n$('lsnTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){ls.i=+b.dataset.k;ls.k=99;renderLesson()}});\n$('lsnBody').addEventListener('click',e=>{const b=e.target.closest('button[data-w]');if(b){ls.w=b.dataset.w;renderLesson()}});\n\n/* ===== Practice test ===== */\nconst practice={active:false,scored:false,gaveUp:false,seed:0,level:1,code:'',opts:{}};\nconst sc={ok:0,tried:0,streak:0};\nfunction rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction gen(level,seed){\n  const rnd=rng(seed),pick=a=>a[Math.floor(rnd()*a.length)],chance=p=>rnd()\u003cp;\n  const regs=level===3?['r2','r3','r4','r5','r6','r7','r8','r9']:['r1','r2','r3','r4','r5','r6','r7','r8','r9'];\n  const recent=[];\n  const src=()=>recent.length&&chance(.65)?pick(recent.slice(-2)):pick(regs);\n  const mk={\n    alu(){const d=pick(regs),s1=src(),s2=src();recent.push(d);return`${pick(['dadd','dsub','and','or','xor'])} ${d}, ${s1}, ${s2}`},\n    imm(){const d=pick(regs),s1=src();recent.push(d);return`${pick(['daddi','ori'])} ${d}, ${s1}, ${pick([1,4,8,16])}`},\n    ld(){const d=pick(regs),s1=src();recent.push(d);return`ld ${d}, ${pick([0,8,100,120])}(${s1})`},\n    sd(){return`sd ${src()}, ${pick([0,8,16])}(${src()})`},\n    mul(){const d=pick(regs),s1=src(),s2=src();recent.push(d);return`dmul ${d}, ${s1}, ${s2}`}\n  };\n  const kinds=level===1?['alu','alu','alu','imm']:level===2?['alu','alu','imm','ld','ld','sd']:['alu','alu','ld','mul','mul','imm'];\n  const body=n=>Array.from({length:n},()=>mk[pick(kinds)]());\n  let lines=[],o={cyc:12,auto:1};\n  if(level===1){lines=body(4+Math.floor(rnd()*2));o.fwd=chance(.4)?1:0}\n  else if(level===2){\n    lines=body(2+Math.floor(rnd()*2));\n    const br=chance(.5);\n    if(br){const x=pick(['beqz','bnez']);lines.push(`${x} ${src()}, end ; ${chance(.5)?'taken':'nt'}`);lines.push(...body(2));lines.push('end:');lines.push(...body(1));o.pred=pick(['stall','nt']);o.early=chance(.4)?1:0}\n    else lines.push(...body(2));\n    o.fwd=chance(.6)?1:0;o.mem=chance(.5)?1:0;\n  }else{\n    const n=2+Math.floor(rnd()*2);\n    lines=[`daddi r1, r0, ${n}`,'loop:',...body(2+Math.floor(rnd()*2)),'daddi r1, r1, -1','bnez r1, loop',...body(1)];\n    o.fwd=chance(.7)?1:0;o.early=1;o.pred=pick(['nt','bht','bht']);o.mulLat=pick([3,4]);o.pipe=chance(.5)?1:0;o.ooo=chance(.7)?1:0;o.oooRet=chance(.5)?1:0;o.ren=chance(.3)?1:0;o.mem=chance(.3)?1:0;o.cyc=16;\n  }\n  return{code:lines.join('\\n'),opts:o};\n}\nfunction descOpts(o){\n  const d=[];d.push('Forwarding: '+(o.fwd?'ON':'off'));\n  if(o.mem)d.push('single memory port');if(o.early)d.push('early branches (ID)');\n  if(o.pred)d.push('branch policy: '+{stall:'stall fetch',nt:'always not taken',bht:'2-bit predictor (starts 01)'}[o.pred]);\n  if(o.mulLat)d.push(`mul/div ${o.mulLat} cycles${o.pipe?' pipelined':''}`);\n  if(o.ooo)d.push('out-of-order execution');if(o.mulLat)d.push(o.oooRet?'out-of-order retirement':'precise (in-order) retirement');\n  if(o.ren)d.push('register renaming');\n  return d.join(' \u00b7 ');\n}\nfunction loadEx(level,seed){\n  const g=gen(level,seed);Object.assign(practice,{active:true,scored:false,gaveUp:false,seed,level,code:g.code,opts:g.opts});\n  $('pre').value='';$('code').value=g.code;setOpts(g.opts);grid=[];$('solCard').hidden=true;build();\n  sc.tried++;showInfo();$('mine').scrollIntoView({behavior:'smooth',block:'center'});\n}\nfunction showInfo(){\n  $('exInfo').innerHTML=`\u003cb>Seed ${practice.seed}\u003c/b> \u00b7 Settings of this exercise: ${descOpts(practice.opts)}\u003cbr>Paint the pipeline diagram in \u201cYour prediction\u201d below, then press \u003cb>Check my answer\u003c/b>. Hint and Show solution are available if you get stuck.`;\n  $('score').textContent=`Solved ${sc.ok} of ${sc.tried} \u00b7 streak ${sc.streak}`;\n}\n$('newEx').onclick=()=>{const s=+$('seed').value||Math.floor(Math.random()*90000)+10000;$('seed').value='';loadEx(+$('lvl').value,s)};\n$('retryEx').onclick=()=>{if(practice.seed){sc.tried--;loadEx(practice.level,practice.seed)}};\n$('chk').addEventListener('click',()=>{\n  if(practice.active&&!practice.scored&&!practice.gaveUp&&$('res').textContent.startsWith('\u2713')){practice.scored=true;sc.ok++;sc.streak++;showInfo();$('res').innerHTML+=' \u003cspan class=\"good\">Exercise solved! Press \u201cNew exercise\u201d for another.\u003c/span>'}\n});\n$('rev').addEventListener('click',()=>{if(practice.active&&!practice.scored&&!practice.gaveUp){practice.gaveUp=true;sc.streak=0;showInfo()}});\n$('code').addEventListener('input',()=>{practice.active=false});\nrenderLesson();showInfo();\n\n$('pre').value='0';$('pre').onchange();$('calc').onclick();$('calc2').onclick();\n\u003c/script>\n\u003cscript>\n(function(){\nconst KEY='mp64blitz',TOT=10,TIME=30,B=$('blitz');\nconst ldS=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}};\nconst svS=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};\nconst dayNum=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};\nlet G=null,timer=null;\nfunction shuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction numChoices(c,extra,rnd){\n  const cand=[c-2,c-1,c+1,c+2,c+3,...extra].filter((v,i,a)=>v>=0&&v!==c&&a.indexOf(v)===i);\n  const pick=shuffle(cand,rnd).slice(0,3);\n  for(let k=1;pick.length\u003c3;k++){const v=c+3+k;if(!pick.includes(v))pick.push(v)}\n  const all=shuffle([c,...pick],rnd);return{ch:all.map(String),ans:all.indexOf(c)};\n}\nfunction mkRound(i,seedBase,rnd){\n  const level=G.endless?(i\u003c3?1:i\u003c8?2:3):(i\u003c3?1:i\u003c7?2:3);\n  for(let tries=0;tries\u003c30;tries++){\n    const seed=seedBase*37+i*101+tries*7;\n    const g=gen(level,seed),o=mkO(g.opts),Pp=parse(g.code),sm=simulate(Pp,o);\n    if(!sm.rows.length||sm.n\u003c2||sm.maxC>26)continue;\n    const types=shuffle(['cyc','stall','stage','fwd','worst'],rnd);\n    for(const ty of types){\n      const q=build(ty,g,o,Pp,sm,rnd);if(q){q.level=level;q.code=g.code;q.opts=g.opts;return q}\n    }\n  }\n  return null;\n}\nfunction build(ty,g,o,Pp,sm,rnd){\n  const T=sm.total,n=sm.n,ideal=n+4;\n  if(ty==='cyc'){const c=numChoices(T,[ideal,5*n],rnd);\n    return{q:'How many clock cycles until the last instruction finishes (WB)?',...c,sm,why:`Total = ${T} cycles for ${n} executed instructions (ideal without hazards would be ${ideal}).`}}\n  if(ty==='stall'){const s=T-ideal;if(s\u003c1)return null;const c=numChoices(s,[],rnd);\n    return{q:`This run executes ${n} instructions, so the ideal pipeline needs ${n}+4 = ${ideal} cycles. How many extra cycles does it actually lose?`,...c,sm,why:`${T} \u2212 ${ideal} = ${s} extra cycle(s).`}}\n  if(ty==='stage'){\n    const rows=sm.rows.filter(r=>!r.fl&&Object.keys(r.cells).length>3);if(!rows.length)return null;\n    const r=rows[Math.floor(rnd()*rows.length)],cs=Object.keys(r.cells).map(Number),cy=cs[Math.floor(rnd()*cs.length)];\n    const st=base(r.cells[cy].l),opts=['IF','ID','EX','MEM','WB'];\n    const three=shuffle(opts.filter(x=>x!==st),rnd).slice(0,3),all=shuffle([st,...three],rnd);\n    return{q:`In clock cycle ${cy}, which stage is \u201c${r.x.line}\u201d${r.n>1?` (execution #${r.n})`:''} in? (Stalls repeat the stage they wait in.)`,ch:all,ans:all.indexOf(st),sm,why:`Look at the row of \u201c${r.x.line}\u201d, column ${cy}: ${st}.`}}\n  if(ty==='fwd'){\n    const o2=Object.assign({},g.opts,{fwd:g.opts.fwd?0:1}),s2=simulate(Pp,mkO(o2));\n    if(s2.total===T||s2.maxC>26)return null;const c=numChoices(s2.total,[T],rnd);\n    return{q:`With these settings the program takes ${T} cycles. How many cycles would it take with forwarding turned ${g.opts.fwd?'OFF':'ON'} (everything else equal)?`,...c,sm:s2,why:`With forwarding ${g.opts.fwd?'off':'on'} the total is ${s2.total} cycles (diagram below shows that case).`}}\n  if(ty==='worst'){\n    const rows=sm.rows.filter(r=>!r.fl);if(rows.length\u003c3||rows.length>8)return null;\n    const cnt=rows.map(r=>Object.values(r.cells).filter(c=>c.s).length),mx=Math.max(...cnt);\n    if(mx\u003c1||cnt.filter(v=>v===mx).length>1)return null;\n    const lab=r=>r.x.line+(r.n>1?` #${r.n}`:''),names=rows.map(lab);\n    if(new Set(names).size!==names.length)return null;\n    const ci=cnt.indexOf(mx),others=shuffle(names.filter((_,k)=>k!==ci),rnd).slice(0,3);\n    if(others.length\u003c2)return null;\n    const all=shuffle([names[ci],...others],rnd);\n    return{q:'Which instruction spends the most stall cycles (hatched cells)?',ch:all,ans:all.indexOf(names[ci]),sm,why:`\u201c${names[ci]}\u201d stalls ${mx} cycle(s), more than any other.`}}\n  return null;\n}\nfunction menu(){\n  clearInterval(timer);const s=ldS(),d=dayNum(),done=s.daily&&s.daily.day===d;\n  B.innerHTML=`\u003cp class=\"mut\" style=\"margin:0 0 10px\">Each round gives you a random program and settings; the answer comes straight from the simulator. Correct answers build a streak multiplier, and quick answers earn bonus points. Wrong answer or timeout = lose a life. \u003cb>Endless\u003c/b> never stops: the clock shrinks every round and the programs get harder, so chase the high score (every 5 correct in a row wins back a life).\u003c/p>\n  \u003cdiv class=\"hud\" style=\"margin-bottom:10px\">\u003cdiv>Best score \u003cb>${s.best||0}\u003c/b>\u003c/div>\u003cdiv>Endless best \u003cb>${s.bestE||0}\u003c/b> (${s.bestER||0} rounds)\u003c/div>\u003cdiv>Daily streak \u003cb>${(s.ds&&s.ds.l>=d-1)?s.ds.n:0}\u003c/b>\u003c/div>\u003cdiv>Today \u003cb>${done?s.daily.score:'not played'}\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"btns\" style=\"margin-top:0\">\u003cbutton class=\"pri\" id=\"bzDaily\">\ud83d\udcc5 Daily blitz${done?' (replay)':''}\u003c/button>\u003cbutton id=\"bzRnd\">\ud83c\udfb2 Random blitz\u003c/button>\u003cbutton id=\"bzEnd\">\u267e\ufe0f Endless\u003c/button>\u003clabel style=\"margin:0;display:flex;gap:6px;align-items:center\">\u003cinput type=\"checkbox\" id=\"bzTimer\" ${s.noTimer?'':'checked'}> ${TIME}s timer\u003c/label>\u003c/div>\u003cdiv id=\"bzBoard\">\u003c/div>`;\n  boardUI($('bzBoard'),lbView);\n  $('bzDaily').onclick=()=>start('daily');$('bzRnd').onclick=()=>start('random');$('bzEnd').onclick=()=>start('endless');\n  $('bzTimer').onchange=e=>{const x=ldS();x.noTimer=!e.target.checked;svS(x)};\n}\nfunction start(mode){\n  const seedBase=mode==='daily'?dayNum():Math.floor(Math.random()*90000)+10000,rnd=rng(seedBase),endless=mode==='endless';\n  G={mode,endless,seedBase,rnd,i:0,lives:3,score:0,streak:0,best:0,ok:0,timer:endless||!ldS().noTimer,q:null,done:false};nextQ();\n}\nfunction nextQ(){\n  if((!G.endless&&G.i>=TOT)||G.lives\u003c=0)return finish();\n  const q=mkRound(G.i,G.seedBase,G.rnd);if(!q){G.i=G.endless?G.i:TOT;return finish()}\n  G.secs=G.endless?Math.max(6,Math.round(TIME*Math.pow(0.93,G.i))):TIME;G.ticks=G.secs*4;G.q=q;G.done=false;G.left=G.ticks;paint();\n  clearInterval(timer);if(G.timer)timer=setInterval(()=>{\n    if(!B.offsetParent||G.done)return;G.left--;const b=$('bzBar');if(b)b.style.width=(G.left/G.ticks*100)+'%';\n    if(G.left\u003c=0)answer(-1)},250);\n}\nfunction paint(){\n  const q=G.q;\n  B.innerHTML=`\u003cdiv class=\"top2\">\u003cdiv class=\"hud\">\u003cdiv>Round \u003cb>${G.i+1}${G.endless?'':'/'+TOT}\u003c/b>\u003c/div>${G.endless?`\u003cdiv>Time \u003cb>${G.secs}s\u003c/b>\u003c/div>`:''}\u003cdiv>Lives \u003cb>${'\u2665'.repeat(G.lives)+'\u2661'.repeat(3-G.lives)}\u003c/b>\u003c/div>\u003cdiv>Score \u003cb>${G.score}\u003c/b>\u003c/div>\u003cdiv>Streak \u003cb>${G.streak}\u003c/b>\u003c/div>\u003c/div>\u003cbutton id=\"bzQuit\">Quit\u003c/button>\u003c/div>\n  ${G.timer?'\u003cdiv class=\"bar\">\u003ci id=\"bzBar\">\u003c/i>\u003c/div>':''}\n  \u003cdiv class=\"mut\" style=\"font-size:12px\">${esc(descOpts(q.opts))}\u003c/div>\n  \u003cpre>${esc(q.code)}\u003c/pre>\u003cdiv class=\"q\">${esc(q.q)}\u003c/div>\n  \u003cdiv class=\"opts\">${q.ch.map((c,k)=>`\u003cbutton data-k=\"${k}\">${esc(c)}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"bzFb\">\u003c/div>`;\n  B.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.k));$('bzQuit').onclick=menu;\n}\nfunction answer(k){\n  if(G.done)return;G.done=true;G.bonusLife=false;clearInterval(timer);const q=G.q,ok=k===q.ans;\n  let gain=0;\n  if(ok){G.streak++;G.ok++;gain=10+Math.min(G.streak-1,5)*2+(G.timer?Math.ceil(G.left/G.ticks*10):5)+(G.endless?Math.floor(G.i/5)*2:0);G.score+=gain;if(G.endless&&G.streak%5===0&&G.lives\u003c3){G.lives++;gain+=0;G.bonusLife=true}}\n  else{G.streak=0;G.lives--}\n  B.querySelectorAll('.opts button').forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add('ok');else if(i===k)b.classList.add('no')});\n  const N=q.sm.maxC;\n  $('bzFb').innerHTML=`\u003cp class=\"${ok?'good':'badc'}\" style=\"font-weight:700\">${ok?`\u2713 Correct! +${gain}${G.bonusLife?' \u00b7 +1 life \u2665':''}`:(k\u003c0?'\u23f0 Time is up.':'\u2717 Not quite.')}\u003c/p>\u003cdiv class=\"tip\">${esc(q.why)}\u003c/div>\n  \u003cdetails>\u003csummary>Show the pipeline diagram\u003c/summary>\u003cdiv class=\"scroll\" style=\"margin-top:8px\">${diagHTML(q.sm,N,N)}\u003c/div>\u003c/details>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"pri\" id=\"bzNext\">${((!G.endless&&G.i+1>=TOT)||G.lives\u003c=0)?'See results':'Next \u25b6'}\u003c/button>\u003c/div>`;\n  $('bzNext').onclick=()=>{G.i++;nextQ()};\n  const hud=B.querySelector('.hud');if(hud)hud.innerHTML=`\u003cdiv>Round \u003cb>${G.i+1}${G.endless?'':'/'+TOT}\u003c/b>\u003c/div>${G.endless?`\u003cdiv>Time \u003cb>${G.secs}s\u003c/b>\u003c/div>`:''}\u003cdiv>Lives \u003cb>${'\u2665'.repeat(G.lives)+'\u2661'.repeat(3-G.lives)}\u003c/b>\u003c/div>\u003cdiv>Score \u003cb>${G.score}\u003c/b>\u003c/div>\u003cdiv>Streak \u003cb>${G.streak}\u003c/b>\u003c/div>`;\n}\nconst BN={endless:'ENDLESS',blitz:'BLITZ 10'};let lbView='endless';\nconst rankOf=(list,sc)=>list.filter(x=>x.s>=sc).length;\nfunction boardHTML(b,hi){\n  const list=(ldS().lb||{})[b]||[],lab=b==='endless'?'RND':'HIT';\n  let rows='';for(let k=0;k\u003c10;k++){const x=list[k];\n    rows+=`\u003ctr class=\"${k\u003c3?'r'+(k+1):''} ${hi===k?'me':''}\">\u003ctd>${String(k+1).padStart(2,'0')}.\u003c/td>\u003ctd>${x?esc(x.n):'---'}\u003c/td>\u003ctd>${x?String(x.s).padStart(5,'0'):'-----'}\u003c/td>\u003ctd>${x?x.r:'--'}\u003c/td>\u003ctd>${x?x.d:'--------'}\u003c/td>\u003c/tr>`}\n  return `\u003ch3>\u2605 HIGH SCORES \u00b7 ${BN[b]} \u2605\u003c/h3>\u003ctable>\u003ctr>\u003cth>RK\u003c/th>\u003cth>NAME\u003c/th>\u003cth>SCORE\u003c/th>\u003cth>${lab}\u003c/th>\u003cth>DATE\u003c/th>\u003c/tr>${rows}\u003c/table>`;\n}\nfunction boardUI(el,b,hi){\n  lbView=b;\n  el.innerHTML=`\u003cdiv class=\"arc\">\u003cdiv class=\"tabs2\">\u003cbutton data-b=\"endless\" class=\"${b==='endless'?'sel':''}\">\u267e\ufe0f Endless\u003c/button>\u003cbutton data-b=\"blitz\" class=\"${b==='blitz'?'sel':''}\">\ud83c\udfae Blitz 10\u003c/button>\u003c/div>${boardHTML(b,hi)}\u003cdiv class=\"hint\">Scores are saved in this browser only.\u003c/div>\u003cdiv class=\"btns\" style=\"justify-content:center\">\u003cbutton id=\"bzClr\">Clear scores\u003c/button>\u003c/div>\u003c/div>`;\n  el.querySelectorAll('.tabs2 button').forEach(x=>x.onclick=()=>boardUI(el,x.dataset.b));\n  let armed=false;$('bzClr').onclick=function(){if(!armed){armed=true;this.textContent='Sure? Click again';return}\n    const t=ldS();t.lb={};svS(t);boardUI(el,b)};\n}\nfunction initials(el,b,rank,done){\n  const s0=ldS();let L=(s0.ini||'AAA').split(''),cur=0;\n  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';\n  const draw=()=>{el.innerHTML=`\u003cdiv class=\"arc\">\u003ch3>\u2605 NEW HIGH SCORE \u00b7 RANK #${rank+1} \u2605\u003c/h3>\u003cdiv>ENTER YOUR INITIALS\u003c/div>\u003cdiv>${L.map((c,i)=>`\u003cdiv class=\"ini ${i===cur?'cur':''}\">\u003cbutton data-i=\"${i}\" data-d=\"1\">\u25b2\u003c/button>\u003cspan data-i=\"${i}\">${c}\u003c/span>\u003cbutton data-i=\"${i}\" data-d=\"-1\">\u25bc\u003c/button>\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"btns\" style=\"justify-content:center\">\u003cbutton class=\"pri\" id=\"bzOk\">OK\u003c/button>\u003c/div>\u003cdiv class=\"hint\">Tap \u25b2\u25bc or type letters \u00b7 Enter to confirm\u003c/div>\u003c/div>`;\n    el.querySelectorAll('.ini button').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;cur=i;L[i]=A[(A.indexOf(L[i])+ +x.dataset.d+A.length)%A.length];draw()});\n    el.querySelectorAll('.ini span').forEach(x=>x.onclick=()=>{cur=+x.dataset.i;draw()});\n    $('bzOk').onclick=ok};\n  const key=e=>{const k=e.key;\n    if(/^[a-z0-9]$/i.test(k)){L[cur]=k.toUpperCase();cur=Math.min(2,cur+1);draw()}\n    else if(k==='Backspace'){cur=Math.max(0,cur-1);draw()}\n    else if(k==='ArrowLeft'){cur=Math.max(0,cur-1);draw()}else if(k==='ArrowRight'){cur=Math.min(2,cur+1);draw()}\n    else if(k==='ArrowUp'||k==='ArrowDown'){L[cur]=A[(A.indexOf(L[cur])+(k==='ArrowUp'?1:-1)+A.length)%A.length];draw()}\n    else if(k==='Enter'){ok()}else return;e.preventDefault()};\n  function ok(){document.removeEventListener('keydown',key);done(L.join(''))}\n  document.addEventListener('keydown',key);draw();\n}\nfunction finish(){\n  clearInterval(timer);const s=ldS(),d=dayNum(),won=!G.endless&&G.lives>0&&G.i>=TOT;\n  if(G.endless){if(G.score>(s.bestE||0))s.bestE=G.score,s.bestER=G.i,G.newBest=true}\n  else if(G.score>(s.best||0))s.best=G.score,G.newBest=true;\n  if(G.mode==='daily'){\n    if(!s.daily||s.daily.day!==d){const p=s.ds||{n:0,l:0};s.ds={n:p.l===d-1?p.n+1:1,l:d}}\n    if(!s.daily||s.daily.day!==d||G.score>s.daily.score)s.daily={day:d,score:G.score};\n  }\n  svS(s);\n  const rate=G.endless?(G.i>=25?'\ud83c\udfc6 Pipeline legend':G.i>=15?'\ud83e\udd47 Clock crusher':G.i>=8?'\ud83e\udd48 Fast hands':'\ud83e\udd49 Warming up'):G.ok>=10?'\ud83c\udfc6 Pipeline master':G.ok>=8?'\ud83e\udd47 Hazard hunter':G.ok>=5?'\ud83e\udd48 Getting there':'\ud83e\udd49 Keep practising';\n  B.innerHTML=`\u003cdiv class=\"big\">${won?'Blitz complete!':G.endless?`Game over \u00b7 ${G.i} round${G.i===1?'':'s'} survived`:'Out of lives'}\u003c/div>\u003cp>${rate}\u003c/p>\n  \u003cdiv class=\"stats\">\u003cdiv>Score \u003cb>${G.score}\u003c/b>\u003c/div>\u003cdiv>Correct \u003cb>${G.ok}/${G.endless?G.i:Math.min(G.i,TOT)}\u003c/b>\u003c/div>\u003cdiv>Best \u003cb>${G.endless?(s.bestE||0):(s.best||0)}\u003c/b>\u003c/div>${G.mode==='daily'?`\u003cdiv>Daily streak \u003cb>${s.ds.n}\u003c/b>\u003c/div>`:''}\u003c/div>\n  ${G.newBest?'\u003cp class=\"good\">New personal best!\u003c/p>':''}\u003cdiv id=\"bzLb\">\u003c/div>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"pri\" id=\"bzAgain\">${G.endless?'\u267e\ufe0f Again':'\ud83c\udfb2 Random blitz'}\u003c/button>\u003cbutton id=\"bzMenu\">Menu\u003c/button>\u003c/div>`;\n  $('bzAgain').onclick=()=>start(G.endless?'endless':(G.mode==='daily'?'random':G.mode));$('bzMenu').onclick=menu;\n  const b=G.endless?'endless':'blitz',list=(s.lb&&s.lb[b])||[],box=$('bzLb'),sc=G.score;\n  if(sc>0&&(list.length\u003c10||sc>list[list.length-1].s)){\n    const rank=rankOf(list,sc);\n    initials(box,b,rank,name=>{const t=ldS();t.lb=t.lb||{};const l=t.lb[b]||[];\n      l.splice(rankOf(l,sc),0,{n:name,s:sc,r:G.endless?G.i:G.ok,d:new Date().toISOString().slice(2,10)});t.lb[b]=l.slice(0,10);t.ini=name;svS(t);\n      boardUI(box,b,rankOf(l,sc)-1\u003c10?l.findIndex(x=>x.n===name&&x.s===sc):-1)});\n  }else boardUI(box,b);\n}\nmenu();\n})();\n\u003c/script>\u003c/body>\n\u003c/html>\n", "hci": "\u003c!doctype html>\n\u003chtml data-theme=\"light\" lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>HCI &amp; Java GUI Lab\u003c/title>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cstyle>\n:root{--bg:#eaf0f7;--card:#fff;--ink:#12233a;--mut:#62728a;--acc:#2f5bea;--soft:#e4ebff;--hi:#ffb703;--ok:#12a37f;--bad:#e5484d;--bd:#d3dcea;--code:#0e1a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1522;--card:#14233a;--ink:#e8eef8;--mut:#93a4bd;--acc:#7b9bff;--soft:#1f3358;--bd:#2a3d5c;--code:#070e19;color-scheme:dark}}\n:root[data-theme=dark]{--bg:#0c1522;--card:#14233a;--ink:#e8eef8;--mut:#93a4bd;--acc:#7b9bff;--soft:#1f3358;--bd:#2a3d5c;--code:#070e19;color-scheme:dark}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;color:var(--ink);font:15px/1.45 \"Avenir Next\",\"Segoe UI\",system-ui,sans-serif}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:2px solid var(--ink);padding:8px 12px}\nh1{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}\nnav{display:flex;gap:6px;overflow-x:auto}\nnav button{flex:none;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:600 14px inherit;cursor:pointer}\nnav button.on{background:var(--ink);color:var(--card)}\nmain{max-width:9 cdiv class=\"row\">\u003cbutton class=\"chip on\" data-m=\"b\">\ud83d\udc23 Beginner\u003c/button>\u003cbutton class=\"chip\" data-m=\"e\">\ud83d\ude80 Expert\u003c/button>\u003c/div>\u003cdiv class=\"row\" id=\"a\">\u003c/div>\u003cdiv class=\"mut\">The UI adapts to the user\u2019s level and preferences.\u003c/div>`,(q,Q)=>{const r=m=>q(\"#a\").innerHTML=m==\"b\"?[\"\ud83d\udcbe Save the file\",\"\ud83d\udcc2 Open a file\",\"\ud83d\udda8\ufe0f Print it\"].map(x=>`\u003cbutton class=\"b\">${x}\u003c/button>`).join(\"\"):[\"\ud83d\udcbe \u2318S\",\"\ud83d\udcc2 \u2318O\",\"\ud83d\udda8\ufe0f \u2318P\",\"\u26a1 Macro\"].map(x=>`\u003cbutton class=\"b\" style=\"padding:3px 7px\">${x}\u003c/button>`).join(\"\");r(\"b\");sw(Q,r)}],\n\"Observability\":[`\u003cdiv class=\"row\">\u003cbutton class=\"chip\" id=\"k\">\ud83d\udd12 Caps Lock\u003c/button>\u003clabel class=\"row\">\u003cinput type=\"checkbox\" id=\"v\" checked> show state\u003c/label>\u003cspan class=\"chip\" id=\"i\" hidden>\ud83d\udd20 CAPS ON\u003c/span>\u003c/div>\u003cinput class=\"ti\" id=\"t\" placeholder=\"type here\">\u003cdiv class=\"mut\">Hide the indicator and the UPPERCASE surprise appears.\u003c/div>`,(q)=>{let on=0;const u=()=>q(\"#i\").hidden=!(on&&q(\"#v\").checked);q(\"#k\").onclick=e=>{on=e.target.classList.toggle(\"on\");u()};q(\"#v\").onchange=u;q(\"#t\").oninput=e=>{if(on)e.target.value=e.target.value.toUpperCase()}}],\n\"Recoverability\":[`\u003cdiv class=\"big\" id=\"w\" style=\"font-size:22px\">Hello brave new world\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"b\" id=\"d\">\u2702\ufe0f Delete word\u003c/button>\u003cbutton class=\"b\" id=\"u\">\u21a9 Undo\u003c/button>\u003c/div>\u003cdiv class=\"mut\">A mistake is cheap to fix.\u003c/div>`,(q)=>{const w=[\"Hello\",\"brave\",\"new\",\"world\"],h=[];const r=()=>q(\"#w\").textContent=w.join(\" \")||\"\u2026\";q(\"#d\").onclick=()=>{w.length&&h.push(w.pop());r()};q(\"#u\").onclick=()=>{h.length&&w.push(h.pop());r()};r()}],\n\"Response times\":[`\u003cdiv class=\"row\">\u003cbutton class=\"chip on\" data-m=\"0\">\u26a1 0.1 s\u003c/button>\u003cbutton class=\"chip\" data-m=\"1\">\u23f3 1 s\u003c/button>\u003cbutton class=\"chip\" data-m=\"4\">\ud83d\udd52 4 s\u003c/button>\u003cbutton class=\"b p\" id=\"r\">Run\u003c/button>\u003c/div>\u003cdiv style=\"height:14px;border-radius:8px;border:1px solid var(--bd);overflow:hidden;margin-top:6px\">\u003cdiv id=\"p\" style=\"height:100%;width:0;background:var(--ok)\">\u003c/div>\u003c/div>\u003cdiv class=\"say\" id=\"m\">Pick a duration.\u003c/div>`,(q,Q)=>{let d=0;sw(Q,v=>d=+v);q(\"#r\").onclick=()=>{const b=q(\"#p\");b.style.transition=\"none\";b.style.width=\"0\";void b.offsetWidth;const m=q(\"#m\");if(d==0){m.innerHTML='\u003cspan class=\"ok\">\u2714 Done.\u003c/span> Instant: no feedback needed.';return}\nm.textContent=d==1?\"\u23f3 busy cursor\u2026\":\"\ud83d\udd52 Working\u2026 about 4 s left\";if(d==4){b.style.transition=\"width 4s linear\";b.style.width=\"100%\"}setTimeout(()=>m.innerHTML='\u003cspan class=\"ok\">\u2714 Done.\u003c/span> '+(d==1?\"A busy cursor is enough.\":\"Long wait: show progress and an estimate.\"),d*1000)}}],\n\"Task advisability\":[`\u003cdiv class=\"mut\">Goal: print only page 2 of 12.\u003c/div>\u003cdiv class=\"row\">\u003clabel class=\"row\">\u003cinput type=\"checkbox\" id=\"o\"> UI has a \u201cPages\u201d option\u003c/label>\u003cbutton class=\"b p\" id=\"p\">\ud83d\udda8\ufe0f Print\u003c/button>\u003c/div>\u003cdiv class=\"say\" id=\"m\">Try with and without the option.\u003c/div>`,(q)=>{q(\"#p\").onclick=()=>q(\"#m\").innerHTML=q(\"#o\").checked?'\u003cspan class=\"ok\">\u2714 1 page printed.\u003c/span> The UI supports the task.':'\u003cspan class=\"no\">\ud83d\ude2c 12 pages printed.\u003c/span> The UI can\u2019t express my task.'}]};\nV.hci={html:`\u003ch2>Foundations of HCI\u003c/h2>\u003cp class=\"mut\">UI \u2248 50% of the code, &gt;70% of the effort. Bad UI \u2192 low productivity, errors, rejection.\u003c/p>\n\u003cdiv class=\"card\">\u003ch3>Usability = a specified user \u00b7 a specified goal \u00b7 a specified context\u003c/h3>\u003csvg viewBox=\"0 0 320 190\" width=\"100%\" style=\"max-width:420px;display:block;margin:auto\">\u003cpolygon points=\"160,20 40,160 280,160\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003ctext x=\"160\" y=\"118\" text-anchor=\"middle\" font-weight=\"800\" fill=\"var(--ink)\" font-size=\"16\">USABILITY\u003c/text>\n\u003cg id=\"tri\" style=\"cursor:pointer\" font-size=\"12\" font-weight=\"700\">\u003ccircle data-u=\"0\" cx=\"160\" cy=\"20\" r=\"17\" fill=\"var(--hi)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003ctext x=\"160\" y=\"8\" text-anchor=\"middle\" fill=\"var(--ink)\">Effectiveness\u003c/text>\u003ccircle data-u=\"1\" cx=\"40\" cy=\"160\" r=\"17\" fill=\"var(--acc)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003ctext x=\"40\" y=\"186\" text-anchor=\"middle\" fill=\"var(--ink)\">Efficiency\u003c/text>\u003ccircle data-u=\"2\" cx=\"280\" cy=\"160\" r=\"17\" fill=\"var(--ok)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003ctext x=\"280\" y=\"186\" text-anchor=\"middle\" fill=\"var(--ink)\">Satisfaction\u003c/text>\u003c/g>\u003c/svg>\n\u003cdiv class=\"say\" id=\"us\">Tap a corner \ud83d\udc46\u003c/div>\u003cdiv class=\"row\">\u003cspan class=\"chip\">\ud83d\udcd6 Learnability: easy to learn?\u003c/span>\u003cspan class=\"chip\">\u26a1 Efficiency: fast once learned?\u003c/span>\u003cspan class=\"chip\">\ud83d\udedf Safety: few, recoverable errors?\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>12 principles \u2014 tap one\u003c/h3>\u003cdiv class=\"grid\" id=\"pr\">\u003c/div>\u003cdiv class=\"say\" id=\"pd\">Pick a principle \ud83d\udc46 each one has a mini demo\u003c/div>\n\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>\u2615 Coffee machine \u003cspan class=\"mut\">(Prediction \u00b7 Task advisability)\u003c/span>\u003c/h3>\u003cdiv class=\"row\" id=\"cv\">\u003cbutton class=\"chip on\" data-v=\"bad\">Original\u003c/button>\u003cbutton class=\"chip\" data-v=\"good\">Improved\u003c/button>\u003c/div>\u003cdiv class=\"row\" id=\"cs\">\u003c/div>\u003cdiv class=\"say\" id=\"co\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>\u21a9\ufe0f Recoverability \u003cspan class=\"mut\">(proportional effort)\u003c/span>\u003c/h3>\u003cdiv class=\"big\" id=\"fn\">\ud83d\udcc4 report.docx\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"b\" id=\"rn\">Rename\u003c/button>\u003cbutton class=\"b\" id=\"dl\">Delete\u003c/button>\u003c/div>\u003cdiv class=\"say\" id=\"fm\">Easy to undo \u2192 one click. Hard to undo \u2192 ask first.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>\u23f1\ufe0f Response time \u003cspan class=\"mut\">(Observability)\u003c/span>\u003c/h3>\u003clabel class=\"row\">Delay \u003cinput type=\"range\" id=\"dly\" min=\"0\" max=\"4\" step=\".5\" value=\"3\"> \u003cb id=\"dv\">3s\u003c/b>\u003c/label>\u003clabel class=\"row\">\u003cinput type=\"checkbox\" id=\"fb\" checked> Show progress\u003c/label>\u003cbutton class=\"b p\" id=\"sv\">\ud83d\udcbe Save\u003c/button>\u003cdiv style=\"height:14px;border:2px solid var(--ink);border-radius:8px;margin-top:8px;overflow:hidden\">\u003cdiv id=\"pb\" style=\"height:100%;width:0;background:var(--ok)\">\u003c/div>\u003c/div>\u003cdiv class=\"say\" id=\"sm\">Try 3s with progress off \ud83d\ude2c\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>\u267f Accessibility\u003c/h3>\u003clabel class=\"row\">Font \u003cinput type=\"range\" id=\"fz\" min=\"12\" max=\"28\" value=\"14\">\u003c/label>\u003cdiv class=\"row\">\u003cbutton class=\"chip\" id=\"hc\">High contrast\u003c/button>\u003cbutton class=\"chip\" id=\"gs\">Colour-blind view\u003c/button>\u003c/div>\n\u003cdiv id=\"ac\" style=\"padding:10px;border:2px solid var(--ink);border-radius:8px;font-size:14px;margin-top:6px\">\u003cdiv>Colour only: \u003cspan style=\"color:#d22\">\u25cf\u003c/span> \u003cspan style=\"color:#2a small>','\u26a1 Wire every outpost with power cable at minimum cost. Powered domes light up! \u003csmall>(Prim)\u003c/small>','\ud83c\udfe5 Where should the rebel med-bay go? The farthest outpost should still be as close as possible. \u003csmall>(Graph center)\u003c/small>'],\nCW=`\u003cdiv class='crawl' id='cw'>\u003cdiv class='lead'>Not so long ago, in a post office not so far away...\u003c/div>\u003cdiv class='pl'>\u003cdiv class='tx'>\u003ch3>EPISODE \u221e\u003cbr>THE LOST PARCEL\u003c/h3>\u003cp>It is a dark time for the postal service. The evil Bureaucratic Empire has taxed every road in the galaxy.\u003c/p>\u003cp>Rebel couriers must find the cheapest hyperlanes, wire every outpost with power, and choose the perfect place for a med-bay.\u003c/p>\u003cp>Only a true master of graphs can restore order to the galaxy...\u003c/p>\u003cp style='text-align:center'>\u2605 \u2605 \u2605\u003cbr>May the force be with you - MartinWeb\u003c/p>\u003c/div>\u003c/div>\u003csmall>tap to skip\u003c/small>\u003c/div>`,\nswoosh=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(120,c.currentTime);o.frequency.exponentialRampToValueAtTime(1400,c.currentTime+.9);g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.9)}catch(e){}};\nconst EVT=['A friendly trader waves from the landing pad.','Meteor shower! Your hull is fine, your nerves are not.','A patrol ship scans you. You whistle innocently.','The fuel stop sells suspicious space sandwiches.','Someone is playing very odd music on the comm.','A kid sells you a shiny rock. It might be a small moon.','Static on the radio: \u201c...is anyone getting this?\u201d','Two cargo pilots argue about the best hyperlane.','A tiny moon waves as you pass. You wave back.','The outpost cat watches you from a window.'],evt=v=>v==t?'Landing pad in sight. Parcel secured!':S.mis&&v==S.wp?'Clearance codes received.
